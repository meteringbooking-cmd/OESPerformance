<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engineer Postcode List</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: single working column — paste box on top, results table below */
:root{
  --bg:#f5f7f6; --surface:#ffffff; --fg:#17201d; --muted:#5d6b66; --line:#d9e0dd; --faint:#b7c2be;
  --accent:#0f7a5c; --accent-soft:#e1f1eb; --warn:#a4570b; --warn-soft:#fbeedd; --foot:#eef2f0;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#18201d; --fg:#e4ebe8; --muted:#94a39d; --line:#2b3632; --faint:#46534e;
  --accent:#4cc79d; --accent-soft:#16352b; --warn:#f0a85a; --warn-soft:#3a2a17; --foot:#1e2824; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#18201d; --fg:#e4ebe8; --muted:#94a39d; --line:#2b3632; --faint:#46534e;
  --accent:#4cc79d; --accent-soft:#16352b; --warn:#f0a85a; --warn-soft:#3a2a17; --foot:#1e2824; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:1200px;margin:0 auto;padding-block:28px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;gap:20px}
h1{font-size:1.5rem;font-weight:600;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;max-width:70ch}
label.lbl{font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
textarea{width:100%;box-sizing:border-box;min-height:150px;resize:vertical;margin-top:6px;
  font:13px/1.5 var(--mono);color:var(--fg);background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:12px}
textarea:focus,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button{font:500 14px var(--sans);border-radius:6px;padding:8px 14px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--fg)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.check{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--muted);cursor:pointer}
.count{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.toast{color:var(--accent);font-weight:500}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:100%}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.7rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;vertical-align:bottom}
th.job{white-space:normal;min-width:5.5em;max-width:7em;text-align:center;line-height:1.25}
td.n{text-align:center}
td.n.z{color:var(--faint)}
td.tot,th.tot{text-align:center;font-weight:600;border-left:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
tfoot td{background:var(--foot);font-weight:600;border-top:1px solid var(--line);border-bottom:0}
td.num{color:var(--muted);width:1%}
.pc{font-family:var(--mono);font-weight:500}
.sen{display:inline-block;min-width:1.6em;text-align:center;font-weight:600;
  background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 6px}
tr.bad td{background:var(--warn-soft);color:var(--warn)}
tr.bad td.raw{white-space:normal;font-family:var(--mono);font-size:12px;word-break:break-all}
.empty{padding:24px 14px;color:var(--muted)}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Engineer Postcode List</h1>
    <p class="sub">Paste the schedule rows below, one engineer per line. Name, seniority and start postcode come from the text before the first <code>|</code>; job types are counted across the whole line.</p>
  </header>

  <div>
    <label class="lbl" for="input">Schedule text</label>
    <textarea id="input" spellcheck="false">Alexandra EganSPL3 6BU | ENG | LIVE07:457mDual Fuel Meter ExchangeAM1h 50mPL4 0PLClick to copyJ-3AAC4ED113mDual Fuel Meter ExchangeAD1h 50mPL7 4JEClick to copyJ-02525E4ELUNCH12:00 - 13:007mElectricity Meter ExchangePM1h 5mPL7 1LJClick to copyJ-9E5536A5Electricity Meter CommissionPL7 1QYClick to copyJ-EC301B718m17:45
Ali Mohamed (ENG)SRM8 1AE | ENG | LIVE07:456mDual Fuel Meter ExchangeAM1h 50mRM10 7TTClick to copyJ-495DE92819mGas Meter ExchangeAM1h 5mRM5 2UHClick to copyJ-1926FE36LUNCH11:15 - 12:1519mDual Fuel Meter ExchangePM1h 50mRM10 7BAClick to copyJ-EF2322328m17:15
Andrew BartleSHX3 5AY | ENG | LIVE07:3012mGas Meter ExchangeAM1h 5mHX3 7JHClick to copyJ-5498522C18mDual Fuel Meter ExchangeAD1h 50mBD4 0FEClick to copyJ-0BEF4434LUNCH11:15 - 12:1511mDual Fuel Meter ExchangeAD1h 50mBD6 1ETClick to copyJ-73A4E52122mDual Fuel Meter ExchangePM1h 50mHX2 7DUClick to copyJ-9C21D7FF11m17:30</textarea>
  </div>

  <div class="bar">
    <button class="primary" id="copy" type="button">Copy table for Excel</button>
    <button id="clear" type="button">Clear</button>
    <label class="check" for="showall"><input type="checkbox" id="showall"> Show all job types</label>
    <span class="toast" id="toast" aria-live="polite"></span>
    <span class="count" id="count"></span>
  </div>

  <div class="tablebox">
    <table>
      <thead id="head"></thead>
      <tbody id="rows"></tbody>
      <tfoot id="foot"></tfoot>
    </table>
  </div>
</div>

<script>
const JOBS = [
  'DualFuelMeterCommission','DualFuelMeterExchange','DualFuelNewConnection',
  'ElectricityMeterExchange','ElectricityMeterNewConnection','ElectricityMeterRemoval','ElectricityMeterCommission',
  'GasMeterCommission','GasMeterExchange','GasMeterNewConnection','GasMeterRemoval',
  'InstallConsumerDevice','CommunicationsHubExchange','InstallIsolatorSwitch',
  'MeteringAccuracyTest','SiteInvestigation','TraceandLabel','DualFuelRemoval'
];
// "TraceandLabel" -> words Trace / and / Label; others split on capitals
const words = j => j.replace(/and(?=[A-Z])/,' and ').replace(/([a-z])([A-Z])/g,'$1 $2').trim().split(/\s+/);
const LABELS = JOBS.map(j => words(j).join(' '));
// Match with or without spaces between words, any case. Longest names first so they win.
const order = JOBS.map((j,i)=>i).sort((a,b)=>JOBS[b].length-JOBS[a].length);
const JOB_RE = new RegExp(order.map(i => '(' + words(JOBS[i]).join('\\s*') + ')').join('|'), 'gi');

// Name ends in a lowercase letter, ")", "." or "'"; then one seniority letter; then a UK postcode.
const RE = /^(.*?[a-z\)\.'’])\s*([A-Z])\s*([A-Z]{1,2}\d[A-Z\d]?\s?\d[A-Z]{2})\s*$/;

function parseLine(line){
  const head = line.split('|')[0].trim();
  const m = head.match(RE);
  if(!m) return {bad:true, raw:head};
  const name = m[1].replace(/\s*\([^)]*\)\s*$/,'').trim();
  let pc = m[3].replace(/\s+/g,'');
  pc = pc.slice(0,-3)+' '+pc.slice(-3);
  const counts = new Array(JOBS.length).fill(0);
  let mm; JOB_RE.lastIndex = 0;
  while((mm = JOB_RE.exec(line))){
    const g = mm.slice(1).findIndex(x => x !== undefined);
    counts[order[g]]++;
  }
  return {name, sen:m[2], pc, counts, total:counts.reduce((a,b)=>a+b,0)};
}

const $ = id => document.getElementById(id);
let parsed = [];
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function render(){
  const lines = $('input').value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const all = lines.map(parseLine);
  parsed = all.filter(r=>!r.bad);
  const bad = all.length - parsed.length;
  const sums = JOBS.map((_,i)=>parsed.reduce((a,r)=>a+r.counts[i],0));
  const cols = JOBS.map((_,i)=>i).filter(i => $('showall').checked || sums[i] > 0);
  const span = 5 + cols.length;

  $('head').innerHTML = '<tr><th>#</th><th>Name</th><th>Seniority</th><th>Postcode</th>' +
    cols.map(i=>`<th class="job">${LABELS[i]}</th>`).join('') + '<th class="tot">Total jobs</th></tr>';

  if(!all.length){
    $('rows').innerHTML = `<tr><td colspan="${span}" class="empty">Paste schedule rows above and the list appears here.</td></tr>`;
    $('foot').innerHTML = '';
  } else {
    let n = 0;
    $('rows').innerHTML = all.map(r => r.bad
      ? `<tr class="bad"><td class="num">–</td><td colspan="${span-1}" class="raw">Couldn't read: ${esc(r.raw.slice(0,80))}</td></tr>`
      : `<tr><td class="num">${++n}</td><td>${esc(r.name)}</td><td><span class="sen">${esc(r.sen)}</span></td><td class="pc">${esc(r.pc)}</td>` +
        cols.map(i=>`<td class="n${r.counts[i]?'':' z'}">${r.counts[i]}</td>`).join('') +
        `<td class="tot">${r.total}</td></tr>`
    ).join('');
    $('foot').innerHTML = parsed.length ? '<tr><td></td><td colspan="3">Total</td>' +
      cols.map(i=>`<td class="n">${sums[i]}</td>`).join('') +
      `<td class="tot">${sums.reduce((a,b)=>a+b,0)}</td></tr>` : '';
  }
  $('count').textContent = `${parsed.length} engineer${parsed.length===1?'':'s'}` + (bad?` · ${bad} not read`:'');
}

function flash(msg){ $('toast').textContent = msg; setTimeout(()=>$('toast').textContent='',2500); }

$('input').addEventListener('input', render);
$('showall').addEventListener('change', render);
$('clear').addEventListener('click', ()=>{ $('input').value=''; render(); $('input').focus(); });
$('copy').addEventListener('click', ()=>{
  // Excel copy always includes every job type, so columns stay the same each time
  const tsv = [['Name','Seniority','Postcode',...LABELS,'Total jobs'].join('\t'),
    ...parsed.map(r=>[r.name,r.sen,r.pc,...r.counts,r.total].join('\t'))].join('\n');
  const fallback = ()=>{
    const t = document.createElement('textarea'); t.value = tsv; document.body.appendChild(t); t.select();
    try{ document.execCommand('copy'); flash('Copied'); }catch(e){ flash('Select the text and copy it manually'); }
    t.remove();
  };
  try{ navigator.clipboard.writeText(tsv).then(()=>flash('Copied — paste into Excel'), fallback); }
  catch(e){ fallback(); }
});
render();
</script>
</body>
</html>
