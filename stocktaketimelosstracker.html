<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Take Tracker - OES Performance</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --surface2: #1f2937;
            --border: #30363d;
            --accent: #f0a500;
            --accent2: #e05c2a;
            --text: #e6edf3;
            --muted: #7d8590;
            --success: #3fb950;
            --danger: #f85149;
            --radius: 10px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Mono', monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 24px 16px;
        }

        /* Header */
        .header {
            max-width: 960px;
            margin: 0 auto 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3em;
        }

        .brand-text {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 1.3em;
            letter-spacing: -0.5px;
        }

        .brand-text span {
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .back-link {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.85em;
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .back-link:hover { color: var(--text); border-color: var(--accent); }

        .main { max-width: 960px; margin: 0 auto; }

        /* Message */
        .message {
            padding: 14px 18px;
            border-radius: var(--radius);
            margin-bottom: 24px;
            font-size: 0.9em;
            display: none;
            border-left: 4px solid;
        }
        .message.success { background: rgba(63,185,80,0.1); border-color: var(--success); color: var(--success); display: block; }
        .message.error { background: rgba(248,81,73,0.1); border-color: var(--danger); color: var(--danger); display: block; }

        /* Cards */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 28px;
            margin-bottom: 28px;
        }

        .card-title {
            font-family: 'Syne', sans-serif;
            font-size: 1.1em;
            font-weight: 700;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title .icon {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .card-subtitle {
            color: var(--muted);
            font-size: 0.82em;
            margin-bottom: 24px;
        }

        /* Month selector row */
        .month-row {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .month-label {
            font-size: 0.85em;
            color: var(--muted);
        }

        .month-nav {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 4px;
        }

        .month-nav button {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.9em;
            transition: all 0.2s;
            font-family: 'DM Mono', monospace;
        }
        .month-nav button:hover { background: var(--border); color: var(--text); }

        #currentMonthLabel {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 0.95em;
            min-width: 130px;
            text-align: center;
            color: var(--accent);
        }

        /* Stats strip */
        .stats-strip {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .stat-pill {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 18px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .stat-pill .num {
            font-family: 'Syne', sans-serif;
            font-size: 1.4em;
            font-weight: 800;
            color: var(--accent);
        }

        .stat-pill .lbl {
            font-size: 0.75em;
            color: var(--muted);
        }

        /* Table */
        .table-wrap {
            overflow-x: auto;
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: var(--surface2);
        }

        th {
            padding: 12px 16px;
            text-align: left;
            font-size: 0.78em;
            color: var(--muted);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            white-space: nowrap;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 14px 16px;
            font-size: 0.88em;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
        }

        tbody tr:last-child td { border-bottom: none; }

        tbody tr {
            transition: background 0.15s;
        }
        tbody tr:hover { background: rgba(255,255,255,0.03); }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.78em;
            font-weight: 500;
            white-space: nowrap;
        }

        .badge-duration {
            background: rgba(240,165,0,0.15);
            color: var(--accent);
            border: 1px solid rgba(240,165,0,0.3);
        }

        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: var(--muted);
        }

        .empty-state .icon { font-size: 2.5em; margin-bottom: 12px; }
        .empty-state p { font-size: 0.9em; }

        .loading-state {
            text-align: center;
            padding: 40px;
            color: var(--muted);
            font-size: 0.9em;
        }

        /* Form */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group.full { grid-column: 1 / -1; }

        label {
            font-size: 0.8em;
            color: var(--muted);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        input, select, textarea {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: 'DM Mono', monospace;
            font-size: 0.9em;
            padding: 11px 14px;
            transition: border-color 0.2s;
            width: 100%;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        select option { background: var(--surface2); }

        .btn-submit {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #000;
            border: none;
            border-radius: 8px;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 0.95em;
            padding: 13px 28px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.15s;
            margin-top: 8px;
        }

        .btn-submit:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .divider {
            border: none;
            border-top: 1px solid var(--border);
            margin: 32px 0;
        }

        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full { grid-column: 1; }
            th, td { padding: 10px 12px; }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="brand">
        <div class="brand-icon">📦</div>
        <div class="brand-text">OES <span>Stock Take</span></div>
    </div>
    <a href="index.html" class="back-link">← Back to Home</a>
</div>

<div class="main">

    <div id="message" class="message"></div>

    <!-- ===== ENTRIES TABLE ===== -->
    <div class="card">
        <div class="card-title"><span class="icon">📋</span> Stock Take Entries</div>
        <div class="card-subtitle">Viewing entries for the selected month</div>

        <div class="month-row">
            <span class="month-label">Viewing:</span>
            <div class="month-nav">
                <button id="prevMonth">&#8249;</button>
                <div id="currentMonthLabel">Loading...</div>
                <button id="nextMonth">&#8250;</button>
            </div>
        </div>

        <div class="stats-strip">
            <div class="stat-pill">
                <div class="num" id="statTotal">—</div>
                <div class="lbl">Total Entries</div>
            </div>
            <div class="stat-pill">
                <div class="num" id="statEngineers">—</div>
                <div class="lbl">Engineers</div>
            </div>
        </div>

        <div id="tableContainer">
            <div class="loading-state">⏳ Loading entries...</div>
        </div>
    </div>

    <hr class="divider">

    <!-- ===== ENTRY FORM ===== -->
    <div class="card">
        <div class="card-title"><span class="icon">➕</span> Add New Entry</div>
        <div class="card-subtitle">Record a new stock take issue below</div>

        <form id="stockForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="engineerName">Engineer Name</label>
                    <select id="engineerName" required>
                        <option value="">— Loading engineers... —</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="entryDate">Date</label>
                    <input type="date" id="entryDate" required>
                </div>
                <div class="form-group">
                    <label for="duration">Length of Time</label>
                    <select id="duration" required>
                        <option value="">— Select Duration —</option>
                        <option value="Under 15 mins">Under 15 mins</option>
                        <option value="15–30 mins">15–30 mins</option>
                        <option value="30–60 mins">30–60 mins</option>
                        <option value="1–2 hours">1–2 hours</option>
                        <option value="2–4 hours">2–4 hours</option>
                        <option value="Half day">Half day</option>
                        <option value="Full day">Full day</option>
                        <option value="Multiple days">Multiple days</option>
                    </select>
                </div>
                <div class="form-group full">
                    <label for="issue">Issue / Description</label>
                    <textarea id="issue" placeholder="Describe the stock take issue..." required></textarea>
                </div>
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">Save Entry</button>
        </form>
    </div>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, query, where, orderBy, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
        authDomain: "oesperformance-a54c0.firebaseapp.com",
        projectId: "oesperformance-a54c0",
        storageBucket: "oesperformance-a54c0.firebasestorage.app",
        messagingSenderId: "484894102454",
        appId: "1:484894102454:web:17535ee497eac2d90d6717",
        measurementId: "G-R56BGZYV8N"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Set default date to today
    const today = new Date();
    document.getElementById('entryDate').valueAsDate = today;

    // ===== LOAD ENGINEERS INTO DROPDOWN =====
    async function loadEngineers() {
        const select = document.getElementById('engineerName');
        try {
            const snap = await getDocs(collection(db, "engineers"));
            const engineers = [];
            snap.forEach(doc => {
                const data = doc.data();
                if (data.engineerName) engineers.push(data.engineerName);
            });
            engineers.sort((a, b) => a.localeCompare(b));
            select.innerHTML = '<option value="">— Select Engineer —</option>';
            engineers.forEach(name => {
                const opt = document.createElement('option');
                opt.value = name;
                opt.textContent = name;
                select.appendChild(opt);
            });
        } catch (err) {
            console.error('Error loading engineers:', err);
            select.innerHTML = '<option value="">— Failed to load engineers —</option>';
        }
    }
    loadEngineers();

    // ===== MONTH NAVIGATION =====
    let viewYear = today.getFullYear();
    let viewMonth = today.getMonth(); // 0-indexed

    const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];

    function updateMonthLabel() {
        document.getElementById('currentMonthLabel').textContent = `${monthNames[viewMonth]} ${viewYear}`;
    }

    document.getElementById('prevMonth').addEventListener('click', () => {
        viewMonth--;
        if (viewMonth < 0) { viewMonth = 11; viewYear--; }
        updateMonthLabel();
        loadEntries();
    });

    document.getElementById('nextMonth').addEventListener('click', () => {
        viewMonth++;
        if (viewMonth > 11) { viewMonth = 0; viewYear++; }
        updateMonthLabel();
        loadEntries();
    });

    // ===== LOAD ENTRIES =====
    async function loadEntries() {
        const container = document.getElementById('tableContainer');
        container.innerHTML = '<div class="loading-state">⏳ Loading...</div>';

        try {
            // Date range for selected month
            const start = new Date(viewYear, viewMonth, 1);
            const end = new Date(viewYear, viewMonth + 1, 1);

            const startStr = formatDateStr(start);
            const endStr = formatDateStr(end);

            const q = query(
                collection(db, "Stock Take"),
                where("date", ">=", startStr),
                where("date", "<", endStr),
                orderBy("date", "desc")
            );

            const snap = await getDocs(q);
            const entries = [];
            snap.forEach(doc => entries.push({ id: doc.id, ...doc.data() }));

            // Stats
            const engineers = new Set(entries.map(e => e.engineer));
            document.getElementById('statTotal').textContent = entries.length;
            document.getElementById('statEngineers').textContent = engineers.size;

            if (entries.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <p>No entries found for ${monthNames[viewMonth]} ${viewYear}</p>
                    </div>`;
                return;
            }

            let rows = entries.map(e => `
                <tr>
                    <td>${formatDisplayDate(e.date)}</td>
                    <td>${escHtml(e.engineer)}</td>
                    <td><span class="badge badge-duration">${escHtml(e.duration)}</span></td>
                    <td style="max-width:340px; white-space:pre-wrap;">${escHtml(e.issue)}</td>
                </tr>
            `).join('');

            container.innerHTML = `
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Engineer</th>
                                <th>Duration</th>
                                <th>Issue</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>`;
        } catch (err) {
            console.error(err);
            container.innerHTML = `<div class="loading-state" style="color:var(--danger)">⚠ Failed to load entries: ${err.message}</div>`;
        }
    }

    // ===== SUBMIT FORM =====
    document.getElementById('stockForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.textContent = 'Saving...';

        const engineer = document.getElementById('engineerName').value;
        const date = document.getElementById('entryDate').value;
        const duration = document.getElementById('duration').value;
        const issue = document.getElementById('issue').value.trim();

        try {
            await addDoc(collection(db, "Stock Take"), {
                engineer,
                date,
                duration,
                issue,
                submittedAt: serverTimestamp()
            });

            showMessage('Entry saved successfully!', 'success');
            // Reset form fields except engineer dropdown (preserve loaded options)
            document.getElementById('entryDate').valueAsDate = new Date();
            document.getElementById('engineerName').value = '';
            document.getElementById('duration').value = '';
            document.getElementById('issue').value = '';

            // Reload if the saved entry is in the currently viewed month
            const d = new Date(date + 'T00:00:00');
            if (d.getFullYear() === viewYear && d.getMonth() === viewMonth) {
                loadEntries();
            }
        } catch (err) {
            console.error(err);
            showMessage('Error saving entry: ' + err.message, 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Save Entry';
        }
    });

    // ===== HELPERS =====
    function formatDateStr(d) {
        const y = d.getFullYear();
        const m = String(d.getMonth()+1).padStart(2,'0');
        const day = String(d.getDate()).padStart(2,'0');
        return `${y}-${m}-${day}`;
    }

    function formatDisplayDate(str) {
        if (!str) return '—';
        const [y,m,d] = str.split('-');
        return `${d}/${m}/${y}`;
    }

    function escHtml(str) {
        if (!str) return '';
        return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function showMessage(text, type) {
        const m = document.getElementById('message');
        m.textContent = text;
        m.className = 'message ' + type;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        setTimeout(() => { m.className = 'message'; }, 5000);
    }

    // ===== INIT =====
    updateMonthLabel();
    loadEntries();
</script>
</body>
</html>
