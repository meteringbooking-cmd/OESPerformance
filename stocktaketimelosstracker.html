<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Take Tracker - OES Performance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #005EB8;
            --primary-dark: #003d7a;
            --accent: #00A3E0;
            --bg-dark: #0A1628;
            --bg-card: #1a2942;
            --text-light: #E8EDF2;
            --text-muted: #8B9AAE;
            --border: #2a3f5f;
            --success: #10B981;
            --amber: #F59E0B;
            --error: #EF4444;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Work Sans',sans-serif;
            background:linear-gradient(135deg, var(--bg-dark) 0%, #0d1f3a 100%);
            color:var(--text-light); min-height:100vh; padding:2rem;
            position:relative; overflow-x:hidden;
        }
        body::before {
            content:''; position:fixed; top:0; left:0; right:0; bottom:0;
            background:
                radial-gradient(circle at 20% 30%, rgba(0,163,224,0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0,94,184,0.06) 0%, transparent 50%);
            pointer-events:none; z-index:0;
        }
        .container { max-width:1200px; margin:0 auto; position:relative; z-index:1; }

        header { margin-bottom:3rem; animation:slideDown 0.6s ease-out; }
        @keyframes slideDown { from{opacity:0;transform:translateY(-20px)} to{opacity:1;transform:translateY(0)} }
        @keyframes fadeInUp  { from{opacity:0;transform:translateY(30px)}  to{opacity:1;transform:translateY(0)} }
        @keyframes spin      { to{transform:rotate(360deg)} }

        .header-content { display:flex; align-items:center; gap:1.5rem; margin-bottom:1rem; }
        .back-btn {
            width:48px; height:48px; background:var(--bg-card); border:1px solid var(--border);
            border-radius:12px; display:flex; align-items:center; justify-content:center;
            cursor:pointer; transition:all 0.3s; text-decoration:none; color:var(--text-light); font-size:1.25rem;
            flex-shrink:0;
        }
        .back-btn:hover { background:var(--primary); border-color:var(--accent); transform:translateX(-4px); }
        h1 {
            font-size:2.25rem; font-weight:700; letter-spacing:-0.02em;
            background:linear-gradient(135deg, var(--text-light) 0%, var(--accent) 100%);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
        }
        .subtitle { font-family:'DM Mono',monospace; color:var(--text-muted); font-size:0.95rem; margin-left:64px; letter-spacing:0.05em; }

        /* Cards */
        .card { background:var(--bg-card); border:1px solid var(--border); border-radius:16px; padding:2.5rem; margin-bottom:2rem; animation:fadeInUp 0.6s ease-out; }
        .card-title { font-size:1.4rem; font-weight:600; margin-bottom:1.5rem; display:flex; align-items:center; gap:0.75rem; }
        .card-title::before { content:''; display:block; width:4px; height:24px; background:linear-gradient(to bottom, var(--accent), var(--primary)); border-radius:2px; }

        /* Badges */
        .badge {
            display:inline-flex; align-items:center; gap:0.4rem;
            padding:0.35rem 0.85rem; border-radius:999px;
            font-size:0.8rem; font-weight:600; font-family:'DM Mono',monospace; white-space:nowrap;
        }
        .badge-blue   { background:rgba(0,163,224,0.15);  color:var(--accent);  border:1px solid rgba(0,163,224,0.3); }
        .badge-amber  { background:rgba(245,158,11,0.15); color:var(--amber);   border:1px solid rgba(245,158,11,0.3); }

        /* Month nav */
        .month-nav-row { display:flex; align-items:center; gap:1rem; margin-bottom:1.5rem; flex-wrap:wrap; }
        .month-nav-label { font-family:'DM Mono',monospace; color:var(--text-muted); font-size:0.9rem; }
        .month-nav-controls { display:flex; align-items:center; background:var(--bg-dark); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
        .month-nav-btn {
            background:none; border:none; color:var(--text-muted); cursor:pointer;
            padding:0.6rem 1.1rem; font-size:1.1rem; transition:all 0.2s; font-family:'DM Mono',monospace;
        }
        .month-nav-btn:hover { background:rgba(0,163,224,0.1); color:var(--accent); }
        #currentMonthLabel {
            font-family:'Work Sans',sans-serif; font-weight:700; font-size:0.95rem;
            min-width:150px; text-align:center; color:var(--accent); padding:0 0.5rem;
        }

        /* Stats */
        .stats-strip { display:flex; gap:1rem; margin-bottom:1.5rem; flex-wrap:wrap; }
        .stat-card {
            background:var(--bg-dark); border:1px solid var(--border); border-radius:12px;
            padding:1rem 1.5rem; display:flex; flex-direction:column; gap:0.2rem;
        }
        .stat-card .num { font-family:'Work Sans',sans-serif; font-size:1.8rem; font-weight:700; line-height:1; color:var(--accent); }
        .stat-card .lbl { font-size:0.8rem; color:var(--text-muted); font-family:'DM Mono',monospace; }

        /* Table */
        .table-wrapper { overflow-x:auto; border-radius:12px; border:1px solid var(--border); }
        table { width:100%; border-collapse:collapse; background:var(--bg-dark); }
        thead { background:linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); }
        th { padding:1rem; text-align:left; font-weight:600; font-size:0.85rem; letter-spacing:0.05em; text-transform:uppercase; white-space:nowrap; }
        td { padding:1rem; border-bottom:1px solid var(--border); font-size:0.9rem; vertical-align:middle; }
        tbody tr { transition:background 0.2s; }
        tbody tr:hover { background:rgba(0,163,224,0.07); }
        tbody tr:last-child td { border-bottom:none; }
        .empty-state { text-align:center; padding:3rem; color:var(--text-muted); font-style:italic; }
        .spinner { width:36px; height:36px; border:4px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 1s linear infinite; margin:1.5rem auto; }

        /* Form */
        .form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:1.5rem; }
        .form-group { margin-bottom:0; }
        .form-group.full-width { grid-column:1/-1; }
        label { display:block; margin-bottom:0.6rem; font-weight:600; color:var(--text-light); font-size:0.9rem; }
        input[type="date"], select.form-select, textarea {
            width:100%; padding:0.85rem 1rem;
            background:var(--bg-dark); border:2px solid var(--border); border-radius:10px;
            color:var(--text-light); font-family:'Work Sans',sans-serif; font-size:0.95rem; transition:all 0.3s;
        }
        textarea { resize:vertical; min-height:100px; }
        input:focus, select.form-select:focus, textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 4px rgba(0,163,224,0.1); }
        select.form-select option { background:var(--bg-card); }

        .btn { padding:0.9rem 2rem; border:none; border-radius:12px; font-weight:600; font-size:0.95rem; cursor:pointer; transition:all 0.3s; font-family:'Work Sans',sans-serif; }
        .btn-primary { background:linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%); color:white; }
        .btn-primary:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 12px 24px rgba(0,163,224,0.3); }
        .btn-secondary { background:var(--bg-dark); color:var(--text-light); border:2px solid var(--border); }
        .btn-secondary:hover { border-color:var(--accent); }
        .btn:disabled { opacity:0.5; cursor:not-allowed; transform:none !important; box-shadow:none !important; }
        .btn-group { display:flex; gap:1rem; margin-top:2rem; flex-wrap:wrap; }

        /* Toast */
        .toast { position:fixed; bottom:2rem; right:2rem; padding:1rem 1.5rem; border-radius:12px; font-weight:600; z-index:300; display:none; }
        .toast.show { display:block; animation:fadeInUp 0.4s ease-out; }
        .toast-success { background:rgba(16,185,129,0.92); color:white; border:1px solid var(--success); }
        .toast-error   { background:rgba(239,68,68,0.92);   color:white; border:1px solid var(--error); }

        @media(max-width:768px) {
            body { padding:1.5rem; }
            h1 { font-size:1.75rem; }
            .subtitle { margin-left:0; margin-top:0.5rem; }
            .card { padding:1.5rem; }
            .form-grid { grid-template-columns:1fr; }
            .btn-group { flex-direction:column; }
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div class="header-content">
            <a href="index.html" class="back-btn">←</a>
            <h1>Stock Take Tracker</h1>
        </div>
        <p class="subtitle">LOG AND REVIEW ENGINEER STOCK TAKE ISSUES</p>
    </header>

    <main>

        <!-- ── Entries Table ── -->
        <div class="card">
            <div class="card-title">Stock Take Entries</div>

            <div class="month-nav-row">
                <span class="month-nav-label">Viewing:</span>
                <div class="month-nav-controls">
                    <button class="month-nav-btn" id="prevMonth">&#8249;</button>
                    <div id="currentMonthLabel">Loading...</div>
                    <button class="month-nav-btn" id="nextMonth">&#8250;</button>
                </div>
            </div>

            <div class="stats-strip">
                <div class="stat-card">
                    <div class="num" id="statTotal">—</div>
                    <div class="lbl">Total Entries</div>
                </div>
                <div class="stat-card">
                    <div class="num" id="statEngineers">—</div>
                    <div class="lbl">Engineers</div>
                </div>
            </div>

            <div id="loadingSpinner" style="display:none;"><div class="spinner"></div></div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Engineer</th>
                            <th>Duration</th>
                            <th>Issue / Description</th>
                        </tr>
                    </thead>
                    <tbody id="entriesTableBody">
                        <tr><td colspan="4" class="empty-state">Loading entries...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- ── Add Entry Form ── -->
        <div class="card">
            <div class="card-title">Add New Entry</div>
            <form id="stockForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="engineerName">Engineer *</label>
                        <select id="engineerName" class="form-select" required>
                            <option value="">Loading engineers...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="entryDate">Date *</label>
                        <input type="date" id="entryDate" required>
                    </div>
                    <div class="form-group">
                        <label for="duration">Length of Time *</label>
                        <select id="duration" class="form-select" required>
                            <option value="">Select Duration</option>
                            <option value="Under 15 mins">Under 15 mins</option>
                            <option value="15–30 mins">15–30 mins</option>
                            <option value="30–60 mins">30–60 mins</option>
                            <option value="1–2 hours">1–2 hours</option>
                            <option value="2–4 hours">2–4 hours</option>
                            <option value="Half day">Half day</option>
                            <option value="Full day">Full day</option>
                            <option value="Multiple days">Multiple days</option>
                        </select>
                    </div>
                    <div class="form-group full-width">
                        <label for="issue">Issue / Description *</label>
                        <textarea id="issue" placeholder="Describe the stock take issue..." required></textarea>
                    </div>
                </div>
                <div class="btn-group">
                    <button type="submit" class="btn btn-primary" id="submitBtn">Submit Entry</button>
                    <button type="button" class="btn btn-secondary" id="resetBtn">Clear Form</button>
                </div>
            </form>
        </div>

    </main>
</div>

<div id="toast" class="toast"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, query, where, orderBy, getDocs, serverTimestamp }
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const app = initializeApp({
        apiKey: "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
        authDomain: "oesperformance-a54c0.firebaseapp.com",
        projectId: "oesperformance-a54c0",
        storageBucket: "oesperformance-a54c0.firebasestorage.app",
        messagingSenderId: "484894102454",
        appId: "1:484894102454:web:17535ee497eac2d90d6717",
        measurementId: "G-R56BGZYV8N"
    });
    const db = getFirestore(app);

    // ── Toast ─────────────────────────────────────────────────────────────────
    function showToast(msg, type = 'success') {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = `toast toast-${type} show`;
        setTimeout(() => t.classList.remove('show'), 3500);
    }

    // ── Helpers ───────────────────────────────────────────────────────────────
    function escHtml(s) {
        if (!s) return '';
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function formatDate(str) {
        if (!str) return '—';
        const [y,m,d] = str.split('-');
        return `${d}/${m}/${y}`;
    }
    function formatDateStr(d) {
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    // ── Month nav ─────────────────────────────────────────────────────────────
    const today = new Date();
    let viewYear  = today.getFullYear();
    let viewMonth = today.getMonth();
    const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    document.getElementById('entryDate').valueAsDate = today;

    function updateMonthLabel() {
        document.getElementById('currentMonthLabel').textContent = `${monthNames[viewMonth]} ${viewYear}`;
    }
    document.getElementById('prevMonth').addEventListener('click', () => {
        viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; }
        updateMonthLabel(); loadEntries();
    });
    document.getElementById('nextMonth').addEventListener('click', () => {
        viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; }
        updateMonthLabel(); loadEntries();
    });

    // ── Engineers ─────────────────────────────────────────────────────────────
    async function loadEngineers() {
        const select = document.getElementById('engineerName');
        try {
            const snap = await getDocs(collection(db, "engineers"));
            const engineers = [];
            snap.forEach(doc => {
                const data = doc.data();
                if (data.engineerName) engineers.push(data.engineerName);
            });
            engineers.sort((a,b) => a.localeCompare(b));
            select.innerHTML = '<option value="">Select Engineer</option>';
            engineers.forEach(name => {
                const opt = document.createElement('option');
                opt.value = name; opt.textContent = name;
                select.appendChild(opt);
            });
        } catch(err) {
            select.innerHTML = '<option value="">Failed to load engineers</option>';
        }
    }

    // ── Load Entries ──────────────────────────────────────────────────────────
    async function loadEntries() {
        document.getElementById('loadingSpinner').style.display = 'block';
        const tbody = document.getElementById('entriesTableBody');
        tbody.innerHTML = '';

        const start = formatDateStr(new Date(viewYear, viewMonth, 1));
        const end   = formatDateStr(new Date(viewYear, viewMonth + 1, 1));

        try {
            const q = query(
                collection(db, "Stock Take"),
                where("date", ">=", start),
                where("date", "<", end),
                orderBy("date", "desc")
            );
            const snap = await getDocs(q);
            const entries = [];
            snap.forEach(doc => entries.push({ id: doc.id, ...doc.data() }));

            // Stats
            const uniqueEngineers = new Set(entries.map(e => e.engineer));
            document.getElementById('statTotal').textContent     = entries.length;
            document.getElementById('statEngineers').textContent = uniqueEngineers.size;

            tbody.innerHTML = '';
            if (entries.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="empty-state">No entries found for ${monthNames[viewMonth]} ${viewYear}</td></tr>`;
            } else {
                entries.forEach(entry => {
                    const tr = document.createElement('tr');
                    const issueTrunc = entry.issue && entry.issue.length > 80
                        ? escHtml(entry.issue.substring(0, 80)) + '…'
                        : escHtml(entry.issue);
                    tr.innerHTML = `
                        <td>${formatDate(entry.date)}</td>
                        <td><strong>${escHtml(entry.engineer)}</strong></td>
                        <td><span class="badge badge-blue">${escHtml(entry.duration)}</span></td>
                        <td>${issueTrunc}</td>`;
                    tbody.appendChild(tr);
                });
            }
        } catch(err) {
            tbody.innerHTML = `<tr><td colspan="4" class="empty-state" style="color:#EF4444;">⚠ Failed to load: ${err.message}</td></tr>`;
        }
        document.getElementById('loadingSpinner').style.display = 'none';
    }

    // ── Submit Form ───────────────────────────────────────────────────────────
    document.getElementById('stockForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const engineer = document.getElementById('engineerName').value;
        const date     = document.getElementById('entryDate').value;
        const duration = document.getElementById('duration').value;
        const issue    = document.getElementById('issue').value.trim();

        if (!engineer || !date || !duration || !issue) {
            showToast('Please fill in all required fields.', 'error');
            return;
        }

        const btn = document.getElementById('submitBtn');
        btn.disabled = true; btn.textContent = 'Submitting...';

        try {
            await addDoc(collection(db, "Stock Take"), {
                engineer, date, duration, issue, submittedAt: serverTimestamp()
            });
            showToast('✓ Entry submitted successfully.');
            document.getElementById('engineerName').value = '';
            document.getElementById('duration').value = '';
            document.getElementById('issue').value = '';
            document.getElementById('entryDate').valueAsDate = new Date();
            const d = new Date(date + 'T00:00:00');
            if (d.getFullYear() === viewYear && d.getMonth() === viewMonth) loadEntries();
        } catch(err) {
            showToast('Error: ' + err.message, 'error');
        }
        btn.disabled = false; btn.textContent = 'Submit Entry';
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
        document.getElementById('engineerName').value = '';
        document.getElementById('duration').value = '';
        document.getElementById('issue').value = '';
        document.getElementById('entryDate').valueAsDate = new Date();
    });

    // ── Init ──────────────────────────────────────────────────────────────────
    updateMonthLabel();
    loadEngineers();
    loadEntries();
</script>
</body>
</html>
