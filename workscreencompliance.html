<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Compliance • OES</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #6366f1;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
      --border: #334155;
      --error: #f87171;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      grid-template-columns: 280px 1fr;
    }
    aside {
      background: var(--card);
      border-right: 1px solid var(--border);
      padding: 2rem 1.5rem;
      height: 100vh;
      position: sticky;
      top: 0;
      overflow-y: auto;
    }
    .logo {
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(90deg, var(--accent), #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 2.5rem;
      text-align: center;
    }
    h2 {
      font-size: 1.1rem;
      color: var(--text-dim);
      margin: 1.8rem 0 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }
    .period-btn, .filter-btn {
      display: block;
      width: 100%;
      padding: 0.95rem 1.2rem;
      margin: 0.4rem 0;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: all 0.18s ease;
      font-size: 0.97rem;
      font-family: inherit;
    }
    .period-btn:hover, .filter-btn:hover {
      background: rgba(99,102,241,0.08);
      border-color: var(--accent);
    }
    .period-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
      box-shadow: 0 3px 12px rgba(99,102,241,0.3);
    }
    .filter-btn.active {
      background: rgba(99,102,241,0.25);
      color: white;
      font-weight: 600;
      border-color: var(--accent);
    }

    /* Team leader section with expand arrow */
    .team-row {
      display: flex;
      align-items: center;
      gap: 0;
      margin: 0.4rem 0;
    }
    .team-row .filter-btn {
      flex: 1;
      margin: 0;
      border-radius: 10px 0 0 10px;
      border-right: none;
    }
    .expand-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 0 10px 10px 0;
      color: var(--text-dim);
      cursor: pointer;
      padding: 0.95rem 0.75rem;
      transition: all 0.18s ease;
      font-size: 0.75rem;
      font-family: inherit;
      line-height: 1;
    }
    .expand-btn:hover {
      background: rgba(99,102,241,0.08);
      border-color: var(--accent);
      color: var(--text);
    }
    .expand-btn.open {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Engineer sub-list */
    .engineer-list {
      display: none;
      padding-left: 1rem;
      margin-bottom: 0.25rem;
    }
    .engineer-list.open {
      display: block;
    }
    .engineer-btn {
      display: block;
      width: 100%;
      padding: 0.6rem 1rem;
      margin: 0.2rem 0;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--text-dim);
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
      font-size: 0.88rem;
      font-family: inherit;
      position: relative;
      padding-left: 1.4rem;
    }
    .engineer-btn::before {
      content: '└';
      position: absolute;
      left: 0.35rem;
      color: var(--border);
      font-size: 0.85rem;
    }
    .engineer-btn:hover {
      background: rgba(99,102,241,0.08);
      border-color: var(--border);
      color: var(--text);
    }
    .engineer-btn.active {
      background: rgba(99,102,241,0.15);
      border-color: var(--accent);
      color: white;
      font-weight: 600;
    }
    .engineer-btn.active::before {
      color: var(--accent);
    }
    .engineers-loading {
      font-size: 0.82rem;
      color: var(--text-dim);
      padding: 0.5rem 1.4rem;
      font-style: italic;
    }

    main {
      padding: 2.5rem 3rem;
      max-width: 1600px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    h1 {
      font-size: 2.1rem;
      font-weight: 700;
      background: linear-gradient(90deg, #e2e8f0, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .breadcrumb {
      font-size: 0.9rem;
      color: var(--text-dim);
      margin-top: 0.4rem;
    }
    .breadcrumb span {
      color: var(--accent);
      font-weight: 600;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 1.8rem 2rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    #chartContainer {
      height: 580px;
      position: relative;
      margin-top: 1.5rem;
    }
    .loading, .error-msg {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-size: 1.2rem;
      background: rgba(15,23,42,0.6);
      border-radius: 12px;
      text-align: center;
      padding: 2rem;
      z-index: 10;
    }
    .error-msg { color: var(--error) !important; font-weight: 500; }

    /* ── Stats strip ── */
    .stats-strip {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
    .stat-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.4rem;
      min-width: 130px;
      flex: 1;
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
    }
    .stat-box.highlight {
      border-color: var(--accent);
      background: linear-gradient(135deg, rgba(99,102,241,0.12), rgba(139,92,246,0.08));
    }
    .stat-box.green {
      border-color: #10b981;
      background: linear-gradient(135deg, rgba(16,185,129,0.12), rgba(52,211,153,0.08));
    }
    .stat-box.red {
      border-color: #f87171;
      background: linear-gradient(135deg, rgba(248,113,113,0.12), rgba(252,165,165,0.08));
    }
    .stat-box.amber {
      border-color: #f59e0b;
      background: linear-gradient(135deg, rgba(245,158,11,0.12), rgba(251,191,36,0.08));
    }
    .stat-label {
      font-size: 0.75rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
      margin-bottom: 0.4rem;
    }
    .stat-value {
      font-size: 1.9rem;
      font-weight: 700;
      line-height: 1.1;
    }
    .stat-value.purple { background: linear-gradient(90deg, var(--accent), #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .stat-value.green  { background: linear-gradient(90deg, #10b981, #34d399);       -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .stat-value.red    { background: linear-gradient(90deg, #f87171, #fca5a5);       -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .stat-value.amber  { background: linear-gradient(90deg, #f59e0b, #fbbf24);       -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .stat-sub {
      font-size: 0.78rem;
      color: var(--text-dim);
      margin-top: 0.2rem;
    }

    @media (max-width: 1100px) {
      body { grid-template-columns: 1fr; }
      aside { height: auto; position: relative; border-right: none; border-bottom: 1px solid var(--border); }
      main { padding: 2rem 1.5rem; }
    }
  </style>
</head>
<body>

<aside>
  <div class="logo">OES Compliance</div>

  <h2>Time Period</h2>
  <button class="period-btn active" data-period="6months">6 months (bar)</button>
  <button class="period-btn" data-period="year">Year to date (bar)</button>

  <h2>Audit Type</h2>
  <button class="filter-btn active" data-audit="all">All Types</button>
  <button class="filter-btn" data-audit="wip">WIP</button>
  <button class="filter-btn" data-audit="post_completion">Post Completes</button>

  <h2>Team Leader</h2>
  <button class="filter-btn active" data-team="all" style="margin: 0.4rem 0; border-radius: 10px;">All Teams</button>

  <!-- Team leader rows injected here by JS -->
  <div id="teamLeaderList"></div>
</aside>

<main>
  <header>
    <div>
      <h1>Compliance</h1>
      <div class="breadcrumb" id="breadcrumb" style="display:none">
        Viewing: <span id="breadcrumbText"></span>
      </div>
    </div>
  </header>

  <!-- Stats strip -->
  <div class="stats-strip" id="statsStrip">
    <div class="stat-box highlight">
      <div class="stat-label">Overall Pass Rate</div>
      <div class="stat-value purple" id="statOverall">—</div>
      <div class="stat-sub" id="statOverallRaw"></div>
    </div>
    <div class="stat-box green">
      <div class="stat-label">Jobs Passed</div>
      <div class="stat-value green" id="statPassed">—</div>
      <div class="stat-sub" id="statPassedSub"></div>
    </div>
    <div class="stat-box red">
      <div class="stat-label">Jobs Failed</div>
      <div class="stat-value red" id="statFailed">—</div>
      <div class="stat-sub" id="statFailedSub"></div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Total Audited</div>
      <div class="stat-value purple" id="statTotal">—</div>
      <div class="stat-sub" id="statTotalSub"></div>
    </div>
    <div class="stat-box amber">
      <div class="stat-label">Best Month</div>
      <div class="stat-value amber" id="statBest">—</div>
      <div class="stat-sub" id="statBestSub"></div>
    </div>
  </div>

  <div class="card">
    <div id="chartContainer">
      <div class="loading">Loading compliance data…</div>
    </div>
  </div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
    authDomain: "oesperformance-a54c0.firebaseapp.com",
    projectId: "oesperformance-a54c0",
    storageBucket: "oesperformance-a54c0.firebasestorage.app",
    messagingSenderId: "484894102454",
    appId: "1:484894102454:web:17535ee497eac2d90d6717",
    measurementId: "G-R56BGZYV8N"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);

  const TEAM_LEADERS = [
    "Richard Wiecko",
    "Scott Carson",
    "Scott Carson - Scot",
    "Stuart Whyte",
    "Tom Green"
  ];

  // ── Hardcoded engineer → team leader map ──────────────────────────────────
  // This is the source of truth — ignores whatever lineManager is stored in
  // Firestore and assigns every engineer to the correct team leader directly.
  const ENGINEER_TO_TEAM = {
    "Aaron Shepherd":      "Richard Wiecko",
    "Alex Duff":           "Richard Wiecko",
    "Authur Bumhira":      "Richard Wiecko",
    "Bryan McCabe":        "Richard Wiecko",
    "Herve Ntwali":        "Richard Wiecko",
    "Matti Chalkowski":    "Richard Wiecko",
    "Muhammad Shahroze":   "Richard Wiecko",
    "Nick Griffiths":      "Richard Wiecko",
    "Simon Morris":        "Richard Wiecko",
    "Craig O'Sullivan":    "Richard Wiecko",
    "Mehdi Khamseh":       "Richard Wiecko",
    "Owain Sigsworth":     "Richard Wiecko",

    "Chris Timm":          "Scott Carson",
    "Daniel Sanders":      "Scott Carson",
    "Geoff Pymm":          "Scott Carson",
    "Jon Convery":         "Scott Carson",
    "Jordan Gray":         "Scott Carson",
    "Martin Bailes":       "Scott Carson",
    "Michael Douglass":    "Scott Carson",
    "Michael Seaman":      "Scott Carson",
    "Michael Timm":        "Scott Carson",
    "Alistair Cavan":      "Scott Carson",
    "Harris Saleem":       "Scott Carson",
    "Scott Coyle":         "Scott Carson",
    "Tomas Anderson":      "Scott Carson",

    "Bilal Amin":          "Scott Carson - Scot",
    "Daniel Nally":        "Scott Carson - Scot",
    "James Mclean":        "Scott Carson - Scot",
    "Richard Lang":        "Scott Carson - Scot",

    "Calum Ballingal":     "Stuart Whyte",
    "Chris Stein":         "Stuart Whyte",
    "Clayton Spink":       "Stuart Whyte",
    "Jamie Longland":      "Stuart Whyte",
    "Jonny Thompson":      "Stuart Whyte",
    "Morris Dow":          "Stuart Whyte",
    "Paul Davidson":       "Stuart Whyte",
    "Allan Grant":         "Stuart Whyte",
    "Craig Steel":         "Stuart Whyte",
    "Jonathan Chyla":      "Stuart Whyte",
    "Kris Armstrong":      "Stuart Whyte",
    "Muhammad Zafar":      "Stuart Whyte",
    "Neil Burns":          "Stuart Whyte",
    "Ryan Clark":          "Stuart Whyte",

    "Billy McDonough":     "Tom Green",
    "Chanda Kasama":       "Tom Green",
    "Dinis Cruz":          "Tom Green",
    "George Chapman":      "Tom Green",
    "Ivan Rivers":         "Tom Green",
    "Johnson Allepot":     "Tom Green",
    "Jordan Morrison":     "Tom Green",
    "Lukasz Holysz":       "Tom Green",
    "Ryan Beekawa":        "Tom Green",
    "Sammim Miah":         "Tom Green",
    "Stephen Lawless":     "Tom Green",
  };

  // Pre-build the engineersByTeam sidebar list from the hardcoded map
  const engineersByTeam = {};
  TEAM_LEADERS.forEach(tl => engineersByTeam[tl] = []);
  Object.entries(ENGINEER_TO_TEAM).forEach(([eng, tl]) => {
    if (engineersByTeam[tl]) engineersByTeam[tl].push(eng);
  });
  TEAM_LEADERS.forEach(tl => engineersByTeam[tl].sort());

  // Resolve team for a compliance record:
  // 1. Look up installerEngineer in the hardcoded map (most reliable)
  // 2. Fall back to lineManager field as stored
  function resolveTeam(d) {
    const eng = (d.installerEngineer || '').trim();
    if (eng && ENGINEER_TO_TEAM[eng]) return ENGINEER_TO_TEAM[eng];
    return (d.lineManager || '').trim();
  }

  const ctx = document.createElement('canvas');
  document.querySelector('#chartContainer').appendChild(ctx);
  let chart = null;

  // Cache all compliance docs with resolved team attached
  let allDocs = null;
  async function getAllDocs() {
    if (allDocs) return allDocs;
    const snapshot = await getDocs(collection(db, "compliance"));
    allDocs = [];
    snapshot.forEach(doc => {
      const d = doc.data();
      // Normalise known alternate spellings before resolving team
      const rawEng = (d.installerEngineer || '').trim();
      const normEng = rawEng
        .replace(/^Medhi\b/i,    'Mehdi')      // Medhi → Mehdi Khamseh
        .replace(/^Muhammad Zafar$/i, 'Muhammed Zafar');  // Muhammad → Muhammed Zafar
      const normDoc = normEng !== rawEng ? { ...d, installerEngineer: normEng } : d;
      allDocs.push({ ...normDoc, _team: resolveTeam(normDoc) });
    });
    return allDocs;
  }

  const periods = {
    "6months": { label: "Last 6 months",  daysBack: 180, color: "#6366f1" },
    "year":    { label: "Year to date",   daysBack: 365, color: "#8b5cf6" },
  };

  let currentPeriod   = "6months";
  let currentTeam     = "all";
  let currentEngineer = "all";
  let currentAudit    = "all";

  // engineersByTeam is pre-built from the hardcoded ENGINEER_TO_TEAM map.
  // buildEngineerLists is a no-op kept so init() still works.
  async function buildEngineerLists() { /* no-op */ }

  // ── Build sidebar team leader rows ──────────────────────────────────────
  function buildTeamLeaderSidebar() {
    const container = document.getElementById('teamLeaderList');
    container.innerHTML = '';

    TEAM_LEADERS.forEach(tl => {
      const row = document.createElement('div');
      row.className = 'team-row';

      // Team leader button
      const tlBtn = document.createElement('button');
      tlBtn.className = 'filter-btn';
      tlBtn.dataset.team = tl;
      tlBtn.textContent = tl;
      tlBtn.addEventListener('click', () => selectTeam(tl, tlBtn));

      // Expand arrow
      const expandBtn = document.createElement('button');
      expandBtn.className = 'expand-btn';
      expandBtn.title = 'Show engineers';
      expandBtn.textContent = '▾';
      expandBtn.dataset.tl = tl;

      row.appendChild(tlBtn);
      row.appendChild(expandBtn);
      container.appendChild(row);

      // Engineer sub-list
      const engList = document.createElement('div');
      engList.className = 'engineer-list';
      engList.id = `engineers-${tl.replace(/\s+/g, '-')}`;
      container.appendChild(engList);

      expandBtn.addEventListener('click', () => toggleEngineerList(tl, expandBtn, engList));
    });
  }

  function toggleEngineerList(tl, expandBtn, engList) {
    const isOpen = engList.classList.contains('open');
    if (isOpen) {
      engList.classList.remove('open');
      expandBtn.classList.remove('open');
      expandBtn.textContent = '▾';
    } else {
      engList.classList.add('open');
      expandBtn.classList.add('open');
      expandBtn.textContent = '▴';
      populateEngineerList(tl, engList);
    }
  }

  function populateEngineerList(tl, engList) {
    engList.innerHTML = '';
    const engineers = engineersByTeam[tl] || [];

    if (engineers.length === 0) {
      engList.innerHTML = '<div class="engineers-loading">No engineers found</div>';
      return;
    }

    engineers.forEach(eng => {
      const btn = document.createElement('button');
      btn.className = 'engineer-btn';
      btn.dataset.engineer = eng;
      btn.textContent = eng;
      if (currentEngineer === eng) btn.classList.add('active');
      btn.addEventListener('click', () => selectEngineer(eng, tl, btn));
      engList.appendChild(btn);
    });
  }

  function selectTeam(team, clickedBtn) {
    // Deactivate all team/audit filter buttons (not period, not engineer)
    document.querySelectorAll('[data-team]').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.engineer-btn').forEach(b => b.classList.remove('active'));

    clickedBtn.classList.add('active');
    currentTeam     = team;
    currentEngineer = 'all';
    updateBreadcrumb();
    updateChart();
  }

  function selectEngineer(eng, tl, clickedBtn) {
    // Activate the parent team leader button too
    document.querySelectorAll('[data-team]').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.engineer-btn').forEach(b => b.classList.remove('active'));

    // Highlight the team leader
    const tlBtn = document.querySelector(`[data-team="${CSS.escape(tl)}"]`);
    if (tlBtn) tlBtn.classList.add('active');

    clickedBtn.classList.add('active');
    currentTeam     = tl;
    currentEngineer = eng;
    updateBreadcrumb();
    updateChart();
  }

  function updateBreadcrumb() {
    const bc     = document.getElementById('breadcrumb');
    const bcText = document.getElementById('breadcrumbText');
    if (currentTeam === 'all') {
      bc.style.display = 'none';
    } else if (currentEngineer === 'all') {
      bc.style.display = 'block';
      bcText.textContent = currentTeam;
    } else {
      bc.style.display = 'block';
      bcText.textContent = `${currentTeam} → ${currentEngineer}`;
    }
  }

  // ── Date helpers ────────────────────────────────────────────────────────
  function parseInstallationDate(dateStr) {
    if (!dateStr) return null;
    let parts = dateStr.split('/');
    if (parts.length === 3) return new Date(parts[2], parts[1] - 1, parts[0]);
    parts = dateStr.split('-');
    if (parts.length === 3) return new Date(parts[0], parts[1] - 1, parts[2]);
    const d = new Date(dateStr);
    return isNaN(d.getTime()) ? null : d;
  }

  // ── Main data aggregation ────────────────────────────────────────────────
  async function fetchAndAggregateCompliance(periodKey, team, engineer, auditType) {
    const cfg   = periods[periodKey];
    const today = new Date();
    const start = new Date(today);
    start.setDate(start.getDate() - cfg.daysBack);

    const docs = await getAllDocs();

    // Build month buckets
    const allMonths = [];
    const cur = new Date(start);
    cur.setDate(1);
    while (cur <= today) {
      allMonths.push(`${cur.getFullYear()}-${String(cur.getMonth() + 1).padStart(2, '0')}`);
      cur.setMonth(cur.getMonth() + 1);
    }

    const monthMap = {};
    allMonths.forEach(mk => {
      monthMap[mk] = { wipJobs: new Map(), postCompJobs: new Map() };
    });

    docs.forEach(d => {
      const installDate = parseInstallationDate(d.installationDate);
      if (!installDate || installDate < start || installDate > today) return;

      // _team is resolved from the hardcoded ENGINEER_TO_TEAM map (most reliable)
      const tlMatch  = team === 'all' || d._team === team;
      const engMatch = engineer === 'all' || (d.installerEngineer || '').trim() === engineer;
      const auditMatch = auditType === 'all' || d.type === auditType;

      if (!tlMatch || !engMatch || !auditMatch) return;

      const mk = `${installDate.getFullYear()}-${String(installDate.getMonth() + 1).padStart(2, '0')}`;
      if (!monthMap[mk]) return;

      const jobRef   = d.jobReference;
      const outcome  = (d.auditOutcome || '').toLowerCase().trim();
      const isPassed = outcome.includes('pass') || outcome === 'p';

      if (d.type === 'wip') {
        if (!monthMap[mk].wipJobs.has(jobRef)) monthMap[mk].wipJobs.set(jobRef, isPassed);
      } else if (d.type === 'post_completion') {
        if (!monthMap[mk].postCompJobs.has(jobRef)) monthMap[mk].postCompJobs.set(jobRef, isPassed);
      }
    });

    const labels = allMonths.map(mk => {
      const [y, m] = mk.split('-');
      return new Date(y, parseInt(m) - 1).toLocaleDateString('en-GB', { month: 'short', year: 'numeric' });
    });

    const values = allMonths.map(mk => {
      const data = monthMap[mk];
      let total = 0, passed = 0;
      if (auditType === 'all' || auditType === 'wip') {
        total  += data.wipJobs.size;
        passed += [...data.wipJobs.values()].filter(Boolean).length;
      }
      if (auditType === 'all' || auditType === 'post_completion') {
        total  += data.postCompJobs.size;
        passed += [...data.postCompJobs.values()].filter(Boolean).length;
      }
      return total === 0 ? 0 : Math.round((passed / total) * 100);
    });

    // Also compute per-month passed/total for bar sub-labels
    const passedArr = allMonths.map(mk => {
      const data = monthMap[mk];
      let passed = 0;
      if (auditType === 'all' || auditType === 'wip')           passed += [...data.wipJobs.values()].filter(Boolean).length;
      if (auditType === 'all' || auditType === 'post_completion') passed += [...data.postCompJobs.values()].filter(Boolean).length;
      return passed;
    });
    const totalArr = allMonths.map(mk => {
      const data = monthMap[mk];
      let total = 0;
      if (auditType === 'all' || auditType === 'wip')           total += data.wipJobs.size;
      if (auditType === 'all' || auditType === 'post_completion') total += data.postCompJobs.size;
      return total;
    });

    return { labels, values, monthMap, allMonths, passedArr, totalArr };
  }

  // ── Stats strip update ──────────────────────────────────────────────────
  function updateStats(data) {
    // Sum across all months in the period
    let totalPassed = 0, totalJobs = 0;
    let bestPct = -1, bestLabel = '—', bestRaw = '';
    let worstActiveMonth = null;

    data.allMonths.forEach((mk, i) => {
      const passed = data.passedArr[i];
      const total  = data.totalArr[i];
      totalPassed += passed;
      totalJobs   += total;

      if (total > 0) {
        const pct = Math.round((passed / total) * 100);
        if (pct > bestPct) {
          bestPct   = pct;
          bestLabel = pct + '%';
          bestRaw   = data.labels[i] + ' (' + passed + '/' + total + ')';
        }
      }
    });

    const totalFailed = totalJobs - totalPassed;
    const overallPct  = totalJobs > 0 ? Math.round((totalPassed / totalJobs) * 100) : null;

    // Overall pass rate — colour by performance
    const overallEl = document.getElementById('statOverall');
    overallEl.textContent = overallPct !== null ? overallPct + '%' : '—';
    overallEl.className = 'stat-value ' +
      (overallPct === null ? 'purple' : overallPct >= 90 ? 'green' : overallPct >= 75 ? 'amber' : 'red');

    const overallBox = overallEl.closest('.stat-box');
    overallBox.className = 'stat-box ' +
      (overallPct === null ? 'highlight' : overallPct >= 90 ? 'green' : overallPct >= 75 ? 'amber' : 'red');

    document.getElementById('statOverallRaw').textContent =
      totalJobs > 0 ? totalPassed + ' passed from ' + totalJobs + ' audited' : 'No data for this period';

    document.getElementById('statPassed').textContent  = totalPassed || '—';
    document.getElementById('statPassedSub').textContent =
      totalJobs > 0 ? ((totalPassed / totalJobs * 100).toFixed(1)) + '% of audited jobs' : '';

    document.getElementById('statFailed').textContent  = totalFailed > 0 ? totalFailed : totalJobs > 0 ? '0' : '—';
    document.getElementById('statFailedSub').textContent =
      totalJobs > 0 ? ((totalFailed / totalJobs * 100).toFixed(1)) + '% of audited jobs' : '';

    document.getElementById('statTotal').textContent   = totalJobs || '—';
    const activeMonths = data.allMonths.filter((_, i) => data.totalArr[i] > 0).length;
    document.getElementById('statTotalSub').textContent =
      activeMonths > 0 ? 'across ' + activeMonths + ' month' + (activeMonths !== 1 ? 's' : '') : '';

    document.getElementById('statBest').textContent    = bestPct >= 0 ? bestLabel : '—';
    document.getElementById('statBestSub').textContent = bestRaw;
  }

  // ── Chart render ────────────────────────────────────────────────────────
  async function updateChart() {
    const container = document.querySelector('#chartContainer');
    container.innerHTML = '<div class="loading">Loading compliance data…</div>';

    try {
      const data = await fetchAndAggregateCompliance(currentPeriod, currentTeam, currentEngineer, currentAudit);
      const cfg  = periods[currentPeriod];

      updateStats(data);

      container.innerHTML = '';
      container.appendChild(ctx);
      if (chart) chart.destroy();

      const auditLabel  = currentAudit === 'all' ? 'All Types' : currentAudit === 'wip' ? 'WIP' : 'Post Completes';
      const filterLabel = currentEngineer !== 'all'
        ? `${currentTeam} → ${currentEngineer}`
        : currentTeam === 'all' ? 'All Teams' : currentTeam;

      chart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: data.labels,
          datasets: [{
            label: `Pass % (${auditLabel} – ${filterLabel})`,
            data: data.values,
            backgroundColor: 'rgba(99,102,241,0.75)',
            borderColor: cfg.color,
            borderWidth: 1,
            borderRadius: 6,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          layout: { padding: { top: 28 } },
          plugins: {
            title: {
              display: true,
              text: `${cfg.label} – Compliance Pass Rate`,
              color: '#e2e8f0',
              font: { size: 18, weight: '600' },
              padding: { bottom: 20 }
            },
            legend: { labels: { color: '#cbd5e1', font: { size: 14 } } },
            datalabels: {
              anchor: 'end',
              align: 'top',
              offset: 4,
              color: (ctx) => {
                const pct = data.values[ctx.dataIndex];
                return pct === 0 && data.totalArr[ctx.dataIndex] > 0 ? '#f87171' : '#e2e8f0';
              },
              font: { weight: 'bold', size: 11 },
              textShadowColor: 'rgba(0,0,0,0.8)',
              textShadowBlur: 4,
              formatter: (value, ctx) => {
                const passed = data.passedArr[ctx.dataIndex];
                const total  = data.totalArr[ctx.dataIndex];
                if (total === 0) return '';
                const pctLine = value > 0 ? value + '%' : '0%';
                return pctLine + '\n' + passed + '/' + total;
              },
            },
            tooltip: {
              callbacks: {
                afterLabel(context) {
                  const mk   = data.allMonths[context.dataIndex];
                  const md   = data.monthMap[mk];
                  if (!md) return '';
                  let total = 0, passed = 0;
                  if (currentAudit === 'all' || currentAudit === 'wip') {
                    total  += md.wipJobs.size;
                    passed += [...md.wipJobs.values()].filter(Boolean).length;
                  }
                  if (currentAudit === 'all' || currentAudit === 'post_completion') {
                    total  += md.postCompJobs.size;
                    passed += [...md.postCompJobs.values()].filter(Boolean).length;
                  }
                  return `Passed: ${passed} / ${total}`;
                }
              }
            }
          },
          scales: {
            x: { ticks: { color: '#94a3b8', font: { size: 11 }, padding: 8 }, grid: { color: '#334155' } },
            y: {
              beginAtZero: true, max: 100,
              ticks: { color: '#94a3b8', stepSize: 10, callback: v => v + '%' },
              grid: { color: '#334155' }
            }
          }
        },
        plugins: [ChartDataLabels]
      });
    } catch (err) {
      console.error("Error:", err);
      container.innerHTML = `<div class="error-msg">${err.message || 'Unknown error'}<br><br><small>Press F12 → Console for details</small></div>`;
    }
  }

  // ── Period buttons ───────────────────────────────────────────────────────
  document.querySelectorAll('.period-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentPeriod = btn.dataset.period;
      updateChart();
    });
  });

  // ── Audit type buttons ───────────────────────────────────────────────────
  document.querySelectorAll('[data-audit]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-audit]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentAudit = btn.dataset.audit;
      updateChart();
    });
  });

  // ── "All Teams" button ───────────────────────────────────────────────────
  document.querySelector('[data-team="all"]').addEventListener('click', function () {
    document.querySelectorAll('[data-team]').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.engineer-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    currentTeam     = 'all';
    currentEngineer = 'all';
    updateBreadcrumb();
    updateChart();
  });

  // ── Init ─────────────────────────────────────────────────────────────────
  async function init() {
    await buildEngineerLists();
    buildTeamLeaderSidebar();
    updateChart();
  }

  init();
</script>

</body>
