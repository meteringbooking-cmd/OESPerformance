<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Compliance • OES</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #6366f1;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
      --border: #334155;
      --error: #f87171;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      grid-template-columns: 280px 1fr;
    }
    aside {
      background: var(--card);
      border-right: 1px solid var(--border);
      padding: 2rem 1.5rem;
      height: 100vh;
      position: sticky;
      top: 0;
      overflow-y: auto;
    }
    .logo {
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(90deg, var(--accent), #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 2.5rem;
      text-align: center;
    }
    h2 {
      font-size: 1.1rem;
      color: var(--text-dim);
      margin: 1.8rem 0 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }
    .period-btn, .team-btn {
      display: block;
      width: 100%;
      padding: 0.95rem 1.2rem;
      margin: 0.4rem 0;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: all 0.18s ease;
      font-size: 0.97rem;
    }
    .period-btn:hover, .team-btn:hover {
      background: rgba(99,102,241,0.08);
      border-color: var(--accent);
    }
    .period-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
      box-shadow: 0 3px 12px rgba(99,102,241,0.3);
    }
    .team-btn.active {
      background: rgba(99,102,241,0.25);
      color: white;
      font-weight: 600;
      border-color: var(--accent);
    }
    main {
      padding: 2.5rem 3rem;
      max-width: 1600px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    h1 {
      font-size: 2.1rem;
      font-weight: 700;
      background: linear-gradient(90deg, #e2e8f0, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 1.8rem 2rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    #chartContainer {
      height: 580px;
      position: relative;
      margin-top: 1.5rem;
    }
    .loading, .error-msg {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-size: 1.2rem;
      background: rgba(15,23,42,0.6);
      border-radius: 12px;
      text-align: center;
      padding: 2rem;
      z-index: 10;
    }
    .error-msg {
      color: var(--error) !important;
      font-weight: 500;
    }
    @media (max-width: 1100px) {
      body { grid-template-columns: 1fr; }
      aside { height: auto; position: relative; border-right: none; border-bottom: 1px solid var(--border); }
      main { padding: 2rem 1.5rem; }
    }
  </style>
</head>
<body>

<aside>
  <div class="logo">OES Compliance</div>

  <h2>Time Period</h2>
  <button class="period-btn active" data-period="6months">6 months (bar)</button>
  <button class="period-btn" data-period="year">Year to date (bar)</button>

  <h2>Audit Type</h2>
  <button class="team-btn active" data-audit="all">All Types</button>
  <button class="team-btn" data-audit="wip">WIP</button>
  <button class="team-btn" data-audit="post_completion">Post Completes</button>

  <h2>Team Leader</h2>
  <button class="team-btn active" data-team="all">All Teams</button>
  <button class="team-btn" data-team="Richard Wiecko">Richard Wiecko</button>
  <button class="team-btn" data-team="Scott Carson">Scott Carson</button>
  <button class="team-btn" data-team="Stuart Whyte">Stuart Whyte</button>
  <button class="team-btn" data-team="FTL 4">FTL 4</button>
</aside>

<main>
  <header>
    <h1></h1>Compliance</h1>
  </header>

  <div class="card">
    <div id="chartContainer">
      <div class="loading">Loading compliance data…</div>
    </div>
  </div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
    authDomain: "oesperformance-a54c0.firebaseapp.com",
    projectId: "oesperformance-a54c0",
    storageBucket: "oesperformance-a54c0.firebasestorage.app",
    messagingSenderId: "484894102454",
    appId: "1:484894102454:web:17535ee497eac2d90d6717",
    measurementId: "G-R56BGZYV8N"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const ctx = document.createElement('canvas');
  document.querySelector('#chartContainer').appendChild(ctx);
  let chart = null;

  const periods = {
    "6months": { label: "Last 6 months",        daysBack: 180, color: "#6366f1", type: "bar" },
    "year":    { label: "Year to date",         daysBack: 365, color: "#8b5cf6", type: "bar" },
  };

  let currentPeriod = "6months";
  let currentTeam   = "all";
  let currentAudit  = "all";

  async function fetchAndAggregateCompliance(periodKey, team, auditType) {
    const cfg = periods[periodKey];
    const today = new Date();
    const start = new Date(today);
    start.setDate(start.getDate() - cfg.daysBack);

    // Fetch all compliance data (no date filter in query due to installationDate format)
    const snapshot = await getDocs(collection(db, "compliance"));
    
    // Helper function to parse installation date
    function parseInstallationDate(dateStr) {
      if (!dateStr) return null;
      
      // Try DD/MM/YYYY format
      let parts = dateStr.split('/');
      if (parts.length === 3) {
        return new Date(parts[2], parts[1] - 1, parts[0]);
      }
      
      // Try YYYY-MM-DD format
      parts = dateStr.split('-');
      if (parts.length === 3) {
        return new Date(parts[0], parts[1] - 1, parts[2]);
      }
      
      // Try parsing as standard date
      const date = new Date(dateStr);
      return isNaN(date.getTime()) ? null : date;
    }

    // Generate all months in the period
    const allMonths = [];
    const currentMonth = new Date(start);
    currentMonth.setDate(1); // Set to first day of month
    
    while (currentMonth <= today) {
      const monthKey = `${currentMonth.getFullYear()}-${String(currentMonth.getMonth() + 1).padStart(2, '0')}`;
      allMonths.push(monthKey);
      currentMonth.setMonth(currentMonth.getMonth() + 1);
    }

    // Group data by month and job reference
    const monthMap = {};
    allMonths.forEach(monthKey => {
      monthMap[monthKey] = {
        wipJobs: new Map(),
        postCompJobs: new Map()
      };
    });

    snapshot.forEach(doc => {
      const d = doc.data();
      const installDate = parseInstallationDate(d.installationDate);
      
      if (!installDate || installDate < start || installDate > today) return;
      
      // Filter by team (using lineManager field)
      const teamMatch = team === "all" || d.lineManager === team;
      // Filter by audit type
      const auditMatch = auditType === "all" || d.type === auditType;
      
      if (!teamMatch || !auditMatch) return;
      
      const monthKey = `${installDate.getFullYear()}-${String(installDate.getMonth() + 1).padStart(2, '0')}`;
      
      if (!monthMap[monthKey]) return;
      
      const jobRef = d.jobReference;
      const outcome = (d.auditOutcome || '').toLowerCase();
      const isPassed = outcome.includes('pass') || outcome === 'p';
      
      if (d.type === 'wip') {
        if (!monthMap[monthKey].wipJobs.has(jobRef)) {
          monthMap[monthKey].wipJobs.set(jobRef, isPassed);
        }
      } else if (d.type === 'post_completion') {
        if (!monthMap[monthKey].postCompJobs.has(jobRef)) {
          monthMap[monthKey].postCompJobs.set(jobRef, isPassed);
        }
      }
    });

    // Calculate percentages
    const labels = allMonths.map(monthKey => {
      const [year, month] = monthKey.split('-');
      const date = new Date(year, parseInt(month) - 1);
      return date.toLocaleDateString('en-GB', { month: 'short', year: 'numeric' });
    });

    const values = allMonths.map(monthKey => {
      const data = monthMap[monthKey];
      
      // Combine WIP and Post Completion based on audit type filter
      let totalJobs = 0;
      let passedJobs = 0;
      
      if (auditType === 'all' || auditType === 'wip') {
        totalJobs += data.wipJobs.size;
        passedJobs += Array.from(data.wipJobs.values()).filter(passed => passed).length;
      }
      
      if (auditType === 'all' || auditType === 'post_completion') {
        totalJobs += data.postCompJobs.size;
        passedJobs += Array.from(data.postCompJobs.values()).filter(passed => passed).length;
      }
      
      if (totalJobs === 0) return 0;
      return Math.round((passedJobs / totalJobs) * 100);
    });

    return { labels, values, monthMap, allMonths };
  }

  async function updateChart() {
    const container = document.querySelector('#chartContainer');
    container.innerHTML = '<div class="loading">Loading compliance data…</div>';

    try {
      const data = await fetchAndAggregateCompliance(currentPeriod, currentTeam, currentAudit);
      const cfg = periods[currentPeriod];

      container.innerHTML = '';
      container.appendChild(ctx);

      if (chart) chart.destroy();

      const auditLabel = currentAudit === 'all' ? 'All Types' : 
                         currentAudit === 'wip' ? 'WIP' : 'Post Completes';
      const teamLabel = currentTeam === 'all' ? 'All Teams' : currentTeam;

      chart = new Chart(ctx, {
        type: cfg.type,
        data: {
          labels: data.labels,
          datasets: [{
            label: `Pass % (${auditLabel} - ${teamLabel})`,
            data: data.values,
            backgroundColor: 'rgba(99,102,241,0.75)',
            borderColor: cfg.color,
            borderWidth: 1,
            borderRadius: 6,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            title: {
              display: true,
              text: `${cfg.label} – Compliance Pass Rate`,
              color: '#e2e8f0',
              font: { size: 18, weight: '600' },
              padding: { bottom: 20 }
            },
            legend: { labels: { color: '#cbd5e1', font: { size: 14 } } },
            datalabels: {
              anchor: 'end',
              align: 'top',
              offset: 4,
              color: '#e2e8f0',
              font: { weight: 'bold', size: 12 },
              formatter: (value) => value > 0 ? value + '%' : '',
              textShadowColor: 'rgba(0,0,0,0.8)',
              textShadowBlur: 4
            },
            tooltip: {
              callbacks: {
                afterLabel: function(context) {
                  const monthKey = data.allMonths[context.dataIndex];
                  const monthData = data.monthMap[monthKey];
                  if (monthData) {
                    let totalJobs = 0;
                    let passedJobs = 0;
                    
                    if (currentAudit === 'all' || currentAudit === 'wip') {
                      totalJobs += monthData.wipJobs.size;
                      passedJobs += Array.from(monthData.wipJobs.values()).filter(p => p).length;
                    }
                    
                    if (currentAudit === 'all' || currentAudit === 'post_completion') {
                      totalJobs += monthData.postCompJobs.size;
                      passedJobs += Array.from(monthData.postCompJobs.values()).filter(p => p).length;
                    }
                    
                    return `Passed: ${passedJobs} / ${totalJobs}`;
                  }
                  return '';
                }
              }
            }
          },
          scales: {
            x: {
              ticks: {
                color: '#94a3b8',
                font: { size: 11 },
                padding: 8,
              },
              grid: { color: '#334155' }
            },
            y: {
              beginAtZero: true,
              max: 100,
              ticks: { 
                color: '#94a3b8', 
                stepSize: 10,
                callback: function(value) {
                  return value + '%';
                }
              },
              grid: { color: '#334155' }
            }
          }
        },
        plugins: [ChartDataLabels]
      });
    } catch (err) {
      console.error("Error:", err);
      let msg = err.message || "Unknown error";
      container.innerHTML = `
        <div class="error-msg">
          ${msg}<br><br>
          <small>Press F12 → Console for details</small>
        </div>`;
    }
  }

  document.querySelectorAll('.period-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentPeriod = btn.dataset.period;
      updateChart();
    });
  });

  document.querySelectorAll('[data-team]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-team]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTeam = btn.dataset.team;
      updateChart();
    });
  });

  document.querySelectorAll('[data-audit]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-audit]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentAudit = btn.dataset.audit;
      updateChart();
    });
  });

  updateChart();
</script>

</body>
</html>
