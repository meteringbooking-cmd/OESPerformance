<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Energise — Stock Order Form</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>

  :root {

    --bg: #0f0f0f;

    --surface: #1a1a1a;

    --surface2: #222222;

    --border: #2e2e2e;

    --accent: #e8ff47;

    --accent2: #47c8ff;

    --text: #f0f0f0;

    --text-muted: #888;

    --in-stock: #4ade80;

    --backorder: #f59e0b;

    --out: #f87171;

    --radius: 6px;

  }



  * { box-sizing: border-box; margin: 0; padding: 0; }



  body {

    background: var(--bg);

    color: var(--text);

    font-family: 'DM Sans', sans-serif;

    font-size: 14px;

    min-height: 100vh;

  }



  /* HEADER */

  header {

    background: var(--surface);

    border-bottom: 1px solid var(--border);

    padding: 20px 32px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    position: sticky;

    top: 0;

    z-index: 100;

  }



  .logo {

    font-family: 'Syne', sans-serif;

    font-size: 22px;

    font-weight: 800;

    letter-spacing: -0.5px;

  }

  .logo span { color: var(--accent); }



  .header-right {

    display: flex;

    align-items: center;

    gap: 16px;

  }



  .basket-btn {

    background: var(--accent);

    color: #000;

    border: none;

    padding: 9px 20px;

    border-radius: var(--radius);

    font-family: 'Syne', sans-serif;

    font-weight: 700;

    font-size: 13px;

    cursor: pointer;

    display: flex;

    align-items: center;

    gap: 8px;

    transition: transform 0.15s, background 0.15s;

  }

  .basket-btn:hover { transform: translateY(-1px); background: #d4eb30; }



  .basket-count {

    background: #000;

    color: var(--accent);

    border-radius: 50%;

    width: 20px;

    height: 20px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 11px;

    font-weight: 700;

  }



  /* TABLE THUMBNAIL */

  .item-thumb {

    width: 36px;

    height: 36px;

    border-radius: 5px;

    object-fit: cover;

    display: block;

    flex-shrink: 0;

    border: 1px solid var(--border);

    background: var(--surface2);

  }

  .item-thumb-placeholder {

    width: 36px;

    height: 36px;

    border-radius: 5px;

    background: var(--surface2);

    border: 1px solid var(--border);

    display: flex;

    align-items: center;

    justify-content: center;

    flex-shrink: 0;

    opacity: 0.4;

  }

  .item-name-cell {

    display: flex;

    align-items: center;

    gap: 10px;

  }



  /* FILTERS + SEARCH */

  .toolbar {

    padding: 20px 32px;

    display: flex;

    gap: 12px;

    align-items: center;

    flex-wrap: wrap;

    border-bottom: 1px solid var(--border);

    background: var(--surface);

  }



  .search-wrap {

    position: relative;

    flex: 1;

    min-width: 200px;

  }

  .search-wrap svg {

    position: absolute;

    left: 12px;

    top: 50%;

    transform: translateY(-50%);

    color: var(--text-muted);

  }

  input[type="search"], select {

    background: var(--bg);

    border: 1px solid var(--border);

    color: var(--text);

    border-radius: var(--radius);

    padding: 9px 12px 9px 36px;

    font-family: 'DM Sans', sans-serif;

    font-size: 13px;

    width: 100%;

    outline: none;

    transition: border-color 0.2s;

  }

  select { padding-left: 12px; cursor: pointer; }

  input[type="search"]:focus, select:focus { border-color: var(--accent); }

  input[type="search"]::placeholder { color: var(--text-muted); }



  .filter-select { min-width: 160px; }



  .results-count {

    font-family: 'DM Mono', monospace;

    font-size: 12px;

    color: var(--text-muted);

    white-space: nowrap;

  }



  /* MAIN LAYOUT */

  .main {

    display: flex;

    gap: 0;

  }



  /* TABLE */

  .table-wrap {

    flex: 1;

    overflow-x: auto;

    padding: 24px 32px;

  }



  table {

    width: 100%;

    border-collapse: collapse;

  }



  thead tr {

    border-bottom: 2px solid var(--accent);

  }



  th {

    font-family: 'Syne', sans-serif;

    font-size: 11px;

    font-weight: 700;

    letter-spacing: 0.08em;

    text-transform: uppercase;

    color: var(--text-muted);

    padding: 10px 14px;

    text-align: left;

    white-space: nowrap;

  }



  th.th-sku { width: 80px; }

  th.th-uom { width: 90px; }

  th.th-action { width: 160px; text-align: center; }



  tbody tr {

    border-bottom: 1px solid var(--border);

    transition: background 0.12s;

  }

  tbody tr:hover { background: var(--surface2); }

  tbody tr.added-row { background: rgba(232, 255, 71, 0.04); }



  td {

    padding: 10px 14px;

    vertical-align: middle;

  }





  .item-name {

    font-size: 13px;

    font-weight: 500;

    line-height: 1.3;

    max-width: 280px;

  }



  .sku {

    font-family: 'DM Mono', monospace;

    font-size: 12px;

    color: var(--text-muted);

  }



  .uom-badge {

    display: inline-block;

    background: var(--surface2);

    border: 1px solid var(--border);

    border-radius: 4px;

    padding: 2px 8px;

    font-family: 'DM Mono', monospace;

    font-size: 11px;

    color: var(--accent2);

    white-space: nowrap;

  }



  /* ACTION CELL */

  .action-cell {

    text-align: center;

  }



  .add-simple {

    background: var(--surface2);

    border: 1px solid var(--border);

    color: var(--text);

    padding: 7px 16px;

    border-radius: var(--radius);

    font-family: 'DM Sans', sans-serif;

    font-size: 13px;

    font-weight: 500;

    cursor: pointer;

    transition: border-color 0.15s, background 0.15s;

    white-space: nowrap;

  }

  .add-simple:hover { border-color: var(--accent); color: var(--accent); }



  .qty-group {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 0;

  }

  .qty-btn {

    background: var(--surface2);

    border: 1px solid var(--border);

    color: var(--text);

    width: 28px;

    height: 30px;

    cursor: pointer;

    font-size: 16px;

    font-weight: 600;

    display: flex;

    align-items: center;

    justify-content: center;

    transition: background 0.12s, color 0.12s;

    line-height: 1;

  }

  .qty-btn:first-child { border-radius: var(--radius) 0 0 var(--radius); }

  .qty-btn:last-child { border-radius: 0 var(--radius) var(--radius) 0; }

  .qty-btn:hover { background: var(--accent); color: #000; border-color: var(--accent); }

  .qty-input {

    width: 42px;

    height: 30px;

    background: var(--bg);

    border: 1px solid var(--border);

    border-left: none;

    border-right: none;

    color: var(--text);

    text-align: center;

    font-family: 'DM Mono', monospace;

    font-size: 13px;

    outline: none;

    -moz-appearance: textfield;

  }

  .qty-input::-webkit-inner-spin-button,

  .qty-input::-webkit-outer-spin-button { -webkit-appearance: none; }



  .add-qty-btn {

    margin-left: 6px;

    background: var(--accent);

    color: #000;

    border: none;

    padding: 6px 10px;

    border-radius: var(--radius);

    font-family: 'Syne', sans-serif;

    font-size: 11px;

    font-weight: 700;

    cursor: pointer;

    transition: background 0.15s;

    white-space: nowrap;

  }

  .add-qty-btn:hover { background: #d4eb30; }



  .added-badge {

    display: inline-flex;

    align-items: center;

    gap: 5px;

    font-size: 12px;

    color: var(--in-stock);

    font-weight: 600;

  }



  /* BASKET PANEL */

  .basket-panel {

    width: 340px;

    background: var(--surface);

    border-left: 1px solid var(--border);

    min-height: calc(100vh - 61px);

    position: sticky;

    top: 61px;

    height: calc(100vh - 61px);

    display: flex;

    flex-direction: column;

    flex-shrink: 0;

    transition: transform 0.3s ease;

  }



  .basket-panel.hidden {

    display: none;

  }



  .basket-header {

    padding: 20px 20px 14px;

    border-bottom: 1px solid var(--border);

    display: flex;

    align-items: center;

    justify-content: space-between;

  }

  .basket-title {

    font-family: 'Syne', sans-serif;

    font-size: 16px;

    font-weight: 700;

  }

  .basket-clear {

    background: none;

    border: none;

    color: var(--text-muted);

    font-size: 12px;

    cursor: pointer;

    transition: color 0.15s;

  }

  .basket-clear:hover { color: var(--out); }



  .basket-items {

    flex: 1;

    overflow-y: auto;

    padding: 12px 0;

  }

  .basket-items::-webkit-scrollbar { width: 4px; }

  .basket-items::-webkit-scrollbar-track { background: transparent; }

  .basket-items::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }



  .basket-item {

    padding: 10px 20px;

    display: flex;

    align-items: flex-start;

    gap: 10px;

    border-bottom: 1px solid var(--border);

  }

  .bi-icon {

    width: 32px;

    height: 32px;

    background: var(--surface2);

    border-radius: 4px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 14px;

    flex-shrink: 0;

    overflow: hidden;

  }

  .bi-info { flex: 1; }

  .bi-name {

    font-size: 12px;

    font-weight: 500;

    line-height: 1.3;

    margin-bottom: 2px;

  }

  .bi-meta {

    font-family: 'DM Mono', monospace;

    font-size: 11px;

    color: var(--text-muted);

  }

  .bi-remove {

    background: none;

    border: none;

    color: var(--text-muted);

    cursor: pointer;

    font-size: 16px;

    line-height: 1;

    padding: 0;

    transition: color 0.15s;

    flex-shrink: 0;

  }

  .bi-remove:hover { color: var(--out); }



  .basket-empty {

    text-align: center;

    color: var(--text-muted);

    padding: 40px 20px;

    font-size: 13px;

  }



  .basket-footer {

    padding: 16px 20px;

    border-top: 1px solid var(--border);

  }



  .basket-summary {

    font-family: 'DM Mono', monospace;

    font-size: 12px;

    color: var(--text-muted);

    margin-bottom: 12px;

  }

  .basket-summary strong { color: var(--text); }



  .submit-btn {

    width: 100%;

    background: var(--accent);

    color: #000;

    border: none;

    padding: 12px;

    border-radius: var(--radius);

    font-family: 'Syne', sans-serif;

    font-size: 14px;

    font-weight: 800;

    cursor: pointer;

    letter-spacing: 0.02em;

    transition: background 0.15s, transform 0.1s;

  }

  .submit-btn:hover { background: #d4eb30; transform: translateY(-1px); }

  .submit-btn:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; transform: none; }



  /* MODAL */

  .modal-overlay {

    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,0.75);

    z-index: 200;

    align-items: center;

    justify-content: center;

  }

  .modal-overlay.open { display: flex; }

  .modal {

    background: var(--surface);

    border: 1px solid var(--border);

    border-radius: 10px;

    width: 580px;

    max-width: 95vw;

    max-height: 88vh;

    display: flex;

    flex-direction: column;

  }

  .modal-head {

    padding: 20px 24px;

    border-bottom: 1px solid var(--border);

    display: flex;

    align-items: center;

    justify-content: space-between;

  }

  .modal-head h2 {

    font-family: 'Syne', sans-serif;

    font-size: 18px;

    font-weight: 700;

  }

  .modal-close {

    background: none;

    border: none;

    color: var(--text-muted);

    font-size: 22px;

    cursor: pointer;

    line-height: 1;

  }

  .modal-body {

    padding: 20px 24px;

    overflow-y: auto;

    flex: 1;

  }



  /* Name field in modal */

  .name-field {

    margin-bottom: 20px;

  }

  .name-field label {

    display: block;

    font-family: 'Syne', sans-serif;

    font-size: 11px;

    font-weight: 700;

    letter-spacing: 0.08em;

    text-transform: uppercase;

    color: var(--text-muted);

    margin-bottom: 8px;

  }

  .name-field input {

    width: 100%;

    background: var(--bg);

    border: 1px solid var(--border);

    color: var(--text);

    border-radius: var(--radius);

    padding: 10px 14px;

    font-family: 'DM Sans', sans-serif;

    font-size: 14px;

    outline: none;

    transition: border-color 0.2s;

  }

  .name-field input:focus { border-color: var(--accent); }

  .name-field input::placeholder { color: var(--text-muted); }

  .name-field .name-error {

    color: var(--out);

    font-size: 12px;

    margin-top: 5px;

    display: none;

  }

  .name-field .name-error.show { display: block; }



  .modal-table {

    width: 100%;

    border-collapse: collapse;

    font-size: 13px;

  }

  .modal-table th {

    text-align: left;

    font-family: 'Syne', sans-serif;

    font-size: 11px;

    font-weight: 700;

    letter-spacing: 0.06em;

    text-transform: uppercase;

    color: var(--text-muted);

    padding: 6px 10px;

    border-bottom: 1px solid var(--border);

  }

  .modal-table td {

    padding: 8px 10px;

    border-bottom: 1px solid var(--border);

    vertical-align: middle;

  }

  .modal-table tr:last-child td { border-bottom: none; }

  .modal-footer {

    padding: 16px 24px;

    border-top: 1px solid var(--border);

    display: flex;

    gap: 10px;

    justify-content: flex-end;

  }

  .btn-secondary {

    background: var(--surface2);

    border: 1px solid var(--border);

    color: var(--text);

    padding: 9px 18px;

    border-radius: var(--radius);

    font-family: 'DM Sans', sans-serif;

    font-size: 13px;

    font-weight: 500;

    cursor: pointer;

    transition: border-color 0.15s;

  }

  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

  .btn-primary {

    background: var(--accent);

    border: none;

    color: #000;

    padding: 9px 18px;

    border-radius: var(--radius);

    font-family: 'Syne', sans-serif;

    font-size: 13px;

    font-weight: 700;

    cursor: pointer;

    transition: background 0.15s;

    display: flex;

    align-items: center;

    gap: 8px;

  }

  .btn-primary:hover { background: #d4eb30; }

  .btn-primary:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }



  /* Toast notification */

  .toast {

    position: fixed;

    bottom: 30px;

    left: 50%;

    transform: translateX(-50%) translateY(20px);

    background: #1e3a1e;

    border: 1px solid var(--in-stock);

    color: var(--in-stock);

    padding: 12px 24px;

    border-radius: 8px;

    font-family: 'DM Sans', sans-serif;

    font-size: 14px;

    font-weight: 500;

    z-index: 9999;

    opacity: 0;

    transition: opacity 0.3s ease, transform 0.3s ease;

    white-space: nowrap;

  }

  .toast.error {

    background: #3a1e1e;

    border-color: var(--out);

    color: var(--out);

  }

  .toast.show {

    opacity: 1;

    transform: translateX(-50%) translateY(0);

  }



  /* PRINT STYLES */

  @media print {

    header, .toolbar, .basket-panel, .modal-overlay { display: none !important; }

    .table-wrap { padding: 0; }

    body { background: white; color: black; }

    }



  /* IMAGE HOVER PREVIEW */

  .img-preview-card {

    position: fixed;

    z-index: 9000;

    pointer-events: none;

    background: #1a1a1a;

    border: 1px solid #2e2e2e;

    border-radius: 10px;

    box-shadow: 0 16px 48px rgba(0,0,0,0.7), 0 0 0 1px rgba(232,255,71,0.08);

    overflow: hidden;

    width: 200px;

    opacity: 0;

    transform: scale(0.92) translateY(4px);

    transition: opacity 0.18s ease, transform 0.18s ease;

    will-change: transform, opacity;

  }

  .img-preview-card.visible {

    opacity: 1;

    transform: scale(1) translateY(0);

  }

  .img-preview-img {

    width: 200px;

    height: 150px;

    object-fit: cover;

    display: block;

  }

  .img-preview-none {

    width: 200px;

    height: 150px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 8px;

    color: #555;

    font-size: 12px;

    background: #141414;

  }

  .img-preview-none svg { opacity: 0.3; }

  .img-preview-footer {

    padding: 8px 12px;

    font-size: 11px;

    color: #666;

    font-family: 'DM Mono', monospace;

    border-top: 1px solid #2e2e2e;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

  }

  .img-preview-footer .pf-sku { color: var(--accent2); }



  /* THUMB LIGHTBOX */

  .thumb-lightbox {

    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,0.88);

    z-index: 9999;

    align-items: center;

    justify-content: center;

    backdrop-filter: blur(10px);

    -webkit-backdrop-filter: blur(10px);

    cursor: zoom-out;

  }

  .thumb-lightbox.open { display: flex; }

  .thumb-lightbox img {

    max-width: min(90vw, 480px);

    max-height: 80vh;

    object-fit: contain;

    border-radius: 12px;

    border: 1px solid var(--border);

    box-shadow: 0 24px 80px rgba(0,0,0,0.8);

    animation: lbIn 0.2s ease;

    cursor: zoom-out;

  }

  .thumb-lightbox-close {

    position: absolute;

    top: 16px;

    right: 20px;

    background: rgba(255,255,255,0.1);

    border: 1px solid rgba(255,255,255,0.15);

    color: #fff;

    font-size: 22px;

    line-height: 1;

    width: 40px;

    height: 40px;

    border-radius: 50%;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

    transition: background 0.15s;

  }

  .thumb-lightbox-close:hover { background: rgba(255,255,255,0.2); }

  .thumb-lightbox-label {

    position: absolute;

    bottom: 20px;

    left: 0;

    right: 0;

    text-align: center;

    font-family: 'DM Sans', sans-serif;

    font-size: 13px;

    color: rgba(255,255,255,0.5);

    pointer-events: none;

  }

  @keyframes lbIn {

    from { opacity: 0; transform: scale(0.9); }

    to   { opacity: 1; transform: scale(1); }

  }

  .item-thumb { cursor: zoom-in; }



  /* RESPONSIVE */

  @media (max-width: 900px) {

    .basket-panel { display: none; }

    .basket-panel.mobile-open {

      display: flex;

      position: fixed;

      right: 0;

      top: 0;

      height: 100vh;

      z-index: 150;

    }

  }

  /* ── MOBILE: card layout ────────────────────────────────────────── */

  @media (max-width: 640px) {

    header { padding: 12px 16px; }

    .logo { font-size: 18px; }

    .toolbar { padding: 10px 12px; gap: 8px; }

    .filter-select { display: none; } /* hide UOM filter — space-saving */

    /* Remove horizontal scroll from table wrapper */

    .table-wrap { padding: 8px 12px 80px; overflow-x: visible; }

    /* Hide table structure — we restyle rows as cards */

    table { display: block; }

    thead { display: none; }

    tbody { display: flex; flex-direction: column; gap: 10px; }

    tbody tr {

      display: flex;

      flex-direction: column;

      background: var(--surface);

      border: 1px solid var(--border);

      border-radius: 10px;

      padding: 12px 14px;

      gap: 8px;

      border-bottom: 1px solid var(--border) !important;

    }

    tbody tr.added-row { border-color: rgba(232,255,71,0.3) !important; background: rgba(232,255,71,0.04); }

    /* All td's become block */

    td { padding: 0; display: block; }

    /* Name cell — thumbnail + name stacked row */

    .item-name-cell { gap: 10px; align-items: flex-start; }

    .item-thumb, .item-thumb-placeholder { width: 44px; height: 44px; flex-shrink: 0; }

    .item-name { font-size: 14px; max-width: none; }

    /* Meta row: SKU + UOM side by side under name */

    td:nth-child(2), td:nth-child(3) {

      display: inline-block;

      width: auto;

    }

    td:nth-child(2) { margin-right: 8px; }

    /* Action cell — full width, button fills row */

    .action-cell {

      text-align: left;

      margin-top: 2px;

    }

    .add-simple {

      width: 100%;

      padding: 10px;

      font-size: 14px;

      text-align: center;

      background: var(--surface2);

      border-color: var(--border);

    }

    .qty-group { flex: 1; }

    .qty-btn { width: 36px; height: 36px; font-size: 18px; }

    .qty-input { width: 48px; height: 36px; font-size: 14px; }

    .add-qty-btn { flex: 1; height: 36px; font-size: 13px; margin-left: 8px; }

    /* Inline qty+add row fills full width */

    td:last-child > div[style] {

      width: 100%;

      justify-content: stretch;

    }

    .added-badge { font-size: 13px; }

    /* Sticky floating basket button at bottom */

    #toggleBasketBtn {

      position: fixed;

      bottom: 16px;

      left: 50%;

      transform: translateX(-50%);

<script type="module">

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

  import { getFirestore, collection, addDoc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";



  const firebaseConfig = {

    apiKey: "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",

    authDomain: "oesperformance-a54c0.firebaseapp.com",

    projectId: "oesperformance-a54c0",

    storageBucket: "oesperformance-a54c0.firebasestorage.app",

    messagingSenderId: "484894102454",

    appId: "1:484894102454:web:17535ee497eac2d90d6717",

    measurementId: "G-R56BGZYV8N"

  };



  const app = initializeApp(firebaseConfig);

  const db = getFirestore(app);



  // ── Product image map (sku → downloadURL) ──────────────────────────────

  const productImages = {};

  window.productImages = productImages; // expose to regular script

  async function loadProductImages() {

    try {

      const snap = await getDocs(collection(db, 'energise order images'));

      snap.forEach(d => {

        const data = d.data();

        if (data.sku && data.downloadURL) productImages[data.sku] = data.downloadURL;

      });

    } catch (e) {

      console.warn('Could not load product images:', e);

    }

  }



  // ── Hover preview logic ────────────────────────────────────────────────

  const previewCard  = document.getElementById('imgPreviewCard');

  const previewImg   = document.getElementById('imgPreviewImg');

  const previewNone  = document.getElementById('imgPreviewNone');

  const previewFoot  = document.getElementById('imgPreviewFooter');

  let hideTimer = null;



  function showPreview(sku, name, mouseX, mouseY) {

    clearTimeout(hideTimer);

    const url = productImages[sku];

    if (url) {

      previewImg.src = url;

      previewImg.style.display = 'block';

      previewNone.style.display = 'none';

    } else {

      previewImg.style.display = 'none';

      previewNone.style.display = 'flex';

    }

    previewFoot.innerHTML = `<span class="pf-sku">${sku}</span>  ${name.length > 28 ? name.slice(0, 28) + '…' : name}`;

    positionPreview(mouseX, mouseY);

    previewCard.classList.add('visible');

  }



  function positionPreview(mx, my) {

    const pw = 200, ph = 200;

    const vw = window.innerWidth, vh = window.innerHeight;

    let left = mx + 18;

    let top  = my - 60;

    if (left + pw > vw - 12) left = mx - pw - 18;

    if (top + ph > vh - 12) top = vh - ph - 12;

    if (top < 8) top = 8;

    previewCard.style.left = left + 'px';

    previewCard.style.top  = top  + 'px';

  }



  function hidePreview() {

    hideTimer = setTimeout(() => previewCard.classList.remove('visible'), 120);

  }



  // Wire hover events onto table rows after render

  function attachRowHover() {

    document.querySelectorAll('#tableBody tr[id^="row-"]').forEach(tr => {

      const sku  = tr.id.replace('row-', '');

      const item = ITEMS.find(i => i.sku === sku);

      if (!item) return;

      tr.addEventListener('mouseenter', e => showPreview(sku, item.name, e.clientX, e.clientY));

      tr.addEventListener('mousemove',  e => positionPreview(e.clientX, e.clientY));

      tr.addEventListener('mouseleave', hidePreview);

    });

  }

  // Expose so the regular script can call it after each render

  window.attachRowHover = attachRowHover;

  // Load images after the regular script has rendered the table

  window.addEventListener('load', () => {

    loadProductImages().then(() => {

      renderTable();       // re-render so thumbnails appear immediately

      attachRowHover();

    });

  });



  // Expose submitToFirebase globally

  window.submitToFirebase = async function() {

    const nameInput = document.getElementById('submitterName');

    const nameError = document.getElementById('nameError');

    const name = nameInput.value.trim();



    if (!name) {

      nameError.classList.add('show');

      nameInput.focus();

      nameInput.style.borderColor = 'var(--out)';

      return;

    }

    nameError.classList.remove('show');

    nameInput.style.borderColor = '';



    const btn = document.getElementById('confirmSubmitBtn');

    btn.disabled = true;

    btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="animation:spin 1s linear infinite"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> Submitting…';



    const items = Object.values(window.basket);



    try {

      await addDoc(collection(db, "Energise Orders"), {

        submittedBy: name,

        submittedAt: serverTimestamp(),

        itemCount: items.length,

        items: items.map(i => ({

          name: i.name,

          sku: i.sku,

          uom: i.uom,

          qty: i.qty,

          category: i.category

        }))

      });



      showToast('✓ Order submitted successfully!', false);

      closeModal();

      clearBasket();

      nameInput.value = '';

    } catch (err) {

      console.error(err);

      showToast('Error submitting order: ' + err.message, true);

    } finally {

      btn.disabled = false;

      btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> Submit Order';

    }

  };

</script>

function renderTable() {

  const tbody = document.getElementById('tableBody');

  tbody.innerHTML = '';



  filteredItems.forEach((item) => {

    const inBasket = window.basket[item.sku];

    const tr = document.createElement('tr');

    if (inBasket) tr.classList.add('added-row');

    tr.innerHTML = `

          ${(window.productImages && window.productImages[item.sku])

      <td class="action-cell" id="action-${item.sku}">${actionHTML}</td>

    `;

    tbody.appendChild(tr);

  });



  document.getElementById('resultsCount').textContent = `${filteredItems.length} item${filteredItems.length !== 1 ? 's' : ''}`;

}



function buildActionCell(item, inBasket) {

  if (inBasket) {

    return `<span class="added-badge">✓ Added (${inBasket.qty})</span>

            <button class="basket-clear" style="margin-left:8px;font-size:11px;" onclick="removeItem('${item.sku}')">Remove</button>`;

  }

  if (isEA(item.uom)) {

    return `

      <div style="display:flex;align-items:center;justify-content:center;gap:6px;">

        <div class="qty-group">

          <button class="qty-btn" onclick="changeQty('${item.sku}', -1)">−</button>

          <input class="qty-input" type="number" id="qty-${item.sku}" value="1" min="1" max="999">

          <button class="qty-btn" onclick="changeQty('${item.sku}', 1)">+</button>

        </div>

        <button class="add-qty-btn" onclick="addItem('${item.sku}')">ADD</button>

      </div>`;

  } else {

    return `<button class="add-simple" onclick="addItem('${item.sku}')">+ Add</button>`;

  }

}



function changeQty(sku, delta) {

  const input = document.getElementById('qty-' + sku);

  if (!input) return;

  let val = parseInt(input.value) || 1;

  val = Math.max(1, val + delta);

  input.value = val;

}



window.addItem = function(sku) {

  const item = ITEMS.find(i => i.sku === sku);

  if (!item) return;

  let qty = 1;

  if (isEA(item.uom)) {

    const input = document.getElementById('qty-' + sku);

    qty = input ? (parseInt(input.value) || 1) : 1;

  }

  window.basket[sku] = { ...item, qty };

  updateBasket();

  const actionCell = document.getElementById('action-' + sku);

  if (actionCell) actionCell.innerHTML = buildActionCell(item, window.basket[sku]);

  const row = document.getElementById('row-' + sku);

  if (row) row.classList.add('added-row');

};



window.removeItem = function(sku) {

  delete window.basket[sku];

  updateBasket();

  const item = ITEMS.find(i => i.sku === sku);

  const actionCell = document.getElementById('action-' + sku);

  if (actionCell) actionCell.innerHTML = buildActionCell(item, null);

  const row = document.getElementById('row-' + sku);

  if (row) row.classList.remove('added-row');

};



window.clearBasket = function() {

  window.basket = {};

  updateBasket();

  renderTable();

  if (typeof attachRowHover === 'function') attachRowHover();

};




function updateBasket() {

  const items = Object.values(window.basket);

  const count = items.length;

  document.getElementById('basketCount').textContent = count;

  document.getElementById('submitBtn').disabled = count === 0;

  document.getElementById('basketSummary').innerHTML = `<strong>${count}</strong> line item${count !== 1 ? 's' : ''}`;



  const container = document.getElementById('basketItems');

  if (count === 0) {

    container.innerHTML = '<div class="basket-empty">No items added yet.</div>';

    return;

  }



  container.innerHTML = items.map(item => `

    <div class="basket-item">

      

      <div class="bi-info">

        <div class="bi-name">${item.name}</div>

        <div class="bi-meta">${item.sku} · ${item.uom} · Qty: ${item.qty}</div>

      </div>

      <button class="bi-remove" onclick="removeItem('${item.sku}')" title="Remove">×</button>

    </div>

  `).join('');

}



window.filterItems = function() {

  const q = document.getElementById('searchInput').value.toLowerCase().trim();

  const uomF = document.getElementById('uomFilter').value;



  filteredItems = ITEMS.filter(item => {

    const matchQ = !q || item.name.toLowerCase().includes(q) || item.sku.includes(q);

    const matchUom = !uomF || item.uom.toLowerCase().startsWith(uomF === 'ea' ? 'ea' : uomF === 'pk' ? 'pk' : 'rl');

    return matchQ && matchUom;

  });



  renderTable();

  if (typeof attachRowHover === 'function') attachRowHover();

};



window.toggleBasket = function() {

  const panel = document.getElementById('basketPanel');

  panel.classList.toggle('mobile-open');

};



window.openModal = function() {

  const items = Object.values(window.basket);

  const tbody = document.getElementById('modalBody');

  tbody.innerHTML = items.map(item => `

    <tr>



      <td>${item.name}</td>

      <td><span class="sku">${item.sku}</span></td>

      <td><span class="uom-badge">${item.uom}</span></td>

      <td style="font-family:'DM Mono',monospace;font-weight:600;">${item.qty}</td>

    </tr>

  `).join('');

  // Reset name field state

  document.getElementById('submitterName').style.borderColor = '';

  document.getElementById('nameError').classList.remove('show');

  document.getElementById('modalOverlay').classList.add('open');

};



window.closeModal = function() {

  document.getElementById('modalOverlay').classList.remove('open');

};



window.printOrder = function() {

  window.print();

};



window.copyCSV = function() {

  const items = Object.values(window.basket);

  const header = 'Name,SKU,Unit of Measure,Quantity';

  const rows = items.map(i => `"${i.name}",${i.sku},${i.uom},${i.qty}`);

  const csv = [header, ...rows].join('\n');

  navigator.clipboard.writeText(csv).then(() => {

    showToast('✓ CSV copied to clipboard!', false);

  });

};



window.showToast = function(msg, isError) {

  const toast = document.getElementById('toast');

  toast.textContent = msg;

  toast.className = 'toast' + (isError ? ' error' : '');

  void toast.offsetWidth;

  toast.classList.add('show');

  setTimeout(() => toast.classList.remove('show'), 3000);

};



// Close modal on overlay click

document.getElementById('modalOverlay').addEventListener('click', function(e) {

  if (e.target === this) closeModal();

});



// Name field: clear error on type

document.getElementById('submitterName').addEventListener('input', function() {

  if (this.value.trim()) {

    document.getElementById('nameError').classList.remove('show');

    this.style.borderColor = '';

  }

});



// Init

// ── Thumbnail lightbox ────────────────────────────────────────────────────

window.openThumbLightbox = function(url, label) {

  const lb = document.getElementById('thumbLightbox');

  document.getElementById('thumbLightboxImg').src = url;

  document.getElementById('thumbLightboxLabel').textContent = label;

  lb.classList.add('open');

};

window.closeThumbLightbox = function() {

  document.getElementById('thumbLightbox').classList.remove('open');

};

document.addEventListener('keydown', function(e) {

  if (e.key === 'Escape') closeThumbLightbox();

});

renderTable();

</script>

</body>
