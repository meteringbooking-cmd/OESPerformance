<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineer Daily Breakdown - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            margin: 100px auto;
            padding: 40px;
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 2em;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .login-section {
            margin-top: 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 1.05em;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-message {
            color: #dc3545;
            font-size: 0.9em;
            margin-top: 10px;
            display: none;
            padding: 10px;
            background: #f8d7da;
            border-radius: 6px;
            border-left: 4px solid #dc3545;
        }

        .loading {
            text-align: center;
            color: #666;
            padding: 20px;
        }

        /* Main dashboard styles (hidden until logged in) */
        .dashboard-container {
            display: none;
        }

        .logout-section {
            text-align: right;
            margin-bottom: 20px;
        }

        .btn-logout {
            padding: 8px 20px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .btn-logout:hover {
            background: #c82333;
        }

        .welcome-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #28a745;
            font-weight: 600;
        }

        .filter-section {
            margin-bottom: 30px;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .filter-group {
            margin-bottom: 20px;
        }

        .filter-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 1.05em;
        }

        .date-range-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            margin-top: 15px;
        }

        .btn-secondary:hover:not(:disabled) {
            box-shadow: 0 10px 25px rgba(40, 167, 69, 0.4);
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 1.1em;
        }

        .daily-breakdown-container {
            margin-top: 30px;
        }

        .breakdown-title {
            text-align: center;
            color: #667eea;
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .container {
                margin: 50px auto;
                padding: 25px;
            }

            .date-range-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="loginContainer" class="container">
        <div class="header">
            <div class="logo">👷 Engineer Login</div>
            <div class="subtitle">Access your daily breakdown</div>
        </div>

        <div class="login-section">
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="engineerSelect">Select Your Name:</label>
                    <select id="engineerSelect" required disabled>
                        <option value="">Loading engineers...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="passwordInput">Password:</label>
                    <input type="password" id="passwordInput" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn" id="loginBtn" disabled>
                    Login
                </button>

                <div class="error-message" id="errorMessage">
                    Incorrect password. Please try again.
                </div>
            </form>
        </div>
    </div>

    <!-- Main Dashboard (hidden until logged in) -->
    <div id="dashboardContainer" class="dashboard-container main-container">
        <div class="container" style="max-width: 1400px;">
            <div class="logout-section">
                <button class="btn-logout" onclick="handleLogout()">
                    Logout
                </button>
            </div>

            <div class="welcome-message" id="welcomeMessage">
                Welcome back, <span id="loggedInEngineer"></span>!
            </div>

            <div class="header">
                <div class="logo">👷 Your Daily Breakdown</div>
                <div class="subtitle">View your detailed daily performance</div>
            </div>

            <div class="filter-section">
                <div class="date-range-group">
                    <div class="filter-group">
                        <label for="startDate">Start Date:</label>
                        <input type="date" id="startDate" required>
                    </div>
                    <div class="filter-group">
                        <label for="endDate">End Date:</label>
                        <input type="date" id="endDate" required>
                    </div>
                </div>

                <button class="btn" onclick="loadDailyBreakdown()" id="loadBtn">
                    Show Daily Breakdown
                </button>

                <button class="btn btn-secondary" onclick="alert('Additional payments feature - to be implemented')" id="additionalPaymentBtn" style="display: none;">
                    💰 Submit Additional Payments
                </button>
            </div>

            <div id="loadingDiv" class="loading" style="display: none;">Loading data...</div>
            <div id="noDataDiv" class="no-data" style="display: none;">No data found for the selected date range.</div>

            <div id="dailyBreakdownSection" class="daily-breakdown-container" style="display: none;">
                <h2 class="breakdown-title">Daily Performance Breakdown</h2>
                <div id="dailyBreakdownContent"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
            authDomain: "oesperformance-a54c0.firebaseapp.com",
            projectId: "oesperformance-a54c0",
            storageBucket: "oesperformance-a54c0.firebasestorage.app",
            messagingSenderId: "484894102454",
            appId: "1:484894102454:web:17535ee497eac2d90d6717",
            measurementId: "G-R56BGZYV8N"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db;

        let allEngineers = [];
        let currentEngineer = '';
        let engineersData = {}; // Store engineer names with their passwords

        // Set default dates (last 7 days)
        const today = new Date();
        const lastWeek = new Date(today);
        lastWeek.setDate(lastWeek.getDate() - 7);
        
        document.getElementById('endDate').valueAsDate = today;
        document.getElementById('startDate').valueAsDate = lastWeek;

        // Load engineers with passwords from engineers collection
        async function loadEngineers() {
            const selectElement = document.getElementById('engineerSelect');
            const loginBtn = document.getElementById('loginBtn');
            
            try {
                const querySnapshot = await getDocs(collection(db, "engineers"));
                
                engineersData = {};
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.engineerName) {
                        engineersData[data.engineerName] = {
                            password: data.password || '',
                            id: doc.id
                        };
                    }
                });

                allEngineers = Object.keys(engineersData).sort();
                
                if (allEngineers.length === 0) {
                    selectElement.innerHTML = '<option value="">No engineers found</option>';
                    selectElement.disabled = true;
                    return;
                }
                
                selectElement.innerHTML = '<option value="">-- Select Your Name --</option>';
                
                allEngineers.forEach(engineer => {
                    const option = document.createElement('option');
                    option.value = engineer;
                    option.textContent = engineer;
                    selectElement.appendChild(option);
                });

                selectElement.disabled = false;
                loginBtn.disabled = false;

            } catch (error) {
                console.error("Error loading engineers:", error);
                selectElement.innerHTML = '<option value="">Error loading engineers</option>';
                selectElement.disabled = true;
                alert('Error loading engineers. Please refresh the page.');
            }
        }

        window.handleLogin = function(event) {
            event.preventDefault();
            
            const selectedEngineer = document.getElementById('engineerSelect').value;
            const enteredPassword = document.getElementById('passwordInput').value;
            const errorMessage = document.getElementById('errorMessage');

            if (!selectedEngineer) {
                alert('Please select your name');
                return;
            }

            const engineerInfo = engineersData[selectedEngineer];
            
            // Check if password exists and matches
            if (!engineerInfo.password) {
                // No password set - show error
                errorMessage.textContent = 'No password set for this account. Please contact your administrator.';
                errorMessage.style.display = 'block';
                return;
            }

            if (enteredPassword === engineerInfo.password) {
                // Successful login
                currentEngineer = selectedEngineer;
                
                // Store session
                sessionStorage.setItem('loggedInEngineer', selectedEngineer);
                
                // Show dashboard
                showDashboard();
            } else {
                // Wrong password
                errorMessage.textContent = 'Incorrect password. Please try again.';
                errorMessage.style.display = 'block';
                document.getElementById('passwordInput').value = '';
                document.getElementById('passwordInput').focus();
            }
        }

        function showDashboard() {
            document.getElementById('loginContainer').style.display = 'none';
            document.getElementById('dashboardContainer').style.display = 'block';
            document.getElementById('loggedInEngineer').textContent = currentEngineer;
        }

        window.handleLogout = function() {
            if (confirm('Are you sure you want to logout?')) {
                sessionStorage.removeItem('loggedInEngineer');
                currentEngineer = '';
                
                // Reset forms
                document.getElementById('loginForm').reset();
                document.getElementById('errorMessage').style.display = 'none';
                
                // Hide dashboard
                document.getElementById('dashboardContainer').style.display = 'none';
                document.getElementById('loginContainer').style.display = 'block';
                
                // Clear any loaded data
                document.getElementById('dailyBreakdownSection').style.display = 'none';
                document.getElementById('additionalPaymentBtn').style.display = 'none';
            }
        }

        window.loadDailyBreakdown = async function() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;

            if (!startDate || !endDate) {
                alert('Please select both start and end dates');
                return;
            }

            if (startDate > endDate) {
                alert('Start date must be before end date');
                return;
            }

            document.getElementById('loadingDiv').style.display = 'block';
            document.getElementById('noDataDiv').style.display = 'none';
            document.getElementById('dailyBreakdownSection').style.display = 'none';

            try {
                // Get all dates in range (weekdays only)
                const start = new Date(startDate);
                const end = new Date(endDate);
                const allDates = [];
                
                for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
                    const dayOfWeek = d.getDay();
                    if (dayOfWeek !== 0 && dayOfWeek !== 6) {
                        allDates.push(d.toISOString().split('T')[0]);
                    }
                }

                // Load performance data
                const perfQuery = query(
                    collection(db, "performance"),
                    where("engineerName", "==", currentEngineer)
                );

                const perfSnapshot = await getDocs(perfQuery);
                const performanceData = {};
                perfSnapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.date >= startDate && data.date <= endDate) {
                        performanceData[data.date] = data;
                    }
                });

                // Display basic breakdown
                displayDailyBreakdown(allDates, performanceData);

                document.getElementById('loadingDiv').style.display = 'none';
                document.getElementById('additionalPaymentBtn').style.display = 'block';

            } catch (error) {
                console.error("Error loading data:", error);
                document.getElementById('loadingDiv').style.display = 'none';
                document.getElementById('noDataDiv').textContent = 'Error loading data: ' + error.message;
                document.getElementById('noDataDiv').style.display = 'block';
            }
        }

        function displayDailyBreakdown(dates, performanceData) {
            const container = document.getElementById('dailyBreakdownContent');
            container.innerHTML = '';

            if (dates.length === 0) {
                document.getElementById('noDataDiv').textContent = 'No weekdays in selected date range.';
                document.getElementById('noDataDiv').style.display = 'block';
                return;
            }

            dates.forEach(date => {
                const perf = performanceData[date] || {};

                const dateObj = new Date(date + 'T00:00:00');
                const displayDate = dateObj.toLocaleDateString('en-GB', { 
                    day: '2-digit', 
                    month: 'long',
                    year: 'numeric'
                });
                const weekday = dateObj.toLocaleDateString('en-GB', { weekday: 'long' });

                const card = document.createElement('div');
                card.style.cssText = `
                    background: white;
                    border-radius: 10px;
                    padding: 25px;
                    margin-bottom: 20px;
                    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
                    border-left: 5px solid #667eea;
                `;

                card.innerHTML = `
                    <div style="margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #f0f0f0;">
                        <div style="font-size: 1.3em; font-weight: bold; color: #333;">${displayDate}</div>
                        <div style="color: #667eea; font-size: 0.9em; margin-top: 5px;">${weekday}</div>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px;">
                        <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center;">
                            <div style="font-size: 0.85em; color: #666; margin-bottom: 8px;">TOTAL JOBS</div>
                            <div style="font-size: 1.8em; font-weight: bold; color: #667eea;">${perf.jobs || 0}</div>
                        </div>
                        <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center;">
                            <div style="font-size: 0.85em; color: #666; margin-bottom: 8px;">COMPLETED</div>
                            <div style="font-size: 1.8em; font-weight: bold; color: #28a745;">${perf.completed || 0}</div>
                        </div>
                        <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center;">
                            <div style="font-size: 0.85em; color: #666; margin-bottom: 8px;">ABORTED</div>
                            <div style="font-size: 1.8em; font-weight: bold; color: #dc3545;">${perf.aborted || 0}</div>
                        </div>
                        <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center;">
                            <div style="font-size: 0.85em; color: #666; margin-bottom: 8px;">METERS</div>
                            <div style="font-size: 1.8em; font-weight: bold; color: #fd7e14;">${Math.round(perf.meters || 0)}</div>
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });

            document.getElementById('dailyBreakdownSection').style.display = 'block';
        }

        // Check if already logged in
        window.addEventListener('load', () => {
            const loggedIn = sessionStorage.getItem('loggedInEngineer');
            if (loggedIn && engineersData[loggedIn]) {
                currentEngineer = loggedIn;
                showDashboard();
            }
            
            loadEngineers();
        });
    </script>
</body>
</html>
