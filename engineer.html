<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NGU Engineer Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=Barlow:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:        #080c14;
            --bg2:       #0d1420;
            --bg3:       #111928;
            --bg4:       #1a2337;
            --border:    rgba(255,255,255,0.07);
            --border2:   rgba(255,255,255,0.12);
            --accent:    #00d4ff;
            --accent2:   #00ff9d;
            --accent3:   #ff6b35;
            --accent4:   #a855f7;
            --text:      #e8edf8;
            --text2:     #8b97b0;
            --text3:     #4a5568;
            --danger:    #ef4444;
            --warn:      #f59e0b;
            --success:   #10b981;
        }

        [data-theme="light"] {
            --bg:        #f4f6f8;
            --bg2:       #ffffff;
            --bg3:       #e2e8f0;
            --bg4:       #cbd5e1;
            --border:    rgba(0,0,0,0.1);
            --border2:   rgba(0,0,0,0.15);
            --accent:    #0284c7; 
            --accent2:   #059669; 
            --accent3:   #ea580c;
            --accent4:   #7c3aed;
            --text:      #0f172a;
            --text2:     #475569;
            --text3:     #64748b;
        }

        [data-theme="ocean"] {
            --bg:        #001220;
            --bg2:       #001f3f;
            --bg3:       #003366;
            --bg4:       #004080;
            --border:    rgba(255,255,255,0.08);
            --border2:   rgba(255,255,255,0.15);
            --accent:    #0ea5e9;
            --accent2:   #2dd4bf;
            --accent3:   #fb923c;
            --accent4:   #818cf8;
            --text:      #f0f9ff;
            --text2:     #bae6fd;
            --text3:     #7dd3fc;
        }

        [data-theme="forest"] {
            --bg:        #021207;
            --bg2:       #052411;
            --bg3:       #0a381c;
            --bg4:       #104f29;
            --border:    rgba(255,255,255,0.06);
            --border2:   rgba(255,255,255,0.12);
            --accent:    #34d399;
            --accent2:   #a3e635;
            --accent3:   #fbbf24;
            --accent4:   #2dd4bf;
            --text:      #ecfdf5;
            --text2:     #a7f3d0;
            --text3:     #6ee7b7;
        }

        [data-theme="sunset"] {
            --bg:        #1a0815;
            --bg2:       #2d0d21;
            --bg3:       #4a1532;
            --bg4:       #6b1d44;
            --border:    rgba(255,255,255,0.08);
            --border2:   rgba(255,255,255,0.15);
            --accent:    #f43f5e;
            --accent2:   #fb923c;
            --accent3:   #facc15;
            --accent4:   #c084fc;
            --text:      #fff1f2;
            --text2:     #fecdd3;
            --text3:     #fda4af;
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: 'Barlow', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(color-mix(in srgb, var(--accent) 5%, transparent) 1px, transparent 1px),
                linear-gradient(90deg, color-mix(in srgb, var(--accent) 5%, transparent) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .top-bar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px; height: 56px;
            background: color-mix(in srgb, var(--bg) 95%, transparent);
            border-bottom: 1px solid var(--border2);
            backdrop-filter: blur(12px);
        }

        .top-bar-left { display: flex; align-items: center; gap: 20px; }
        .portal-wordmark { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 1.1em; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text); }
        .portal-wordmark span { color: var(--accent); }
        .top-bar-divider { width: 1px; height: 24px; background: var(--border2); }
        .breadcrumb { font-family: 'JetBrains Mono', monospace; font-size: 0.65em; color: var(--text3); letter-spacing: 0.05em; }
        .breadcrumb .bc-active { color: var(--accent); }
        .top-bar-right { display: flex; align-items: center; gap: 12px; }

        .theme-select {
            background: var(--bg3);
            border: 1px solid var(--border2);
            color: var(--text);
            padding: 6px 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7em;
            border-radius: 4px;
            outline: none;
            cursor: pointer;
            text-transform: uppercase;
        }

        .whatsapp-btn {
            display: inline-flex; align-items: center; gap: 6px;
            background: color-mix(in srgb, #25D366 10%, transparent);
            border: 1px solid color-mix(in srgb, #25D366 30%, transparent);
            color: #25D366;
            padding: 6px 14px;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 600;
            font-size: 0.75em;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .ngu-logo { height: 30px; }

        .screen { display: none; min-height: 100vh; padding-top: 56px; position: relative; z-index: 1; }
        .screen.active { display: block; }

        #loginScreen { min-height: 100vh; }
        #loginScreen.active { display: flex; align-items: center; justify-content: center; }
        .login-wrap { width: 100%; max-width: 420px; padding: 24px; }
        .login-badge { display: inline-flex; align-items: center; gap: 8px; background: color-mix(in srgb, var(--accent) 8%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 20%, transparent); padding: 6px 14px; margin-bottom: 32px; font-family: 'JetBrains Mono', monospace; font-size: 0.65em; color: var(--accent); letter-spacing: 0.1em; }
        .login-badge-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

        .login-headline { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 2.8em; line-height: 1; text-transform: uppercase; letter-spacing: -0.01em; margin-bottom: 8px; }
        .login-sub { color: var(--text2); font-size: 0.85em; margin-bottom: 36px; }
        .login-panel { background: var(--bg2); border: 1px solid var(--border2); padding: 28px; }

        .field-group { margin-bottom: 20px; }
        .field-label { display: block; font-family: 'JetBrains Mono', monospace; font-size: 0.65em; color: var(--text3); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 8px; }
        .field-input { width: 100%; background: var(--bg3); border: 1px solid var(--border2); color: var(--text); padding: 12px 14px; font-family: 'Barlow', sans-serif; font-size: 0.95em; outline: none; transition: border-color 0.2s; }
        
        .pw-wrap { position: relative; }
        .pw-toggle { position: absolute; right: 0; top: 0; bottom: 0; width: 44px; display: flex; align-items: center; justify-content: center; background: none; border: none; cursor: pointer; color: var(--text3); }

        .btn-primary { width: 100%; padding: 14px; background: var(--accent); color: var(--bg); border: none; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 1em; letter-spacing: 0.15em; text-transform: uppercase; cursor: pointer; transition: all 0.2s; min-height: 48px; }
        
        .hub-wrap { max-width: 960px; margin: 0 auto; padding: 48px 24px; }
        .hub-header { margin-bottom: 48px; }
        .hub-tag { font-family: 'JetBrains Mono', monospace; font-size: 0.65em; color: var(--accent); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .hub-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: clamp(2.2em, 5vw, 3.4em); text-transform: uppercase; line-height: 1; margin-bottom: 12px; }
        
        .hub-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); margin-bottom: 32px; }
        .hub-card { background: var(--bg2); padding: 28px 24px; cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden; border: none; text-align: left; width: 100%; }
        .hub-card:hover { background: var(--bg3); }
        .hub-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--card-accent, var(--accent)); transform: scaleX(0); transition: transform 0.3s; }
        .hub-card:hover::before { transform: scaleX(1); }

        .hub-card-icon { display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 12px; background: color-mix(in srgb, var(--card-accent, var(--accent)) 8%, transparent); border: 1px solid color-mix(in srgb, var(--card-accent, var(--accent)) 15%, transparent); color: var(--card-accent, var(--accent)); margin-bottom: 20px; transition: all 0.3s; }
        .hub-card-icon svg { width: 26px; height: 26px; stroke-width: 2.2; }
        .hub-card:hover .hub-card-icon { background: var(--card-accent, var(--accent)); color: var(--bg); transform: scale(1.1); }

        .hub-card-label { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 1.15em; text-transform: uppercase; color: var(--text); margin-bottom: 6px; }
        .hub-card-desc { font-size: 0.8em; color: var(--text2); line-height: 1.5; }
        .hub-card-arrow { position: absolute; bottom: 20px; right: 20px; color: var(--card-accent, var(--accent)); opacity: 0; transition: 0.2s; }
        .hub-card:hover .hub-card-arrow { opacity: 1; transform: translate(2px,-2px); }

        .modal-overlay { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.open { display: flex; }
        .modal-box { background: var(--bg2); border: 1px solid var(--border2); width: 100%; max-width: 560px; max-height: 88vh; display: flex; flex-direction: column; overflow: hidden; }
        .capacity-modal-box { background: var(--bg2); border: 1px solid var(--border2); width: 95%; max-width: 1100px; height: 88vh; display: flex; flex-direction: column; }
        .capacity-iframe { flex: 1; width: 100%; border: none; background: white; }

        .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border2); background: var(--bg3); }
        .modal-close { background: none; border: none; color: var(--text2); font-size: 1.5em; cursor: pointer; }
        .footer-strip { border-top: 1px solid var(--border); padding: 20px 24px; font-family: 'JetBrains Mono', monospace; font-size: 0.6em; color: var(--text3); text-align: center; }

        .nav-badge { position: absolute; top: 12px; right: 12px; background: var(--danger); color: white; font-family: 'JetBrains Mono', monospace; font-size: 0.6em; padding: 2px 6px; border-radius: 4px; font-weight: 700; }
    </style>
</head>
<body>

<header class="top-bar">
    <div class="top-bar-left">
        <div class="portal-wordmark">NGU <span>ENGINEER</span> PORTAL</div>
        <div class="top-bar-divider"></div>
        <div class="breadcrumb" id="breadcrumb"><span class="bc-active">// AUTH</span></div>
    </div>
    <div class="top-bar-right">
        <select id="themeSwitcher" class="theme-select" onchange="changeTheme(this.value)">
            <option value="dark">Dark Theme</option>
            <option value="light">Light Theme</option>
            <option value="ocean">Ocean Theme</option>
            <option value="forest">Forest Theme</option>
            <option value="sunset">Sunset Theme</option>
        </select>
        <a href="https://wa.me/447904287999" class="whatsapp-btn" target="_blank">💬 <span>WhatsApp Us</span></a>
        <img src="https://www.dropbox.com/scl/fi/kkujm1u6y7vvnp7luq8d7/ngu-main-white.png?rlkey=kgq2uh48qh4xssh4vlbz868lr&st=6cy1lbvp&dl=1" alt="NGU" class="ngu-logo">
    </div>
</header>

<div id="loginScreen" class="screen active">
    <div class="login-wrap">
        <div class="login-badge"><span class="login-badge-dot"></span> SECURE ACCESS PORTAL</div>
        <div class="login-headline">SIGN<br>INTO<br>YOUR<br>PORTAL</div>
        <div class="login-panel">
            <div id="loginError" style="color:var(--danger); margin-bottom:10px; display:none;"></div>
            <div class="field-group">
                <label class="field-label">Username</label>
                <input class="field-input" type="text" id="loginUsername" placeholder="Your username">
            </div>
            <div class="field-group">
                <label class="field-label">Password</label>
                <div class="pw-wrap">
                    <input class="field-input" type="password" id="loginPassword" placeholder="Your password">
                    <button class="pw-toggle" onclick="togglePw()">👁️</button>
                </div>
            </div>
            <button class="btn-primary" onclick="handleLogin()">Access Portal →</button>
        </div>
    </div>
</div>

<div id="welcomeScreen" class="screen">
    <div style="display:flex;align-items:center;justify-content:center;height:80vh;">
        <div style="text-align:center;">
            <div style="font-size:3em;">👷</div>
            <div class="welcome-name" id="welcomeName" style="font-size:2.5em; font-weight:800; color:var(--accent);"></div>
            <div style="color:var(--text2);">Loading your dashboard...</div>
        </div>
    </div>
</div>

<div id="hubScreen" class="screen">
    <div class="hub-wrap">
        <div class="hub-header">
            <div class="hub-tag">ENGINEER DASHBOARD</div>
            <div class="hub-title">WHAT WOULD YOU<br><span style="color:var(--text2);">LIKE TO VIEW?</span></div>
        </div>

        <div class="hub-grid">
            <!-- View Bonus -->
            <button class="hub-card" style="--card-accent:var(--accent);" onclick="setScreen('bonusScreen')">
                <span class="hub-card-icon"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M12 8c-1.657 0-3 1.343-3 3s1.343 3 3 3 3-1.343 3-3-1.343-3-3-3zM2 12c0 5.523 4.477 10 10 10s10-4.477 10-10S17.523 2 12 2 2 6.477 2 12z"/></svg></span>
                <div class="hub-card-label">View Bonus</div>
                <div class="hub-card-desc">Daily breakdown and earnings summary.</div>
                <span class="hub-card-arrow">↗</span>
            </button>

            <!-- Accident Form (New) -->
            <button class="hub-card" style="--card-accent:var(--danger);" onclick="window.open('https://www.cognitoforms.com/BMSL1/AccidentIncidentForm', 'AccidentForm', 'width=800,height=900,scrollbars=yes')">
                <span class="hub-card-icon"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg></span>
                <div class="hub-card-label">Accident Form</div>
                <div class="hub-card-desc">Report an incident or accident immediately.</div>
                <span class="hub-card-arrow">↗</span>
            </button>

            <!-- Capacity -->
            <button class="hub-card" style="--card-accent:var(--accent3);" onclick="openModal('capacityModal', 'https://oes-performance.vercel.app/capacity2.html')">
                <span class="hub-card-icon"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg></span>
                <div class="hub-card-label">View Capacity</div>
                <div class="hub-card-desc">Check scheduling and operational capacity.</div>
                <span class="hub-card-arrow">↗</span>
            </button>

            <!-- Rota -->
            <button class="hub-card" style="--card-accent:var(--success);" onclick="openModal('rotaModal', './oncall.html')">
                <span class="hub-card-icon"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></span>
                <div class="hub-card-label">On Call Rota</div>
                <div class="hub-card-desc">View the out-of-hours engineer rota.</div>
                <span class="hub-card-arrow">↗</span>
            </button>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--border); padding-top:20px;">
            <div style="font-size:0.7em; color:var(--text3);">LOGGED IN AS: <strong id="hubUserName" style="color:var(--text2);"></strong></div>
            <button style="background:none; border:1px solid var(--border2); color:var(--text2); padding:8px 15px; cursor:pointer;" onclick="logout()">Logout</button>
        </div>
    </div>
</div>

<div id="bonusScreen" class="screen">
    <div class="hub-wrap">
        <button class="btn-primary" style="width:auto; padding:10px 20px; margin-bottom:20px;" onclick="setScreen('hubScreen')">← Back</button>
        <div class="hub-title">BONUS BREAKDOWN</div>
        <div style="padding:40px; background:var(--bg2); border:1px solid var(--border2); text-align:center; color:var(--text3);">Select a date range to view earnings (Logic connected to Firebase).</div>
    </div>
</div>

<!-- Modals -->
<div id="capacityModal" class="modal-overlay">
    <div class="capacity-modal-box">
        <div class="modal-head"><div>📅 CAPACITY</div><button class="modal-close" onclick="closeModal('capacityModal')">×</button></div>
        <iframe id="capacityIframe" class="capacity-iframe"></iframe>
    </div>
</div>

<div id="rotaModal" class="modal-overlay">
    <div class="capacity-modal-box">
        <div class="modal-head"><div>📅 ON CALL ROTA</div><button class="modal-close" onclick="closeModal('rotaModal')">×</button></div>
        <iframe id="rotaIframe" class="capacity-iframe"></iframe>
    </div>
</div>

<script>
    // Theme logic
    function changeTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('ngu_theme', theme);
    }
    const savedTheme = localStorage.getItem('ngu_theme') || 'dark';
    changeTheme(savedTheme);

    function togglePw() {
        const p = document.getElementById('loginPassword');
        p.type = p.type === 'password' ? 'text' : 'password';
    }

    function handleLogin() {
        const u = document.getElementById('loginUsername').value;
        const p = document.getElementById('loginPassword').value;
        if(u && p) {
            document.getElementById('welcomeName').innerText = u.toUpperCase();
            document.getElementById('hubUserName').innerText = u.toUpperCase();
            setScreen('welcomeScreen');
            setTimeout(() => setScreen('hubScreen'), 1500);
        } else {
            const err = document.getElementById('loginError');
            err.innerText = "Please enter credentials";
            err.style.display = "block";
        }
    }

    function setScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById('breadcrumb').innerText = "// " + id.replace('Screen', '').toUpperCase();
    }

    function openModal(id, url) {
        const m = document.getElementById(id);
        const f = m.querySelector('iframe');
        if(!f.src) f.src = url;
        m.classList.add('open');
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove('open');
    }

    function logout() {
        location.reload();
    }

    // Escape to close modals
    document.addEventListener('keydown', e => {
        if(e.key === 'Escape') {
            document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('open'));
        }
    });
</script>

</body>
</html>
