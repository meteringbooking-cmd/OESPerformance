<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineer Daily Breakdown</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 2em;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .filter-section {
            margin-bottom: 30px;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .filter-group {
            margin-bottom: 20px;
        }

        .filter-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 1.05em;
        }

        .filter-group select,
        .filter-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        .filter-group select:focus,
        .filter-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .date-range-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            width: 100%;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            margin-top: 15px;
        }

        /* Password Modal Styles */
        .password-modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .password-modal-content {
            background-color: white;
            margin: 15% auto;
            padding: 0;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            animation: slideIn 0.3s ease;
        }

        .password-modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 25px;
            border-radius: 15px 15px 0 0;
        }

        .password-modal-header h3 {
            margin: 0;
            font-size: 1.3em;
        }

        .password-modal-body {
            padding: 25px;
        }

        .password-input-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .password-input-wrapper input {
            width: 100%;
            padding: 12px 40px 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
        }

        .password-input-wrapper input:focus {
            outline: none;
            border-color: #667eea;
        }

        .password-toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2em;
            padding: 5px;
            color: #666;
        }

        .password-toggle-btn:hover {
            color: #667eea;
        }

        .password-error {
            background: #f8d7da;
            color: #721c24;
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 0.9em;
            display: none;
        }

        .password-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-password-submit,
        .btn-password-cancel {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-password-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-password-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-password-cancel {
            background: #e0e0e0;
            color: #333;
        }

        .btn-password-cancel:hover {
            background: #d0d0d0;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 1.1em;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 1.1em;
        }

        .daily-breakdown-container {
            margin-top: 30px;
        }

        .breakdown-title {
            text-align: center;
            color: #667eea;
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .daily-card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border-left: 5px solid #667eea;
        }

        .daily-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .daily-date {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
        }

        .daily-weekday {
            color: #667eea;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .daily-stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .daily-stat-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .daily-stat-label {
            font-size: 0.85em;
            color: #666;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .daily-stat-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #333;
        }

        .daily-stat-item.jobs .daily-stat-value {
            color: #667eea;
        }

        .daily-stat-item.completed .daily-stat-value {
            color: #28a745;
        }

        .daily-stat-item.aborted .daily-stat-value {
            color: #dc3545;
        }

        .daily-stat-item.meters .daily-stat-value {
            color: #fd7e14;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .date-range-group {
                grid-template-columns: 1fr;
            }

            .daily-stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .daily-stat-item {
                padding: 12px;
            }

            .daily-stat-value {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">👷 Engineer Daily Breakdown</div>
            <div class="subtitle">View detailed daily performance</div>
        </div>

        <div class="filter-section">
            <div class="filter-group">
                <label for="engineerSelect">Select Engineer:</label>
                <select id="engineerSelect" disabled>
                    <option value="">Loading engineers...</option>
                </select>
            </div>

            <div class="date-range-group">
                <div class="filter-group">
                    <label for="startDate">Start Date:</label>
                    <input type="date" id="startDate" required>
                </div>
                <div class="filter-group">
                    <label for="endDate">End Date:</label>
                    <input type="date" id="endDate" required>
                </div>
            </div>

            <button class="btn" onclick="loadDailyBreakdown()" id="loadBtn" disabled>
                Show Daily Breakdown
            </button>
        </div>

        <div id="loadingDiv" class="loading" style="display: none;">Loading data...</div>
        <div id="noDataDiv" class="no-data" style="display: none;">No data found for the selected date range.</div>

        <div id="dailyBreakdownSection" class="daily-breakdown-container" style="display: none;">
            <h2 class="breakdown-title">Daily Performance Breakdown</h2>
            <div id="dailyBreakdownContent"></div>
        </div>
    </div>

    <!-- Password Modal -->
    <div id="passwordModal" class="password-modal">
        <div class="password-modal-content">
            <div class="password-modal-header">
                <h3>🔐 Enter Password</h3>
            </div>
            <div class="password-modal-body">
                <div class="password-error" id="passwordError"></div>
                <p style="margin-bottom: 15px; color: #666;">
                    Please enter your password to access <strong id="selectedEngineerName"></strong>'s data
                </p>
                <div class="password-input-wrapper">
                    <input type="password" id="passwordModalInput" placeholder="Enter password">
                    <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility()">👁️</button>
                </div>
                <div class="password-buttons">
                    <button class="btn-password-cancel" onclick="cancelPasswordEntry()">Cancel</button>
                    <button class="btn-password-submit" onclick="verifyPassword()">Submit</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, Timestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
            authDomain: "oesperformance-a54c0.firebaseapp.com",
            projectId: "oesperformance-a54c0",
            storageBucket: "oesperformance-a54c0.firebasestorage.app",
            messagingSenderId: "484894102454",
            appId: "1:484894102454:web:17535ee497eac2d90d6717",
            measurementId: "G-R56BGZYV8N"
        };

        console.log("Initializing Firebase...");
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db;
        console.log("Firebase initialized successfully");

        let engineersWithPasswords = [];
        let selectedEngineerForAuth = '';
        let currentEngineer = '';

        // Set default dates (last 7 days)
        const today = new Date();
        const lastWeek = new Date(today);
        lastWeek.setDate(lastWeek.getDate() - 7);
        
        document.getElementById('endDate').valueAsDate = today;
        document.getElementById('startDate').valueAsDate = lastWeek;

        // Load engineers on page load
        async function loadEngineers() {
            const selectElement = document.getElementById('engineerSelect');
            const loadBtn = document.getElementById('loadBtn');
            
            console.log("Starting to load engineers...");
            
            try {
                selectElement.innerHTML = '<option value="">Loading engineers...</option>';
                
                console.log("Fetching engineers collection...");
                const querySnapshot = await getDocs(collection(db, "engineers"));
                
                console.log("Documents fetched:", querySnapshot.size);
                
                engineersWithPasswords = [];
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.engineerName) {
                        engineersWithPasswords.push({
                            name: data.engineerName,
                            password: data.password || null
                        });
                    }
                });

                engineersWithPasswords.sort((a, b) => a.name.localeCompare(b.name));
                console.log("Engineers found:", engineersWithPasswords);
                
                if (engineersWithPasswords.length === 0) {
                    selectElement.innerHTML = '<option value="">No engineers found</option>';
                    selectElement.disabled = true;
                    return;
                }
                
                selectElement.innerHTML = '<option value="">-- Select an Engineer --</option>';
                
                engineersWithPasswords.forEach(engineer => {
                    const option = document.createElement('option');
                    option.value = engineer.name;
                    option.textContent = engineer.name;
                    selectElement.appendChild(option);
                });

                selectElement.disabled = false;
                console.log("Dropdown enabled with", engineersWithPasswords.length, "engineers");

                selectElement.addEventListener('change', function() {
                    if (this.value) {
                        selectedEngineerForAuth = this.value;
                        showPasswordModal(this.value);
                    } else {
                        loadBtn.disabled = true;
                        currentEngineer = '';
                    }
                });

            } catch (error) {
                console.error("Error loading engineers:", error);
                selectElement.innerHTML = '<option value="">Error: ' + error.message + '</option>';
                selectElement.disabled = true;
                alert('Error loading engineers. Check console for details.\n\n' + error.message);
            }
        }

        window.showPasswordModal = function(engineerName) {
            document.getElementById('selectedEngineerName').textContent = engineerName;
            document.getElementById('passwordModalInput').value = '';
            document.getElementById('passwordError').style.display = 'none';
            document.getElementById('passwordModal').style.display = 'block';
            document.getElementById('passwordModalInput').focus();
        }

        window.togglePasswordVisibility = function() {
            const input = document.getElementById('passwordModalInput');
            const btn = document.querySelector('.password-toggle-btn');
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        }

        window.cancelPasswordEntry = function() {
            document.getElementById('passwordModal').style.display = 'none';
            document.getElementById('engineerSelect').value = '';
            selectedEngineerForAuth = '';
            currentEngineer = '';
            document.getElementById('loadBtn').disabled = true;
        }

        window.verifyPassword = function() {
            const enteredPassword = document.getElementById('passwordModalInput').value;
            const engineer = engineersWithPasswords.find(e => e.name === selectedEngineerForAuth);
            
            if (!engineer) {
                showPasswordError('Engineer not found');
                return;
            }
            
            if (!engineer.password) {
                showPasswordError('No password set for this account. Contact administrator.');
                return;
            }
            
            if (enteredPassword !== engineer.password) {
                showPasswordError('Incorrect password. Please try again.');
                return;
            }
            
            // Password correct - allow access
            document.getElementById('passwordModal').style.display = 'none';
            currentEngineer = selectedEngineerForAuth;
            document.getElementById('loadBtn').disabled = false;
            console.log("Authentication successful for:", currentEngineer);
        }

        function showPasswordError(message) {
            const errorDiv = document.getElementById('passwordError');
            errorDiv.textContent = '❌ ' + message;
            errorDiv.style.display = 'block';
        }

        // Allow Enter key to submit password
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && document.getElementById('passwordModal').style.display === 'block') {
                verifyPassword();
            }
        });

        window.loadDailyBreakdown = async function() {
            if (!currentEngineer) {
                alert('Please select an engineer first');
                return;
            }

            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;

            if (!startDate || !endDate) {
                alert('Please select both start and end dates');
                return;
            }

            document.getElementById('loadingDiv').style.display = 'block';
            document.getElementById('noDataDiv').style.display = 'none';
            document.getElementById('dailyBreakdownSection').style.display = 'none';

            try {
                console.log("Loading data for:", currentEngineer, "from", startDate, "to", endDate);

                // Query performance data
                const performanceQuery = query(
                    collection(db, "performanceData"),
                    where("engineerName", "==", currentEngineer),
                    where("date", ">=", startDate),
                    where("date", "<=", endDate)
                );

                const performanceSnapshot = await getDocs(performanceQuery);
                const performanceData = {};
                
                performanceSnapshot.forEach((doc) => {
                    const data = doc.data();
                    performanceData[data.date] = {
                        jobs: data.jobs || 0,
                        completed: data.completed || 0,
                        aborted: data.aborted || 0,
                        meters: data.meters || 0
                    };
                });

                console.log("Performance data loaded:", Object.keys(performanceData).length, "dates");

                // Generate all weekdays in range
                const allDates = [];
                let currentDate = new Date(startDate);
                const endDateObj = new Date(endDate);

                while (currentDate <= endDateObj) {
                    const dayOfWeek = currentDate.getDay();
                    if (dayOfWeek !== 0 && dayOfWeek !== 6) { // Exclude weekends
                        const dateStr = currentDate.toISOString().split('T')[0];
                        allDates.push(dateStr);
                    }
                    currentDate.setDate(currentDate.getDate() + 1);
                }

                console.log("Generated weekdays:", allDates.length);

                // Display daily breakdown
                displayDailyBreakdown(allDates, performanceData);

                document.getElementById('loadingDiv').style.display = 'none';

            } catch (error) {
                console.error("Error loading data:", error);
                document.getElementById('loadingDiv').style.display = 'none';
                document.getElementById('noDataDiv').textContent = 'Error loading data: ' + error.message;
                document.getElementById('noDataDiv').style.display = 'block';
            }
        }

        function displayDailyBreakdown(dates, performanceData) {
            const container = document.getElementById('dailyBreakdownContent');
            container.innerHTML = '';

            if (dates.length === 0) {
                document.getElementById('noDataDiv').textContent = 'No weekdays in selected date range.';
                document.getElementById('noDataDiv').style.display = 'block';
                return;
            }

            dates.forEach(date => {
                const perf = performanceData[date] || {};

                const dateObj = new Date(date + 'T00:00:00');
                const displayDate = dateObj.toLocaleDateString('en-GB', { 
                    day: '2-digit', 
                    month: 'long',
                    year: 'numeric'
                });
                const weekday = dateObj.toLocaleDateString('en-GB', { weekday: 'long' });

                const card = document.createElement('div');
                card.className = 'daily-card';

                card.innerHTML = `
                    <div class="daily-card-header">
                        <div>
                            <div class="daily-date">${displayDate}</div>
                            <div class="daily-weekday">${weekday}</div>
                        </div>
                    </div>
                    
                    <div class="daily-stats-grid">
                        <div class="daily-stat-item jobs">
                            <div class="daily-stat-label">Total Jobs</div>
                            <div class="daily-stat-value">${perf.jobs || 0}</div>
                        </div>
                        <div class="daily-stat-item completed">
                            <div class="daily-stat-label">Completed</div>
                            <div class="daily-stat-value">${perf.completed || 0}</div>
                        </div>
                        <div class="daily-stat-item aborted">
                            <div class="daily-stat-label">Aborted</div>
                            <div class="daily-stat-value">${perf.aborted || 0}</div>
                        </div>
                        <div class="daily-stat-item meters">
                            <div class="daily-stat-label">Meters</div>
                            <div class="daily-stat-value">${Math.round(perf.meters || 0)}</div>
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });

            document.getElementById('dailyBreakdownSection').style.display = 'block';
        }

        // Initialize
        window.addEventListener('load', () => {
            loadEngineers();
        });
    </script>
</body>
</html>
