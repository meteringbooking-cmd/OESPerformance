<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineer Daily Breakdown</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 2em;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .filter-section {
            margin-bottom: 30px;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .filter-group {
            margin-bottom: 20px;
        }

        .filter-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 1.05em;
        }

        .filter-group select,
        .filter-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        .filter-group select:focus,
        .filter-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .date-range-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            width: 100%;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 1.1em;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 1.1em;
        }

        .daily-breakdown-container {
            margin-top: 30px;
        }

        .breakdown-title {
            text-align: center;
            color: #667eea;
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .daily-card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border-left: 5px solid #667eea;
        }

        .daily-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .daily-date {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
        }

        .daily-weekday {
            color: #667eea;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .daily-stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .daily-stat-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .daily-stat-label {
            font-size: 0.85em;
            color: #666;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .daily-stat-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #333;
        }

        .daily-stat-item.jobs .daily-stat-value {
            color: #667eea;
        }

        .daily-stat-item.completed .daily-stat-value {
            color: #28a745;
        }

        .daily-stat-item.aborted .daily-stat-value {
            color: #dc3545;
        }

        .daily-stat-item.meters .daily-stat-value {
            color: #fd7e14;
        }

        .absence-section {
            margin-top: 15px;
            padding: 15px;
            background: #fff3cd;
            border-radius: 8px;
            border-left: 4px solid #ffc107;
        }

        .absence-section.present {
            background: #d4edda;
            border-left-color: #28a745;
        }

        .absence-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .absence-type {
            display: inline-block;
            padding: 4px 12px;
            background: #ffc107;
            color: #333;
            border-radius: 4px;
            font-size: 0.9em;
            font-weight: 600;
        }

        .absence-type.holiday {
            background: #007bff;
            color: white;
        }

        .absence-type.sick {
            background: #dc3545;
            color: white;
        }

        .present-badge {
            display: inline-block;
            padding: 4px 12px;
            background: #28a745;
            color: white;
            border-radius: 4px;
            font-size: 0.9em;
            font-weight: 600;
        }

        .bonus-section {
            margin-top: 15px;
            padding: 15px;
            background: #d1ecf1;
            border-radius: 8px;
            border-left: 4px solid #17a2b8;
        }

        .bonus-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .bonus-amount {
            display: inline-block;
            padding: 6px 15px;
            background: #28a745;
            color: white;
            border-radius: 4px;
            font-size: 1.1em;
            font-weight: bold;
        }

        .no-bonus {
            color: #666;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .date-range-group {
                grid-template-columns: 1fr;
            }

            .daily-stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .daily-card-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">👷 Engineer Daily Breakdown</div>
            <div class="subtitle">View detailed daily performance</div>
        </div>

        <div class="filter-section">
            <div class="filter-group">
                <label for="engineerSelect">Select Engineer:</label>
                <select id="engineerSelect" disabled>
                    <option value="">Loading engineers...</option>
                </select>
            </div>

            <div class="date-range-group">
                <div class="filter-group">
                    <label for="startDate">Start Date:</label>
                    <input type="date" id="startDate" required>
                </div>
                <div class="filter-group">
                    <label for="endDate">End Date:</label>
                    <input type="date" id="endDate" required>
                </div>
            </div>

            <button class="btn" onclick="loadDailyBreakdown()" id="loadBtn" disabled>
                Show Daily Breakdown
            </button>
        </div>

        <div id="loadingDiv" class="loading" style="display: none;">Loading data...</div>
        <div id="noDataDiv" class="no-data" style="display: none;">No data found for the selected date range.</div>

        <div id="dailyBreakdownSection" class="daily-breakdown-container" style="display: none;">
            <h2 class="breakdown-title">Daily Performance Breakdown</h2>
            <div id="dailyBreakdownContent"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
            authDomain: "oesperformance-a54c0.firebaseapp.com",
            projectId: "oesperformance-a54c0",
            storageBucket: "oesperformance-a54c0.firebasestorage.app",
            messagingSenderId: "484894102454",
            appId: "1:484894102454:web:17535ee497eac2d90d6717",
            measurementId: "G-R56BGZYV8N"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allEngineers = [];

        // Set default dates (last 7 days)
        const today = new Date();
        const lastWeek = new Date(today);
        lastWeek.setDate(lastWeek.getDate() - 7);
        
        document.getElementById('endDate').valueAsDate = today;
        document.getElementById('startDate').valueAsDate = lastWeek;

        // Load engineers on page load
        async function loadEngineers() {
            const selectElement = document.getElementById('engineerSelect');
            const loadBtn = document.getElementById('loadBtn');
            
            try {
                const q = query(collection(db, "performance"), orderBy("engineerName"));
                const querySnapshot = await getDocs(q);
                
                const engineerSet = new Set();
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.engineerName) {
                        engineerSet.add(data.engineerName);
                    }
                });

                allEngineers = Array.from(engineerSet).sort();
                
                selectElement.innerHTML = '<option value="">-- Select an Engineer --</option>';
                
                allEngineers.forEach(engineer => {
                    const option = document.createElement('option');
                    option.value = engineer;
                    option.textContent = engineer;
                    selectElement.appendChild(option);
                });

                selectElement.disabled = false;

                // Enable load button when engineer and dates are selected
                selectElement.addEventListener('change', function() {
                    loadBtn.disabled = !this.value;
                });

            } catch (error) {
                console.error("Error loading engineers:", error);
                selectElement.innerHTML = '<option value="">Error loading engineers</option>';
            }
        }

       window.loadDailyBreakdown = async function() {
    const engineerSelect = document.getElementById('engineerSelect');
    const startDate = document.getElementById('startDate').value;
    const endDate = document.getElementById('endDate').value;
    const selectedEngineer = engineerSelect.value;

    if (!selectedEngineer) {
        alert('Please select an engineer');
        return;
    }

    if (!startDate || !endDate) {
        alert('Please select both start and end dates');
        return;
    }

    if (startDate > endDate) {
        alert('Start date must be before end date');
        return;
    }

    document.getElementById('loadingDiv').style.display = 'block';
    document.getElementById('noDataDiv').style.display = 'none';
    document.getElementById('dailyBreakdownSection').style.display = 'none';

    try {
        // Get all dates in range (weekdays only)
        const start = new Date(startDate);
        const end = new Date(endDate);
        const allDates = [];
        
        for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
            const dayOfWeek = d.getDay();
            if (dayOfWeek !== 0 && dayOfWeek !== 6) {
                allDates.push(d.toISOString().split('T')[0]);
            }
        }

        // Load performance data - without orderBy to avoid index issues
        const perfQuery = query(
            collection(db, "performance"),
            where("engineerName", "==", selectedEngineer),
            where("date", ">=", startDate),
            where("date", "<=", endDate)
        );

        const perfSnapshot = await getDocs(perfQuery);
        const performanceData = {};
        perfSnapshot.forEach((doc) => {
            const data = doc.data();
            performanceData[data.date] = data;
        });

        // Load attendance data - without orderBy
        const attendanceQuery = query(
            collection(db, "attendance"),
            where("engineerName", "==", selectedEngineer),
            where("date", ">=", startDate),
            where("date", "<=", endDate)
        );

        const attendanceSnapshot = await getDocs(attendanceQuery);
        const attendanceData = {};
        attendanceSnapshot.forEach((doc) => {
            const data = doc.data();
            attendanceData[data.date] = data;
        });

        // Load bonus data - without orderBy
        let bonusData = {};
        try {
            const bonusQuery = query(
                collection(db, "bonuses"),
                where("engineerName", "==", selectedEngineer),
                where("weekStartDate", ">=", startDate),
                where("weekStartDate", "<=", endDate)
            );

            const bonusSnapshot = await getDocs(bonusQuery);
            bonusSnapshot.forEach((doc) => {
                const data = doc.data();
                if (data.dailyBonuses) {
                    Object.keys(data.dailyBonuses).forEach(date => {
                        bonusData[date] = data.dailyBonuses[date];
                    });
                }
            });
        } catch (bonusError) {
            console.log("Bonus data not available:", bonusError);
            // Continue without bonus data
        }

        // Display daily breakdown
        displayDailyBreakdown(allDates, performanceData, attendanceData, bonusData, selectedEngineer);

        document.getElementById('loadingDiv').style.display = 'none';

    } catch (error) {
        console.error("Error loading data:", error);
        document.getElementById('loadingDiv').style.display = 'none';
        
        if (error.message && error.message.includes('index')) {
            const match = error.message.match(/https:\/\/[^\s]+/);
            if (match) {
                const indexUrl = match[0];
                document.getElementById('noDataDiv').innerHTML = `
                    <strong>Index Required</strong><br><br>
                    Firestore needs to create an index for this query.<br><br>
                    <a href="${indexUrl}" target="_blank" style="color: #667eea; font-weight: bold; text-decoration: underline;">
                        Click here to create the index
                    </a><br><br>
                    After creating it, wait 1-2 minutes and refresh this page.
                `;
                document.getElementById('noDataDiv').style.display = 'block';
            }
        } else {
            document.getElementById('noDataDiv').textContent = 'Error loading data: ' + error.message;
            document.getElementById('noDataDiv').style.display = 'block';
        }
    }
}
        // Initialize
        window.addEventListener('load', () => {
            loadEngineers();
        });
    </script>
</body>
</html>
