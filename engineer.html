<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineer Login - OES Performance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 450px;
            width: 100%;
            padding: 40px;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .logo-text {
            font-size: 1.8em;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 5px;
        }

        .logo-subtitle {
            color: #666;
            font-size: 1em;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 1em;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .password-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2em;
            color: #666;
            padding: 5px;
        }

        .password-toggle:hover {
            color: #667eea;
        }

        .btn-login {
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 10px;
        }

        .btn-login:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.9em;
            border-left: 4px solid #dc3545;
        }

        .info-message {
            background: #d1ecf1;
            color: #0c5460;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9em;
            border-left: 4px solid #17a2b8;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 0.9em;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95em;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }

            .logo-text {
                font-size: 1.5em;
            }

            .logo-icon {
                font-size: 2.5em;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <div class="logo-icon">👷</div>
            <div class="logo-text">Engineer Login</div>
            <div class="logo-subtitle">OES Performance System</div>
        </div>

        <div id="loadingDiv" class="loading">Loading engineers...</div>

        <div id="errorMessage" class="error-message"></div>

        <form id="loginForm" style="display: none;" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="engineerSelect">Select Your Name:</label>
                <select id="engineerSelect" required>
                    <option value="">-- Select Your Name --</option>
                </select>
            </div>

            <div class="form-group">
                <label for="passwordInput">Password:</label>
                <div class="password-wrapper">
                    <input type="password" id="passwordInput" placeholder="Enter your password" required>
                    <button type="button" class="password-toggle" onclick="togglePassword()">
                        👁️
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                🔐 Login
            </button>
        </form>

        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
            authDomain: "oesperformance-a54c0.firebaseapp.com",
            projectId: "oesperformance-a54c0",
            storageBucket: "oesperformance-a54c0.firebasestorage.app",
            messagingSenderId: "484894102454",
            appId: "1:484894102454:web:17535ee497eac2d90d6717",
            measurementId: "G-R56BGZYV8N"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let engineers = [];

        // Load engineers from database
        async function loadEngineers() {
            try {
                const querySnapshot = await getDocs(collection(db, "engineers"));
                
                engineers = [];
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    engineers.push({
                        id: doc.id,
                        name: data.engineerName,
                        password: data.password || null
                    });
                });

                // Sort engineers by name
                engineers.sort((a, b) => a.name.localeCompare(b.name));

                // Populate dropdown
                const select = document.getElementById('engineerSelect');
                engineers.forEach(engineer => {
                    const option = document.createElement('option');
                    option.value = engineer.name;
                    option.textContent = engineer.name;
                    select.appendChild(option);
                });

                document.getElementById('loadingDiv').style.display = 'none';
                document.getElementById('loginForm').style.display = 'block';

            } catch (error) {
                console.error("Error loading engineers:", error);
                document.getElementById('loadingDiv').textContent = 'Error loading data. Please refresh the page.';
                showError('Failed to load engineer list. Please try again.');
            }
        }

        window.togglePassword = function() {
            const passwordInput = document.getElementById('passwordInput');
            const toggleBtn = document.querySelector('.password-toggle');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                toggleBtn.textContent = '👁️';
            }
        }

        window.handleLogin = function(event) {
            event.preventDefault();
            
            const selectedName = document.getElementById('engineerSelect').value;
            const enteredPassword = document.getElementById('passwordInput').value;

            if (!selectedName) {
                showError('Please select your name from the dropdown.');
                return;
            }

            // Find the engineer
            const engineer = engineers.find(e => e.name === selectedName);

            if (!engineer) {
                showError('Engineer not found. Please try again.');
                return;
            }

            // Check if password is set
            if (!engineer.password) {
                showError('No password has been set for this account. Please contact your administrator.');
                return;
            }

            // Verify password
            if (enteredPassword !== engineer.password) {
                showError('Incorrect password. Please try again.');
                return;
            }

            // Login successful - store in session and redirect
            sessionStorage.setItem('engineerLoggedIn', 'true');
            sessionStorage.setItem('engineerName', engineer.name);
            
            // Redirect to engineer daily breakdown
            window.location.href = 'engineer-daily-breakdown-updated.html';
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = '❌ ' + message;
            errorDiv.style.display = 'block';
            
            // Hide error after 5 seconds
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        // Check if already logged in
        if (sessionStorage.getItem('engineerLoggedIn') === 'true') {
            window.location.href = 'engineer.html';
        } else {
            // Load engineers on page load
            loadEngineers();
        }
    </script>
</body>
</html>
