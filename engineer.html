<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineer Daily Breakdown</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 2em;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .filter-section {
            margin-bottom: 30px;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .filter-group {
            margin-bottom: 20px;
        }

        .filter-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 1.05em;
        }

        .filter-group select,
        .filter-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        .filter-group select:focus,
        .filter-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .date-range-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            width: 100%;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            margin-top: 15px;
        }

        .btn-secondary:hover:not(:disabled) {
            box-shadow: 0 10px 25px rgba(40, 167, 69, 0.4);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 1.1em;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 1.1em;
        }

        .daily-breakdown-container {
            margin-top: 30px;
        }

        .breakdown-title {
            text-align: center;
            color: #667eea;
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .daily-card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border-left: 5px solid #667eea;
        }

        .daily-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .daily-date {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
        }

        .daily-weekday {
            color: #667eea;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .daily-stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .daily-stat-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .daily-stat-label {
            font-size: 0.85em;
            color: #666;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .daily-stat-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #333;
        }

        .daily-stat-item.jobs .daily-stat-value {
            color: #667eea;
        }

        .daily-stat-item.completed .daily-stat-value {
            color: #28a745;
        }

        .daily-stat-item.aborted .daily-stat-value {
            color: #dc3545;
        }

        .daily-stat-item.meters .daily-stat-value {
            color: #fd7e14;
        }

        .absence-section {
            margin-top: 15px;
            padding: 15px;
            background: #fff3cd;
            border-radius: 8px;
            border-left: 4px solid #ffc107;
        }

        .absence-section.present {
            background: #d4edda;
            border-left-color: #28a745;
        }

        .absence-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .absence-type {
            display: inline-block;
            padding: 4px 12px;
            background: #ffc107;
            color: #333;
            border-radius: 4px;
            font-size: 0.9em;
            font-weight: 600;
        }

        .absence-type.holiday {
            background: #007bff;
            color: white;
        }

        .absence-type.sick {
            background: #dc3545;
            color: white;
        }

        .present-badge {
            display: inline-block;
            padding: 4px 12px;
            background: #28a745;
            color: white;
            border-radius: 4px;
            font-size: 0.9em;
            font-weight: 600;
        }

        .bonus-section {
            margin-top: 15px;
            padding: 15px;
            background: #d1ecf1;
            border-radius: 8px;
            border-left: 4px solid #17a2b8;
        }

        .bonus-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .bonus-amount {
            display: inline-block;
            padding: 6px 15px;
            background: #28a745;
            color: white;
            border-radius: 4px;
            font-size: 1.1em;
            font-weight: bold;
        }

        .no-bonus {
            color: #666;
            font-style: italic;
        }

        .jobs-section {
            margin-top: 15px;
            padding: 15px;
            background: #e7f3ff;
            border-radius: 8px;
            border-left: 4px solid #2196F3;
        }

        .jobs-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .jobs-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 5px;
            overflow: hidden;
            font-size: 0.9em;
        }

        .jobs-table th {
            background: #2196F3;
            color: white;
            padding: 8px;
            text-align: left;
            font-weight: 600;
            font-size: 0.85em;
        }

        .jobs-table td {
            padding: 8px;
            border-bottom: 1px solid #e0e0e0;
        }

        .jobs-table tbody tr:last-child td {
            border-bottom: none;
        }

        .jobs-table tbody tr:hover {
            background-color: #f5f5f5;
        }

        .job-number {
            color: #2196F3;
            font-weight: 600;
        }

        .job-status {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 0.8em;
            font-weight: 600;
        }

        .job-status.completed {
            background: #d4edda;
            color: #155724;
        }

        .job-status.aborted {
            background: #f8d7da;
            color: #721c24;
        }

        .job-status.other {
            background: #e2e3e5;
            color: #383d41;
        }

        .no-jobs {
            color: #666;
            font-style: italic;
            text-align: center;
            padding: 15px;
        }

        /* Additional Payments Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background-color: #fefefe;
            margin: 3% auto;
            padding: 0;
            border-radius: 15px;
            width: 90%;
            max-width: 800px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            animation: slideIn 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            padding: 25px;
            border-radius: 15px 15px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.5em;
        }

        .close {
            color: white;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease;
            line-height: 1;
        }

        .close:hover,
        .close:focus {
            transform: scale(1.2);
        }

        .modal-body {
            padding: 30px;
        }

        .form-section {
            margin-bottom: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #28a745;
        }

        .form-section h3 {
            color: #28a745;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-row.full {
            grid-template-columns: 1fr;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #28a745;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .radio-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-weight: normal;
        }

        .radio-group input[type="radio"] {
            width: auto;
            cursor: pointer;
        }

        .jobs-entry-container {
            margin-top: 15px;
        }

        .job-entry {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 2px solid #e0e0e0;
        }

        .job-entry-header {
            font-weight: 600;
            color: #28a745;
            margin-bottom: 10px;
            font-size: 1.05em;
        }

        .submit-notice {
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            text-align: center;
            color: #856404;
            font-weight: 600;
        }

        .additional-payment-section {
            margin-top: 15px;
            padding: 20px;
            background: #e8f5e9;
            border-radius: 8px;
            border-left: 4px solid #28a745;
        }

        .additional-payment-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.1em;
        }

        .payment-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #c8e6c9;
        }

        .payment-item:last-child {
            border-bottom: none;
            padding-top: 12px;
            margin-top: 8px;
            border-top: 2px solid #28a745;
            font-weight: bold;
            font-size: 1.1em;
        }

        .payment-label {
            color: #555;
        }

        .payment-value {
            color: #28a745;
            font-weight: 600;
        }

        .payment-details {
            background: white;
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 0.9em;
        }

        .payment-details-item {
            padding: 5px 0;
            color: #666;
        }

        .pending-approval {
            display: inline-block;
            background: #ffc107;
            color: #333;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: 600;
            margin-left: 10px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .date-range-group {
                grid-template-columns: 1fr;
            }

            .daily-stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .daily-card-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .modal-content {
                width: 95%;
                margin: 5% auto;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">👷 Engineer Daily Breakdown</div>
            <div class="subtitle">View detailed daily performance</div>
        </div>

        <div class="filter-section">
            <div class="filter-group">
                <label for="engineerSelect">Select Engineer:</label>
                <select id="engineerSelect" disabled>
                    <option value="">Loading engineers...</option>
                </select>
            </div>

            <div class="date-range-group">
                <div class="filter-group">
                    <label for="startDate">Start Date:</label>
                    <input type="date" id="startDate" required>
                </div>
                <div class="filter-group">
                    <label for="endDate">End Date:</label>
                    <input type="date" id="endDate" required>
                </div>
            </div>

            <button class="btn" onclick="loadDailyBreakdown()" id="loadBtn" disabled>
                Show Daily Breakdown
            </button>

            <button class="btn btn-secondary" onclick="openAdditionalPaymentModal()" id="additionalPaymentBtn" style="display: none;">
                💰 Submit Additional Payments
            </button>
        </div>

        <div id="loadingDiv" class="loading" style="display: none;">Loading data...</div>
        <div id="noDataDiv" class="no-data" style="display: none;">No data found for the selected date range.</div>

        <div id="dailyBreakdownSection" class="daily-breakdown-container" style="display: none;">
            <h2 class="breakdown-title">Daily Performance Breakdown</h2>
            <div id="dailyBreakdownContent"></div>
        </div>
    </div>

    <!-- Additional Payment Modal -->
    <div id="additionalPaymentModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>💰 Submit Additional Payments</h2>
                <span class="close" onclick="closeAdditionalPaymentModal()">&times;</span>
            </div>
            <div class="modal-body">
                <form id="additionalPaymentForm" onsubmit="submitAdditionalPayment(event)">
                    <div class="form-section">
                        <h3>📅 Payment Date</h3>
                        <div class="form-group">
                            <label for="paymentDate">Date:</label>
                            <input type="date" id="paymentDate" required>
                        </div>
                    </div>

                    <div class="form-section">
                        <h3>💵 Payment Types</h3>
                        
                        <div class="form-group">
                            <label>Are you claiming a standby payment?</label>
                            <div class="radio-group">
                                <label><input type="radio" name="standby" value="yes" onchange="updateForm()"> Yes</label>
                                <label><input type="radio" name="standby" value="no" checked onchange="updateForm()"> No</label>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Are you claiming a working away allowance?</label>
                            <div class="radio-group">
                                <label><input type="radio" name="workingAway" value="yes" onchange="updateForm()"> Yes</label>
                                <label><input type="radio" name="workingAway" value="no" checked onchange="updateForm()"> No</label>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Are you claiming overtime?</label>
                            <div class="radio-group">
                                <label><input type="radio" name="overtime" value="yes" onchange="updateForm()"> Yes</label>
                                <label><input type="radio" name="overtime" value="no" checked onchange="updateForm()"> No</label>
                            </div>
                        </div>

                        <div id="overtimeDetails" style="display: none;">
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="overtimeStart">Start Time:</label>
                                    <input type="time" id="overtimeStart">
                                </div>
                                <div class="form-group">
                                    <label for="overtimeEnd">End Time:</label>
                                    <input type="time" id="overtimeEnd">
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="overtimeReason">Reason:</label>
                                <select id="overtimeReason">
                                    <option value="">Select a reason</option>
                                    <option value="extra work">Extra Work</option>
                                    <option value="OOH rota coverage">OOH Rota Coverage</option>
                                    <option value="standard weekly hours exceeded">Standard Weekly Hours Exceeded</option>
                                    <option value="travel to training/work away">Travel to Training/Work Away</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Did you carry out any jobs?</label>
                            <div class="radio-group">
                                <label><input type="radio" name="hasJobs" value="yes" onchange="updateForm()"> Yes</label>
                                <label><input type="radio" name="hasJobs" value="no" checked onchange="updateForm()"> No</label>
                            </div>
                        </div>

                        <div id="jobsQuantity" style="display: none;">
                            <div class="form-group">
                                <label for="numJobs">Number of Jobs (1-10):</label>
                                <input type="number" id="numJobs" min="1" max="10" onchange="generateJobEntries()">
                            </div>
                        </div>
                    </div>

                    <div id="jobsEntrySection" style="display: none;">
                        <div class="form-section">
                            <h3>📋 Job Details</h3>
                            <div id="jobsEntryContainer" class="jobs-entry-container"></div>
                        </div>
                    </div>

                    <div class="submit-notice">
                        ⚠️ All submissions are subject to approval
                    </div>

                    <button type="submit" class="btn" style="margin-top: 20px;">Submit Payment Claim</button>
                </form>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, addDoc, Timestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
            authDomain: "oesperformance-a54c0.firebaseapp.com",
            projectId: "oesperformance-a54c0",
            storageBucket: "oesperformance-a54c0.firebasestorage.app",
            messagingSenderId: "484894102454",
            appId: "1:484894102454:web:17535ee497eac2d90d6717",
            measurementId: "G-R56BGZYV8N"
        };

        console.log("Initializing Firebase...");
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db;
        console.log("Firebase initialized successfully");

        let allEngineers = [];
        let currentEngineer = '';
        let additionalPayments = {};

        // Set default dates (last 7 days)
        const today = new Date();
        const lastWeek = new Date(today);
        lastWeek.setDate(lastWeek.getDate() - 7);
        
        document.getElementById('endDate').valueAsDate = today;
        document.getElementById('startDate').valueAsDate = lastWeek;

        // Load engineers on page load
        async function loadEngineers() {
            const selectElement = document.getElementById('engineerSelect');
            const loadBtn = document.getElementById('loadBtn');
            
            console.log("Starting to load engineers...");
            
            try {
                selectElement.innerHTML = '<option value="">Loading engineers...</option>';
                
                console.log("Fetching performance collection...");
                const querySnapshot = await getDocs(collection(db, "performance"));
                
                console.log("Documents fetched:", querySnapshot.size);
                
                const engineerSet = new Set();
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.engineerName) {
                        engineerSet.add(data.engineerName);
                    }
                });

                allEngineers = Array.from(engineerSet).sort();
                console.log("Engineers found:", allEngineers);
                
                if (allEngineers.length === 0) {
                    selectElement.innerHTML = '<option value="">No engineers found</option>';
                    selectElement.disabled = true;
                    return;
                }
                
                selectElement.innerHTML = '<option value="">-- Select an Engineer --</option>';
                
                allEngineers.forEach(engineer => {
                    const option = document.createElement('option');
                    option.value = engineer;
                    option.textContent = engineer;
                    selectElement.appendChild(option);
                });

                selectElement.disabled = false;
                console.log("Dropdown enabled with", allEngineers.length, "engineers");

                selectElement.addEventListener('change', function() {
                    loadBtn.disabled = !this.value;
                    currentEngineer = this.value;
                    console.log("Engineer selected:", this.value);
                });

            } catch (error) {
                console.error("Error loading engineers:", error);
                selectElement.innerHTML = '<option value="">Error: ' + error.message + '</option>';
                selectElement.disabled = true;
                alert('Error loading engineers. Check console for details.\n\n' + error.message);
            }
        }

        window.loadDailyBreakdown = async function() {
            const engineerSelect = document.getElementById('engineerSelect');
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const selectedEngineer = engineerSelect.value;

            if (!selectedEngineer) {
                alert('Please select an engineer');
                return;
            }

            if (!startDate || !endDate) {
                alert('Please select both start and end dates');
                return;
            }

            if (startDate > endDate) {
                alert('Start date must be before end date');
                return;
            }

            currentEngineer = selectedEngineer;

            document.getElementById('loadingDiv').style.display = 'block';
            document.getElementById('noDataDiv').style.display = 'none';
            document.getElementById('dailyBreakdownSection').style.display = 'none';
            document.getElementById('additionalPaymentBtn').style.display = 'none';

            try {
                // Get all dates in range (weekdays only)
                const start = new Date(startDate);
                const end = new Date(endDate);
                const allDates = [];
                
                for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
                    const dayOfWeek = d.getDay();
                    if (dayOfWeek !== 0 && dayOfWeek !== 6) {
                        allDates.push(d.toISOString().split('T')[0]);
                    }
                }

                // Load performance data
                console.log("Loading performance data...");
                const perfQuery = query(
                    collection(db, "performance"),
                    where("engineerName", "==", selectedEngineer)
                );

                const perfSnapshot = await getDocs(perfQuery);
                const performanceData = {};
                perfSnapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.date >= startDate && data.date <= endDate) {
                        performanceData[data.date] = data;
                    }
                });
                console.log("Performance data loaded:", Object.keys(performanceData).length, "records");

                // Load attendance data
                console.log("Loading attendance data...");
                const attendanceQuery = query(
                    collection(db, "attendance"),
                    where("engineerName", "==", selectedEngineer)
                );

                const attendanceSnapshot = await getDocs(attendanceQuery);
                const attendanceData = {};
                attendanceSnapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.date >= startDate && data.date <= endDate) {
                        attendanceData[data.date] = data;
                    }
                });
                console.log("Attendance data loaded:", Object.keys(attendanceData).length, "records");

                // Load bonus and jobs data
                let bonusData = {};
                let jobsData = {};
                try {
                    console.log("Loading bonus data...");
                    const bonusQuery = query(
                        collection(db, "bonuses"),
                        where("engineerName", "==", selectedEngineer)
                    );

                    const bonusSnapshot = await getDocs(bonusQuery);
                    bonusSnapshot.forEach((doc) => {
                        const data = doc.data();
                        if (data.dailyBonuses) {
                            Object.keys(data.dailyBonuses).forEach(date => {
                                if (date >= startDate && date <= endDate) {
                                    bonusData[date] = data.dailyBonuses[date];
                                }
                            });
                        }
                        if (data.dailyJobs) {
                            Object.keys(data.dailyJobs).forEach(date => {
                                if (date >= startDate && date <= endDate) {
                                    jobsData[date] = data.dailyJobs[date];
                                }
                            });
                        }
                    });
                    console.log("Bonus data loaded:", Object.keys(bonusData).length, "records");
                    console.log("Jobs data loaded:", Object.keys(jobsData).length, "dates with jobs");
                } catch (bonusError) {
                    console.log("Bonus data not available:", bonusError);
                }

                // Load additional payments
                console.log("Loading additional payments...");
                const paymentsQuery = query(
                    collection(db, "additionalPayments"),
                    where("engineerName", "==", selectedEngineer)
                );

                const paymentsSnapshot = await getDocs(paymentsQuery);
                additionalPayments = {};
                paymentsSnapshot.forEach((doc) => {
                    const data = doc.data();
                    const paymentDate = data.date;
                    if (paymentDate >= startDate && paymentDate <= endDate) {
                        additionalPayments[paymentDate] = data;
                    }
                });
                console.log("Additional payments loaded:", Object.keys(additionalPayments).length, "records");

                // Display daily breakdown
                displayDailyBreakdown(allDates, performanceData, attendanceData, bonusData, jobsData, selectedEngineer);

                document.getElementById('loadingDiv').style.display = 'none';
                document.getElementById('additionalPaymentBtn').style.display = 'block';

            } catch (error) {
                console.error("Error loading data:", error);
                document.getElementById('loadingDiv').style.display = 'none';
                
                if (error.message && error.message.includes('index')) {
                    const match = error.message.match(/https:\/\/[^\s]+/);
                    if (match) {
                        const indexUrl = match[0];
                        document.getElementById('noDataDiv').innerHTML = `
                            <strong>Index Required</strong><br><br>
                            Firestore needs to create an index for this query.<br><br>
                            <a href="${indexUrl}" target="_blank" style="color: #667eea; font-weight: bold; text-decoration: underline;">
                                Click here to create the index
                            </a><br><br>
                            After creating it, wait 1-2 minutes and refresh this page.
                        `;
                        document.getElementById('noDataDiv').style.display = 'block';
                    }
                } else {
                    document.getElementById('noDataDiv').textContent = 'Error loading data: ' + error.message;
                    document.getElementById('noDataDiv').style.display = 'block';
                }
            }
        }

        function displayDailyBreakdown(dates, performanceData, attendanceData, bonusData, jobsData, engineerName) {
            const container = document.getElementById('dailyBreakdownContent');
            container.innerHTML = '';

            if (dates.length === 0) {
                document.getElementById('noDataDiv').textContent = 'No weekdays in selected date range.';
                document.getElementById('noDataDiv').style.display = 'block';
                return;
            }

            dates.forEach(date => {
                const perf = performanceData[date] || {};
                const attendance = attendanceData[date] || {};
                const bonus = bonusData[date] || 0;
                const jobs = jobsData[date] || [];
                const additionalPayment = additionalPayments[date];

                const dateObj = new Date(date + 'T00:00:00');
                const displayDate = dateObj.toLocaleDateString('en-GB', { 
                    day: '2-digit', 
                    month: 'long',
                    year: 'numeric'
                });
                const weekday = dateObj.toLocaleDateString('en-GB', { weekday: 'long' });

                const card = document.createElement('div');
                card.className = 'daily-card';

                // Absence info
                let absenceHTML = '';
                const attendanceStatus = attendance.attendance;
                
                if (attendanceStatus && attendanceStatus !== 'X') {
                    const absenceLabels = {
                        'H': 'Holiday',
                        'H/H': 'Half Day Holiday',
                        'Sick': 'Sick Leave',
                        'AAUP': 'Authorised Absence Unpaid',
                        'TOFD': 'Time Off For Dependants',
                        'AAP': 'Authorised Absence Paid'
                    };
                    
                    let absenceClass = 'other';
                    if (attendanceStatus === 'H' || attendanceStatus === 'H/H') {
                        absenceClass = 'holiday';
                    } else if (attendanceStatus === 'Sick') {
                        absenceClass = 'sick';
                    }
                    
                    absenceHTML = `
                        <div class="absence-section">
                            <div class="absence-title">
                                🚫 Absence:
                                <span class="absence-type ${absenceClass}">${absenceLabels[attendanceStatus] || attendanceStatus}</span>
                            </div>
                        </div>
                    `;
                } else if (attendanceStatus === 'X' || !attendanceStatus) {
                    absenceHTML = `
                        <div class="absence-section present">
                            <div class="absence-title">
                                ✅ <span class="present-badge">Present</span>
                            </div>
                        </div>
                    `;
                }

                // Bonus info
                let bonusHTML = '';
                if (bonus > 0) {
                    bonusHTML = `
                        <div class="bonus-section">
                            <div class="bonus-title">
                                💰 Bonus Earned:
                                <span class="bonus-amount">£${bonus}</span>
                            </div>
                        </div>
                    `;
                }

                // Jobs info
                let jobsHTML = '';
                if (jobs.length > 0) {
                    let jobsTableRows = '';
                    jobs.forEach(job => {
                        const statusClass = (job.bookingStatus || '').toLowerCase().includes('completed') ? 'completed' : 
                                          (job.bookingStatus || '').toLowerCase().includes('abort') ? 'aborted' : 'other';
                        const statusText = job.bookingStatus || 'Unknown';
                        
                        jobsTableRows += `
                            <tr>
                                <td class="job-number">${job.bookingRef || 'N/A'}</td>
                                <td>${job.time || 'N/A'}</td>
                                <td>${job.jobType || 'N/A'}</td>
                                <td><span class="job-status ${statusClass}">${statusText}</span></td>
                            </tr>
                        `;
                    });

                    jobsHTML = `
                        <div class="jobs-section">
                            <div class="jobs-title">
                                📋 Jobs Completed (${jobs.length})
                            </div>
                            <table class="jobs-table">
                                <thead>
                                    <tr>
                                        <th>Booking Reference</th>
                                        <th>Time</th>
                                        <th>Job Type</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${jobsTableRows}
                                </tbody>
                            </table>
                        </div>
                    `;
                } else if ((perf.jobs || 0) > 0) {
                    jobsHTML = `
                        <div class="jobs-section">
                            <div class="jobs-title">
                                📋 Jobs (${perf.jobs || 0})
                            </div>
                            <div class="no-jobs">Detailed job information not available for this date</div>
                        </div>
                    `;
                }

                // Additional Payment info
                let additionalPaymentHTML = '';
                if (additionalPayment) {
                    additionalPaymentHTML = generateAdditionalPaymentHTML(additionalPayment, dateObj);
                }

                card.innerHTML = `
                    <div class="daily-card-header">
                        <div>
                            <div class="daily-date">${displayDate}</div>
                            <div class="daily-weekday">${weekday}</div>
                        </div>
                    </div>
                    
                    <div class="daily-stats-grid">
                        <div class="daily-stat-item jobs">
                            <div class="daily-stat-label">Total Jobs</div>
                            <div class="daily-stat-value">${perf.jobs || 0}</div>
                        </div>
                        <div class="daily-stat-item completed">
                            <div class="daily-stat-label">Completed</div>
                            <div class="daily-stat-value">${perf.completed || 0}</div>
                        </div>
                        <div class="daily-stat-item aborted">
                            <div class="daily-stat-label">Aborted</div>
                            <div class="daily-stat-value">${perf.aborted || 0}</div>
                        </div>
                        <div class="daily-stat-item meters">
                            <div class="daily-stat-label">Meters</div>
                            <div class="daily-stat-value">${Math.round(perf.meters || 0)}</div>
                        </div>
                    </div>

                    ${absenceHTML}
                    ${bonusHTML}
                    ${jobsHTML}
                    ${additionalPaymentHTML}
                `;

                container.appendChild(card);
            });

            document.getElementById('dailyBreakdownSection').style.display = 'block';
        }

        function generateAdditionalPaymentHTML(payment, dateObj) {
            let totalAmount = 0;
            let details = [];

            const dayOfWeek = dateObj.getDay();
            const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
            const isSaturday = dayOfWeek === 6;
            const isSunday = dayOfWeek === 0;

            // Check if bank holiday, Christmas, or New Year
            const dateStr = dateObj.toISOString().split('T')[0];
            const month = dateObj.getMonth() + 1;
            const day = dateObj.getDate();
            const isChristmas = month === 12 && day === 25;
            const isBoxingDay = month === 12 && day === 26;
            const isNewYear = month === 1 && day === 1;
            const isSpecialHoliday = isChristmas || isBoxingDay || isNewYear;

            // Standby
            if (payment.standby === 'yes') {
                let standbyAmount = 0;
                if (isSpecialHoliday) {
                    standbyAmount = 100;
                    details.push({ label: 'Standby (Special Holiday)', value: `£${standbyAmount}` });
                } else if (isWeekend) {
                    standbyAmount = 50;
                    details.push({ label: `Standby (${isSaturday ? 'Saturday' : 'Sunday'})`, value: `£${standbyAmount}` });
                } else {
                    standbyAmount = 20;
                    details.push({ label: 'Standby (Weekday)', value: `£${standbyAmount}` });
                }
                totalAmount += standbyAmount;
            }

            // Working Away Allowance
            if (payment.workingAway === 'yes') {
                const allowanceAmount = 50; // Assuming £50, adjust as needed
                details.push({ label: 'Working Away Allowance', value: `£${allowanceAmount}` });
                totalAmount += allowanceAmount;
            }

            // Overtime
            if (payment.overtime === 'yes' && payment.overtimeHours > 0) {
                let hourlyRate = 24.94; // Weekday
                let rateLabel = 'Weekday';
                
                if (isSunday || payment.isBankHoliday) {
                    hourlyRate = 37.50;
                    rateLabel = isSunday ? 'Sunday' : 'Bank Holiday';
                } else if (isSaturday) {
                    hourlyRate = 28.13;
                    rateLabel = 'Saturday';
                }

                const overtimeAmount = payment.overtimeHours * hourlyRate;
                details.push({ 
                    label: `Overtime (${payment.overtimeHours.toFixed(2)} hrs @ £${hourlyRate}/hr - ${rateLabel})`, 
                    value: `£${overtimeAmount.toFixed(2)}` 
                });
                details.push({ label: `Reason: ${payment.overtimeReason}`, value: '' });
                totalAmount += overtimeAmount;
            }

            // Jobs
            if (payment.jobs && payment.jobs.length > 0) {
                let jobsTotal = 0;
                payment.jobs.forEach(job => {
                    if (job.claimPricePerJob === 'yes') {
                        let jobAmount = 0;
                        if (job.jobType === 'Dual') jobAmount = 80;
                        else if (job.jobType === 'Single') jobAmount = 50;
                        else if (job.jobType === 'Comms') jobAmount = 25;

                        details.push({ 
                            label: `Job ${job.jobNumber} (${job.postcode}) - ${job.jobType}`, 
                            value: `£${jobAmount}` 
                        });
                        jobsTotal += jobAmount;
                    }
                });
                if (jobsTotal > 0) {
                    totalAmount += jobsTotal;
                }
            }

            let detailsHTML = '';
            details.forEach(detail => {
                if (detail.value) {
                    detailsHTML += `
                        <div class="payment-item">
                            <span class="payment-label">${detail.label}</span>
                            <span class="payment-value">${detail.value}</span>
                        </div>
                    `;
                } else {
                    detailsHTML += `
                        <div class="payment-details-item">${detail.label}</div>
                    `;
                }
            });

            return `
                <div class="additional-payment-section">
                    <div class="additional-payment-title">
                        💳 Additional Payment Claim
                        <span class="pending-approval">Pending Approval</span>
                    </div>
                    <div class="payment-details">
                        ${detailsHTML}
                        <div class="payment-item">
                            <span class="payment-label">Total Claimed</span>
                            <span class="payment-value">£${totalAmount.toFixed(2)}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        window.openAdditionalPaymentModal = function() {
            if (!currentEngineer) {
                alert('Please load daily breakdown first');
                return;
            }
            const modal = document.getElementById('additionalPaymentModal');
            modal.style.display = 'block';
            
            // Set date range limits
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const paymentDateInput = document.getElementById('paymentDate');
            paymentDateInput.min = startDate;
            paymentDateInput.max = endDate;
            paymentDateInput.value = endDate;
        }

        window.closeAdditionalPaymentModal = function() {
            const modal = document.getElementById('additionalPaymentModal');
            modal.style.display = 'none';
            document.getElementById('additionalPaymentForm').reset();
            updateForm();
        }

        window.updateForm = function() {
            const overtime = document.querySelector('input[name="overtime"]:checked').value;
            const hasJobs = document.querySelector('input[name="hasJobs"]:checked').value;

            document.getElementById('overtimeDetails').style.display = overtime === 'yes' ? 'block' : 'none';
            document.getElementById('jobsQuantity').style.display = hasJobs === 'yes' ? 'block' : 'none';

            if (hasJobs === 'no') {
                document.getElementById('jobsEntrySection').style.display = 'none';
            }
        }

        window.generateJobEntries = function() {
            const numJobs = parseInt(document.getElementById('numJobs').value);
            const container = document.getElementById('jobsEntryContainer');
            container.innerHTML = '';

            if (numJobs > 0 && numJobs <= 10) {
                document.getElementById('jobsEntrySection').style.display = 'block';

                for (let i = 1; i <= numJobs; i++) {
                    const jobEntry = document.createElement('div');
                    jobEntry.className = 'job-entry';
                    jobEntry.innerHTML = `
                        <div class="job-entry-header">Job ${i}</div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Job Number:</label>
                                <input type="text" name="jobNumber_${i}" required>
                            </div>
                            <div class="form-group">
                                <label>Post Code:</label>
                                <input type="text" name="postcode_${i}" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Job Type:</label>
                                <select name="jobType_${i}" required>
                                    <option value="">Select type</option>
                                    <option value="Dual">Dual</option>
                                    <option value="Single">Single</option>
                                    <option value="Comms">Comms</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Are you claiming price per job?</label>
                                <div class="radio-group">
                                    <label><input type="radio" name="claimPricePerJob_${i}" value="yes"> Yes</label>
                                    <label><input type="radio" name="claimPricePerJob_${i}" value="no" checked> No</label>
                                </div>
                            </div>
                        </div>
                    `;
                    container.appendChild(jobEntry);
                }
            } else {
                document.getElementById('jobsEntrySection').style.display = 'none';
            }
        }

        window.submitAdditionalPayment = async function(event) {
            event.preventDefault();

            const paymentDate = document.getElementById('paymentDate').value;
            const standby = document.querySelector('input[name="standby"]:checked').value;
            const workingAway = document.querySelector('input[name="workingAway"]:checked').value;
            const overtime = document.querySelector('input[name="overtime"]:checked').value;
            const hasJobs = document.querySelector('input[name="hasJobs"]:checked').value;

            let overtimeHours = 0;
            let overtimeReason = '';

            if (overtime === 'yes') {
                const startTime = document.getElementById('overtimeStart').value;
                const endTime = document.getElementById('overtimeEnd').value;
                overtimeReason = document.getElementById('overtimeReason').value;

                if (!startTime || !endTime || !overtimeReason) {
                    alert('Please fill in all overtime details');
                    return;
                }

                const start = new Date(`2000-01-01T${startTime}`);
                const end = new Date(`2000-01-01T${endTime}`);
                overtimeHours = (end - start) / (1000 * 60 * 60);

                if (overtimeHours <= 0) {
                    alert('End time must be after start time');
                    return;
                }
            }

            let jobs = [];
            if (hasJobs === 'yes') {
                const numJobs = parseInt(document.getElementById('numJobs').value);
                
                if (!numJobs || numJobs < 1 || numJobs > 10) {
                    alert('Please select number of jobs (1-10)');
                    return;
                }

                for (let i = 1; i <= numJobs; i++) {
                    const jobNumber = document.querySelector(`input[name="jobNumber_${i}"]`).value;
                    const postcode = document.querySelector(`input[name="postcode_${i}"]`).value;
                    const jobType = document.querySelector(`select[name="jobType_${i}"]`).value;
                    const claimPricePerJob = document.querySelector(`input[name="claimPricePerJob_${i}"]:checked`).value;

                    if (!jobNumber || !postcode || !jobType) {
                        alert(`Please fill in all details for Job ${i}`);
                        return;
                    }

                    jobs.push({
                        jobNumber,
                        postcode,
                        jobType,
                        claimPricePerJob
                    });
                }
            }

            // Check if bank holiday (simplified - would need proper bank holiday API)
            const dateObj = new Date(paymentDate + 'T00:00:00');
            const isBankHoliday = false; // You would implement proper bank holiday checking

            const paymentData = {
                engineerName: currentEngineer,
                date: paymentDate,
                standby,
                workingAway,
                overtime,
                overtimeHours,
                overtimeReason,
                hasJobs: hasJobs === 'yes',
                jobs,
                isBankHoliday,
                submittedAt: Timestamp.now(),
                status: 'pending'
            };

            try {
                await addDoc(collection(db, "additionalPayments"), paymentData);
                additionalPayments[paymentDate] = paymentData;
                
                alert('Additional payment claim submitted successfully!\n\nAll submissions are subject to approval.');
                closeAdditionalPaymentModal();
                
                // Reload the daily breakdown to show the new payment
                loadDailyBreakdown();
            } catch (error) {
                console.error("Error submitting payment:", error);
                alert('Error submitting payment: ' + error.message);
            }
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('additionalPaymentModal');
            if (event.target === modal) {
                closeAdditionalPaymentModal();
            }
        }

        // Initialize
        window.addEventListener('load', () => {
            loadEngineers();
        });
    </script>
