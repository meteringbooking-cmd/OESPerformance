<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGU Admin - File Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;800&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080c14; --bg2: #0d1420; --bg3: #111928; --border: rgba(255,255,255,0.07);
            --border2: rgba(255,255,255,0.12); --accent: #00d4ff; --accent2: #00ff9d;
            --text: #e8edf8; --text2: #8b97b0; --text3: #4a5568; --danger: #ef4444;
        }
        body { font-family: 'Barlow', sans-serif; background: var(--bg); color: var(--text); padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }
        
        .admin-wrap { background: var(--bg2); border: 1px solid var(--border2); padding: 32px; width: 100%; max-width: 500px; border-radius: 8px; margin-bottom: 30px; }
        .title { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 2em; text-transform: uppercase; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
        .title span { color: var(--accent); }
        
        .field-group { margin-bottom: 20px; }
        .field-label { display: block; font-family: 'JetBrains Mono', monospace; font-size: 0.7em; color: var(--text3); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px; }
        .field-select, .field-input { width: 100%; background: var(--bg3); border: 1px solid var(--border2); color: var(--text); padding: 12px; font-family: 'Barlow', sans-serif; font-size: 1em; outline: none; }
        
        .file-drop-zone { border: 2px dashed var(--border2); padding: 40px 20px; text-align: center; background: rgba(0,212,255,0.02); cursor: pointer; transition: all 0.2s; margin-bottom: 20px; }
        .file-drop-zone:hover { border-color: var(--accent); background: rgba(0,212,255,0.05); }
        #fileInput { display: none; }

        .btn-upload { width: 100%; padding: 16px; background: var(--accent); color: var(--bg); border: none; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 1.1em; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; }

        /* ── PREVIOUSLY UPLOADED LIST ── */
        .list-wrap { width: 100%; max-width: 500px; }
        .list-header { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 1.2em; text-transform: uppercase; margin-bottom: 15px; color: var(--text2); display: flex; align-items: center; gap: 10px; }
        .list-header::after { content: ''; flex: 1; height: 1px; background: var(--border); }
        
        .doc-item { background: var(--bg2); border: 1px solid var(--border); padding: 12px 16px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .doc-info { flex: 1; }
        .doc-name { font-weight: 600; font-size: 0.95em; color: var(--text); margin-bottom: 2px; }
        .doc-meta { font-family: 'JetBrains Mono', monospace; font-size: 0.65em; color: var(--text3); }
        
        .btn-delete { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); color: var(--danger); padding: 6px 10px; font-family: 'JetBrains Mono', monospace; font-size: 0.7em; cursor: pointer; transition: all 0.2s; }
        .btn-delete:hover { background: var(--danger); color: white; }

        #statusMsg { margin-top: 16px; font-family: 'JetBrains Mono', monospace; font-size: 0.8em; text-align: center; }
    </style>
</head>
<body>

<div class="admin-wrap">
    <div class="title">Admin <span>File Manager</span></div>

    <div class="field-group">
        <label class="field-label">Target Section</label>
        <select class="field-select" id="fileCategory" onchange="loadExistingDocs()">
            <option value="Toolbox Talks">Toolbox Talks</option>
            <option value="Vehicle Documents">Vehicle Documents</option>
            <option value="DNO Guides">DNO Guides</option>
        </select>
    </div>

    <div class="field-group">
        <label class="field-label">Document Display Name</label>
        <input type="text" class="field-input" id="fileName" placeholder="e.g., Q2 Safety Briefing">
    </div>

    <div class="field-group">
        <label class="field-label">Select File</label>
        <div class="file-drop-zone" onclick="document.getElementById('fileInput').click()">
            <p id="fileDisplay">Click here to browse for a file</p>
        </div>
        <input type="file" id="fileInput" onchange="updateFileDisplay()">
    </div>

    <button class="btn-upload" id="uploadBtn" onclick="uploadFile()">Upload to Portal</button>
    <div id="statusMsg"></div>
</div>

<div class="list-wrap">
    <div class="list-header" id="listHeader">Current Documents</div>
    <div id="existingDocsContainer">
        </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
        authDomain: "oesperformance-a54c0.firebaseapp.com",
        projectId: "oesperformance-a54c0",
        storageBucket: "oesperformance-a54c0.firebasestorage.app",
        messagingSenderId: "484894102454",
        appId: "1:484894102454:web:17535ee497eac2d90d6717"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const storage = firebase.storage();

    let selectedFile = null;

    // ── LOAD DOCUMENTS ──
    async function loadExistingDocs() {
        const category = document.getElementById('fileCategory').value;
        const container = document.getElementById('existingDocsContainer');
        const header = document.getElementById('listHeader');
        
        header.textContent = `${category} List`;
        container.innerHTML = '<div style="text-align:center; font-family:JetBrains Mono; font-size:0.8em; color:var(--text3); padding:20px;">// FETCHING...</div>';

        try {
            const snapshot = await db.collection("portal_documents")
                                     .where("category", "==", category)
                                     .orderBy("uploadedAt", "desc")
                                     .get();

            if (snapshot.empty) {
                container.innerHTML = '<div style="text-align:center; font-family:JetBrains Mono; font-size:0.8em; color:var(--text3); padding:20px;">NO FILES UPLOADED YET</div>';
                return;
            }

            let html = '';
            snapshot.forEach(doc => {
                const data = doc.data();
                const dateStr = data.uploadedAt ? data.uploadedAt.toDate().toLocaleDateString('en-GB') : '---';
                html += `
                    <div class="doc-item">
                        <div class="doc-info">
                            <div class="doc-name">${data.name}</div>
                            <div class="doc-meta">DATE: ${dateStr}</div>
                        </div>
                        <button class="btn-delete" onclick="deleteDoc('${doc.id}', '${data.url}')">DELETE</button>
                    </div>
                `;
            });
            container.innerHTML = html;
        } catch (e) {
            console.error(e);
            container.innerHTML = `<div style="color:var(--danger); font-size:0.8em;">Error: ${e.message}</div>`;
        }
    }

    // ── DELETE DOCUMENT (Storage + Firestore) ──
    async function deleteDoc(docId, fileUrl) {
        if (!confirm("Are you sure you want to delete this document? It will be removed from the Engineer Portal immediately.")) return;

        try {
            // 1. Remove from Firestore
            await db.collection("portal_documents").doc(docId).delete();
            
            // 2. Optional: Remove from Storage (requires parsing filename from URL, but simple for now)
            try {
                const storageRef = firebase.storage().refFromURL(fileUrl);
                await storageRef.delete();
            } catch (storageErr) {
                console.warn("File deleted from DB, but might already be missing from storage.");
            }

            alert("Document deleted successfully.");
            loadExistingDocs(); // Refresh list
        } catch (e) {
            alert("Error deleting: " + e.message);
        }
    }

    function updateFileDisplay() {
        const fileInput = document.getElementById('fileInput');
        const display = document.getElementById('fileDisplay');
        if (fileInput.files.length > 0) {
            selectedFile = fileInput.files[0];
            display.innerHTML = `Selected: <strong style="color:var(--accent)">${selectedFile.name}</strong>`;
            const nameInput = document.getElementById('fileName');
            if(!nameInput.value) nameInput.value = selectedFile.name.split('.')[0];
        }
    }

    async function uploadFile() {
        const category = document.getElementById('fileCategory').value;
        const displayName = document.getElementById('fileName').value.trim();
        const statusMsg = document.getElementById('statusMsg');
        const uploadBtn = document.getElementById('uploadBtn');

        if (!selectedFile || !displayName) { alert("File and Display Name required."); return; }

        uploadBtn.disabled = true;
        statusMsg.style.color = "var(--accent)";
        statusMsg.textContent = "// UPLOADING...";

        try {
            const fileRef = storage.ref().child(`portal_documents/${category}/${Date.now()}_${selectedFile.name}`);
            await fileRef.put(selectedFile);
            const downloadUrl = await fileRef.getDownloadURL();

            await db.collection("portal_documents").add({
                name: displayName,
                category: category,
                url: downloadUrl,
                uploadedAt: firebase.firestore.Timestamp.now()
            });

            statusMsg.style.color = "var(--accent2)";
            statusMsg.textContent = "✓ UPLOAD COMPLETE";
            
            // Reset
            document.getElementById('fileName').value = '';
            selectedFile = null;
            document.getElementById('fileDisplay').textContent = 'Click here to browse for a file';
            
            loadExistingDocs(); // Refresh the list below

        } catch (error) {
            statusMsg.style.color = "var(--danger)";
            statusMsg.textContent = "⚠ ERROR: " + error.message;
        } finally {
            uploadBtn.disabled = false;
        }
    }

    // Initial Load
    window.onload = loadExistingDocs;
</script>
</body>
</html>
