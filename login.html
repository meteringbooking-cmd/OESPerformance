<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OES Performance — Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Karla:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00D2FF;
            --secondary: #3a7bd5;
            --card: rgba(26,32,44,0.9);
            --text: #e1e8ed;
            --muted: #a8dadc;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Karla', sans-serif;
            background: linear-gradient(135deg, #0a1020 0%, #0f1a2e 50%, #0a1828 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px; position: relative; overflow: hidden;
        }
        body::before {
            content: ''; position: fixed; inset: 0;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(0,210,255,0.03) 40px, rgba(0,210,255,0.03) 41px),
                repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(0,210,255,0.03) 40px, rgba(0,210,255,0.03) 41px);
            pointer-events: none; z-index: 0;
        }
        body::after {
            content: ''; position: fixed; width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(0,210,255,0.08) 0%, transparent 70%);
            top: -200px; left: -200px; pointer-events: none; z-index: 0;
            animation: orbFloat 12s ease-in-out infinite;
        }
        @keyframes orbFloat { 0%,100%{transform:translate(0,0)} 50%{transform:translate(60px,60px)} }
        .login-wrapper { position: relative; z-index: 1; width: 100%; max-width: 460px; }
        .logo-area { text-align: center; margin-bottom: 40px; animation: fadeDown 0.7s ease forwards; }
        .logo-img { height: 50px; filter: drop-shadow(0 0 20px rgba(0,210,255,0.4)); margin-bottom: 20px; }
        .logo-title {
            font-family: 'Orbitron', sans-serif; font-size: 1.5em; font-weight: 900;
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            letter-spacing: 3px; text-transform: uppercase;
        }
        .logo-sub { color: var(--muted); font-size: 0.85em; margin-top: 6px; font-weight: 300; letter-spacing: 1px; }
        @keyframes fadeDown { from{opacity:0;transform:translateY(-20px)} to{opacity:1;transform:translateY(0)} }
        .login-card {
            background: var(--card); border: 1px solid rgba(0,210,255,0.2);
            border-radius: 20px; padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
            animation: fadeUp 0.7s ease 0.1s both; position: relative; overflow: hidden;
        }
        .login-card::before {
            content: ''; position: absolute; top:0;left:0;right:0;height:2px;
            background: linear-gradient(90deg, transparent, var(--primary), var(--secondary), transparent);
        }
        @keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
        .card-title {
            font-family: 'Orbitron', sans-serif; font-size: 1em; color: var(--primary);
            letter-spacing: 2px; text-transform: uppercase; margin-bottom: 30px; text-align: center;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block; color: var(--muted); font-size: 0.78em; font-weight: 600;
            text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px;
        }
        .form-group input {
            width: 100%; padding: 14px 16px;
            background: rgba(0,0,0,0.3); border: 1.5px solid rgba(0,210,255,0.2);
            border-radius: 10px; color: var(--text); font-family: 'Karla', sans-serif;
            font-size: 1em; transition: all 0.3s ease; outline: none;
        }
        .form-group input:focus { border-color: var(--primary); background: rgba(0,210,255,0.05); box-shadow: 0 0 0 3px rgba(0,210,255,0.1); }
        .form-group input::placeholder { color: rgba(255,255,255,0.2); }
        .btn-login {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            border: none; border-radius: 10px; color: #0a1020;
            font-family: 'Orbitron', sans-serif; font-size: 0.85em; font-weight: 700;
            letter-spacing: 2px; text-transform: uppercase; cursor: pointer;
            transition: all 0.3s ease; margin-top: 10px;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,210,255,0.4); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .alert { padding: 12px 16px; border-radius: 8px; font-size: 0.9em; font-weight: 600; margin-bottom: 20px; display: none; }
        .alert-error { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.4); color: #f87171; }
        .alert-info  { background: rgba(0,210,255,0.1);  border: 1px solid rgba(0,210,255,0.3);  color: var(--primary); }
        .spinner {
            display: inline-block; width: 16px; height: 16px;
            border: 2px solid rgba(10,16,32,0.3); border-top-color: #0a1020;
            border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 8px;
        }
        @keyframes spin { to{transform:rotate(360deg)} }
        .footer-note { text-align: center; color: rgba(168,218,220,0.4); font-size: 0.78em; margin-top: 24px; letter-spacing: 0.5px; }
        #debugBox {
            display: none; margin-top: 20px;
            background: rgba(0,0,0,0.6); border: 1px solid rgba(0,210,255,0.2);
            border-radius: 8px; padding: 14px; font-family: monospace;
            font-size: 0.74em; color: #a8dadc; line-height: 1.9; word-break: break-all;
        }
        #debugBox .ok  { color: #34d399; }
        #debugBox .err { color: #f87171; }
        #debugBox .inf { color: #00d2ff; }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="logo-area">
            <img src="https://www.dropbox.com/scl/fi/kkujm1u6y7vvnp7luq8d7/ngu-main-white.png?rlkey=kgq2uh48qh4xssh4vlbz868lr&st=481r4vh1&raw=1" alt="NGU" class="logo-img">
            <div class="logo-title">OES Performance</div>
            <div class="logo-sub">Track · Monitor · Analyse</div>
        </div>

        <div class="login-card">
            <div class="card-title">Sign In</div>

            <div class="alert alert-error" id="alertError"></div>
            <div class="alert alert-info"  id="alertInfo">Checking credentials...</div>

            <div class="form-group">
                <label for="emailInput">Email Address</label>
                <input type="email" id="emailInput" placeholder="your@email.com" autocomplete="email">
            </div>
            <div class="form-group">
                <label for="passwordInput">Password</label>
                <input type="password" id="passwordInput" placeholder="••••••••" autocomplete="current-password">
            </div>

            <button class="btn-login" id="loginBtn" onclick="handleLogin()">Sign In</button>

            <div class="footer-note">Access is restricted to authorised users only.</div>
            <div id="debugBox"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp }    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
                                    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc }
                                    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
            authDomain: "oesperformance-a54c0.firebaseapp.com",
            projectId: "oesperformance-a54c0",
            storageBucket: "oesperformance-a54c0.firebasestorage.app",
            messagingSenderId: "484894102454",
            appId: "1:484894102454:web:17535ee497eac2d90d6717"
        };

        const app  = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db   = getFirestore(app);
        const COLLECTION = 'users';

        function debug(msg, type = 'inf') {
            const box = document.getElementById('debugBox');
            box.style.display = 'block';
            box.innerHTML += `<span class="${type}">${msg}</span><br>`;
            console.log('[LOGIN]', msg);
        }

        // If already signed in, check userdatabase and redirect
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                debug('Already signed in as: ' + user.email + ' UID: ' + user.uid);
                try {
                    const userDoc = await getDoc(doc(db, COLLECTION, user.uid));
                    if (userDoc.exists()) {
                        debug('Found in userdatabase — redirecting...', 'ok');
                        window.location.href = new URLSearchParams(window.location.search).get('redirect') || 'workscreenftl.html';
                    } else {
                        debug('UID not in userdatabase — signing out', 'err');
                        await signOut(auth);
                    }
                } catch(e) {
                    debug('Firestore error: ' + e.message, 'err');
                }
            }
        });

        window.handleLogin = async function() {
            const email    = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value;
            const btn      = document.getElementById('loginBtn');
            const errorEl  = document.getElementById('alertError');
            const infoEl   = document.getElementById('alertInfo');

            document.getElementById('debugBox').innerHTML = '';

            if (!email || !password) {
                errorEl.textContent = 'Please enter your email and password.';
                errorEl.style.display = 'block';
                infoEl.style.display = 'none';
                return;
            }

            btn.disabled  = true;
            btn.innerHTML = '<span class="spinner"></span>Signing in...';
            errorEl.style.display = 'none';
            infoEl.style.display  = 'block';

            try {
                debug('Step 1: Signing in with Firebase Auth...');
                const userCred = await signInWithEmailAndPassword(auth, email, password);
                debug('Step 2: Auth OK — UID: ' + userCred.user.uid, 'ok');

                debug('Step 3: Checking collection "' + COLLECTION + '" for document ID: ' + userCred.user.uid);
                const userDoc = await getDoc(doc(db, COLLECTION, userCred.user.uid));
                debug('Step 4: Document found = ' + userDoc.exists());

                if (userDoc.exists()) {
                    // Update last login timestamp
                    await updateDoc(doc(db, COLLECTION, userCred.user.uid), {
                        lastLogin: new Date().toISOString()
                    });
                    debug('Step 5: Data = ' + JSON.stringify(userDoc.data()), 'ok');
                    debug('Step 6: Redirecting to workscreenftl.html...', 'ok');
                    infoEl.style.display = 'none';
                    window.location.href = new URLSearchParams(window.location.search).get('redirect') || 'workscreenftl.html';
                } else {
                    debug('Step 5: Document NOT found in "' + COLLECTION + '"!', 'err');
                    debug('The UID above must match a document ID in Firestore > userdatabase', 'err');
                    await signOut(auth);
                    throw new Error('no-access');
                }

            } catch (err) {
                debug('CAUGHT ERROR — code: ' + (err.code||'—') + '  message: ' + err.message, 'err');
                btn.disabled  = false;
                btn.innerHTML = 'Sign In';
                infoEl.style.display  = 'none';
                errorEl.style.display = 'block';

                if (err.code === 'auth/too-many-requests') {
                    errorEl.textContent = 'Too many failed attempts. Try again later.';
                } else if (['auth/invalid-credential','auth/wrong-password','auth/user-not-found'].includes(err.code)) {
                    errorEl.textContent = 'Incorrect email or password.';
                } else if (err.message === 'no-access') {
                    errorEl.textContent = 'Your account is not in userdatabase — check the debug info below.';
                } else {
                    errorEl.textContent = 'Error: ' + (err.code || err.message);
                }
            }
        };

        document.addEventListener('keydown', (e) => { if (e.key === 'Enter') window.handleLogin(); });
    </script>
</body>
</html>
