<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Data Export | Kaye</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --secondary: rgba(255, 255, 255, 0.1);
            --secondary-hover: rgba(255, 255, 255, 0.2);
            --accent: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            line-height: 1.5;
        }

        .dashboard-container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .category-group {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .category-group:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .category-group h2 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .checkbox-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            position: relative;
            padding-left: 35px;
            cursor: pointer;
            font-size: 1rem;
            color: var(--text-muted);
            transition: color 0.2s ease;
            user-select: none;
        }

        .checkbox-container:hover {
            color: var(--text-main);
        }

        .checkbox-container input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            height: 0;
            width: 0;
        }

        .checkmark {
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            height: 22px;
            width: 22px;
            background-color: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .checkbox-container:hover input ~ .checkmark {
            background-color: rgba(255,255,255,0.15);
        }

        .checkbox-container input:checked ~ .checkmark {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        .checkmark:after {
            content: "";
            position: absolute;
            display: none;
        }

        .checkbox-container input:checked ~ .checkmark:after {
            display: block;
        }

        .checkbox-container .checkmark:after {
            left: 7px;
            top: 3px;
            width: 6px;
            height: 11px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--card-border);
            flex-wrap: wrap;
            gap: 1rem;
        }

        .btn {
            padding: 0.875rem 2rem;
            border-radius: 12px;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-secondary {
            background-color: var(--secondary);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: var(--secondary-hover);
            transform: translateY(-1px);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
            color: white;
            box-shadow: 0 10px 20px -10px rgba(99, 102, 241, 0.5);
        }

        .btn-primary:hover {
            box-shadow: 0 15px 25px -10px rgba(99, 102, 241, 0.7);
            transform: translateY(-2px);
        }
        
        .btn-primary:active {
            transform: translateY(0);
        }
        
        #feedback {
            margin-top: 1rem;
            text-align: right;
            font-size: 0.9rem;
            color: var(--accent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        @media (max-width: 768px) {
            .dashboard-container {
                padding: 2rem;
            }
            h1 {
                font-size: 2rem;
            }
            .actions {
                flex-direction: column;
            }
            .actions .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <header>
            <h1>Monthly Finance Export</h1>
            <p class="subtitle">Select the data fields to generate your custom XLSX report.</p>
        </header>

        <form id="exportForm">
            <div class="grid-layout">
                
                <!-- Group 1 -->
                <div class="category-group">
                    <h2>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
                        Jobs & Revenue
                    </h2>
                    <div class="checkbox-list">
                        <label class="checkbox-container">
                            <input type="checkbox" name="exportField" value="Jobs completed (by division)" checked>
                            <span class="checkmark"></span>
                            Jobs completed (by division)
                        </label>
                        <label class="checkbox-container">
                            <input type="checkbox" name="exportField" value="Revenue per job" checked>
                            <span class="checkmark"></span>
                            Revenue per job
                        </label>
                    </div>
                </div>

                <!-- Group 2 -->
                <div class="category-group">
                    <h2>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                        Headcount & Availability
                    </h2>
                    <div class="checkbox-list">
                        <label class="checkbox-container">
                            <input type="checkbox" name="exportField" value="Engineer headcount" checked>
                            <span class="checkmark"></span>
                            Engineer headcount
                        </label>
                        <label class="checkbox-container">
                            <input type="checkbox" name="exportField" value="Number of engineers available" checked>
                            <span class="checkmark"></span>
                            Number of engineers available
                        </label>
                    </div>
                </div>

                <!-- Group 3 -->
                <div class="category-group">
                    <h2>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                        Time & Leave
                    </h2>
                    <div class="checkbox-list">
                        <label class="checkbox-container">
                            <input type="checkbox" name="exportField" value="Sickness" checked>
                            <span class="checkmark"></span>
                            Sickness
                        </label>
                        <label class="checkbox-container">
                            <input type="checkbox" name="exportField" value="Annual leave" checked>
                            <span class="checkmark"></span>
                            Annual leave
                        </label>
                        <label class="checkbox-container">
                            <input type="checkbox" name="exportField" value="Unpaid leave" checked>
                            <span class="checkmark"></span>
                            Unpaid leave
                        </label>
                        <label class="checkbox-container">
                            <input type="checkbox" name="exportField" value="Non-productive time" checked>
                            <span class="checkmark"></span>
                            Non-productive time
                        </label>
                    </div>
                </div>

                <!-- Group 4 -->
                <div class="category-group">
                    <h2>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                        Aborts
                    </h2>
                    <div class="checkbox-list">
                        <label class="checkbox-container">
                            <input type="checkbox" name="exportField" value="Technical aborts" checked>
                            <span class="checkmark"></span>
                            Technical aborts
                        </label>
                        <label class="checkbox-container">
                            <input type="checkbox" name="exportField" value="Customer no-shows" checked>
                            <span class="checkmark"></span>
                            Customer no-shows
                        </label>
                        <label class="checkbox-container">
                            <input type="checkbox" name="exportField" value="Other abort reasons" checked>
                            <span class="checkmark"></span>
                            Other abort reasons
                        </label>
                    </div>
                </div>

            </div>

            <div class="actions">
                <button type="button" id="toggleAllBtn" class="btn btn-secondary">Deselect All</button>
                
                <div>
                    <button type="submit" class="btn btn-primary">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        Export to XLSX
                    </button>
                    <div id="feedback">Export successful!</div>
                </div>
            </div>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.getElementById('toggleAllBtn');
            const checkboxes = document.querySelectorAll('input[name="exportField"]');
            const form = document.getElementById('exportForm');
            const feedback = document.getElementById('feedback');

            let allSelected = true;

            const updateToggleBtnState = () => {
                const checkedCount = document.querySelectorAll('input[name="exportField"]:checked').length;
                if (checkedCount === checkboxes.length) {
                    allSelected = true;
                    toggleBtn.textContent = 'Deselect All';
                } else {
                    allSelected = false;
                    toggleBtn.textContent = 'Select All';
                }
            };
            
            updateToggleBtnState();

            checkboxes.forEach(cb => {
                cb.addEventListener('change', updateToggleBtnState);
            });

            toggleBtn.addEventListener('click', () => {
                const targetState = !allSelected;
                checkboxes.forEach(cb => cb.checked = targetState);
                updateToggleBtnState();
            });

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                
                const selectedFields = [];
                document.querySelectorAll('input[name="exportField"]:checked').forEach(cb => {
                    selectedFields.push(cb.value);
                });

                if (selectedFields.length === 0) {
                    alert('Please select at least one field to export.');
                    return;
                }

                // Generate dummy data based on selections
                const data = [];
                
                // Headers
                data.push(selectedFields);

                // Mock Rows
                const mockDivisions = ['North', 'South', 'Midlands'];
                
                for(let i = 0; i < 3; i++) {
                    const row = [];
                    selectedFields.forEach(field => {
                        switch(field) {
                            case 'Jobs completed (by division)': row.push(`142 (${mockDivisions[i]})`); break;
                            case 'Revenue per job': row.push('£185.50'); break;
                            case 'Engineer headcount': row.push(Math.floor(Math.random() * 20 + 50)); break;
                            case 'Number of engineers available': row.push(Math.floor(Math.random() * 15 + 40)); break;
                            case 'Sickness': row.push(Math.floor(Math.random() * 5)); break;
                            case 'Annual leave': row.push(Math.floor(Math.random() * 10)); break;
                            case 'Unpaid leave': row.push(Math.floor(Math.random() * 3)); break;
                            case 'Non-productive time': row.push(`${Math.floor(Math.random() * 10 + 5)} hrs`); break;
                            case 'Technical aborts': row.push(Math.floor(Math.random() * 15)); break;
                            case 'Customer no-shows': row.push(Math.floor(Math.random() * 8)); break;
                            case 'Other abort reasons': row.push(Math.floor(Math.random() * 5)); break;
                            default: row.push('-');
                        }
                    });
                    data.push(row);
                }

                const ws = XLSX.utils.aoa_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Finance_Report");

                const dateStr = new Date().toISOString().split('T')[0];
                const filename = `Finance_Report_${dateStr}.xlsx`;

                XLSX.writeFile(wb, filename);

                feedback.style.opacity = 1;
                setTimeout(() => {
                    feedback.style.opacity = 0;
                }, 3000);
            });
        });
    </script>
</body>
</html>
