<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Data Export | Kaye</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --secondary: rgba(255, 255, 255, 0.1);
            --secondary-hover: rgba(255, 255, 255, 0.2);
            --accent: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            line-height: 1.5;
        }

        .dashboard-container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        header { text-align: center; margin-bottom: 2rem; }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle { color: var(--text-muted); font-size: 1.1rem; }

        .month-picker-container {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .month-picker-container input {
            padding: 0.75rem 1.5rem;
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            background: rgba(0,0,0,0.3);
            color: var(--text-main);
            outline: none;
            transition: border-color 0.3s ease;
        }

        .month-picker-container input:focus {
            border-color: var(--primary);
        }

        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .category-group {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .category-group:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .category-group h2 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .checkbox-list { display: flex; flex-direction: column; gap: 1rem; }

        .checkbox-container {
            display: flex;
            align-items: center;
            position: relative;
            padding-left: 35px;
            cursor: pointer;
            font-size: 1rem;
            color: var(--text-muted);
            transition: color 0.2s ease;
            user-select: none;
        }

        .checkbox-container:hover { color: var(--text-main); }
        .checkbox-container input { position: absolute; opacity: 0; cursor: pointer; height: 0; width: 0; }

        .checkmark {
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            height: 22px;
            width: 22px;
            background-color: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .checkbox-container:hover input ~ .checkmark { background-color: rgba(255,255,255,0.15); }
        .checkbox-container input:checked ~ .checkmark { background-color: var(--primary); border-color: var(--primary); }
        .checkmark:after { content: ""; position: absolute; display: none; }
        .checkbox-container input:checked ~ .checkmark:after { display: block; }
        .checkbox-container .checkmark:after {
            left: 7px; top: 3px; width: 6px; height: 11px;
            border: solid white; border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--card-border);
            flex-wrap: wrap;
            gap: 1rem;
        }

        .btn {
            padding: 0.875rem 2rem;
            border-radius: 12px;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary { background-color: var(--secondary); color: var(--text-main); }
        .btn-secondary:hover:not(:disabled) { background-color: var(--secondary-hover); transform: translateY(-1px); }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
            color: white;
            box-shadow: 0 10px 20px -10px rgba(99, 102, 241, 0.5);
        }

        .btn-primary:hover:not(:disabled) {
            box-shadow: 0 15px 25px -10px rgba(99, 102, 241, 0.7);
            transform: translateY(-2px);
        }
        
        .btn-primary:active:not(:disabled) { transform: translateY(0); }
        
        #feedback {
            margin-top: 1rem;
            text-align: right;
            font-size: 0.9rem;
            color: var(--accent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .dashboard-container { padding: 2rem; }
            h1 { font-size: 2rem; }
            .actions { flex-direction: column; }
            .actions .btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <header>
            <h1>Monthly Finance Export</h1>
            <p class="subtitle">Select a month and the data fields to generate your custom XLSX report.</p>
        </header>

        <form id="exportForm">
            <div class="month-picker-container">
                <input type="month" id="reportMonth" required>
            </div>

            <div class="grid-layout">
                
                <!-- Group 1 -->
                <div class="category-group">
                    <h2>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
                        Jobs & Revenue
                    </h2>
                    <div class="checkbox-list">
                        <label class="checkbox-container">
                            <input type="checkbox" name="exportField" value="Total jobs" checked>
                            <span class="checkmark"></span>
                            Total jobs
                        </label>
                        <label class="checkbox-container">
                            <input type="checkbox" name="exportField" value="Jobs completed" checked>
                            <span class="checkmark"></span>
                            Jobs completed
                        </label>
                        <label class="checkbox-container">
                            <input type="checkbox" name="exportField" value="Total meters" checked>
                            <span class="checkmark"></span>
                            Total meters
                        </label>
                        <label class="checkbox-container">
                            <input type="checkbox" name="exportField" value="Total aborts" checked>
                            <span class="checkmark"></span>
                            Total aborts
                        </label>
                        <label class="checkbox-container">
                            <input type="checkbox" name="exportField" value="Revenue per job" checked>
                            <span class="checkmark"></span>
                            Revenue per job
                        </label>
                    </div>
                </div>

                <!-- Group 2 -->
                <div class="category-group">
                    <h2>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                        Headcount & Availability
                    </h2>
                    <div class="checkbox-list">
                        <label class="checkbox-container">
                            <input type="checkbox" name="exportField" value="Engineer headcount" checked>
                            <span class="checkmark"></span>
                            Engineer headcount
                        </label>
                        <label class="checkbox-container">
                            <input type="checkbox" name="exportField" value="Number of engineers available" checked>
                            <span class="checkmark"></span>
                            Number of engineers available
                        </label>
                    </div>
                </div>

                <!-- Group 3 -->
                <div class="category-group">
                    <h2>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                        Time & Leave
                    </h2>
                    <div class="checkbox-list">
                        <label class="checkbox-container">
                            <input type="checkbox" name="exportField" value="Sickness" checked>
                            <span class="checkmark"></span>
                            Sickness
                        </label>
                        <label class="checkbox-container">
                            <input type="checkbox" name="exportField" value="Annual leave" checked>
                            <span class="checkmark"></span>
                            Annual leave
                        </label>
                        <label class="checkbox-container">
                            <input type="checkbox" name="exportField" value="Unpaid leave" checked>
                            <span class="checkmark"></span>
                            Unpaid leave
                        </label>
                        <label class="checkbox-container">
                            <input type="checkbox" name="exportField" value="Non-productive time" checked>
                            <span class="checkmark"></span>
                            Non-productive time (Working Hours)
                        </label>
                    </div>
                </div>



            </div>

            <div class="actions">
                <button type="button" id="toggleAllBtn" class="btn btn-secondary">Deselect All</button>
                
                <div>
                    <button type="submit" id="exportBtn" class="btn btn-primary">
                        <span class="spinner" id="btnSpinner"></span>
                        <svg id="btnIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        <span id="btnText">Export to XLSX</span>
                    </button>
                    <div id="feedback">Export successful!</div>
                </div>
            </div>
        </form>
    </div>

    <!-- Firebase SDK Setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
            authDomain: "oesperformance-a54c0.firebaseapp.com",
            projectId: "oesperformance-a54c0",
            storageBucket: "oesperformance-a54c0.firebasestorage.app",
            messagingSenderId: "484894102454",
            appId: "1:484894102454:web:17535ee497eac2d90d6717"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.addEventListener('DOMContentLoaded', () => {
            // Set default month to current month
            const today = new Date();
            const currentMonth = today.toISOString().substring(0, 7);
            document.getElementById('reportMonth').value = currentMonth;

            const toggleBtn = document.getElementById('toggleAllBtn');
            const checkboxes = document.querySelectorAll('input[name="exportField"]');
            const form = document.getElementById('exportForm');
            const feedback = document.getElementById('feedback');
            const exportBtn = document.getElementById('exportBtn');
            const btnSpinner = document.getElementById('btnSpinner');
            const btnIcon = document.getElementById('btnIcon');
            const btnText = document.getElementById('btnText');

            let allSelected = true;

            const updateToggleBtnState = () => {
                const checkedCount = document.querySelectorAll('input[name="exportField"]:checked').length;
                if (checkedCount === checkboxes.length) {
                    allSelected = true;
                    toggleBtn.textContent = 'Deselect All';
                } else {
                    allSelected = false;
                    toggleBtn.textContent = 'Select All';
                }
            };
            
            updateToggleBtnState();

            checkboxes.forEach(cb => {
                cb.addEventListener('change', updateToggleBtnState);
            });

            toggleBtn.addEventListener('click', () => {
                const targetState = !allSelected;
                checkboxes.forEach(cb => cb.checked = targetState);
                updateToggleBtnState();
            });

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const selectedFields = Array.from(document.querySelectorAll('input[name="exportField"]:checked')).map(cb => cb.value);
                const monthStr = document.getElementById('reportMonth').value;

                if (selectedFields.length === 0) {
                    alert('Please select at least one field to export.');
                    return;
                }

                if (!monthStr) {
                    alert('Please select a month.');
                    return;
                }

                // UI Loading State
                exportBtn.disabled = true;
                btnSpinner.style.display = 'block';
                btnIcon.style.display = 'none';
                btnText.textContent = 'Gathering Data...';

                try {
                    const startDate = `${monthStr}-01`;
                    // Calculate end date of the month
                    const [yyyy, mm] = monthStr.split('-');
                    const lastDay = new Date(yyyy, mm, 0).getDate();
                    const endDate = `${monthStr}-${lastDay}`;

                    // Data structures for aggregation
                    let totalJobs = 0;
                    let totalJobsCompleted = 0;
                    let totalValue = 0;
                    let totalMeters = 0;
                    let totalAbortsPerf = 0;
                    let uniqueEngineers = new Set();
                    let totalSickness = 0;
                    let totalHoliday = 0;
                    let totalUnpaid = 0;
                    let totalWorkingMinutes = 0;
                    let totalDaysRecorded = 0;
                    let totalDaysWorked = 0;
                    let totalKrakenHeadcount = 0;
                    let krakenHeadcountDays = 0;

                    // 0. Fetch Sureserve Engineers
                    const staffQuery = query(collection(db, "Establishment Report"), where("_type", "==", "staff"));
                    const staffSnap = await getDocs(staffQuery);
                    const sureserveEngineers = new Set();
                    staffSnap.forEach(doc => {
                        const data = doc.data();
                        if (data.contract === 'Sureserve OES') {
                            if (data.name) sureserveEngineers.add(data.name.trim().toLowerCase());
                        }
                    });

                    // Helper to check if engineer is Sureserve
                    const isSureserve = (name) => {
                        return name && sureserveEngineers.has(name.trim().toLowerCase());
                    };

                    // 1. Fetch Performance Data
                    if (selectedFields.includes('Total jobs') || selectedFields.includes('Jobs completed') || selectedFields.includes('Total meters') || selectedFields.includes('Total aborts') || selectedFields.includes('Revenue per job') || selectedFields.includes('Engineer headcount') || selectedFields.includes('Number of engineers available')) {
                        const perfQuery = query(
                            collection(db, "performance"),
                            where("date", ">=", startDate),
                            where("date", "<=", endDate)
                        );
                        const perfSnap = await getDocs(perfQuery);
                        perfSnap.forEach(doc => {
                            const data = doc.data();
                            // Calculate these totals for ALL engineers to match display.html
                            totalJobs += Number(data.jobs || 0);
                            totalJobsCompleted += Number(data.completed || 0);
                            totalMeters += Number(data.meters || 0);
                            totalAbortsPerf += Number(data.aborted || 0);
                            totalValue += Number(data.value || 0);
                            
                            // Only count Sureserve engineers for the Headcount
                            if (isSureserve(data.engineerName) && data.engineerName) {
                                uniqueEngineers.add(data.engineerName.trim().toLowerCase());
                            }
                        });
                    }

                    // 2. Fetch Attendance Data
                    if (selectedFields.includes('Sickness') || selectedFields.includes('Annual leave') || selectedFields.includes('Unpaid leave') || selectedFields.includes('Number of engineers available')) {
                        const attQuery = query(
                            collection(db, "attendance"),
                            where("date", ">=", startDate),
                            where("date", "<=", endDate)
                        );
                        const attSnap = await getDocs(attQuery);
                        let uniqueDates = new Set();

                        attSnap.forEach(doc => {
                            const data = doc.data();
                            if (!isSureserve(data.engineerName)) return;
                            uniqueDates.add(data.date);
                            const att = data.attendance;
                            if (att === 'Sick') totalSickness++;
                            if (att === 'H' || att === 'H/H') totalHoliday++;
                            if (att === 'AAUP') totalUnpaid++;
                            if (att === 'X') totalDaysWorked++;
                        });
                        totalDaysRecorded = uniqueDates.size || 21; // Fallback to 21 working days if no data
                    }

                    // 3. Fetch Working Hours Data (Non-productive time)
                    if (selectedFields.includes('Non-productive time')) {
                        const workQuery = query(
                            collection(db, "working hours"),
                            where("queryDate", ">=", startDate),
                            where("queryDate", "<=", endDate)
                        );
                        const workSnap = await getDocs(workQuery);
                        workSnap.forEach(doc => {
                            const data = doc.data();
                            if (!isSureserve(data.engineerName)) return;
                            totalWorkingMinutes += data.durationMins || 0;
                        });
                    }


                    // 5. Fetch Kraken Headcount Data
                    if (selectedFields.includes('Number of engineers available')) {
                        const hcQuery = query(
                            collection(db, "KrakenAM Headcount"),
                            where("date", ">=", startDate),
                            where("date", "<=", endDate)
                        );
                        const hcSnap = await getDocs(hcQuery);
                        hcSnap.forEach(doc => {
                            const data = doc.data();
                            totalKrakenHeadcount += (data.headcount || 0);
                            krakenHeadcountDays++;
                        });
                    }

                    // Build Excel Rows
                    const excelData = [];
                    excelData.push(["Metric", "Value"]);

                    if (selectedFields.includes('Total jobs')) {
                        excelData.push(["Total Jobs", totalJobs]);
                    }
                    if (selectedFields.includes('Jobs completed')) {
                        excelData.push(["Completed Jobs", totalJobsCompleted]);
                    }
                    if (selectedFields.includes('Total meters')) {
                        excelData.push(["Total Meters", totalMeters]);
                    }
                    if (selectedFields.includes('Total aborts')) {
                        excelData.push(["Total Aborts", totalAbortsPerf]);
                    }
                    if (selectedFields.includes('Revenue per job')) {
                        const revPerJob = totalJobsCompleted > 0 ? (totalValue / totalJobsCompleted) : 0;
                        excelData.push(["Revenue per Job", `£${revPerJob.toFixed(2)}`]);
                    }
                    if (selectedFields.includes('Engineer headcount')) {
                        excelData.push(["Engineer Headcount", uniqueEngineers.size]);
                    }
                    if (selectedFields.includes('Number of engineers available')) {
                        const avgAvailable = krakenHeadcountDays > 0 ? (totalKrakenHeadcount / krakenHeadcountDays) : 0;
                        excelData.push(["Avg. Daily Engineers Available", avgAvailable.toFixed(1)]);
                    }
                    if (selectedFields.includes('Sickness')) {
                        excelData.push(["Sickness (Days)", totalSickness]);
                    }
                    if (selectedFields.includes('Annual leave')) {
                        excelData.push(["Annual Leave (Days)", totalHoliday]);
                    }
                    if (selectedFields.includes('Unpaid leave')) {
                        excelData.push(["Unpaid Leave (Days)", totalUnpaid]);
                    }
                    if (selectedFields.includes('Non-productive time')) {
                        const totalHours = (totalWorkingMinutes / 60).toFixed(1);
                        const payableHours = totalDaysWorked * 8;
                        const unproductiveHours = (payableHours - (totalWorkingMinutes / 60)).toFixed(1);
                        
                        excelData.push(["Total Days Worked", totalDaysWorked]);
                        excelData.push(["Total Payable Hours (Days Worked x 8)", payableHours]);
                        excelData.push(["Total Working Hours (Tracker)", `${totalHours} hrs`]);
                        excelData.push(["Unproductive Hours", `${unproductiveHours} hrs`]);
                    }
                    


                    const ws = XLSX.utils.aoa_to_sheet(excelData);
                    
                    // Column widths
                    ws['!cols'] = [{ wch: 40 }, { wch: 20 }];

                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, "Finance_Report");

                    const filename = `Finance_Report_${monthStr}.xlsx`;
                    XLSX.writeFile(wb, filename);

                    feedback.textContent = 'Export successful!';
                    feedback.style.color = 'var(--accent)';
                    feedback.style.opacity = 1;
                    setTimeout(() => {
                        feedback.style.opacity = 0;
                    }, 3000);

                } catch (error) {
                    console.error("Export Error: ", error);
                    let errMessage = error.message;
                    if (errMessage.includes('index')) {
                        const urlMatch = errMessage.match(/https:\/\/[^\s]+/);
                        if (urlMatch) {
                            alert('Firestore Index Required. Please check the browser console for the index link, create it, wait 2 minutes, and try again.');
                            console.log('CREATE INDEX HERE:', urlMatch[0]);
                        } else {
                            alert('Firestore index error.');
                        }
                    } else {
                        alert(`An error occurred: ${errMessage}`);
                    }
                    
                    feedback.textContent = 'Export failed.';
                    feedback.style.color = '#ef4444';
                    feedback.style.opacity = 1;
                } finally {
                    // Reset UI State
                    exportBtn.disabled = false;
                    btnSpinner.style.display = 'none';
                    btnIcon.style.display = 'inline-block';
                    btnText.textContent = 'Export to XLSX';
                }
            });
        });
    </script>
</body>
</html>
