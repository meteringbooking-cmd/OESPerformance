<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills Matrix - OES Performance</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Barlow:wght@300;400;600;700;900&family=Barlow+Condensed:wght@600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:        #080C14;
            --surface:   #0E1520;
            --border:    #1C2A3A;
            --border-hi: #2A3F55;
            --amber:     #F5A623;
            --amber-dim: #C07B10;
            --cyan:      #2BE4C3;
            --text:      #E8EDF4;
            --text-mid:  #9DB0C4;
            --text-dim:  #5C7690;
            --text-faint:#3D5168;
            --danger:    #FF5757;
            --success:   #2BE4C3;
            --warning:   #F5A623;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { height: 100%; }

        body {
            font-family: 'Barlow', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(245,166,35,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(245,166,35,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            top: -200px; left: 50%;
            transform: translateX(-50%);
            width: 800px; height: 600px;
            background: radial-gradient(ellipse, rgba(245,166,35,0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* ── TOPBAR ── */
        .topbar {
            position: relative; z-index: 10;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 48px; height: 64px;
            border-bottom: 1px solid var(--border);
            background: rgba(8,12,20,0.9);
            backdrop-filter: blur(12px);
            animation: fadeDown 0.6s ease both;
        }
        .topbar-brand { display: flex; align-items: center; gap: 12px; }
        .brand-mark {
            width: 32px; height: 32px;
            background: var(--amber);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }
        .brand-name {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 1.25rem; font-weight: 700;
            letter-spacing: 0.12em; text-transform: uppercase; color: var(--text);
        }
        .brand-name span { color: var(--amber); }
        .topbar-right { display: flex; align-items: center; gap: 20px; }
        .back-link {
            font-family: 'DM Mono', monospace; font-size: 0.72rem;
            letter-spacing: 0.1em; text-transform: uppercase;
            color: var(--text-mid); text-decoration: none;
            border: 1px solid var(--border); padding: 0.35rem 0.8rem;
            border-radius: 4px; transition: all 0.2s ease;
        }
        .back-link:hover { color: var(--amber); border-color: var(--amber); }

        /* ── PAGE HERO ── */
        .hero {
            position: relative; z-index: 10;
            padding: 48px 48px 32px;
            animation: fadeUp 0.7s ease 0.1s both;
        }
        .hero-label {
            font-family: 'DM Mono', monospace; font-size: 0.7rem;
            letter-spacing: 0.18em; text-transform: uppercase;
            color: var(--amber); margin-bottom: 12px;
            display: flex; align-items: center; gap: 10px;
        }
        .hero-label::before { content: ''; display: block; width: 24px; height: 1px; background: var(--amber); }
        .hero-title {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: clamp(2rem, 4vw, 3.2rem); font-weight: 900;
            line-height: 0.95; letter-spacing: -0.01em;
            text-transform: uppercase; color: var(--text); margin-bottom: 12px;
        }
        .hero-title em { font-style: normal; color: var(--amber); }
        .hero-sub { font-size: 0.95rem; font-weight: 300; color: var(--text-mid); }

        /* ── CONTENT WRAPPER ── */
        .content {
            position: relative; z-index: 10;
            padding: 0 48px 48px;
            flex: 1;
        }

        /* ── CONTROLS BAR ── */
        .controls-bar {
            display: flex; align-items: flex-end; gap: 16px;
            flex-wrap: wrap;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 20px;
            animation: fadeUp 0.6s ease 0.2s both;
        }
        .ctrl-group { display: flex; flex-direction: column; gap: 8px; }
        .ctrl-label {
            font-family: 'DM Mono', monospace; font-size: 0.65rem;
            letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-dim);
        }
        .ctrl-input {
            background: var(--bg); border: 1px solid var(--border);
            color: var(--text); padding: 0.6rem 1rem;
            border-radius: 6px; font-family: 'DM Mono', monospace;
            font-size: 0.85rem; transition: border 0.2s;
            min-width: 220px;
        }
        .ctrl-input:focus { outline: none; border-color: var(--amber); }
        .ctrl-actions { display: flex; gap: 10px; align-items: flex-end; margin-left: auto; }

        /* ── LEGEND / STATS ── */
        .stat-row {
            display: flex; gap: 12px; flex-wrap: wrap;
            margin-bottom: 20px;
            animation: fadeUp 0.6s ease 0.22s both;
        }
        .stat-chip {
            display: flex; align-items: center; gap: 10px;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 10px; padding: 12px 18px;
        }
        .stat-chip .n {
            font-family: 'DM Mono', monospace; font-weight: 500; font-size: 1.3rem;
        }
        .stat-chip .l {
            font-family: 'DM Mono', monospace; font-size: 0.65rem;
            letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim);
        }
        .stat-chip.overdue .n { color: var(--danger); }
        .stat-chip.soon .n { color: var(--amber); }
        .stat-chip.booked .n { color: var(--cyan); }
        .stat-chip.attended .n { color: #C89BFF; }

        /* ── MESSAGE ── */
        .message {
            padding: 12px 16px; border-radius: 8px;
            font-family: 'DM Mono', monospace; font-size: 0.8rem;
            margin-bottom: 16px; display: none;
            animation: fadeUp 0.3s ease both;
        }
        .message.show { display: block; }
        .message.success { background: rgba(43,228,195,0.1); color: var(--cyan); border: 1px solid rgba(43,228,195,0.3); }
        .message.error   { background: rgba(255,87,87,0.1); color: var(--danger); border: 1px solid rgba(255,87,87,0.3); }
        .message.warning { background: rgba(245,166,35,0.1); color: var(--amber); border: 1px solid rgba(245,166,35,0.3); }

        /* ── TABLE ── */
        .table-wrap {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px; overflow: hidden;
            animation: fadeUp 0.6s ease 0.3s both;
        }
        .table-scroll { overflow-x: auto; }

        table { width: 100%; border-collapse: collapse; }
        thead th {
            background: var(--bg);
            padding: 12px 10px;
            text-align: left;
            font-family: 'DM Mono', monospace;
            font-size: 0.62rem; letter-spacing: 0.1em;
            text-transform: uppercase; color: var(--text-dim);
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        thead th:first-child { padding-left: 20px; position: sticky; left: 0; background: var(--bg); z-index: 2; }

        tbody tr {
            border-bottom: 1px solid rgba(42,63,85,0.75);
            transition: background 0.15s;
        }
        tbody tr:nth-child(even) { background: rgba(255,255,255,0.018); }
        tbody tr:nth-child(even) td:first-child { background: #101927; }
        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background: rgba(245,166,35,0.06); }
        tbody tr:hover td:first-child { background: #16202f; }

        td {
            padding: 8px 10px;
            vertical-align: middle;
            font-size: 0.85rem;
            white-space: nowrap;
        }
        td:first-child {
            padding-left: 20px;
            position: sticky; left: 0;
            background: var(--surface);
            z-index: 1;
        }

        .eng-name { font-weight: 600; color: var(--text); font-size: 0.9rem; }
        .eng-ref { font-family: 'DM Mono', monospace; font-size: 0.74rem; color: var(--text-mid); }

        .qual-cell {
            display: inline-flex; align-items: center; gap: 6px;
            background: transparent; border: 1px solid transparent;
            border-radius: 6px; padding: 5px 9px;
            font-family: 'DM Mono', monospace; font-size: 0.82rem;
            color: var(--text-mid); cursor: pointer;
            transition: all 0.15s;
        }
        .qual-cell:hover { border-color: var(--border-hi); background: rgba(255,255,255,0.03); }
        .qual-cell.ok { color: var(--text); font-weight: 500; }
        .qual-cell.soon { color: var(--amber); font-weight: 600; }
        .qual-cell.overdue { color: var(--danger); font-weight: 700; }
        .qual-cell.empty { color: var(--text-faint); font-style: italic; }
        .qual-cell.st-booked { background: rgba(43,228,195,0.08); border-color: rgba(43,228,195,0.35); color: var(--cyan); }
        .qual-cell.st-attended { background: rgba(200,155,255,0.1); border-color: rgba(200,155,255,0.4); color: #C89BFF; }

        /* ── LOADING ── */
        .loading-state {
            padding: 60px; text-align: center;
            color: var(--text-dim); font-family: 'DM Mono', monospace; font-size: 0.82rem;
        }
        .spinner {
            display: inline-block; width: 20px; height: 20px;
            border: 2px solid var(--border); border-top-color: var(--amber);
            border-radius: 50%; animation: spin 0.7s linear infinite;
            margin-right: 10px; vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeDown { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

        /* ── MODAL ── */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(5,8,14,0.75);
            backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center;
            z-index: 100; padding: 20px;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: var(--surface); border: 1px solid var(--border-hi);
            border-radius: 14px; width: 100%; max-width: 440px;
            padding: 28px; animation: fadeUp 0.25s ease both;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .modal-eyebrow {
            font-family: 'DM Mono', monospace; font-size: 0.65rem;
            letter-spacing: 0.15em; text-transform: uppercase; color: var(--amber);
            margin-bottom: 6px;
        }
        .modal-title {
            font-family: 'Barlow Condensed', sans-serif; font-size: 1.4rem;
            font-weight: 700; text-transform: uppercase; margin-bottom: 4px;
        }
        .modal-sub {
            font-family: 'DM Mono', monospace; font-size: 0.72rem;
            color: var(--text-mid); margin-bottom: 20px;
        }
        .modal-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 0; border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
        }
        .modal-row .k { color: var(--text-mid); }
        .modal-row .v { font-family: 'DM Mono', monospace; font-weight: 500; }
        .modal-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .modal-btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 0.7rem 1rem; border-radius: 8px; border: none;
            font-family: 'Barlow Condensed', sans-serif; font-size: 0.9rem;
            font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
            cursor: pointer; transition: all 0.15s;
        }
        .modal-btn.primary { background: var(--amber); color: #080C14; }
        .modal-btn.primary:hover { background: #FFB93A; }
        .modal-btn.success { background: var(--cyan); color: #080C14; }
        .modal-btn.success:hover { background: #52EDD3; }
        .modal-btn.danger { background: transparent; border: 1px solid rgba(255,87,87,0.4); color: var(--danger); }
        .modal-btn.danger:hover { background: rgba(255,87,87,0.1); }
        .modal-btn.ghost { background: transparent; border: 1px solid var(--border-hi); color: var(--text-mid); }
        .modal-btn.ghost:hover { border-color: var(--text-mid); color: var(--text); }
        .modal-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .modal-date-picker { display: none; flex-direction: column; gap: 10px; margin-top: 6px; }
        .modal-date-picker.show { display: flex; }
        .modal-close {
            position: absolute; top: 18px; right: 20px;
            background: none; border: none; color: var(--text-dim);
            font-size: 1.3rem; cursor: pointer; line-height: 1;
        }
        .modal-close:hover { color: var(--text); }
        .modal-box { position: relative; }
        .history-log {
            margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--border);
            max-height: 120px; overflow-y: auto;
        }
        .history-log .h-item {
            font-family: 'DM Mono', monospace; font-size: 0.68rem;
            color: var(--text-dim); padding: 3px 0;
        }

        @media (max-width: 768px) {
            .topbar, .hero, .content { padding-left: 20px; padding-right: 20px; }
            .hero { padding-top: 32px; }
            .ctrl-actions { margin-left: 0; }
        }
    </style>
</head>

                <button class="modal-btn primary" id="datePickerConfirmBtn">Confirm</button>
                <button class="modal-btn ghost" onclick="cancelDatePicker()">Back</button>
            </div>

            <div class="history-log" id="historyLog" style="display:none;">
                <div id="historyItems"></div>
            </div>
        </div>
    </div>

        function showMessage(text, type) {
            const el = document.getElementById('message');
            el.textContent = text;
            el.className = `message ${type} show`;
            setTimeout(() => { el.className = 'message'; }, 5000);
        }

        // ── Load (and seed if empty) ──
        async function loadMatrix() {
            try {
                const snap = await getDocs(collection(db, MATRIX_COLLECTION));
                if (snap.empty) {
                    await seedFromSpreadsheet();
                    return loadMatrix();
                }
                engineers = [];
                snap.forEach(d => engineers.push({ id: d.id, ...d.data() }));
                engineers.sort((a, b) => a.engineerName.localeCompare(b.engineerName));
                render();
            } catch (err) {
                console.error('Error loading skills matrix:', err);
                document.getElementById('loadingDiv').innerHTML = 'Error loading skills matrix. Check the browser console.';
            }
        }

        async function seedFromSpreadsheet() {
            showMessage('First run — seeding skills matrix from the spreadsheet…', 'warning');
            const batch = writeBatch(db);
            SEED_DATA.forEach(rec => {
                const ref = doc(db, MATRIX_COLLECTION, rec.id);
                batch.set(ref, {
                    engineerName: rec.engineerName,
                    eusr: rec.eusr,
                    gasSafe: rec.gasSafe,
                    quals: rec.quals
                });
            });
            await batch.commit();
        }

        // ── Date helpers ──
        function parseISO(iso) {
            if (!iso) return null;
            const [y, m, d] = iso.split('-').map(Number);
            return new Date(y, m - 1, d);
        }
        function formatDisplay(iso) {
            const d = parseISO(iso);
            if (!d) return '—';
            return d.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }
        function formatDisplayLong(iso) {
            const d = parseISO(iso);
            if (!d) return '—';
            return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
        }
        function todayISO() {
            const d = new Date();
            return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        }
        function qualStatus(iso) {
            const d = parseISO(iso);
            if (!d) return 'empty';
            const now = new Date(); now.setHours(0,0,0,0);
            const cutoff = new Date(now); cutoff.setMonth(cutoff.getMonth() + 6);
            if (d < now) return 'overdue';
            if (d <= cutoff) return 'soon';
            return 'ok';
        }

        // ── Render ──
        function render() {
            renderStats();
            renderHead();
            renderBody();
            document.getElementById('loadingDiv').style.display = 'none';
            document.getElementById('tableContainer').style.display = 'block';
        }

        // Display column order mirrors the spreadsheet: Gas Safe sits between
        // NPG expiry and Expiry, as a plain reference number (not a qual with a workflow).
        const DISPLAY_COLS = (() => {
            const cols = QUAL_COLS.map(k => ({ type: 'qual', key: k }));
            const idx = QUAL_COLS.indexOf('Expiry');
            cols.splice(idx, 0, { type: 'static', key: 'gasSafe', label: 'Gas Safe' });
            return cols;
        })();

        function renderStats() {
            let overdue = 0, booked = 0, attended = 0;
            const affected = new Set();
            engineers.forEach(eng => {
                QUAL_COLS.forEach(q => {
                    const qual = eng.quals?.[q];
                    if (!qual) return;
                    const st = qualStatus(qual.expiry);
                    if (st === 'overdue') { overdue++; affected.add(eng.id); }
                    else if (st === 'soon') { affected.add(eng.id); }
                    if (qual.assessment?.status === 'booked') booked++;
                    if (qual.assessment?.status === 'attended') attended++;
                });
            });
            const row = document.getElementById('statRow');
            row.innerHTML = `
                <div class="stat-chip overdue"><span class="n">${overdue}</span><span class="l">Overdue</span></div>
                <div class="stat-chip soon"><span class="n">${affected.size}</span><span class="l">Engineers Affected</span></div>
                <div class="stat-chip booked"><span class="n">${booked}</span><span class="l">Assessments booked</span></div>
                <div class="stat-chip attended"><span class="n">${attended}</span><span class="l">Awaiting result</span></div>
            `;
        }

        function renderHead() {
            const tr = document.getElementById('tableHeadRow');
            let html = '<th>Engineer</th><th>EUSR</th>';
            DISPLAY_COLS.forEach(c => { html += `<th>${c.type === 'static' ? c.label : c.key}</th>`; });
            tr.innerHTML = html;
        }

        function renderBody() {
            const tbody = document.getElementById('matrixBody');
            tbody.innerHTML = '';
            const filtered = engineers.filter(e =>
                !filterText || e.engineerName.toLowerCase().includes(filterText)
            );
            if (!filtered.length) {
                tbody.innerHTML = `<tr><td colspan="${DISPLAY_COLS.length + 2}" style="text-align:center; color:var(--text-dim); padding:30px;">No engineers match that filter.</td></tr>`;
                return;
            }
            filtered.forEach(eng => {
                const tr = document.createElement('tr');
                let html = `<td><div class="eng-name">${eng.engineerName}</div></td>`;
                html += `<td class="eng-ref">${eng.eusr || '—'}</td>`;
                DISPLAY_COLS.forEach(c => {
                    html += c.type === 'static'
                        ? `<td class="eng-ref">${eng[c.key] || '—'}</td>`
                        : `<td>${renderQualCell(eng, c.key)}</td>`;
                });
                tr.innerHTML = html;
                tbody.appendChild(tr);
            });
            // wire click handlers
            tbody.querySelectorAll('[data-eng][data-qual]').forEach(el => {
                el.addEventListener('click', () => openModal(el.getAttribute('data-eng'), el.getAttribute('data-qual')));
            });
        }

        function renderQualCell(eng, qualKey) {
            const qual = eng.quals?.[qualKey] || { expiry: null, assessment: null };
            const assessment = qual.assessment;
            let cls = 'qual-cell';
            let label;
            if (assessment?.status === 'booked') {
                cls += ' st-booked';
                label = `📅 Booked ${formatDisplay(assessment.date)}`;
            } else if (assessment?.status === 'attended') {
                cls += ' st-attended';
                label = `⏳ Attended, pending`;
            } else {
                const st = qualStatus(qual.expiry);
                cls += ' ' + st;
                label = qual.expiry ? formatDisplay(qual.expiry) : '— add —';
            }
            return `<span class="${cls}" data-eng="${eng.id}" data-qual="${encodeURIComponent(qualKey)}">${label}</span>`;
        }

        // ── Modal ──
        window.closeModal = function () {
            document.getElementById('modalOverlay').classList.remove('show');
            modalCtx = null;
            hideDatePicker();
        };

        function openModal(engId, qualKeyEncoded) {
            const qualKey = decodeURIComponent(qualKeyEncoded);
            const eng = engineers.find(e => e.id === engId);
            if (!eng) return;
            modalCtx = { engineerId: engId, qualKey };
            renderModal();
            document.getElementById('modalOverlay').classList.add('show');
        }

        function currentQual() {
            const eng = engineers.find(e => e.id === modalCtx.engineerId);
            return eng.quals?.[modalCtx.qualKey] || { expiry: null, assessment: null, history: [] };
        }

        function renderModal() {
            const eng = engineers.find(e => e.id === modalCtx.engineerId);
            const qual = currentQual();
            document.getElementById('modalEyebrow').textContent = modalCtx.qualKey;
            document.getElementById('modalTitle').textContent = eng.engineerName;
            document.getElementById('modalSub').textContent = `EUSR ${eng.eusr || '—'}`;
            document.getElementById('modalExpiry').textContent = qual.expiry ? formatDisplayLong(qual.expiry) : 'No date on file';

            const assessRow = document.getElementById('modalAssessRow');
            const assessLabel = document.getElementById('modalAssessLabel');
            const assessValue = document.getElementById('modalAssessValue');
            const actions = document.getElementById('modalActions');
            actions.innerHTML = '';
            hideDatePicker();

            const status = qual.assessment?.status || 'none';

            if (status === 'none') {
                assessRow.style.display = 'none';
                actions.innerHTML = `<button class="modal-btn primary" id="btnBook">📅 Book Assessment</button>`;
                document.getElementById('btnBook').addEventListener('click', () => showDatePicker({
                    label: 'Assessment date',
                    confirmLabel: 'Confirm Booking',
                    min: todayISO(),
                    onConfirm: (dateVal) => saveAssessment({ date: dateVal, status: 'booked' }, null, 'booked', dateVal)
                }));
            } else if (status === 'booked') {
                assessRow.style.display = 'flex';
                assessLabel.textContent = 'Assessment booked';
                assessValue.textContent = formatDisplayLong(qual.assessment.date);
                actions.innerHTML = `
                    <button class="modal-btn success" id="btnAttended">✅ Confirm Attendance</button>
                    <button class="modal-btn danger" id="btnCancelBooking">Cancel Booking</button>
                `;
                document.getElementById('btnAttended').addEventListener('click', () =>
                    saveAssessment({ date: qual.assessment.date, status: 'attended' }, null, 'attended', qual.assessment.date));
                document.getElementById('btnCancelBooking').addEventListener('click', () =>
                    saveAssessment(null, null, 'cancelled', qual.assessment.date));
            } else if (status === 'attended') {
                assessRow.style.display = 'flex';
                assessLabel.textContent = 'Attended on';
                assessValue.textContent = formatDisplayLong(qual.assessment.date);
                actions.innerHTML = `
                    <button class="modal-btn success" id="btnPass">✅ Confirm Pass</button>
                    <button class="modal-btn danger" id="btnFail">❌ Confirm Fail</button>
                `;
                document.getElementById('btnPass').addEventListener('click', () => showDatePicker({
                    label: 'New expiry date',
                    confirmLabel: 'Save Pass',
                    min: todayISO(),
                    onConfirm: (dateVal) => saveAssessment(null, dateVal, 'passed', qual.assessment.date)
                }));
                document.getElementById('btnFail').addEventListener('click', () => showDatePicker({
                    label: 'New assessment date',
                    confirmLabel: 'Save & Rebook',
                    min: todayISO(),
                    onConfirm: (dateVal) => saveAssessment({ date: dateVal, status: 'booked' }, null, 'failed', qual.assessment.date, dateVal)
                }));
            }

            renderHistory(qual);
        }

        function renderHistory(qual) {
            const wrap = document.getElementById('historyLog');
            const items = document.getElementById('historyItems');
            const history = qual.history || [];
            if (!history.length) { wrap.style.display = 'none'; return; }
            wrap.style.display = 'block';
            items.innerHTML = history.slice().reverse().slice(0, 8).map(h =>
                `<div class="h-item">${formatDisplay(h.at?.slice(0,10))} — ${h.note}</div>`
            ).join('');
        }

        // ── Date picker sub-panel ──
        let pendingConfirm = null;
        function showDatePicker({ label, confirmLabel, min, onConfirm }) {
            document.getElementById('modalActions').style.display = 'none';
            const block = document.getElementById('datePickerBlock');
            document.getElementById('datePickerLabel').textContent = label;
            const input = document.getElementById('datePickerInput');
            input.value = '';
            if (min) input.min = min;
            const btn = document.getElementById('datePickerConfirmBtn');
            btn.textContent = confirmLabel;
            pendingConfirm = onConfirm;
            btn.onclick = () => {
                if (!input.value) { showMessage('Please choose a date.', 'error'); return; }
                pendingConfirm(input.value);
            };
            block.classList.add('show');
        }
        window.cancelDatePicker = function () {
            hideDatePicker();
        };
        function hideDatePicker() {
            document.getElementById('datePickerBlock').classList.remove('show');
            document.getElementById('modalActions').style.display = 'flex';
        }

        // ── Persist ──
        async function saveAssessment(newAssessment, newExpiry, actionType, assessmentDateForLog, rebookDateForLog) {
            const eng = engineers.find(e => e.id === modalCtx.engineerId);
            const qualKey = modalCtx.qualKey;
            const qual = eng.quals[qualKey] || { expiry: null, assessment: null, history: [] };

            const notes = {
                booked: `Assessment booked for ${formatDisplay(assessmentDateForLog)}`,
                attended: `Marked attended (assessment ${formatDisplay(assessmentDateForLog)})`,
                cancelled: `Booking cancelled (was ${formatDisplay(assessmentDateForLog)})`,
                passed: `Passed — expiry set to ${formatDisplay(newExpiry)}`,
                failed: `Failed assessment — rebooked for ${formatDisplay(rebookDateForLog)}`
            };

            const updatedQual = {
                expiry: newExpiry || qual.expiry || null,
                assessment: newAssessment,
                history: [...(qual.history || []), { at: new Date().toISOString(), note: notes[actionType] || actionType }]
            };

            const updatedQuals = { ...eng.quals, [qualKey]: updatedQual };

            try {
                await updateDoc(doc(db, MATRIX_COLLECTION, eng.id), { quals: updatedQuals });
                eng.quals = updatedQuals;
                render();
                renderModal();
                showMessage('Saved.', 'success');
            } catch (err) {
                console.error(err);
                showMessage('Error saving — please try again.', 'error');
            }
        }

        // ── Search ──
        document.getElementById('searchInput').addEventListener('input', (e) => {
            filterText = e.target.value.trim().toLowerCase();
            renderBody();
        });

        loadMatrix();
    </script>
</body>
</html>
