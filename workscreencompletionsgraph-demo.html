<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Completion % Dashboard • OES</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --accent: #10b981; --text: #e2e8f0; --text-dim: #94a3b8; --border: #334155; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: grid; grid-template-columns: 280px 1fr; }
    
    /* Sidebar Styles */
    aside { background: var(--card); border-right: 1px solid var(--border); padding: 2rem 1.5rem; height: 100vh; position: sticky; top: 0; }
    .logo { font-size: 1.6rem; font-weight: 700; background: linear-gradient(90deg, var(--accent), #34d399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 2.5rem; text-align: center; }
    h2 { font-size: 1.1rem; color: var(--text-dim); margin: 1.8rem 0 0.9rem; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
    .period-btn, .team-btn { display: block; width: 100%; padding: 0.95rem 1.2rem; margin: 0.4rem 0; background: transparent; border: 1px solid var(--border); border-radius: 10px; color: var(--text); text-align: left; cursor: pointer; transition: all 0.18s ease; font-size: 0.97rem; }
    .period-btn.active, .team-btn.active { background: var(--accent); color: white; border-color: var(--accent); font-weight: 600; }

    /* Main Area */
    main { padding: 2.5rem 3rem; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    h1 { font-size: 2.1rem; }
    .stats-box { background: rgba(16,185,129,0.15); border: 1px solid var(--accent); border-radius: 12px; padding: 1rem 2rem; text-align: center; }
    .stats-value { font-size: 2.5rem; font-weight: 700; color: var(--accent); }
    .card { background: var(--card); border-radius: 16px; border: 1px solid var(--border); padding: 2rem; height: 600px; }
  </style>
</head>
<body>

<aside>
  <div class="logo">OES Completion</div>
  <h2>Time Period</h2>
  <button class="period-btn active">15 Working Days</button>
  <button class="period-btn">Month View</button>
  <h2>Team Leader</h2>
  <button class="team-btn active" onclick="updateChart()">All Teams</button>
  <button class="team-btn" onclick="updateChart()">Richard Wiecko</button>
  <button class="team-btn" onclick="updateChart()">Scott Carson</button>
  <button class="team-btn" onclick="updateChart()">Scott Carson - Scot</button>
  <button class="team-btn" onclick="updateChart()">Stuart Whyte</button>
  <button class="team-btn" onclick="updateChart()">Tom Green</button>
</aside>

<main>
  <header>
    <h1>Completion %</h1>
    <div class="stats-box">
      <div class="stats-label">15-Day Average</div>
      <div class="stats-value" id="avgValue">90.4%</div>
    </div>
  </header>
  <div class="card">
    <canvas id="completionChart"></canvas>
  </div>
</main>

<script>
  // Data corresponding to Work Screen 15-day view
  const completionData = [
    { date: "30/04", val: 91 }, { date: "01/05", val: 90 }, { date: "05/05", val: 89 },
    { date: "06/05", val: 92 }, { date: "07/05", val: 90 }, { date: "08/05", val: 88 },
    { date: "11/05", val: 90 }, { date: "12/05", val: 93 }, { date: "13/05", val: 89 },
    { date: "14/05", val: 91 }, { date: "15/05", val: 90 }, { date: "18/05", val: 89 },
    { date: "19/05", val: 90 }, { date: "20/05", val: 91 }, { date: "21/05", val: 90 }
  ];

  const ctx = document.getElementById('completionChart').getContext('2d');
  
  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: completionData.map(d => d.date),
      datasets: [{
        data: completionData.map(d => d.val),
        backgroundColor: 'rgba(16,185,129,0.75)',
        borderColor: '#10b981',
        borderWidth: 1,
        borderRadius: 6
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        datalabels: {
          anchor: 'end', align: 'top', color: '#e2e8f0',
          formatter: (value) => `${value}%`
        }
      },
      scales: {
        y: { min: 80, max: 100, grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
        x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
      }
    },
    plugins: [ChartDataLabels]
  });
</script>

</body>
</html>
