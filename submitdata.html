<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Test - OES Performance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 2em;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .test-section {
            margin: 20px 0;
            padding: 20px;
            border-radius: 10px;
            background: #f8f9fa;
        }

        .test-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }

        .test-result {
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            font-family: monospace;
            font-size: 0.9em;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }

        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">Firebase Connection Test</div>
        </div>

        <div class="test-section">
            <div class="test-title">1. Firebase Initialization</div>
            <div id="initResult" class="test-result info">Testing...</div>
        </div>

        <div class="test-section">
            <div class="test-title">2. Firestore Connection</div>
            <div id="firestoreResult" class="test-result info">Testing...</div>
        </div>

        <div class="test-section">
            <div class="test-title">3. Read Test (Engineers Collection)</div>
            <div id="readResult" class="test-result info">Testing...</div>
        </div>

        <div class="test-section">
            <div class="test-title">4. Write Test</div>
            <div id="writeResult" class="test-result info">Testing...</div>
        </div>

        <button class="btn" onclick="runTests()">Run Tests Again</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
            authDomain: "oesperformance-a54c0.firebaseapp.com",
            projectId: "oesperformance-a54c0",
            storageBucket: "oesperformance-a54c0.firebasestorage.app",
            messagingSenderId: "484894102454",
            appId: "1:484894102454:web:17535ee497eac2d90d6717",
            measurementId: "G-R56BGZYV8N"
        };

        let app, db;

        async function runTests() {
            // Test 1: Initialize Firebase
            try {
                app = initializeApp(firebaseConfig);
                document.getElementById('initResult').className = 'test-result success';
                document.getElementById('initResult').textContent = '✓ Firebase initialized successfully';
            } catch (error) {
                document.getElementById('initResult').className = 'test-result error';
                document.getElementById('initResult').textContent = '✗ Error: ' + error.message;
                return;
            }

            // Test 2: Initialize Firestore
            try {
                db = getFirestore(app);
                document.getElementById('firestoreResult').className = 'test-result success';
                document.getElementById('firestoreResult').textContent = '✓ Firestore connected successfully';
            } catch (error) {
                document.getElementById('firestoreResult').className = 'test-result error';
                document.getElementById('firestoreResult').textContent = '✗ Error: ' + error.message;
                return;
            }

            // Test 3: Read from Firestore
            try {
                const querySnapshot = await getDocs(collection(db, "engineers"));
                const count = querySnapshot.size;
                document.getElementById('readResult').className = 'test-result success';
                document.getElementById('readResult').textContent = `✓ Read successful! Found ${count} engineer(s) in database`;
                
                if (count === 0) {
                    document.getElementById('readResult').textContent += '\n\nNote: No engineers found. Add some using addname.html';
                }
            } catch (error) {
                document.getElementById('readResult').className = 'test-result error';
                document.getElementById('readResult').textContent = '✗ Read Error: ' + error.message + '\n\nThis usually means:\n- Firestore is not enabled\n- Security rules are blocking access\n- The collection does not exist yet';
            }

            // Test 4: Write to Firestore
            try {
                const testDoc = await addDoc(collection(db, "test_connection"), {
                    test: true,
                    timestamp: new Date().toISOString()
                });
                
                // Clean up test document
                await deleteDoc(doc(db, "test_connection", testDoc.id));
                
                document.getElementById('writeResult').className = 'test-result success';
                document.getElementById('writeResult').textContent = '✓ Write test successful! Database is working correctly.';
            } catch (error) {
                document.getElementById('writeResult').className = 'test-result error';
                document.getElementById('writeResult').textContent = '✗ Write Error: ' + error.message + '\n\nCheck your Firestore security rules.';
            }
        }

        window.runTests = runTests;

        // Run tests on page load
        runTests();
    </script>
</body>
</html>
