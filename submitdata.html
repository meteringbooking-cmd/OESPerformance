<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Data - OES Performance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 2em;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .date-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .date-section label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        .date-section input {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
        }

        .engineers-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }

        .engineers-table thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .engineers-table th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }

        .engineers-table tbody tr {
            border-bottom: 1px solid #e0e0e0;
        }

        .engineers-table tbody tr:hover {
            background-color: #f8f9fa;
        }

        .engineers-table td {
            padding: 15px;
        }

        .engineer-name {
            font-weight: 600;
            color: #333;
            min-width: 150px;
        }

        .team-leader {
            color: #666;
            font-size: 0.85em;
            display: block;
            margin-top: 3px;
        }

        .data-input {
            width: 80px;
            padding: 8px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            text-align: center;
            font-size: 0.95em;
        }

        .data-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.show {
            display: block;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .engineers-table {
                font-size: 0.9em;
            }

            .data-input {
                width: 60px;
                padding: 6px;
            }

            .engineers-table th,
            .engineers-table td {
                padding: 10px 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">OES Performance</div>
            <div class="subtitle">Submit Daily Performance Data</div>
        </div>

        <div id="message" class="message"></div>

        <div class="date-section">
            <label for="dataDate">Select Date</label>
            <input type="date" id="dataDate" required>
        </div>

        <div id="loadingDiv" class="loading">Loading engineers...</div>

        <div id="tableContainer" style="display: none;">
            <table class="engineers-table">
                <thead>
                    <tr>
                        <th>Engineer</th>
                        <th>Jobs</th>
                        <th>Completed</th>
                        <th>Aborted</th>
                        <th>Meters</th>
                    </tr>
                </thead>
                <tbody id="engineersBody">
                </tbody>
            </table>

            <button class="btn" onclick="saveData()">Save Data</button>
        </div>

        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
            authDomain: "oesperformance-a54c0.firebaseapp.com",
            projectId: "oesperformance-a54c0",
            storageBucket: "oesperformance-a54c0.firebasestorage.app",
            messagingSenderId: "484894102454",
            appId: "1:484894102454:web:17535ee497eac2d90d6717",
            measurementId: "G-R56BGZYV8N"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Set today's date as default
        document.getElementById('dataDate').valueAsDate = new Date();

        let engineers = [];

        // Load engineers on page load
        async function loadEngineers() {
            try {
                const q = query(collection(db, "engineers"), orderBy("teamLeader"), orderBy("engineerName"));
                const querySnapshot = await getDocs(q);
                
                engineers = [];
                querySnapshot.forEach((doc) => {
                    engineers.push({
                        id: doc.id,
                        ...doc.data()
                    });
                });

                displayEngineers();
            } catch (error) {
                console.error("Error loading engineers:", error);
                document.getElementById('loadingDiv').innerHTML = 'Error loading engineers. Please check the console for details.';
            }
        }

        function displayEngineers() {
            const tbody = document.getElementById('engineersBody');
            tbody.innerHTML = '';

            if (engineers.length === 0) {
                document.getElementById('loadingDiv').innerHTML = 'No engineers found. Please <a href="addname.html" style="color: #667eea; font-weight: bold;">add engineers first</a>.';
                return;
            }

            engineers.forEach((engineer, index) => {
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td>
                        <div class="engineer-name">${engineer.engineerName}</div>
                        <span class="team-leader">${engineer.teamLeader}</span>
                    </td>
                    <td><input type="number" class="data-input" id="jobs_${index}" min="0" value="0"></td>
                    <td><input type="number" class="data-input" id="completed_${index}" min="0" value="0"></td>
                    <td><input type="number" class="data-input" id="aborted_${index}" min="0" value="0"></td>
                    <td><input type="number" class="data-input" id="meters_${index}" min="0" step="0.1" value="0"></td>
                `;
            });

            document.getElementById('loadingDiv').style.display = 'none';
            document.getElementById('tableContainer').style.display = 'block';
        }

        window.saveData = async function() {
            const date = document.getElementById('dataDate').value;
            
            if (!date) {
                showMessage('Please select a date', 'error');
                return;
            }

            const button = event.target;
            button.disabled = true;
            button.textContent = 'Saving...';

            try {
                const batch = [];
                
                for (let i = 0; i < engineers.length; i++) {
                    const jobs = parseInt(document.getElementById(`jobs_${i}`).value) || 0;
                    const completed = parseInt(document.getElementById(`completed_${i}`).value) || 0;
                    const aborted = parseInt(document.getElementById(`aborted_${i}`).value) || 0;
                    const meters = parseFloat(document.getElementById(`meters_${i}`).value) || 0;

                    // Only save if there's data entered
                    if (jobs > 0 || completed > 0 || aborted > 0 || meters > 0) {
                        batch.push(addDoc(collection(db, "performance"), {
                            engineerId: engineers[i].id,
                            engineerName: engineers[i].engineerName,
                            teamLeader: engineers[i].teamLeader,
                            date: date,
                            jobs: jobs,
                            completed: completed,
                            aborted: aborted,
                            meters: meters,
                            submittedAt: serverTimestamp()
                        }));
                    }
                }

                if (batch.length === 0) {
                    showMessage('No data to save. Please enter at least one value.', 'error');
                    button.disabled = false;
                    button.textContent = 'Save Data';
                    return;
                }

                await Promise.all(batch);
                
                showMessage('Data saved successfully!', 'success');
                
                // Clear all inputs
                for (let i = 0; i < engineers.length; i++) {
                    document.getElementById(`jobs_${i}`).value = '0';
                    document.getElementById(`completed_${i}`).value = '0';
                    document.getElementById(`aborted_${i}`).value = '0';
                    document.getElementById(`meters_${i}`).value = '0';
                }

            } catch (error) {
                console.error("Error saving data:", error);
                showMessage('Error saving data. Please try again.', 'error');
            } finally {
                button.disabled = false;
                button.textContent = 'Save Data';
            }
        }

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type} show`;
            
            setTimeout(() => {
                messageDiv.className = 'message';
            }, 5000);
        }

        // Load engineers when page loads
        loadEngineers();
    </script>
</body>
</html>
