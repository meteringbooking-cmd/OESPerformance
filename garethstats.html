<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gareth Stats - OES Performance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            margin: 0 auto;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 2em;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196F3;
            padding: 15px;
            margin-bottom: 30px;
            border-radius: 5px;
        }

        .info-box h3 {
            color: #1976D2;
            margin-bottom: 8px;
            font-size: 1em;
        }

        .info-box p {
            color: #555;
            font-size: 0.9em;
            line-height: 1.6;
        }

        .form-section {
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 0.95em;
        }

        .form-group input[type="date"],
        .form-group input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        .form-group input[type="date"]:focus,
        .form-group input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .percentage-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 10px;
        }

        .percentage-input {
            position: relative;
        }

        .percentage-input input {
            padding-right: 35px;
        }

        .percentage-input::after {
            content: '%';
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-weight: 600;
        }

        .calculated-field {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            border: 2px solid #e0e0e0;
        }

        .calculated-field label {
            display: block;
            color: #666;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .calculated-field .value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.show {
            display: block;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .percentage-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">OES Performance</div>
            <div class="subtitle">Submit Attendance Statistics</div>
        </div>

        <div id="message" class="message"></div>

        <div class="info-box">
            <h3>📊 Attendance Percentages</h3>
            <p>Enter the attendance percentages for the selected day. The "At Work %" will be automatically calculated as: 100% - Holiday% - Sick% - AAUP%</p>
        </div>

        <form id="statsForm">
            <div class="form-section">
                <div class="form-group">
                    <label for="dataDate">Select Date</label>
                    <input type="date" id="dataDate" required>
                </div>

                <div class="percentage-grid">
                    <div class="form-group">
                        <label for="holidayPercent">Holiday %</label>
                        <div class="percentage-input">
                            <input type="number" id="holidayPercent" min="0" max="100" step="0.1" value="0" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="sickPercent">Sick %</label>
                        <div class="percentage-input">
                            <input type="number" id="sickPercent" min="0" max="100" step="0.1" value="0" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="aaupPercent">AAUP %</label>
                        <div class="percentage-input">
                            <input type="number" id="aaupPercent" min="0" max="100" step="0.1" value="0" required>
                        </div>
                    </div>
                </div>

                <div class="calculated-field">
                    <label>At Work % (Calculated)</label>
                    <div class="value" id="atWorkPercent">100.0%</div>
                </div>
            </div>

            <button type="submit" class="btn">Save Attendance Stats</button>
        </form>

        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
            authDomain: "oesperformance-a54c0.firebaseapp.com",
            projectId: "oesperformance-a54c0",
            storageBucket: "oesperformance-a54c0.firebasestorage.app",
            messagingSenderId: "484894102454",
            appId: "1:484894102454:web:17535ee497eac2d90d6717",
            measurementId: "G-R56BGZYV8N"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Set yesterday's date as default
        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        document.getElementById('dataDate').valueAsDate = yesterday;

        // Calculate at work percentage
        function updateAtWorkPercent() {
            const holiday = parseFloat(document.getElementById('holidayPercent').value) || 0;
            const sick = parseFloat(document.getElementById('sickPercent').value) || 0;
            const aaup = parseFloat(document.getElementById('aaupPercent').value) || 0;
            
            const atWork = Math.max(0, 100 - holiday - sick - aaup);
            document.getElementById('atWorkPercent').textContent = atWork.toFixed(1) + '%';
        }

        // Add event listeners for auto-calculation
        document.getElementById('holidayPercent').addEventListener('input', updateAtWorkPercent);
        document.getElementById('sickPercent').addEventListener('input', updateAtWorkPercent);
        document.getElementById('aaupPercent').addEventListener('input', updateAtWorkPercent);

        // Handle form submission
        document.getElementById('statsForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = document.querySelector('.btn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Saving...';

            try {
                const date = document.getElementById('dataDate').value;
                const holidayPercent = parseFloat(document.getElementById('holidayPercent').value) || 0;
                const sickPercent = parseFloat(document.getElementById('sickPercent').value) || 0;
                const aaupPercent = parseFloat(document.getElementById('aaupPercent').value) || 0;
                const atWorkPercent = Math.max(0, 100 - holidayPercent - sickPercent - aaupPercent);

                // Validate total doesn't exceed 100%
                if (holidayPercent + sickPercent + aaupPercent > 100) {
                    showMessage('Error: Total percentages cannot exceed 100%', 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Save Attendance Stats';
                    return;
                }

                await addDoc(collection(db, "garethstats"), {
                    date: date,
                    holidayPercent: holidayPercent,
                    sickPercent: sickPercent,
                    aaupPercent: aaupPercent,
                    atWorkPercent: atWorkPercent,
                    submittedAt: serverTimestamp()
                });

                showMessage('Attendance statistics saved successfully!', 'success');
                
                // Reset form
                document.getElementById('holidayPercent').value = 0;
                document.getElementById('sickPercent').value = 0;
                document.getElementById('aaupPercent').value = 0;
                updateAtWorkPercent();

            } catch (error) {
                console.error("Error saving stats:", error);
                showMessage('Error saving statistics. Please try again.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Save Attendance Stats';
            }
        });

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type} show`;
            
            setTimeout(() => {
                messageDiv.className = 'message';
            }, 5000);
        }
    </script>
</body>
</html>
