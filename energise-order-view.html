<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Order Details - Energise</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Syne:wght@400..800&family=DM+Mono:ital,wght@0,300..500;1,300..500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --border2: #f1f5f9;
      --text: #0f172a;
      --text-muted: #64748b;
      --accent: #1e40af;
      --accent-lt: #eff6ff;
      --accent2: #059669;
      --accent2-lt: #ecfdf5;
      --radius: 12px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 40px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .invoice-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
      width: 100%;
      max-width: 850px;
      padding: 40px;
      position: relative;
    }

    /* Brand Header */
    .invoice-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 2px solid var(--border2);
      padding-bottom: 24px;
      margin-bottom: 24px;
    }

    .brand {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 28px;
      color: var(--accent);
      text-decoration: none;
    }
    .brand span { color: var(--accent2); }

    .invoice-title {
      text-align: right;
    }
    .invoice-title h1 {
      font-family: 'Syne', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .order-id-badge {
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      background: var(--accent-lt);
      color: var(--accent);
      padding: 4px 8px;
      border-radius: 4px;
      display: inline-block;
      font-weight: 500;
    }

    /* Meta Details */
    .invoice-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 32px;
    }

    .meta-box h3 {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }

    .meta-box p {
      font-size: 15px;
      color: var(--text);
      font-weight: 600;
    }

    .meta-box .date {
      font-family: 'DM Mono', monospace;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 400;
    }

    /* Items Table */
    .table-wrap {
      overflow-x: auto;
      margin-bottom: 24px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background: var(--border2);
      padding: 12px 16px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border2);
      font-size: 14px;
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }

    .sku-mono {
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      background: #f1f5f9;
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--text);
    }

    .uom-pill {
      font-size: 12px;
      background: var(--accent-lt);
      color: var(--accent);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 500;
    }

    .item-cost {
      font-family: 'DM Mono', monospace;
      font-weight: 500;
    }

    /* Total Section */
    .total-section {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 32px;
    }

    .total-box {
      text-align: right;
      border-top: 2px solid var(--text);
      padding-top: 12px;
      min-width: 200px;
    }

    .total-box label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-right: 8px;
    }

    .total-box span {
      font-family: 'DM Mono', monospace;
      font-size: 22px;
      font-weight: 700;
      color: var(--accent2);
    }

    /* Print Button Row */
    .actions-row {
      display: flex;
      justify-content: center;
      gap: 16px;
    }

    .btn {
      background: var(--accent);
      border: 1px solid var(--accent);
      color: #ffffff;
      padding: 10px 24px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s;
    }
    .btn:hover { background: #1e3a8a; border-color: #1e3a8a; }

    /* Loading / Error States */
    .state-container {
      text-align: center;
      padding: 40px;
    }
    .spinner {
      border: 3px solid var(--border);
      border-top: 3px solid var(--accent);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Print styling overrides */
    @media print {
      body { background: #ffffff; padding: 0; }
      .invoice-card { border: none; box-shadow: none; padding: 0; width: 100%; max-width: 100%; }
      .actions-row { display: none; }
    }
  </style>
</head>
<body>

  <div class="invoice-card" id="invoiceCard">
    <div class="state-container" id="stateContainer">
      <div class="spinner"></div>
      <p style="color:var(--text-muted);">Loading order details...</p>
    </div>
  </div>

  <!-- Firebase Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
      authDomain: "oesperformance-a54c0.firebaseapp.com",
      projectId: "oesperformance-a54c0",
      storageBucket: "oesperformance-a54c0.firebasestorage.app",
      messagingSenderId: "484894102454",
      appId: "1:484894102454:web:17535ee497eac2d90d6717",
      measurementId: "G-R56BGZYV8N"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);

    function formatDate(isoString) {
      const d = new Date(isoString);
      if(isNaN(d.getTime())) return isoString;
      return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    async function loadOrder() {
      const card = document.getElementById('invoiceCard');
      const stateContainer = document.getElementById('stateContainer');
      
      const urlParams = new URLSearchParams(window.location.search);
      const orderId = urlParams.get('order');

      if (!orderId) {
        stateContainer.innerHTML = `
          <p style="color:#ef4444; font-weight:700; font-size:16px;">❌ Missing Order ID</p>
          <p style="color:var(--text-muted); font-size:14px; margin-top:8px;">No valid order ID was provided in the URL.</p>
        `;
        return;
      }

      try {
        const docRef = doc(db, "Energise Orders", orderId);
        const docSnap = await getDoc(docRef);

        if (!docSnap.exists()) {
          stateContainer.innerHTML = `
            <p style="color:#ef4444; font-weight:700; font-size:16px;">❌ Order Not Found</p>
            <p style="color:var(--text-muted); font-size:14px; margin-top:8px;">The requested order could not be located in the database.</p>
          `;
          return;
        }

        const data = docSnap.data();
        const items = data.items || [];
        
        // Calculate total order value excluding undelivered items
        const orderTotal = items.reduce((sum, item) => {
          if (item.notDelivered) return sum;
          return sum + ((item.price || 0) * (item.qty || 1));
        }, 0);

        // Build item rows
        const rowsHtml = items.map(item => {
          const isNotDelivered = !!item.notDelivered;
          const lineCost = isNotDelivered ? 0 : (item.price || 0) * (item.qty || 1);
          const rowStyle = isNotDelivered ? 'text-decoration: line-through; opacity: 0.55;' : '';

          return `
            <tr style="${rowStyle}">
              <td><span class="sku-mono">${item.sku}</span></td>
              <td style="font-weight:600;">${item.name}</td>
              <td style="color:var(--text-muted); font-size:13px;">${item.category || 'consumable'}</td>
              <td>${item.qty} <span class="uom-pill">${item.uom || 'each'}</span></td>
              <td class="item-cost">£${(item.price || 0).toFixed(2)}</td>
              <td class="item-cost" style="font-weight:600; text-align:right;">£${lineCost.toFixed(2)}</td>
            </tr>
          `;
        }).join('');

        // Populate card HTML
        card.innerHTML = `
          <div class="invoice-header">
            <a href="#" class="brand">energise<span>.</span></a>
            <div class="invoice-title">
              <h1>Order Invoice</h1>
              <span class="order-id-badge">ID: ${orderId}</span>
            </div>
          </div>

          <div class="invoice-meta">
            <div class="meta-box">
              <h3>Submitted By</h3>
              <p>${data.submittedBy || 'Unknown Submitter'}</p>
            </div>
            <div class="meta-box">
              <h3>Processed Date</h3>
              <p class="date">${formatDate(data.processedAt || data.submittedAt)}</p>
            </div>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th width="100">SKU</th>
                  <th>Product Details</th>
                  <th width="110">Category</th>
                  <th width="90">Quantity</th>
                  <th width="100">Unit Price</th>
                  <th width="110" style="text-align:right;">Line Total</th>
                </tr>
              </thead>
              <tbody>
                ${rowsHtml || `<tr><td colspan="6" style="text-align:center; color:var(--text-muted);">No items in this order.</td></tr>`}
              </tbody>
            </table>
          </div>

          <div class="total-section">
            <div class="total-box">
              <label>Invoice Total</label>
              <span>£${orderTotal.toFixed(2)}</span>
            </div>
          </div>

          <div class="actions-row">
            <button class="btn" onclick="window.print()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
              Print Receipt / Save PDF
            </button>
          </div>
        `;

      } catch (err) {
        console.error(err);
        stateContainer.innerHTML = `
          <p style="color:#ef4444; font-weight:700; font-size:16px;">❌ Database Error</p>
          <p style="color:var(--text-muted); font-size:14px; margin-top:8px;">${err.message}</p>
        `;
      }
    }

    loadOrder();
  </script>
</body>
</html>
