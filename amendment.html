<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amendment - OES Performance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            margin: 0 auto;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        .back-link-top {
            position: absolute;
            left: 0;
            top: 0;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .back-link-top:hover {
            text-decoration: underline;
        }

        .logo {
            font-size: 2em;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .selection-section {
            margin-bottom: 30px;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .selection-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .form-group {
            flex: 1;
            min-width: 200px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 0.95em;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-save {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
        }

        .btn-save:hover {
            box-shadow: 0 10px 25px rgba(40, 167, 69, 0.4);
        }

        .data-section {
            display: none;
            margin-bottom: 30px;
        }

        .data-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .data-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .data-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #e0e0e0;
        }

        .data-item label {
            display: block;
            font-size: 0.9em;
            color: #666;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .data-item input,
        .data-item select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 1em;
        }

        .data-item input:focus,
        .data-item select:focus {
            outline: none;
            border-color: #667eea;
        }

        .data-item .current-value {
            color: #667eea;
            font-weight: 600;
            font-size: 1.1em;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .message.show {
            display: block;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 1.1em;
        }

        .bonus-info {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #28a745;
        }

        .bonus-detail {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .bonus-detail:last-child {
            border-bottom: none;
            font-weight: 600;
            color: #28a745;
            font-size: 1.1em;
            padding-top: 12px;
            margin-top: 5px;
            border-top: 2px solid #28a745;
        }

        .bonus-label {
            color: #666;
        }

        .bonus-value {
            font-weight: 600;
            color: #333;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .selection-row {
                flex-direction: column;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="index.html" class="back-link-top">← Back to Home</a>
            <div class="logo">OES Performance</div>
            <div class="subtitle">Amend Performance Data</div>
        </div>

        <div id="message" class="message"></div>

        <div class="selection-section">
            <div class="selection-row">
                <div class="form-group">
                    <label for="engineerSelect">Select Engineer</label>
                    <select id="engineerSelect" required>
                        <option value="">-- Choose an Engineer --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="dateSelect">Select Date</label>
                    <input type="date" id="dateSelect" required>
                </div>
            </div>
            <button class="btn" onclick="loadRecord()">Load Record</button>
        </div>

        <div id="loadingDiv" class="loading" style="display: none;">Loading data...</div>

        <div id="dataSection" class="data-section">
            <!-- Attendance Card -->
            <div class="data-card">
                <div class="card-title">📋 Attendance Status</div>
                <div class="data-item">
                    <label for="attendanceInput">Attendance</label>
                    <select id="attendanceInput">
                        <option value="X">X - In</option>
                        <option value="H">H - Holiday</option>
                        <option value="H/H">H/H - Half Day Holiday</option>
                        <option value="Sick">Sick - Sick</option>
                        <option value="AAUP">AAUP - (Authorised Absence Unpaid)</option>
                        <option value="TOFD">TOFD - (Time Off For Dependants)</option>
                        <option value="AAP">AAP - (Authorised Absence Paid)</option>
                    </select>
                </div>
            </div>

            <!-- Performance Card -->
            <div class="data-card">
                <div class="card-title">📊 Performance Metrics</div>
                <div class="data-grid">
                    <div class="data-item">
                        <label for="jobsInput">Jobs</label>
                        <input type="number" id="jobsInput" min="0" step="1">
                    </div>
                    <div class="data-item">
                        <label for="completedInput">Completed</label>
                        <input type="number" id="completedInput" min="0" step="1">
                    </div>
                    <div class="data-item">
                        <label for="abortedInput">Aborted</label>
                        <input type="number" id="abortedInput" min="0" step="1">
                    </div>
                    <div class="data-item">
                        <label for="metersInput">Meters</label>
                        <input type="number" id="metersInput" min="0" step="0.01">
                    </div>
                </div>
            </div>

            <!-- Bonus Card -->
            <div class="data-card">
                <div class="card-title">💰 Bonus Information</div>
                <div id="bonusInfo" class="bonus-info">
                    <div class="no-data">No bonus data available for this date</div>
                </div>
            </div>

            <div class="button-group">
                <button class="btn btn-save" onclick="saveChanges()" style="flex: 1;">💾 Save Changes</button>
            </div>
        </div>

        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where, updateDoc, doc, addDoc, serverTimestamp, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
            authDomain: "oesperformance-a54c0.firebaseapp.com",
            projectId: "oesperformance-a54c0",
            storageBucket: "oesperformance-a54c0.firebasestorage.app",
            messagingSenderId: "484894102454",
            appId: "1:484894102454:web:17535ee497eac2d90d6717",
            measurementId: "G-R56BGZYV8N"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentPerformanceDoc = null;
        let currentAttendanceDoc = null;
        let currentEngineer = null;
        let currentDate = null;

        // Load engineers on page load
        window.addEventListener('DOMContentLoaded', loadEngineers);

        async function loadEngineers() {
            try {
                const engineerSelect = document.getElementById('engineerSelect');
                engineerSelect.innerHTML = '<option value="">-- Choose an Engineer --</option>';

                const q = query(collection(db, "engineers"), orderBy("engineerName"));
                const querySnapshot = await getDocs(q);
                
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const option = document.createElement('option');
                    option.value = data.engineerName;
                    option.dataset.teamLeader = data.teamLeader;
                    option.textContent = `${data.engineerName} (${data.teamLeader})`;
                    engineerSelect.appendChild(option);
                });

                // Set default date to today
                document.getElementById('dateSelect').valueAsDate = new Date();
            } catch (error) {
                console.error("Error loading engineers:", error);
                showMessage('Error loading engineers list', 'error');
            }
        }

        window.loadRecord = async function() {
            const engineerName = document.getElementById('engineerSelect').value;
            const date = document.getElementById('dateSelect').value;

            if (!engineerName) {
                showMessage('Please select an engineer', 'error');
                return;
            }

            if (!date) {
                showMessage('Please select a date', 'error');
                return;
            }

            currentEngineer = engineerName;
            currentDate = date;

            document.getElementById('loadingDiv').style.display = 'block';
            document.getElementById('dataSection').style.display = 'none';

            try {
                // Get team leader from the selected option
                const engineerSelect = document.getElementById('engineerSelect');
                const selectedOption = engineerSelect.options[engineerSelect.selectedIndex];
                const teamLeader = selectedOption.dataset.teamLeader;

                // Load performance data
                const perfQuery = query(
                    collection(db, "performance"),
                    where("engineerName", "==", engineerName),
                    where("date", "==", date)
                );
                const perfSnapshot = await getDocs(perfQuery);
                
                if (!perfSnapshot.empty) {
                    currentPerformanceDoc = perfSnapshot.docs[0];
                    const perfData = currentPerformanceDoc.data();
                    
                    document.getElementById('jobsInput').value = perfData.jobs || 0;
                    document.getElementById('completedInput').value = perfData.completed || 0;
                    document.getElementById('abortedInput').value = perfData.aborted || 0;
                    document.getElementById('metersInput').value = perfData.meters || 0;
                } else {
                    currentPerformanceDoc = null;
                    document.getElementById('jobsInput').value = 0;
                    document.getElementById('completedInput').value = 0;
                    document.getElementById('abortedInput').value = 0;
                    document.getElementById('metersInput').value = 0;
                }

                // Load attendance data
                const attQuery = query(
                    collection(db, "attendance"),
                    where("engineerName", "==", engineerName),
                    where("date", "==", date)
                );
                const attSnapshot = await getDocs(attQuery);
                
                if (!attSnapshot.empty) {
                    currentAttendanceDoc = attSnapshot.docs[0];
                    const attData = currentAttendanceDoc.data();
                    document.getElementById('attendanceInput').value = attData.attendance || '✓';
                } else {
                    currentAttendanceDoc = null;
                    document.getElementById('attendanceInput').value = '✓';
                }

                // Load bonus data - find the week that contains this date
                await loadBonusData(engineerName, date);

                document.getElementById('loadingDiv').style.display = 'none';
                document.getElementById('dataSection').style.display = 'block';

                const status = currentPerformanceDoc || currentAttendanceDoc ? 'existing' : 'new';
                showMessage(
                    status === 'existing' 
                        ? `Record loaded for ${engineerName} on ${date}. You can now modify the values.`
                        : `No existing record found for ${engineerName} on ${date}. You can create a new record.`,
                    'info'
                );

            } catch (error) {
                console.error("Error loading record:", error);
                showMessage('Error loading record: ' + error.message, 'error');
                document.getElementById('loadingDiv').style.display = 'none';
            }
        }

        async function loadBonusData(engineerName, date) {
            const bonusInfo = document.getElementById('bonusInfo');
            
            try {
                // Find the Monday of the week for the given date
                const dateObj = new Date(date + 'T00:00:00');
                const dayOfWeek = dateObj.getDay();
                const diff = dateObj.getDate() - dayOfWeek + (dayOfWeek === 0 ? -6 : 1);
                const monday = new Date(dateObj.setDate(diff));
                const weekStartDate = monday.toISOString().split('T')[0];

                // Query for bonus with this week start date and engineer
                const bonusQuery = query(
                    collection(db, "bonuses"),
                    where("engineerName", "==", engineerName),
                    where("weekStartDate", "==", weekStartDate)
                );
                
                const bonusSnapshot = await getDocs(bonusQuery);
                
                if (!bonusSnapshot.empty) {
                    const bonusData = bonusSnapshot.docs[0].data();
                    const dailyBonus = bonusData.dailyBonuses && bonusData.dailyBonuses[date] 
                        ? bonusData.dailyBonuses[date] 
                        : 0;
                    
                    bonusInfo.innerHTML = `
                        <div class="bonus-detail">
                            <span class="bonus-label">Week Starting:</span>
                            <span class="bonus-value">${bonusData.weekStartDate}</span>
                        </div>
                        <div class="bonus-detail">
                            <span class="bonus-label">This Day (${date}):</span>
                            <span class="bonus-value">£${dailyBonus}</span>
                        </div>
                        <div class="bonus-detail">
                            <span class="bonus-label">Week Total:</span>
                            <span class="bonus-value">£${bonusData.weekTotal || 0}</span>
                        </div>
                    `;
                } else {
                    bonusInfo.innerHTML = '<div class="no-data">No bonus data available for this week</div>';
                }
            } catch (error) {
                console.error("Error loading bonus data:", error);
                bonusInfo.innerHTML = '<div class="no-data">Error loading bonus data</div>';
            }
        }

        window.saveChanges = async function() {
            const engineerName = document.getElementById('engineerSelect').value;
            const date = document.getElementById('dateSelect').value;

            if (!engineerName || !date) {
                showMessage('Please select an engineer and date', 'error');
                return;
            }

            const engineerSelect = document.getElementById('engineerSelect');
            const selectedOption = engineerSelect.options[engineerSelect.selectedIndex];
            const teamLeader = selectedOption.dataset.teamLeader;

            const attendance = document.getElementById('attendanceInput').value;
            const jobs = parseInt(document.getElementById('jobsInput').value) || 0;
            const completed = parseInt(document.getElementById('completedInput').value) || 0;
            const aborted = parseInt(document.getElementById('abortedInput').value) || 0;
            const meters = parseFloat(document.getElementById('metersInput').value) || 0;

            try {
                // Save/update attendance
                const attendanceData = {
                    engineerName: engineerName,
                    teamLeader: teamLeader,
                    date: date,
                    attendance: attendance,
                    updatedAt: serverTimestamp()
                };

                if (currentAttendanceDoc) {
                    await updateDoc(currentAttendanceDoc.ref, attendanceData);
                } else {
                    await addDoc(collection(db, "attendance"), {
                        ...attendanceData,
                        createdAt: serverTimestamp()
                    });
                }

                // Save/update performance
                const performanceData = {
                    engineerName: engineerName,
                    teamLeader: teamLeader,
                    date: date,
                    jobs: jobs,
                    completed: completed,
                    aborted: aborted,
                    meters: meters,
                    updatedAt: serverTimestamp()
                };

                if (currentPerformanceDoc) {
                    await updateDoc(currentPerformanceDoc.ref, performanceData);
                } else {
                    await addDoc(collection(db, "performance"), {
                        ...performanceData,
                        createdAt: serverTimestamp()
                    });
                }

                showMessage('Changes saved successfully!', 'success');
                
                // Reload the record to get the updated data
                setTimeout(() => {
                    loadRecord();
                }, 1500);

            } catch (error) {
                console.error("Error saving changes:", error);
                showMessage('Error saving changes: ' + error.message, 'error');
            }
        }

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type} show`;
            
            setTimeout(() => {
                messageDiv.className = 'message';
            }, 5000);
        }
    </script>
</body>
</html>
