
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Entry Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
        }
        h1 {
            color: #667eea;
            margin-bottom: 30px;
            text-align: center;
            font-size: 2.5em;
        }
        h2 {
            color: #764ba2;
            margin: 30px 0 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        .section {
            margin-bottom: 40px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .summary-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .summary-card h3 {
            font-size: 0.9em;
            margin-bottom: 10px;
            opacity: 0.9;
        }
        .summary-card .value {
            font-size: 2em;
            font-weight: bold;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
        .file-input {
            padding: 10px;
            background: white;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 600;
        }
        tr:hover {
            background: #f5f5f5;
        }
        .status-complete {
            color: #28a745;
            font-weight: bold;
        }
        .status-pending {
            color: #ffc107;
            font-weight: bold;
        }
        .message {
            padding: 15px;
            margin: 15px 0;
            border-radius: 5px;
            display: none;
        }
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Work Entry Tracker</h1>
        
        <div class="summary">
            <div class="summary-card">
                <h3>Completed Jobs</h3>
                <div class="value" id="totalCompleted">0</div>
            </div>
            <div class="summary-card">
                <h3>Total Income</h3>
                <div class="value" id="totalIncome">£0.00</div>
            </div>
            <div class="summary-card">
                <h3>Commission</h3>
                <div class="value" id="totalCommission">£0.00</div>
            </div>
        </div>

        <div class="section">
            <h2>📝 Manual Entry Submission</h2>
            <div id="manualMessage" class="message"></div>
            <form id="manualEntryForm">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label for="address">1st Line of Address:</label>
                    <input type="text" id="address" required>
                </div>
                <div class="form-group">
                    <label for="postcode">Postcode:</label>
                    <input type="text" id="postcode" required>
                </div>
                <div class="form-group">
                    <label for="jobNumber">Job Number:</label>
                    <input type="text" id="jobNumber" required>
                </div>
                <div class="form-group">
                    <label for="workDate">Work Date:</label>
                    <input type="date" id="workDate" required>
                </div>
                <button type="submit">Submit Entry</button>
            </form>
        </div>

        <div class="section">
            <h2>📤 Upload CSV Data</h2>
            <div id="uploadMessage" class="message"></div>
            <div class="form-group">
                <label for="csvFile">Select CSV File:</label>
                <input type="file" id="csvFile" accept=".csv" class="file-input">
            </div>
            <button onclick="uploadCSV()">Process CSV</button>
        </div>

        <div class="section">
            <h2>📅 Weekly Report</h2>
            <div class="form-group">
                <label for="weekSelect">Select Week Commencing:</label>
                <select id="weekSelect" onchange="loadWeeklyReport()">
                    <option value="">Select a week...</option>
                </select>
            </div>
            <div id="weeklyReport"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, addDoc, query, where, getDocs, orderBy } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
            authDomain: "oesperformance-a54c0.firebaseapp.com",
            projectId: "oesperformance-a54c0",
            storageBucket: "oesperformance-a54c0.firebasestorage.app",
            messagingSenderId: "484894102454",
            appId: "1:484894102454:web:17535ee497eac2d90d6717",
            measurementId: "G-R56BGZYV8N"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const jobTypeValues = {
            'METERING_ELECTRICITY_METER_EXCHANGE': 113.3,
            'METERING_DUAL_FUEL_METER_EXCHANGE': 139.05,
            'METERING_SITE_INVESTIGATION': 72.1,
            'METERING_GAS_METER_EXCHANGE': 113.3,
            'METERING_GAS_METER_REMOVAL': 92.7,
            'METERING_ELECTRICITY_NEW_CONNECTION': 113.3,
            'METERING_DUAL_FUEL_METER_COMMISSION': 72.1,
            'METERING_ELECTRICITY_METER_COMMISSION': 72.1,
            'METERING_GAS_METER_COMMISSION': 72.1,
            'METERING_GAS_METER_NEW_CONNECTION': 113.3,
            'METERING_INSTALL_ISOLATOR_SWITCH': 72.1,
            'METERING_INSTALL_CONSUMER_DEVICE': 72.1,
            'METERING_TRACE_LABEL': 72.1,
            'METERING_COMMUNICATIONS_HUB_EXCHANGE': 72.1
        };

        function getMonday(d) {
            const date = new Date(d);
            const day = date.getDay();
            const diff = date.getDate() - day + (day === 0 ? -6 : 1);
            const monday = new Date(date.setDate(diff));
            monday.setHours(0, 0, 0, 0);
            return monday;
        }

        function formatDate(date) {
            return date.toISOString().split('T')[0];
        }

        document.getElementById('workDate').valueAsDate = new Date();

        document.getElementById('manualEntryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const messageEl = document.getElementById('manualMessage');
            
            try {
                const workDate = new Date(document.getElementById('workDate').value);
                const weekCommencing = getMonday(workDate);
                
                const entry = {
                    name: document.getElementById('name').value,
                    address: document.getElementById('address').value,
                    postcode: document.getElementById('postcode').value,
                    jobNumber: document.getElementById('jobNumber').value,
                    workDate: formatDate(workDate),
                    weekCommencing: formatDate(weekCommencing),
                    submittedAt: new Date().toISOString(),
                    type: 'manual'
                };

                await addDoc(collection(db, 'workEntries'), entry);
                
                messageEl.textContent = 'Entry submitted successfully!';
                messageEl.className = 'message success';
                messageEl.style.display = 'block';
                document.getElementById('manualEntryForm').reset();
                document.getElementById('workDate').valueAsDate = new Date();
                
                setTimeout(() => {
                    messageEl.style.display = 'none';
                }, 3000);
                
                await loadWeekCommencingDates();
            } catch (error) {
                messageEl.textContent = 'Error: ' + error.message;
                messageEl.className = 'message error';
                messageEl.style.display = 'block';
            }
        });

        window.uploadCSV = async function() {
            const fileInput = document.getElementById('csvFile');
            const messageEl = document.getElementById('uploadMessage');
            
            if (!fileInput.files.length) {
                messageEl.textContent = 'Please select a CSV file';
                messageEl.className = 'message error';
                messageEl.style.display = 'block';
                return;
            }

            const file = fileInput.files[0];
            
            Papa.parse(file, {
                header: true,
                complete: async (results) => {
                    try {
                        let count = 0;
                        for (const row of results.data) {
                            if (row['Booking Reference'] && row['Date']) {
                                const workDate = new Date(row['Date']);
                                const weekCommencing = getMonday(workDate);
                                
                                const entry = {
                                    jobNumber: row['Booking Reference'],
                                    workDate: formatDate(workDate),
                                    jobType: row['Job Type'] || '',
                                    bookingStatus: row['Booking Status'] || '',
                                    weekCommencing: formatDate(weekCommencing),
                                    uploadedAt: new Date().toISOString(),
                                    type: 'csv'
                                };

                                await addDoc(collection(db, 'workEntries'), entry);
                                count++;
                            }
                        }
                        
                        messageEl.textContent = `Successfully uploaded ${count} entries`;
                        messageEl.className = 'message success';
                        messageEl.style.display = 'block';
                        fileInput.value = '';
                        
                        setTimeout(() => {
                            messageEl.style.display = 'none';
                        }, 3000);
                        
                        await loadWeekCommencingDates();
                    } catch (error) {
                        messageEl.textContent = 'Error: ' + error.message;
                        messageEl.className = 'message error';
                        messageEl.style.display = 'block';
                    }
                },
                error: (error) => {
                    messageEl.textContent = 'Error parsing CSV: ' + error.message;
                    messageEl.className = 'message error';
                    messageEl.style.display = 'block';
                }
            });
        };

        async function loadWeekCommencingDates() {
            const q = query(collection(db, 'workEntries'), orderBy('weekCommencing', 'desc'));
            const snapshot = await getDocs(q);
            
            const weeks = new Set();
            snapshot.forEach(doc => {
                weeks.add(doc.data().weekCommencing);
            });
            
            const select = document.getElementById('weekSelect');
            select.innerHTML = '<option value="">Select a week...</option>';
            
            Array.from(weeks).sort((a, b) => b.localeCompare(a)).forEach(week => {
                const option = document.createElement('option');
                option.value = week;
                option.textContent = week;
                select.appendChild(option);
            });
        }

        window.loadWeeklyReport = async function() {
            const weekCommencing = document.getElementById('weekSelect').value;
            const reportDiv = document.getElementById('weeklyReport');
            
            if (!weekCommencing) {
                reportDiv.innerHTML = '';
                return;
            }

            const q = query(
                collection(db, 'workEntries'),
                where('weekCommencing', '==', weekCommencing),
                orderBy('workDate', 'asc')
            );
            
            const snapshot = await getDocs(q);
            const entries = [];
            
            snapshot.forEach(doc => {
                entries.push({ id: doc.id, ...doc.data() });
            });

            const entriesByDate = {};
            entries.forEach(entry => {
                if (!entriesByDate[entry.workDate]) {
                    entriesByDate[entry.workDate] = [];
                }
                entriesByDate[entry.workDate].push(entry);
            });

            let totalCompleted = 0;
            let totalIncome = 0;
            let totalCommission = 0;

            Object.keys(entriesByDate).forEach(date => {
                const dayEntries = entriesByDate[date];
                const completedToday = dayEntries.filter(e => 
                    e.bookingStatus && e.bookingStatus.toLowerCase().includes('complete')
                ).length;
                
                if (completedToday > 10) {
                    totalCommission += (completedToday - 10) * 10;
                }
            });

            let html = '<table><thead><tr><th>Date</th><th>Name</th><th>Address</th><th>Postcode</th><th>Job Number</th><th>Job Type</th><th>Status</th><th>Value</th></tr></thead><tbody>';

            Object.keys(entriesByDate).sort().forEach(date => {
                entriesByDate[date].forEach(entry => {
                    const value = jobTypeValues[entry.jobType] || 0;
                    const isComplete = entry.bookingStatus && entry.bookingStatus.toLowerCase().includes('complete');
                    
                    if (isComplete) {
                        totalCompleted++;
                        totalIncome += value;
                    }

                    const statusClass = isComplete ? 'status-complete' : 'status-pending';
                    
                    html += `<tr>
                        <td>${entry.workDate}</td>
                        <td>${entry.name || '-'}</td>
                        <td>${entry.address || '-'}</td>
                        <td>${entry.postcode || '-'}</td>
                        <td>${entry.jobNumber}</td>
                        <td>${entry.jobType || '-'}</td>
                        <td class="${statusClass}">${entry.bookingStatus || '-'}</td>
                        <td>£${value.toFixed(2)}</td>
                    </tr>`;
                });
            });

            html += '</tbody></table>';
            reportDiv.innerHTML = html;

            document.getElementById('totalCompleted').textContent = totalCompleted;
            document.getElementById('totalIncome').textContent = `£${totalIncome.toFixed(2)}`;
            document.getElementById('totalCommission').textContent = `£${totalCommission.toFixed(2)}`;
        };

        loadWeekCommencingDates();
    </script>
</body>
</html>
