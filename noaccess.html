<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Accesses</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-deepest: #080c14; --bg-deep: #0d1220; --bg-card: #111827; --bg-input: #0a0f1a;
            --border: rgba(148,163,184,0.1); --border-focus: #38bdf8;
            --text-primary: #e2e8f0; --text-secondary: #94a3b8; --text-muted: #475569;
            --accent-cyan: #38bdf8; --accent-sky: #0ea5e9; --accent-teal: #2dd4bf;
            --accent-amber: #f59e0b; --accent-rose: #fb7185; --accent-violet: #a78bfa;
            --success: #34d399; --error: #f87171;
            --gradient-header: linear-gradient(135deg, #38bdf8 0%, #2dd4bf 50%, #a78bfa 100%);
            --gradient-btn: linear-gradient(135deg, #0ea5e9 0%, #38bdf8 100%);
        }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg-deepest); min-height: 100vh; color: var(--text-primary); overflow-x: hidden; }

        .header { background: linear-gradient(135deg, #0d1220 0%, #080c14 100%); padding: 36px 24px; border-bottom: 1px solid var(--border); position: relative; }
        .header-content { max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 2.4em; font-weight: 800; background: var(--gradient-header); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .header img { height: 56px; opacity: 0.9; }

        .container { max-width: 1400px; margin: 0 auto; padding: 36px 24px; display: flex; gap: 24px; align-items: flex-start; }
        .main-content { flex: 1; min-width: 0; }
        
        /* Sidebar Styling */
        .sidebar { width: 320px; position: sticky; top: 24px; flex-shrink: 0; }
        @media (max-width: 1100px) { .container { flex-direction: column; } .sidebar { width: 100%; position: static; } }

        .panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 32px; margin-bottom: 28px; }
        .panel-header { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
        .panel-title { font-size: 1.2em; font-weight: 700; color: #f1f5f9; }

        /* Duplicate Block Styles */
        .dup-item { background: rgba(248, 113, 113, 0.05); border: 1px solid rgba(248, 113, 113, 0.2); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
        .dup-postcode { font-family: 'DM Mono', monospace; color: var(--accent-rose); font-weight: 700; font-size: 0.9em; }
        .dup-info { font-size: 0.75em; color: var(--text-secondary); margin-top: 4px; }
        .dup-count { display: inline-block; padding: 2px 8px; background: var(--accent-rose); color: white; border-radius: 10px; font-size: 0.7em; font-weight: 800; margin-left: 5px; }

        /* Form & UI */
        .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .form-label { font-size: 0.75em; font-weight: 600; text-transform: uppercase; color: var(--text-secondary); }
        input, select { font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--text-primary); background: var(--bg-input); border: 2px solid rgba(148,163,184,0.15); border-radius: 12px; padding: 12px; outline: none; width: 100%; }
        
        .btn { padding: 14px 24px; background: var(--gradient-btn); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: 700; width: 100%; transition: 0.3s; }
        .btn.rose { background: linear-gradient(135deg, #e11d48 0%, #fb7185 100%); }
        
        .na-cards { display: flex; flex-direction: column; gap: 12px; }
        .na-card { background: var(--bg-input); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
        .na-card-header { padding: 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .na-card-header-main { display: grid; grid-template-columns: repeat(4, 1fr) auto; gap: 15px; width: 100%; align-items: center; }
        .na-field-label { font-size: 0.7em; color: var(--text-muted); text-transform: uppercase; }
        .na-field-value { font-size: 0.9em; font-weight: 600; }

        .overall-status { padding: 4px 10px; border-radius: 20px; font-size: 0.7em; font-weight: 700; text-transform: uppercase; }
        .overall-status.open { background: rgba(56,189,248,0.1); color: var(--accent-cyan); }
        .overall-status.no-answer { background: rgba(245,158,11,0.1); color: var(--accent-amber); }
        .overall-status.rebooked { background: rgba(52,211,153,0.1); color: var(--success); }
        .overall-status.exhausted { background: rgba(251,113,133,0.1); color: var(--accent-rose); }

        .attempts-wrap { border-top: 1px solid var(--border); padding: 20px; display: none; }
        .expanded .attempts-wrap { display: block; }
        .attempts-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .attempt-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 15px; }

        .status-toast { position: fixed; top: 24px; right: 24px; padding: 15px; border-radius: 10px; display: none; z-index: 100; }
        .status-toast.success { background: #064e3b; color: #34d399; }
    </style>
</head>
<body>

<div class="header">
    <div class="header-content">
        <div>
            <h1>No Accesses</h1>
            <div style="color: var(--text-secondary)">Manage and track field visits</div>
        </div>
        <img src="https://www.dropbox.com/scl/fi/kkujm1u6y7vvnp7luq8d7/ngu-main-white.png?rlkey=kgq2uh48qh4xssh4vlbz868lr&st=wespbsvy&dl=1" alt="Logo">
    </div>
</div>

<div class="container">
    <div class="main-content">
        <div class="panel">
            <div class="panel-header"><div class="panel-title">Log New Entry</div></div>
            <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap:15px; align-items:end;">
                <div class="form-group"><label class="form-label">Date</label><input type="date" id="naDate"></div>
                <div class="form-group"><label class="form-label">Engineer</label><input type="text" id="naName" placeholder="Name"></div>
                <div class="form-group"><label class="form-label">Job #</label><input type="text" id="naJob" placeholder="12345"></div>
                <div class="form-group"><label class="form-label">Postcode</label><input type="text" id="naPostcode" placeholder="SW1" style="text-transform:uppercase"></div>
                <button class="btn rose" id="addBtn" onclick="addNoAccess()">+ Log</button>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header"><div class="panel-title">Active Records</div></div>
            <div class="na-cards" id="naCards"></div>
        </div>
    </div>

    <div class="sidebar">
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title" style="color: var(--accent-rose)">⚠️ Potential Duplicates</div>
            </div>
            <div id="duplicateList">
                <div class="empty-state" style="font-size: 0.8em; color: var(--text-muted)">No matching postcode/status duplicates found.</div>
            </div>
        </div>
    </div>
</div>

<div class="status-toast" id="toast"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp, getDocs, query, orderBy, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    
    const cfg = {
        apiKey:"AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
        authDomain:"oesperformance-a54c0.firebaseapp.com",
        projectId:"oesperformance-a54c0",
        storageBucket:"oesperformance-a54c0.firebasestorage.app",
        messagingSenderId:"484894102454",
        appId:"1:484894102454:web:17535ee497eac2d90d6717"
    };
    const app = initializeApp(cfg);
    const db = getFirestore(app);
    
    window._db = db;
    window._addDoc = addDoc;
    window._collection = collection;
    window._serverTimestamp = serverTimestamp;
    window._getDocs = getDocs;
    window._query = query;
    window._orderBy = orderBy;
    window._updateDoc = updateDoc;
    window._firestoreDoc = doc;

    document.getElementById('naDate').value = new Date().toISOString().split('T')[0];
    loadAll();
</script>

<script>
window._naData = [];
window._expandedId = null;

function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'status-toast success'; t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 3000);
}

function getOverallStatus(item) {
    const atts = item.attempts || [];
    const filled = atts.filter(a => a.outcome);
    if (!filled.length) return 'open';
    const last = filled[filled.length - 1];
    if (last.outcome === 'rebooked') return 'rebooked';
    if (filled.length >= 3) return 'exhausted';
    return 'no-answer';
}

async function loadAll() {
    const snap = await window._getDocs(window._query(window._collection(window._db, 'No Accesses'), window._orderBy('createdAt','desc')));
    window._naData = [];
    snap.forEach(d => window._naData.push({ id: d.id, ...d.data() }));
    renderCards();
    updateDuplicateSidebar();
}

async function addNoAccess() {
    const btn = document.getElementById('addBtn');
    const data = {
        date: document.getElementById('naDate').value,
        name: document.getElementById('naName').value,
        jobNumber: document.getElementById('naJob').value,
        postcode: document.getElementById('naPostcode').value.toUpperCase(),
        attempts: [{}, {}, {}],
        createdAt: window._serverTimestamp()
    };
    if(!data.name || !data.postcode) return;
    btn.disabled = true;
    await window._addDoc(window._collection(window._db, 'No Accesses'), data);
    toast('Record Added');
    btn.disabled = false;
    loadAll();
}

function updateDuplicateSidebar() {
    const counts = {};
    const dupContainer = document.getElementById('duplicateList');
    
    // Group by Postcode + Status
    window._naData.forEach(item => {
        const status = getOverallStatus(item);
        const pc = (item.postcode || 'Unknown').trim().toUpperCase();
        if(!pc || pc === '—') return;
        
        const key = `${pc}|${status}`;
        if (!counts[key]) counts[key] = [];
        counts[key].push(item);
    });

    const duplicates = Object.keys(counts).filter(k => counts[k].length > 1);

    if (duplicates.length === 0) {
        dupContainer.innerHTML = `<div style="font-size: 0.8em; color: var(--text-muted)">No postcode/status duplicates.</div>`;
        return;
    }

    dupContainer.innerHTML = duplicates.map(key => {
        const [pc, status] = key.split('|');
        const items = counts[key];
        return `
            <div class="dup-item">
                <div style="display:flex; justify-content:space-between">
                    <span class="dup-postcode">${pc}</span>
                    <span class="dup-count">${items.length} HITS</span>
                </div>
                <div class="dup-info">Status: <b style="text-transform:uppercase">${status}</b></div>
                <div style="font-size: 0.7em; color: var(--text-muted); margin-top: 5px;">
                    Jobs: ${items.map(i => i.jobNumber).join(', ')}
                </div>
            </div>
        `;
    }).join('');
}

function renderCards() {
    const container = document.getElementById('naCards');
    container.innerHTML = window._naData.map(r => {
        const status = getOverallStatus(r);
        const expanded = window._expandedId === r.id;
        return `
            <div class="na-card ${expanded ? 'expanded' : ''}">
                <div class="na-card-header" onclick="window._expandedId = window._expandedId === '${r.id}' ? null : '${r.id}'; renderCards();">
                    <div class="na-card-header-main">
                        <div><div class="na-field-label">Date</div><div class="na-field-value">${r.date}</div></div>
                        <div><div class="na-field-label">Engineer</div><div class="na-field-value">${r.name}</div></div>
                        <div><div class="na-field-label">Postcode</div><div class="na-field-value" style="color:var(--accent-violet)">${r.postcode}</div></div>
                        <div><div class="na-field-label">Status</div><span class="overall-status ${status}">${status}</span></div>
                        <div style="color:var(--text-muted)">▼</div>
                    </div>
                </div>
                <div class="attempts-wrap">
                    <div class="attempts-grid">
                        ${(r.attempts || []).map((a, i) => `
                            <div class="attempt-box">
                                <div class="form-label">Attempt ${i+1}</div>
                                <div style="font-size:0.8em">${a.outcome || 'No data'}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            </div>
        `;
    }).join('');
}
</script>
</body>
</html>
