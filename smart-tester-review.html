<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Tester Declaration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e9edec;
    --paper:#ffffff;
    --ink:#16212b;
    --ink-soft:#4c5b66;
    --line:#d7dedb;
    --navy:#16212b;
    --navy-2:#233240;
    --amber:#c9821e;
    --amber-dark:#a9690f;
    --good:#2f7b5b;
    --bad:#b23a3a;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(22,33,43,0.06) 1px, transparent 1px);
    background-size:22px 22px;
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:40px 16px 80px;
  }
  .tag{
    width:100%;
    max-width:620px;
    background:var(--paper);
    border-radius:var(--radius);
    box-shadow:0 1px 2px rgba(22,33,43,0.06), 0 12px 32px rgba(22,33,43,0.10);
    overflow:hidden;
    position:relative;
  }
  .tag-head{
    background:var(--navy);
    background-image:linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%);
    color:#fff;
    padding:28px 28px 24px 60px;
    position:relative;
  }
  .tag-head::before{
    content:"";
    position:absolute;
    left:22px;
    top:50%;
    transform:translateY(-50%);
    width:16px;
    height:16px;
    border-radius:50%;
    background:var(--bg);
    box-shadow:inset 0 2px 3px rgba(0,0,0,0.35);
  }
  .tag-head .eyebrow{
    font-family:'Space Grotesk',sans-serif;
    font-size:12.5px;
    letter-spacing:0.04em;
    color:var(--amber);
    margin:0 0 4px;
  }
  .tag-head h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:26px;
    font-weight:600;
    margin:0 0 6px;
    line-height:1.15;
  }
  .tag-head p{
    margin:0;
    font-size:13.5px;
    color:#c7d0d8;
    max-width:38ch;
  }
  form{ padding:28px 28px 32px; }
  .field{ margin-bottom:22px; }
  .field label.q{
    display:block;
    font-weight:600;
    font-size:14.5px;
    margin-bottom:8px;
    color:var(--ink);
  }
  .field .hint{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:-4px 0 8px;
  }
  input[type="text"], input[type="date"], textarea{
    width:100%;
    padding:11px 13px;
    border:1px solid var(--line);
    border-radius:8px;
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    color:var(--ink);
    background:#fbfbfa;
    transition:border-color .15s, box-shadow .15s;
  }
  input[type="text"]:focus, input[type="date"]:focus, textarea:focus{
    outline:none;
    border-color:var(--amber);
    box-shadow:0 0 0 3px rgba(201,130,30,0.15);
    background:#fff;
  }
  textarea{ resize:vertical; min-height:82px; }

  .toggle-row{ display:flex; gap:10px; }
  .toggle-row input{ display:none; }
  .toggle-row label{
    flex:1;
    text-align:center;
    padding:11px 0;
    border:1px solid var(--line);
    border-radius:8px;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    color:var(--ink-soft);
    background:#fbfbfa;
    transition:all .15s;
    user-select:none;
  }
  .toggle-row input:checked + label{
    color:#fff;
    border-color:transparent;
  }
  #hasTesterYes:checked + label{ background:var(--good); }
  #hasTesterNo:checked + label{ background:var(--bad); }

  .branch{
    display:none;
    border-left:2px solid var(--line);
    padding-left:16px;
    margin-top:18px;
  }
  .branch.active{ display:block; }

  .file-drop{
    border:1.5px dashed var(--line);
    border-radius:8px;
    padding:18px;
    text-align:center;
    cursor:pointer;
    background:#fbfbfa;
    transition:border-color .15s;
  }
  .file-drop:hover{ border-color:var(--amber); }
  .file-drop span{ display:block; font-size:13px; color:var(--ink-soft); }
  .file-drop strong{ color:var(--ink); }
  #fileInput{ display:none; }
  #preview{
    margin-top:12px;
    max-width:100%;
    max-height:220px;
    border-radius:8px;
    display:none;
    border:1px solid var(--line);
  }

  button[type="submit"]{
    width:100%;
    padding:13px;
    border:none;
    border-radius:8px;
    background:var(--navy);
    color:#fff;
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
    margin-top:6px;
    transition:background .15s, transform .1s;
  }
  button[type="submit"]:hover{ background:var(--navy-2); }
  button[type="submit"]:disabled{ opacity:0.55; cursor:not-allowed; }

  .status{
    margin-top:16px;
    padding:12px 14px;
    border-radius:8px;
    font-size:13.5px;
    display:none;
  }
  .status.ok{ display:block; background:rgba(47,123,91,0.1); color:var(--good); }
  .status.err{ display:block; background:rgba(178,58,58,0.1); color:var(--bad); }

  .foot-link{
    text-align:center;
    margin-top:18px;
    font-size:13px;
  }
  .foot-link a{ color:var(--ink-soft); }
</style>
</head>
<body>

<div class="tag">
  <div class="tag-head">
    <p class="eyebrow">EQUIPMENT DECLARATION</p>
    <h1>Smart Tester</h1>
    <p>Log whether you hold a smart tester, its serial number and calibration status.</p>
  </div>

  <form id="testerForm">
    <div class="field">
      <label class="q" for="name">Your name</label>
      <input type="text" id="name" name="name" required autocomplete="name">
    </div>

    <div class="field">
      <label class="q">Do you have a smart tester?</label>
      <div class="toggle-row">
        <input type="radio" name="hasTester" id="hasTesterYes" value="yes" required>
        <label for="hasTesterYes">Yes</label>
        <input type="radio" name="hasTester" id="hasTesterNo" value="no">
        <label for="hasTesterNo">No</label>
      </div>

      <!-- NO branch -->
      <div class="branch" id="branchNo">
        <div class="field">
          <label class="q" for="noReason">Please explain why</label>
          <textarea id="noReason" name="noReason"></textarea>
        </div>
        <div class="field">
          <label class="q" for="returnedDate">Approx. date returned to SESM</label>
          <p class="hint">Leave blank if it has not been returned.</p>
          <input type="date" id="returnedDate" name="returnedDate">
        </div>
      </div>

      <!-- YES branch -->
      <div class="branch" id="branchYes">
        <div class="field">
          <label class="q" for="serialNumber">Serial number</label>
          <input type="text" id="serialNumber" name="serialNumber">
        </div>
        <div class="field">
          <label class="q">Photo of smart tester showing serial number</label>
          <div class="file-drop" id="fileDrop">
            <span><strong>Click to upload</strong> or drag an image here</span>
            <span id="fileName" style="margin-top:6px;"></span>
          </div>
          <input type="file" id="fileInput" name="file" accept="image/*">
          <img id="preview" alt="Selected image preview">
        </div>
        <div class="field">
          <label class="q" for="calibrationDue">Calibration due date</label>
          <input type="date" id="calibrationDue" name="calibrationDue">
        </div>
      </div>
    </div>

    <button type="submit" id="submitBtn">Submit declaration</button>
    <div class="status" id="statusBox"></div>
  </form>
</div>

<p class="foot-link"><a href="smart-tester-review.html">View submitted declarations →</a></p>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script>
  // ---------------------------------------------------------
  // PASTE YOUR FIREBASE CONFIG HERE (same config on both pages)
  // ---------------------------------------------------------
  const firebaseConfig = {
    apiKey: "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
    authDomain: "oesperformance-a54c0.firebaseapp.com",
    projectId: "oesperformance-a54c0",
    storageBucket: "oesperformance-a54c0.firebasestorage.app",
    messagingSenderId: "484894102454",
    appId: "1:484894102454:web:17535ee497eac2d90d6717",
    measurementId: "G-R56BGZYV8N"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const storage = firebase.storage();
  const COLLECTION = "Smart Tester";

  // Toggle branches
  const branchYes = document.getElementById('branchYes');
  const branchNo = document.getElementById('branchNo');
  document.getElementById('hasTesterYes').addEventListener('change', () => {
    branchYes.classList.add('active');
    branchNo.classList.remove('active');
  });
  document.getElementById('hasTesterNo').addEventListener('change', () => {
    branchNo.classList.add('active');
    branchYes.classList.remove('active');
  });

  // File picker
  const fileDrop = document.getElementById('fileDrop');
  const fileInput = document.getElementById('fileInput');
  const fileName = document.getElementById('fileName');
  const preview = document.getElementById('preview');
  fileDrop.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    const f = fileInput.files[0];
    if (!f) return;
    fileName.textContent = f.name;
    const reader = new FileReader();
    reader.onload = e => { preview.src = e.target.result; preview.style.display = 'block'; };
    reader.readAsDataURL(f);
  });

  // Submit
  const form = document.getElementById('testerForm');
  const submitBtn = document.getElementById('submitBtn');
  const statusBox = document.getElementById('statusBox');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    statusBox.className = 'status';
    statusBox.textContent = '';

    const name = document.getElementById('name').value.trim();
    const hasTester = document.querySelector('input[name="hasTester"]:checked')?.value;

    if (!name || !hasTester) {
      statusBox.className = 'status err';
      statusBox.textContent = 'Please fill in your name and answer the yes/no question.';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting…';

    try {
      const record = {
        name,
        hasTester: hasTester === 'yes',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      if (hasTester === 'no') {
        record.noReason = document.getElementById('noReason').value.trim();
        record.returnedDate = document.getElementById('returnedDate').value || null;
      } else {
        record.serialNumber = document.getElementById('serialNumber').value.trim();
        record.calibrationDue = document.getElementById('calibrationDue').value || null;

        const file = fileInput.files[0];
        if (file) {
          const path = `smart-tester/${Date.now()}_${file.name}`;
          const ref = storage.ref().child(path);
          await ref.put(file);
          record.imageUrl = await ref.getDownloadURL();
          record.imagePath = path;
        }
      }

      await db.collection(COLLECTION).add(record);

      statusBox.className = 'status ok';
      statusBox.textContent = 'Declaration submitted. Thank you.';
      form.reset();
      branchYes.classList.remove('active');
      branchNo.classList.remove('active');
      preview.style.display = 'none';
      fileName.textContent = '';
    } catch (err) {
      console.error(err);
      statusBox.className = 'status err';
      statusBox.textContent = 'Something went wrong submitting your declaration: ' + err.message;
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit declaration';
    }
  });
</script>
</body>
</html>
