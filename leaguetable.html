<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OES League Table</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#080c14;--surface:#0e1520;--card:#121a28;--border:#1e2d42;--gold:#f5c542;--silver:#b0bec5;--bronze:#cd7f32;--blue:#3b82f6;--green:#10b981;--red:#ef4444;--amber:#f59e0b;--text:#e2e8f0;--dim:#64748b;}
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
    body::before{content:'';position:fixed;inset:0;z-index:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(255,255,255,0.012) 3px,rgba(255,255,255,0.012) 4px);pointer-events:none;}
    .wrapper{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:2rem 1.5rem 4rem;}
    .page-header{display:grid;grid-template-columns:1fr auto;align-items:start;gap:1.5rem;margin-bottom:2.5rem;}
    .eyebrow{font-family:'JetBrains Mono',monospace;font-size:.72rem;letter-spacing:3px;color:var(--blue);text-transform:uppercase;margin-bottom:.4rem;}
    h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(3rem,7vw,5.5rem);letter-spacing:2px;line-height:.95;background:linear-gradient(160deg,#fff 0%,#94a3b8 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:1.2rem;}
    .period-pills{display:flex;gap:.5rem;flex-wrap:wrap;}
    .pill{padding:.55rem 1.2rem;border-radius:100px;border:1px solid var(--border);background:var(--surface);color:var(--dim);font-size:.82rem;font-weight:600;cursor:pointer;transition:all .2s ease;}
    .pill:hover{border-color:var(--blue);color:var(--text);}
    .pill.active{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 20px rgba(59,130,246,.4);}
    .header-logo{height:70px;width:auto;filter:drop-shadow(0 4px 12px rgba(0,210,255,.25));margin-top:.2rem;}
    .sort-bar,.team-filter{display:flex;gap:.4rem;margin-bottom:1.2rem;flex-wrap:wrap;align-items:center;}
    .team-filter{margin-bottom:2rem;}
    .bar-label{font-size:.75rem;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:1px;margin-right:.3rem;}
    .sort-btn,.team-btn{padding:.4rem .9rem;border-radius:8px;border:1px solid var(--border);background:transparent;font-size:.78rem;font-weight:600;cursor:pointer;transition:all .15s;color:var(--dim);}
    .sort-btn:hover{border-color:var(--blue);color:var(--text);}
    .sort-btn.active{border-color:var(--blue);color:var(--blue);background:rgba(59,130,246,.1);}
    .team-btn:hover{border-color:#8b5cf6;color:var(--text);}
    .team-btn.active{border-color:#8b5cf6;color:#a78bfa;background:rgba(139,92,246,.1);}
    .state-box{text-align:center;padding:5rem 2rem;color:var(--dim);}
    .state-box .icon{font-size:3rem;margin-bottom:1rem;}
    .state-box.error{color:var(--red);}
    .summary-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:2.5rem;}
    .summary-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.2rem 1.4rem;}
    .summary-label{font-size:.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--dim);font-weight:700;margin-bottom:.4rem;}
    .summary-val{font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:1px;line-height:1;}
    .summary-sub{font-size:.72rem;color:var(--dim);margin-top:.2rem;}
    .glow-blue{color:#60a5fa;}.glow-green{color:var(--green);}.glow-red{color:var(--red);}.glow-purple{color:#a78bfa;}
    .podium-section{margin-bottom:3rem;}
    .section-title{font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:3px;color:var(--dim);text-transform:uppercase;margin-bottom:1.2rem;text-align:center;}
    .podium{display:flex;justify-content:center;align-items:flex-end;gap:1rem;max-width:780px;margin:0 auto;}
    .podium-slot{flex:1;max-width:240px;min-width:0;}
    .podium-card{border-radius:14px;border:1px solid var(--border);background:var(--card);text-align:center;position:relative;overflow:hidden;transition:transform .2s;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem 1rem 1.2rem;}
    .podium-card:hover{transform:translateY(-4px);}
    .podium-card.rank-1{border-color:rgba(245,197,66,.45);background:linear-gradient(160deg,#1c1500 0%,#121a28 55%);box-shadow:0 0 30px rgba(245,197,66,.12);padding:2.2rem 1rem 1.8rem;}
    .podium-card.rank-2{border-color:rgba(176,190,197,.3);}
    .podium-card.rank-3{border-color:rgba(205,127,50,.3);}
    .medal{font-size:2.5rem;display:block;margin-bottom:.7rem;line-height:1;}
    .podium-name{font-weight:700;font-size:1rem;color:var(--text);margin-bottom:.2rem;line-height:1.2;}
    .podium-team{font-size:.72rem;color:var(--dim);margin-bottom:1rem;}
    .podium-value{font-family:'Bebas Neue',sans-serif;font-size:2.6rem;letter-spacing:1px;line-height:1;}
    .podium-card.rank-1 .podium-value{color:var(--gold);}
    .podium-card.rank-2 .podium-value{color:var(--silver);}
    .podium-card.rank-3 .podium-value{color:var(--bronze);}
    .podium-metric{font-size:.68rem;color:var(--dim);margin-top:.35rem;font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
    .table-wrap{border-radius:16px;border:1px solid var(--border);overflow:hidden;background:var(--card);}
    table{width:100%;border-collapse:collapse;}
    thead tr{background:var(--surface);border-bottom:1px solid var(--border);}
    th{padding:1rem 1.2rem;text-align:left;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--dim);white-space:nowrap;cursor:pointer;user-select:none;transition:color .15s;}
    th:hover{color:var(--text);}
    th.sorted{color:var(--blue);}
    th .sa{margin-left:4px;opacity:.5;font-size:.7em;}
    th.sorted .sa{opacity:1;}
    tbody tr{border-bottom:1px solid rgba(30,45,66,.7);transition:background .15s;animation:rowIn .4s ease both;}
    @keyframes rowIn{from{opacity:0;transform:translateX(-10px);}to{opacity:1;transform:translateX(0);}}
    tbody tr:hover{background:rgba(59,130,246,.05);}
    tbody tr:last-child{border-bottom:none;}
    td{padding:.9rem 1.2rem;font-size:.9rem;vertical-align:middle;}
    .col-rank{width:60px;}
    .rank-badge{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.85rem;background:var(--surface);color:var(--dim);border:1px solid var(--border);}
    .rank-badge.gold{background:rgba(245,197,66,.15);color:var(--gold);border-color:rgba(245,197,66,.4);}
    .rank-badge.silver{background:rgba(176,190,197,.15);color:var(--silver);border-color:rgba(176,190,197,.4);}
    .rank-badge.bronze{background:rgba(205,127,50,.15);color:var(--bronze);border-color:rgba(205,127,50,.4);}
    .eng-name{font-weight:600;color:var(--text);}
    .eng-team{font-size:.72rem;color:var(--dim);margin-top:2px;}
    .val-meters{font-family:'JetBrains Mono',monospace;font-size:1.05rem;font-weight:700;color:#60a5fa;}
    .val-avg{font-family:'JetBrains Mono',monospace;font-size:.88rem;font-weight:700;color:#a78bfa;}
    .comp-wrap{min-width:120px;}
    .comp-bar-bg{height:6px;border-radius:3px;background:var(--surface);margin-top:4px;overflow:hidden;}
    .comp-bar-fill{height:100%;border-radius:3px;transition:width .6s cubic-bezier(.4,0,.2,1);}
    .comp-value{font-weight:700;font-size:.88rem;}
    .abort-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:100px;font-size:.8rem;font-weight:700;border:1px solid;}
    .abort-0{background:rgba(16,185,129,.1);color:var(--green);border-color:rgba(16,185,129,.3);}
    .abort-lo{background:rgba(245,158,11,.1);color:var(--amber);border-color:rgba(245,158,11,.3);}
    .abort-hi{background:rgba(239,68,68,.1);color:var(--red);border-color:rgba(239,68,68,.3);}
    .att-chip{display:inline-block;padding:3px 8px;border-radius:6px;font-size:.72rem;font-weight:700;border:1px solid;margin:1px;}
    .att-in{background:rgba(16,185,129,.1);color:var(--green);border-color:rgba(16,185,129,.3);}
    .att-hol{background:rgba(59,130,246,.1);color:#93c5fd;border-color:rgba(59,130,246,.3);}
    .att-sick{background:rgba(239,68,68,.1);color:var(--red);border-color:rgba(239,68,68,.3);}
    .att-abs{background:rgba(100,116,139,.1);color:var(--dim);border-color:rgba(100,116,139,.3);}
    .days-count{font-family:'JetBrains Mono',monospace;font-size:.82rem;color:var(--dim);}
    @media(max-width:900px){.podium{gap:.6rem;}table{font-size:.82rem;}th,td{padding:.7rem .8rem;}.header-logo{height:50px;}h1{font-size:3rem;}}
    @media(max-width:600px){.podium{flex-direction:column;align-items:center;}.podium-slot{max-width:100%;width:100%;}th:nth-child(n+7),td:nth-child(n+7){display:none;}.header-logo{height:40px;}}
  </style>
</head>
<body>
<div class="wrapper">
  <div class="page-header">
    <div>
      <div class="eyebrow">OES Performance System</div>
      <h1>League<br>Table</h1>
      <div class="period-pills">
        <button class="pill" data-period="curr-week">This Week</button>
        <button class="pill" data-period="prev-week">Last Week</button>
        <button class="pill active" data-period="curr-month">This Month</button>
        <button class="pill" data-period="prev-month">Last Month</button>
      </div>
    </div>
    <img src="https://www.dropbox.com/scl/fi/kkujm1u6y7vvnp7luq8d7/ngu-main-white.png?rlkey=kgq2uh48qh4xssh4vlbz868lr&st=1numuw4d&raw=1" alt="NGU" class="header-logo"/>
  </div>

  <div class="sort-bar">
    <span class="bar-label">Rank by:</span>
    <button class="sort-btn active" data-sort="meters">Meters</button>
    <button class="sort-btn" data-sort="completion">Completion %</button>
    <button class="sort-btn" data-sort="avgDay">Avg / Day</button>
    <button class="sort-btn" data-sort="aborts">Fewest Aborts</button>
  </div>

  <div class="team-filter">
    <span class="bar-label">Team:</span>
    <button class="team-btn active" data-team="all">All Teams</button>
    <button class="team-btn" data-team="Tom Green">Tom Green</button>
    <button class="team-btn" data-team="Richard Wiecko">Richard Wiecko</button>
    <button class="team-btn" data-team="Scott Carson">Scott Carson</button>
    <button class="team-btn" data-team="Scott Carson - Scot">Scott Carson - Scot</button>
    <button class="team-btn" data-team="Stuart Whyte">Stuart Whyte</button>
  </div>

  <div class="summary-strip">
    <div class="summary-card"><div class="summary-label">Total Meters</div><div class="summary-val glow-blue" id="sumMeters">—</div><div class="summary-sub" id="sumPeriod"></div></div>
    <div class="summary-card"><div class="summary-label">Avg Completion</div><div class="summary-val glow-green" id="sumComp">—</div><div class="summary-sub">across active engineers</div></div>
    <div class="summary-card"><div class="summary-label">Total Aborts</div><div class="summary-val glow-red" id="sumAborts">—</div><div class="summary-sub" id="sumAbortSub"></div></div>
    <div class="summary-card"><div class="summary-label">Engineers Active</div><div class="summary-val glow-purple" id="sumEng">—</div><div class="summary-sub">with recorded data</div></div>
  </div>

  <div class="podium-section">
    <div class="section-title">Top 3 &mdash; <span id="podiumMetricLabel">Meters Installed</span></div>
    <div class="podium" id="podium"></div>
  </div>

  <div id="stateBox" class="state-box"><div class="icon">&#9203;</div><div>Loading data&hellip;</div></div>

  <div class="table-wrap" id="tableWrap" style="display:none;">
    <table>
      <thead>
        <tr>
          <th class="col-rank">#</th>
          <th data-col="name">Engineer <span class="sa"></span></th>
          <th data-col="meters" class="sorted">Meters <span class="sa">&#8595;</span></th>
          <th data-col="avgDay">Avg / Day <span class="sa"></span></th>
          <th data-col="completion">Completion <span class="sa"></span></th>
          <th data-col="aborts">Aborts <span class="sa"></span></th>
          <th data-col="daysActive">Days Active <span class="sa"></span></th>
          <th>Attendance</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script type="module">
  import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const cfg={apiKey:"AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",authDomain:"oesperformance-a54c0.firebaseapp.com",projectId:"oesperformance-a54c0",storageBucket:"oesperformance-a54c0.firebasestorage.app",messagingSenderId:"484894102454",appId:"1:484894102454:web:17535ee497eac2d90d6717"};
  const app=getApps().find(a=>a.name==='lt')||initializeApp(cfg,'lt');
  const db=getFirestore(app);

  let period='curr-month', sortBy='meters', team='all', rows=[];

  // Normalise FTL 4 / FTL4 -> Tom Green
  const normTL=tl=>/^ftl\s*4$/i.test((tl||'').trim())?'Tom Green':(tl||'Unknown');

  const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  function sowDate(d){const day=d.getDay();return new Date(d.getFullYear(),d.getMonth(),d.getDate()-(day===0?6:day-1));}
  function addD(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
  function weekdays(s,e){const out=[];let d=new Date(s);while(d<=e){if(d.getDay()!==0&&d.getDay()!==6)out.push(fmt(d));d.setDate(d.getDate()+1);}return out;}
  function range(p){
    const t=new Date();
    if(p==='curr-week')return{s:fmt(sowDate(t)),e:fmt(t)};
    if(p==='prev-week'){const ws=sowDate(t);const s=addD(ws,-7);let e=addD(ws,-1);if(e.getDay()===6)e=addD(e,-1);if(e.getDay()===0)e=addD(e,-2);return{s:fmt(s),e:fmt(e)};}
    if(p==='curr-month')return{s:fmt(new Date(t.getFullYear(),t.getMonth(),1)),e:fmt(t)};
    return{s:fmt(new Date(t.getFullYear(),t.getMonth()-1,1)),e:fmt(new Date(t.getFullYear(),t.getMonth(),0))};
  }

  async function fetchAll(p){
    const{s,e}=range(p);
    const wd=weekdays(new Date(s),new Date(e));
    const wdSet=new Set(wd);
    const[pSnap,aSnap,abSnap]=await Promise.all([
      getDocs(query(collection(db,'performance'),where('date','>=',s),where('date','<=',e),orderBy('date'))),
      getDocs(query(collection(db,'attendance'), where('date','>=',s),where('date','<=',e))),
      getDocs(query(collection(db,'aborts'),     where('date','>=',s),where('date','<=',e)))
    ]);
    const map={};
    pSnap.forEach(doc=>{
      const d=doc.data();
      if(!d.engineerName||!wdSet.has(d.date))return;
      const k=d.engineerName.trim();
      // Normalise FTL 4 -> Tom Green
      const tlNorm=normTL(d.teamLeader);
      if(!map[k])map[k]={name:k,team:tlNorm,meters:0,jobs:0,completed:0,aborts:0,days:new Set(),att:{}};
      const r=map[k];
      r.meters+=Number(d.meters||0);r.jobs+=Number(d.jobs||0);r.completed+=Number(d.completed||0);r.days.add(d.date);
    });
    abSnap.forEach(doc=>{
      const d=doc.data();
      if(!d.engineer||!wdSet.has(d.date))return;
      const k=d.engineer.trim();
      if(map[k])map[k].aborts+=Number(d.total)||1;
    });
    aSnap.forEach(doc=>{
      const d=doc.data();
      if(!d.engineerName||!wdSet.has(d.date))return;
      const k=d.engineerName.trim();
      if(!map[k])return;
      const code=(d.attendance||'X').toUpperCase();
      map[k].att[code]=(map[k].att[code]||0)+1;
    });
    rows=Object.values(map).filter(r=>r.meters>0||r.jobs>0).map(r=>{
      const da=r.days.size;
      return{name:r.name,team:r.team,meters:r.meters,jobs:r.jobs,completed:r.completed,aborts:r.aborts,daysActive:da,totalWd:wd.length,
        completion:r.jobs>0?+((r.completed/r.jobs)*100).toFixed(1):0,
        avgDay:da>0?+(r.meters/da).toFixed(1):0,
        daysIn:r.att['X']||0,daysHol:(r.att['H']||0)+(r.att['H/H']||0),daysSick:r.att['SICK']||0,
        daysAbs:(r.att['AAUP']||0)+(r.att['AAP']||0)+(r.att['TOFD']||0)};
    });
    return{s,e,wd};
  }

  function sorted(){
    let out=team==='all'?[...rows]:rows.filter(r=>r.team===team);
    out.sort((a,b)=>{
      if(sortBy==='meters')return b.meters-a.meters;
      if(sortBy==='completion')return b.completion!==a.completion?b.completion-a.completion:b.meters-a.meters;
      if(sortBy==='avgDay')return b.avgDay!==a.avgDay?b.avgDay-a.avgDay:b.meters-a.meters;
      if(sortBy==='aborts')return a.aborts!==b.aborts?a.aborts-b.aborts:b.meters-a.meters;
      return b.meters-a.meters;
    });
    return out;
  }

  const compColor=p=>p>=90?'#10b981':p>=75?'#f59e0b':'#ef4444';
  const abortCls=n=>n===0?'abort-0':n<=2?'abort-lo':'abort-hi';
  const rnkCls=i=>i===0?'gold':i===1?'silver':i===2?'bronze':'';
  function podiumVal(r){
    if(sortBy==='meters')return r.meters.toLocaleString();
    if(sortBy==='completion')return r.completion+'%';
    if(sortBy==='avgDay')return r.avgDay;
    if(sortBy==='aborts')return r.aborts;
    return r.meters.toLocaleString();
  }
  const podiumLbl=()=>({meters:'Meters Installed',completion:'Completion Rate',avgDay:'Avg Meters / Day',aborts:'Fewest Aborts'}[sortBy]);
  function attHtml(r){
    const p=[];
    if(r.daysIn)p.push(`<span class="att-chip att-in">${r.daysIn}d in</span>`);
    if(r.daysHol)p.push(`<span class="att-chip att-hol">${r.daysHol}d hol</span>`);
    if(r.daysSick)p.push(`<span class="att-chip att-sick">${r.daysSick}d sick</span>`);
    if(r.daysAbs)p.push(`<span class="att-chip att-abs">${r.daysAbs}d abs</span>`);
    return p.join('')||'<span style="color:var(--dim);font-size:.78rem;">&#8212;</span>';
  }

  function render(){
    const data=sorted();
    const sb=document.getElementById('stateBox');
    const tw=document.getElementById('tableWrap');
    const pod=document.getElementById('podium');
    document.getElementById('podiumMetricLabel').textContent=podiumLbl();
    if(!data.length){
      sb.innerHTML='<div class="icon">&#128235;</div><div>No data found for this period.</div>';
      sb.style.display='block';tw.style.display='none';pod.innerHTML='';return;
    }
    sb.style.display='none';tw.style.display='block';
    document.getElementById('sumMeters').textContent=data.reduce((s,r)=>s+r.meters,0).toLocaleString();
    document.getElementById('sumComp').textContent=(data.reduce((s,r)=>s+r.completion,0)/data.length).toFixed(1)+'%';
    document.getElementById('sumAborts').textContent=data.reduce((s,r)=>s+r.aborts,0);
    document.getElementById('sumEng').textContent=data.length;
    const slots=
      data.length>=3?[{r:data[1],rank:2,m:'🥈'},{r:data[0],rank:1,m:'🥇'},{r:data[2],rank:3,m:'🥉'}]:
      data.length===2?[{r:null,rank:null,m:''},{r:data[0],rank:1,m:'🥇'},{r:data[1],rank:2,m:'🥈'}]:
      [{r:null,rank:null,m:''},{r:data[0],rank:1,m:'🥇'},{r:null,rank:null,m:''}];
    pod.innerHTML=slots.map(sl=>{
      if(!sl.r)return`<div class="podium-slot"></div>`;
      const pc=sl.rank===1?'rank-1':sl.rank===2?'rank-2':'rank-3';
      return`<div class="podium-slot"><div class="podium-card ${pc}"><span class="medal">${sl.m}</span><div class="podium-name">${sl.r.name}</div><div class="podium-team">${sl.r.team}</div><div class="podium-value">${podiumVal(sl.r)}</div><div class="podium-metric">${podiumLbl()}</div></div></div>`;
    }).join('');
    document.getElementById('tableBody').innerHTML=data.map((r,i)=>
      `<tr style="animation-delay:${Math.min(i*25,600)}ms">
        <td class="col-rank"><div class="rank-badge ${rnkCls(i)}">${i+1}</div></td>
        <td><div class="eng-name">${r.name}</div><div class="eng-team">${r.team}</div></td>
        <td><span class="val-meters">${r.meters.toLocaleString()}</span></td>
        <td><span class="val-avg">${r.avgDay}</span></td>
        <td><div class="comp-wrap"><span class="comp-value" style="color:${compColor(r.completion)}">${r.completion}%</span><div class="comp-bar-bg"><div class="comp-bar-fill" style="width:${Math.min(r.completion,100)}%;background:${compColor(r.completion)}"></div></div></div></td>
        <td><span class="abort-pill ${abortCls(r.aborts)}">${r.aborts===0?'&#10003; 0':r.aborts}</span></td>
        <td><span class="days-count">${r.daysActive} / ${r.totalWd}</span></td>
        <td>${attHtml(r)}</td>
      </tr>`
    ).join('');
    document.querySelectorAll('thead th[data-col]').forEach(th=>{th.classList.remove('sorted');th.querySelector('.sa').textContent='';});
    const colMap={meters:'meters',completion:'completion',aborts:'aborts',avgDay:'avgDay'};
    const ath=document.querySelector(`thead th[data-col="${colMap[sortBy]}"]`);
    if(ath){ath.classList.add('sorted');ath.querySelector('.sa').textContent=sortBy==='aborts'?'↑':'↓';}
  }

  async function load(){
    const sb=document.getElementById('stateBox');
    sb.innerHTML='<div class="icon">&#9203;</div><div>Loading data&hellip;</div>';
    sb.className='state-box';sb.style.display='block';
    document.getElementById('tableWrap').style.display='none';
    document.getElementById('podium').innerHTML='';
    try{
      const{s,e,wd}=await fetchAll(period);
      document.getElementById('sumPeriod').textContent=`${s} \u2192 ${e}`;
      document.getElementById('sumAbortSub').textContent=`${wd.length} working days`;
      render();
    }catch(err){
      console.error(err);
      sb.className='state-box error';
      sb.innerHTML=`<div class="icon">&#9888;</div><div>Error: ${err.message}</div>`;
      sb.style.display='block';
    }
  }

  document.querySelectorAll('.pill').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));b.classList.add('active');period=b.dataset.period;load();}));
  document.querySelectorAll('.sort-btn').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.sort-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');sortBy=b.dataset.sort;render();}));
  document.querySelectorAll('.team-btn').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.team-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');team=b.dataset.team;render();}));
  document.querySelectorAll('thead th[data-col]').forEach(th=>th.addEventListener('click',()=>{
    const m={meters:'meters',completion:'completion',aborts:'aborts',avgDay:'avgDay'};
    const s=m[th.dataset.col];if(!s)return;
    sortBy=s;
    document.querySelectorAll('.sort-btn').forEach(x=>x.classList.remove('active'));
    const mb=document.querySelector(`.sort-btn[data-sort="${s}"]`);
    if(mb)mb.classList.add('active');
    render();
  }));

  load();
</script>
</body>
</html>
