<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiecko's Big Night Out</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #ffffff;
            min-height: 100vh;
        }
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #1a1a2e; }
        ::-webkit-scrollbar-thumb { background: #4a5568; border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: #718096; }
        .upload-label { cursor: pointer; }
    </style>
</head>
<body class="antialiased pb-16">

    <header class="text-center py-16 px-4">
        <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight mb-4 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500">
            Wiecko's Big Night Out
        </h1>
        <p class="text-xl md:text-2xl text-gray-300 font-semibold mb-2">A Story in 6 Parts</p>
        <p class="text-sm text-gray-400">Click "Upload Image" on any section to add your photos.</p>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10" id="storyboard-container">
            <!-- Sections will be generated by JS -->
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
            authDomain: "oesperformance-a54c0.firebaseapp.com",
            projectId: "oesperformance-a54c0",
            storageBucket: "oesperformance-a54c0.firebasestorage.app",
            messagingSenderId: "484894102454",
            appId: "1:484894102454:web:17535ee497eac2d90d6717",
            measurementId: "G-R56BGZYV8N"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        const storyParts = [
            { id: 'part1', title: 'The Start', desc: "Fresh, dressed to impress in the 'Made in 1986' tee, and ready to party!" },
            { id: 'part2', title: 'The Arrival', desc: "Entering the scene with a giant, dangerously colorful cocktail. Confidence is high." },
            { id: 'part3', title: 'The Mishap', desc: "Gravity strikes! Losing balance as the glorious cocktail goes flying." },
            { id: 'part4', title: 'The Defeat', desc: "Down for the count on the hallway floor. The night took a sudden turn." },
            { id: 'part5', title: 'The Hangover', desc: "Morning regrets. Armed with water, painkillers, and an emergency bag of crisps." },
            { id: 'part6', title: 'The Cleanup', desc: "The reality of the morning after. Tea, toast, mop duty, and a lot of bin bags." }
        ];

        const container = document.getElementById('storyboard-container');

        // Render sections
        storyParts.forEach((part, index) => {
            const article = document.createElement('article');
            article.className = "bg-[#0f172a] rounded-2xl shadow-2xl shadow-black/50 overflow-hidden transform transition-all duration-300 hover:shadow-purple-500/20 group flex flex-col relative";
            article.innerHTML = `
                <div class="overflow-hidden relative pb-[120%] bg-gray-800 flex items-center justify-center">
                    <img id="img-${part.id}" src="https://placehold.co/600x720/1f2937/a1a1aa?text=No+Image+Yet" alt="${part.title}" class="absolute inset-0 w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
                    
                    <div id="loading-${part.id}" class="absolute inset-0 bg-black/70 flex items-center justify-center hidden">
                        <span class="text-white font-bold animate-pulse">Uploading...</span>
                    </div>
                </div>
                <div class="p-6 flex-grow flex flex-col justify-between">
                    <div>
                        <span class="text-purple-400 text-sm font-bold tracking-wider uppercase mb-2 block">Part ${index + 1}</span>
                        <h2 class="text-2xl font-bold mb-3 text-white">${part.title}</h2>
                        <p class="text-gray-400 leading-relaxed mb-4">${part.desc}</p>
                    </div>
                    <div class="mt-auto">
                        <input type="file" id="file-${part.id}" accept="image/*" class="hidden">
                        <label for="file-${part.id}" class="upload-label block w-full text-center bg-purple-600 hover:bg-purple-500 text-white font-semibold py-2 px-4 rounded-lg transition-colors">
                            Upload Image
                        </label>
                    </div>
                </div>
            `;
            container.appendChild(article);

            // Handle File Upload
            document.getElementById(`file-${part.id}`).addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const loadingEl = document.getElementById(`loading-${part.id}`);
                const imgEl = document.getElementById(`img-${part.id}`);
                
                try {
                    loadingEl.classList.remove('hidden');
                    
                    // Upload to Storage
                    const storageRef = ref(storage, `wiecko_images/${part.id}_${Date.now()}_${file.name}`);
                    await uploadBytes(storageRef, file);
                    const downloadURL = await getDownloadURL(storageRef);
                    
                    // Save to Firestore
                    await setDoc(doc(db, 'wiecko images', part.id), { url: downloadURL });
                    
                    // Update UI
                    imgEl.src = downloadURL;
                } catch (error) {
                    console.error("Error uploading image: ", error);
                    alert("Failed to upload image. Please check your Firebase rules.");
                } finally {
                    loadingEl.classList.add('hidden');
                }
            });
        });

        // Load existing images on startup
        async function loadImages() {
            for (const part of storyParts) {
                try {
                    const docSnap = await getDoc(doc(db, 'wiecko images', part.id));
                    if (docSnap.exists() && docSnap.data().url) {
                        document.getElementById(`img-${part.id}`).src = docSnap.data().url;
                    }
                } catch (error) {
                    console.error(`Error loading image for ${part.id}:`, error);
                }
            }
        }

        loadImages();
    </script>
</body>
</html>
