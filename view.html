<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Engineers - OES Performance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        .back-link-top {
            position: absolute;
            left: 0;
            top: 0;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .back-link-top:hover {
            text-decoration: underline;
        }

        .logo {
            font-size: 2em;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .filter-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .filter-dropdown {
            min-width: 200px;
        }

        .filter-dropdown select {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
        }

        .stats-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
        }

        .engineers-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
            overflow-x: auto;
            display: block;
        }

        .engineers-table thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: table;
            width: 100%;
            table-layout: fixed;
        }

        .engineers-table tbody {
            display: table;
            width: 100%;
            table-layout: fixed;
        }

        .engineers-table th {
            padding: 15px 10px;
            text-align: left;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
        }

        .engineers-table th:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .sort-indicator {
            margin-left: 5px;
            font-size: 0.8em;
        }

        .engineers-table tbody tr {
            border-bottom: 1px solid #e0e0e0;
            cursor: pointer;
            transition: background-color 0.2s;
            display: table;
            width: 100%;
            table-layout: fixed;
        }

        .engineers-table tbody tr:hover {
            background-color: #f8f9fa;
        }

        .engineers-table td {
            padding: 15px 10px;
        }

        .engineer-name {
            font-weight: 600;
            color: #333;
        }

        .team-leader-badge {
            display: inline-block;
            padding: 4px 12px;
            background: #667eea;
            color: white;
            border-radius: 12px;
            font-size: 0.85em;
        }

        .contract-badge {
            display: inline-block;
            padding: 4px 12px;
            background: #28a745;
            color: white;
            border-radius: 12px;
            font-size: 0.85em;
            margin-left: 5px;
        }

        .contract-badge.sp {
            background: #007bff;
        }

        .contract-badge.edf {
            background: #fd7e14;
        }

        .email-text {
            color: #666;
            font-size: 0.9em;
        }

        .no-email {
            color: #999;
            font-style: italic;
            font-size: 0.9em;
        }

        .password-display {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .password-text {
            font-family: 'Courier New', monospace;
            color: #333;
            font-size: 0.9em;
            background: #f0f0f0;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .no-password {
            color: #999;
            font-style: italic;
            font-size: 0.9em;
        }

        .date-added {
            color: #666;
            font-size: 0.9em;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 1.1em;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            margin-bottom: 25px;
        }

        .modal-title {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .modal-subtitle {
            color: #666;
            font-size: 0.95em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .password-input-group {
            position: relative;
        }

        .generate-password-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: #667eea;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.85em;
            cursor: pointer;
            transition: background 0.2s;
        }

        .generate-password-btn:hover {
            background: #5568d3;
        }

        .password-note {
            font-size: 0.85em;
            color: #666;
            margin-top: 5px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover,
        .close:focus {
            color: #000;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .engineers-table {
                font-size: 0.85em;
            }

            .engineers-table th,
            .engineers-table td {
                padding: 10px 5px;
            }

            .filter-section {
                flex-direction: column;
            }

            .modal-content {
                margin: 10% auto;
                width: 95%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="index.html" class="back-link-top">← Back to Home</a>
            <div class="logo">OES Performance</div>
            <div class="subtitle">View All Engineers</div>
        </div>

        <div class="stats-section" id="statsSection" style="display: none;">
            <div class="stat-card">
                <div class="stat-label">Total Engineers</div>
                <div class="stat-value" id="totalEngineers">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Team Leaders</div>
                <div class="stat-value" id="totalTeamLeaders">0</div>
            </div>
        </div>

        <div class="filter-section">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search engineers..." oninput="filterEngineers()">
            </div>
            <div class="filter-dropdown">
                <select id="teamLeaderFilter" onchange="filterEngineers()">
                    <option value="all">All Team Leaders</option>
                </select>
            </div>
        </div>

        <div id="loadingDiv" class="loading">Loading engineers...</div>
        <div id="noResultsDiv" class="no-results" style="display: none;">No engineers found.</div>

        <table class="engineers-table" id="engineersTable" style="display: none;">
            <thead>
                <tr>
                    <th onclick="sortTable('name')" style="width: 20%;">Engineer Name <span class="sort-indicator" id="sort-name"></span></th>
                    <th onclick="sortTable('teamLeader')" style="width: 15%;">Team Leader <span class="sort-indicator" id="sort-teamLeader"></span></th>
                    <th onclick="sortTable('email')" style="width: 20%;">Email <span class="sort-indicator" id="sort-email"></span></th>
                    <th onclick="sortTable('contract')" style="width: 10%;">Contract <span class="sort-indicator" id="sort-contract"></span></th>
                    <th style="width: 15%;">Password</th>
                    <th onclick="sortTable('date')" style="width: 15%;">Date Added <span class="sort-indicator" id="sort-date"></span></th>
                </tr>
            </thead>
            <tbody id="engineersBody">
            </tbody>
        </table>

        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div class="modal-header">
                <div class="modal-title" id="modalEngineerName">Engineer Name</div>
                <div class="modal-subtitle">Update engineer details</div>
            </div>
            
            <form id="editForm" onsubmit="saveEngineerDetails(event)">
                <div class="form-group">
                    <label for="emailInput">Email Address</label>
                    <input type="email" id="emailInput" placeholder="engineer@example.com">
                </div>

                <div class="form-group">
                    <label for="contractSelect">Contract</label>
                    <select id="contractSelect">
                        <option value="">Not specified</option>
                        <option value="OES">OES</option>
                        <option value="SP">SP</option>
                        <option value="EDF">EDF</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="passwordInput">Password</label>
                    <div class="password-input-group">
                        <input type="text" id="passwordInput" placeholder="Enter password">
                        <button type="button" class="generate-password-btn" onclick="generatePassword()">Generate</button>
                    </div>
                    <div class="password-note">Leave blank to keep existing password unchanged</div>
                </div>

                <div class="modal-buttons">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveBtn">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
            authDomain: "oesperformance-a54c0.firebaseapp.com",
            projectId: "oesperformance-a54c0",
            storageBucket: "oesperformance-a54c0.firebasestorage.app",
            messagingSenderId: "484894102454",
            appId: "1:484894102454:web:17535ee497eac2d90d6717",
            measurementId: "G-R56BGZYV8N"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allEngineers = [];
        let filteredEngineers = [];
        let sortColumn = 'name';
        let sortDirection = 'asc';
        let currentEngineerId = null;

        // Generate random password
        window.generatePassword = function() {
            const length = 10;
            const charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%";
            let password = "";
            for (let i = 0; i < length; i++) {
                password += charset.charAt(Math.floor(Math.random() * charset.length));
            }
            document.getElementById('passwordInput').value = password;
        }

        // Load engineers
        async function loadEngineers() {
            try {
                const querySnapshot = await getDocs(collection(db, "engineers"));
                
                allEngineers = [];
                querySnapshot.forEach((doc) => {
                    allEngineers.push({
                        id: doc.id,
                        ...doc.data()
                    });
                });

                // Get unique team leaders
                const teamLeaders = [...new Set(allEngineers.map(e => e.teamLeader))].sort();
                
                // Populate team leader filter
                const teamLeaderFilter = document.getElementById('teamLeaderFilter');
                teamLeaders.forEach(tl => {
                    const option = document.createElement('option');
                    option.value = tl;
                    option.textContent = tl;
                    teamLeaderFilter.appendChild(option);
                });

                // Update stats
                document.getElementById('totalEngineers').textContent = allEngineers.length;
                document.getElementById('totalTeamLeaders').textContent = teamLeaders.length;
                document.getElementById('statsSection').style.display = 'grid';

                filteredEngineers = [...allEngineers];
                displayEngineers();

                document.getElementById('loadingDiv').style.display = 'none';

            } catch (error) {
                console.error("Error loading engineers:", error);
                document.getElementById('loadingDiv').textContent = 'Error loading engineers. Please refresh the page.';
            }
        }

        function displayEngineers() {
            const tbody = document.getElementById('engineersBody');
            tbody.innerHTML = '';

            if (filteredEngineers.length === 0) {
                document.getElementById('engineersTable').style.display = 'none';
                document.getElementById('noResultsDiv').style.display = 'block';
                return;
            }

            document.getElementById('noResultsDiv').style.display = 'none';
            document.getElementById('engineersTable').style.display = 'block';

            // Sort engineers
            const sortedEngineers = [...filteredEngineers].sort((a, b) => {
                let aVal, bVal;

                switch(sortColumn) {
                    case 'name':
                        aVal = a.engineerName.toLowerCase();
                        bVal = b.engineerName.toLowerCase();
                        break;
                    case 'teamLeader':
                        aVal = a.teamLeader.toLowerCase();
                        bVal = b.teamLeader.toLowerCase();
                        break;
                    case 'email':
                        aVal = (a.email || '').toLowerCase();
                        bVal = (b.email || '').toLowerCase();
                        break;
                    case 'contract':
                        aVal = (a.contract || '').toLowerCase();
                        bVal = (b.contract || '').toLowerCase();
                        break;
                    case 'date':
                        aVal = a.createdAt ? a.createdAt.seconds : 0;
                        bVal = b.createdAt ? b.createdAt.seconds : 0;
                        break;
                    default:
                        aVal = a.engineerName.toLowerCase();
                        bVal = b.engineerName.toLowerCase();
                }

                if (aVal < bVal) return sortDirection === 'asc' ? -1 : 1;
                if (aVal > bVal) return sortDirection === 'asc' ? 1 : -1;
                return 0;
            });

            // Update sort indicators
            document.querySelectorAll('.sort-indicator').forEach(el => el.textContent = '');
            const indicator = document.getElementById(`sort-${sortColumn}`);
            if (indicator) {
                indicator.textContent = sortDirection === 'asc' ? '▲' : '▼';
            }

            // Display rows
            sortedEngineers.forEach(engineer => {
                const row = tbody.insertRow();
                row.onclick = () => openEditModal(engineer);
                
                const dateAdded = engineer.createdAt 
                    ? new Date(engineer.createdAt.seconds * 1000).toLocaleDateString('en-GB')
                    : 'Unknown';

                const emailDisplay = engineer.email 
                    ? `<span class="email-text">${engineer.email}</span>`
                    : '<span class="no-email">No email</span>';

                const contractDisplay = engineer.contract 
                    ? `<span class="contract-badge ${engineer.contract.toLowerCase()}">${engineer.contract}</span>`
                    : '<span class="no-email">Not set</span>';

                const passwordDisplay = engineer.password 
                    ? `<div class="password-display"><span class="password-text">${engineer.password}</span></div>`
                    : '<span class="no-password">No password set</span>';

                row.innerHTML = `
                    <td class="engineer-name">${engineer.engineerName}</td>
                    <td><span class="team-leader-badge">${engineer.teamLeader}</span></td>
                    <td>${emailDisplay}</td>
                    <td>${contractDisplay}</td>
                    <td>${passwordDisplay}</td>
                    <td class="date-added">${dateAdded}</td>
                `;
            });
        }

        window.openEditModal = function(engineer) {
            currentEngineerId = engineer.id;
            document.getElementById('modalEngineerName').textContent = engineer.engineerName;
            document.getElementById('emailInput').value = engineer.email || '';
            document.getElementById('contractSelect').value = engineer.contract || '';
            document.getElementById('passwordInput').value = engineer.password || '';
            document.getElementById('editModal').style.display = 'block';
        }

        window.closeModal = function() {
            document.getElementById('editModal').style.display = 'none';
            currentEngineerId = null;
        }

        window.saveEngineerDetails = async function(event) {
            event.preventDefault();
            
            const saveBtn = document.getElementById('saveBtn');
            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';

            try {
                const email = document.getElementById('emailInput').value.trim();
                const contract = document.getElementById('contractSelect').value;
                const password = document.getElementById('passwordInput').value.trim();

                const updateData = {
                    email: email || null,
                    contract: contract || null
                };

                // Only update password if a value was entered
                if (password) {
                    updateData.password = password;
                }

                const engineerRef = doc(db, "engineers", currentEngineerId);
                await updateDoc(engineerRef, updateData);

                // Update local data
                const engineerIndex = allEngineers.findIndex(e => e.id === currentEngineerId);
                if (engineerIndex !== -1) {
                    allEngineers[engineerIndex].email = email || null;
                    allEngineers[engineerIndex].contract = contract || null;
                    if (password) {
                        allEngineers[engineerIndex].password = password;
                    }
                }

                closeModal();
                filterEngineers(); // Refresh display

                alert('Engineer details updated successfully!');

            } catch (error) {
                console.error("Error updating engineer:", error);
                alert('Error updating engineer details. Please try again.');
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = 'Save Changes';
            }
        }

        window.sortTable = function(column) {
            if (sortColumn === column) {
                sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                sortColumn = column;
                sortDirection = 'asc';
            }
            displayEngineers();
        }

        window.filterEngineers = function() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const teamLeaderFilter = document.getElementById('teamLeaderFilter').value;

            filteredEngineers = allEngineers.filter(engineer => {
                const matchesSearch = engineer.engineerName.toLowerCase().includes(searchTerm) ||
                                    (engineer.email && engineer.email.toLowerCase().includes(searchTerm));
                const matchesTeamLeader = teamLeaderFilter === 'all' || engineer.teamLeader === teamLeaderFilter;
                return matchesSearch && matchesTeamLeader;
            });

            displayEngineers();
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('editModal');
            if (event.target === modal) {
                closeModal();
            }
        }

        // Load engineers on page load
        loadEngineers();
    </script>
</body>
</html>
