<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Engineers - OES Performance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        .back-link-top {
            position: absolute;
            left: 0;
            top: 0;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .back-link-top:hover {
            text-decoration: underline;
        }

        .logo {
            font-size: 2em;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .filter-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .filter-dropdown {
            min-width: 200px;
        }

        .filter-dropdown select {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
        }

        .stats-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
        }

        .engineers-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }

        .engineers-table thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .engineers-table th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
        }

        .engineers-table th:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .sort-indicator {
            margin-left: 5px;
            font-size: 0.8em;
        }

        .engineers-table tbody tr {
            border-bottom: 1px solid #e0e0e0;
        }

        .engineers-table tbody tr:hover {
            background-color: #f8f9fa;
        }

        .engineers-table td {
            padding: 15px;
        }

        .engineer-name {
            font-weight: 600;
            color: #333;
        }

        .team-leader-badge {
            display: inline-block;
            padding: 4px 12px;
            background: #667eea;
            color: white;
            border-radius: 12px;
            font-size: 0.85em;
        }

        .date-added {
            color: #666;
            font-size: 0.9em;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 1.1em;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .engineers-table {
                font-size: 0.9em;
            }

            .filter-section {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="index.html" class="back-link-top">← Back to Home</a>
            <div class="logo">OES Performance</div>
            <div class="subtitle">View All Engineers</div>
        </div>

        <div class="stats-section" id="statsSection" style="display: none;">
            <div class="stat-card">
                <div class="stat-label">Total Engineers</div>
                <div class="stat-value" id="totalEngineers">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Team Leaders</div>
                <div class="stat-value" id="totalTeamLeaders">0</div>
            </div>
        </div>

        <div class="filter-section">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search engineers..." oninput="filterEngineers()">
            </div>
            <div class="filter-dropdown">
                <select id="teamLeaderFilter" onchange="filterEngineers()">
                    <option value="all">All Team Leaders</option>
                </select>
            </div>
        </div>

        <div id="loadingDiv" class="loading">Loading engineers...</div>
        <div id="noResultsDiv" class="no-results" style="display: none;">No engineers found.</div>

        <table class="engineers-table" id="engineersTable" style="display: none;">
            <thead>
                <tr>
                    <th onclick="sortTable('name')">Engineer Name <span class="sort-indicator" id="sort-name"></span></th>
                    <th onclick="sortTable('teamLeader')">Team Leader <span class="sort-indicator" id="sort-teamLeader"></span></th>
                    <th onclick="sortTable('date')">Date Added <span class="sort-indicator" id="sort-date"></span></th>
                </tr>
            </thead>
            <tbody id="engineersBody">
            </tbody>
        </table>

        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
            authDomain: "oesperformance-a54c0.firebaseapp.com",
            projectId: "oesperformance-a54c0",
            storageBucket: "oesperformance-a54c0.firebasestorage.app",
            messagingSenderId: "484894102454",
            appId: "1:484894102454:web:17535ee497eac2d90d6717",
            measurementId: "G-R56BGZYV8N"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allEngineers = [];
        let filteredEngineers = [];
        let sortColumn = 'name';
        let sortDirection = 'asc';

        // Load engineers
        async function loadEngineers() {
            try {
                const querySnapshot = await getDocs(collection(db, "engineers"));
                
                allEngineers = [];
                querySnapshot.forEach((doc) => {
                    allEngineers.push({
                        id: doc.id,
                        ...doc.data()
                    });
                });

                // Get unique team leaders
                const teamLeaders = [...new Set(allEngineers.map(e => e.teamLeader))].sort();
                
                // Populate team leader filter
                const teamLeaderFilter = document.getElementById('teamLeaderFilter');
                teamLeaders.forEach(tl => {
                    const option = document.createElement('option');
                    option.value = tl;
                    option.textContent = tl;
                    teamLeaderFilter.appendChild(option);
                });

                // Update stats
                document.getElementById('totalEngineers').textContent = allEngineers.length;
                document.getElementById('totalTeamLeaders').textContent = teamLeaders.length;
                document.getElementById('statsSection').style.display = 'grid';

                filteredEngineers = [...allEngineers];
                displayEngineers();

                document.getElementById('loadingDiv').style.display = 'none';

            } catch (error) {
                console.error("Error loading engineers:", error);
                document.getElementById('loadingDiv').textContent = 'Error loading engineers. Please refresh the page.';
            }
        }

        function displayEngineers() {
            const tbody = document.getElementById('engineersBody');
            tbody.innerHTML = '';

            if (filteredEngineers.length === 0) {
                document.getElementById('engineersTable').style.display = 'none';
                document.getElementById('noResultsDiv').style.display = 'block';
                return;
            }

            document.getElementById('noResultsDiv').style.display = 'none';
            document.getElementById('engineersTable').style.display = 'table';

            // Sort engineers
            const sortedEngineers = [...filteredEngineers].sort((a, b) => {
                let aVal, bVal;

                switch(sortColumn) {
                    case 'name':
                        aVal = a.engineerName.toLowerCase();
                        bVal = b.engineerName.toLowerCase();
                        break;
                    case 'teamLeader':
                        aVal = a.teamLeader.toLowerCase();
                        bVal = b.teamLeader.toLowerCase();
                        break;
                    case 'date':
                        aVal = a.createdAt ? a.createdAt.seconds : 0;
                        bVal = b.createdAt ? b.createdAt.seconds : 0;
                        break;
                    default:
                        aVal = a.engineerName.toLowerCase();
                        bVal = b.engineerName.toLowerCase();
                }

                if (aVal < bVal) return sortDirection === 'asc' ? -1 : 1;
                if (aVal > bVal) return sortDirection === 'asc' ? 1 : -1;
                return 0;
            });

            // Update sort indicators
            document.querySelectorAll('.sort-indicator').forEach(el => el.textContent = '');
            const indicator = document.getElementById(`sort-${sortColumn}`);
            if (indicator) {
                indicator.textContent = sortDirection === 'asc' ? '▲' : '▼';
            }

            // Display rows
            sortedEngineers.forEach(engineer => {
                const row = tbody.insertRow();
                
                const dateAdded = engineer.createdAt 
                    ? new Date(engineer.createdAt.seconds * 1000).toLocaleDateString('en-GB')
                    : 'Unknown';

                row.innerHTML = `
                    <td class="engineer-name">${engineer.engineerName}</td>
                    <td><span class="team-leader-badge">${engineer.teamLeader}</span></td>
                    <td class="date-added">${dateAdded}</td>
                `;
            });
        }

        window.sortTable = function(column) {
            if (sortColumn === column) {
                sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                sortColumn = column;
                sortDirection = 'asc';
            }
            displayEngineers();
        }

        window.filterEngineers = function() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const teamLeaderFilter = document.getElementById('teamLeaderFilter').value;

            filteredEngineers = allEngineers.filter(engineer => {
                const matchesSearch = engineer.engineerName.toLowerCase().includes(searchTerm);
                const matchesTeamLeader = teamLeaderFilter === 'all' || engineer.teamLeader === teamLeaderFilter;
                return matchesSearch && matchesTeamLeader;
            });

            displayEngineers();
        }

        // Load engineers on page load
        loadEngineers();
    </script>
</body>
</html>
