
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quarterly Bonus View - OES Performance</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap');

        :root {
            --bg: #0f0f13;
            --surface: #16161c;
            --surface2: #1e1e28;
            --border: #2a2a38;
            --accent: #7c6af7;
            --accent2: #e85d9b;
            --accent3: #34d9a0;
            --text: #e8e8f0;
            --text-muted: #6b6b88;
            --text-dim: #3a3a52;
            --success: #34d9a0;
            --warning: #f7c76a;
            --error: #f76a6a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Syne', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 32px 20px 60px;
            background-image: 
                radial-gradient(ellipse at 20% 0%, rgba(124, 106, 247, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 100%, rgba(232, 93, 155, 0.08) 0%, transparent 50%);
        }

        .container { max-width: 1300px; margin: 0 auto; }

        /* HEADER */
        .header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            margin-bottom: 48px;
            padding-bottom: 32px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 16px;
        }

        .logo-block .label {
            font-family: 'DM Mono', monospace;
            font-size: 0.7em;
            color: var(--accent);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .logo-block h1 {
            font-size: 2.2em;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1;
        }

        .logo-block h1 span {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .back-link {
            font-family: 'DM Mono', monospace;
            font-size: 0.8em;
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }

        .back-link:hover { color: var(--accent); }

        /* STEP DIVIDER */
        .step-divider {
            font-family: 'DM Mono', monospace;
            font-size: 0.7em;
            color: var(--text-dim);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .step-divider::before, .step-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* FILTER CARD */
        .filter-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .filter-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
        }

        .filter-card h2 {
            font-size: 1em;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text);
        }

        .filter-row {
            display: flex;
            gap: 14px;
            align-items: flex-end;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            min-width: 140px;
        }

        .filter-group label {
            font-family: 'DM Mono', monospace;
            font-size: 0.68em;
            color: var(--text-muted);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        select, input[type="date"] {
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 8px;
            padding: 10px 14px;
            font-family: 'DM Mono', monospace;
            font-size: 0.85em;
            appearance: none;
            cursor: pointer;
            transition: border-color 0.2s;
            width: 100%;
        }

        input[type="date"] {
            appearance: none;
            -webkit-appearance: none;
            color-scheme: dark;
        }

        select:focus, input[type="date"]:focus {
            outline: none;
            border-color: var(--accent);
        }

        select option { background: var(--surface2); }

        /* BUTTONS */
        .btn-fetch {
            padding: 11px 28px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: white;
            border: none;
            border-radius: 10px;
            font-family: 'Syne', sans-serif;
            font-size: 0.9em;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            white-space: nowrap;
            letter-spacing: 0.02em;
            height: 42px;
        }

        .btn-fetch:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(124, 106, 247, 0.4);
        }

        .btn-export {
            padding: 11px 22px;
            background: transparent;
            color: var(--accent3);
            border: 1px solid var(--accent3);
            border-radius: 10px;
            font-family: 'Syne', sans-serif;
            font-size: 0.85em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            height: 42px;
            display: none;
            align-items: center;
            gap: 6px;
        }

        .btn-export:hover { background: rgba(52, 217, 160, 0.1); }

        .btn-export.visible { display: flex; }

        .btn-export-csv {
            padding: 11px 22px;
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            border-radius: 10px;
            font-family: 'Syne', sans-serif;
            font-size: 0.85em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            height: 42px;
            display: none;
            align-items: center;
            gap: 6px;
        }

        .btn-export-csv:hover { background: rgba(124, 106, 247, 0.1); }
        .btn-export-csv.visible { display: flex; }

        /* STATS BAR */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 20px;
            display: none;
        }

        .stats-bar.visible { display: grid; }

        @media (max-width: 700px) {
            .stats-bar { grid-template-columns: 1fr 1fr; }
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px 20px;
        }

        .stat-card .stat-label {
            font-family: 'DM Mono', monospace;
            font-size: 0.65em;
            color: var(--text-muted);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .stat-card .stat-value {
            font-size: 1.6em;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .stat-card .stat-value.purple { color: var(--accent); }
        .stat-card .stat-value.pink { color: var(--accent2); }
        .stat-card .stat-value.green { color: var(--accent3); }
        .stat-card .stat-value.yellow { color: var(--warning); }

        /* RESULTS CARD */
        .results-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 20px;
            display: none;
        }

        .results-card.visible { display: block; }

        .results-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .results-header h2 {
            font-size: 1em;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge {
            font-family: 'DM Mono', monospace;
            font-size: 0.7em;
            background: rgba(52, 217, 160, 0.15);
            color: var(--accent3);
            border: 1px solid rgba(52, 217, 160, 0.3);
            border-radius: 20px;
            padding: 2px 10px;
        }

        .export-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* VIEW TOGGLE */
        .view-toggle {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .toggle-btn {
            padding: 8px 18px;
            border-radius: 8px;
            font-family: 'DM Mono', monospace;
            font-size: 0.75em;
            cursor: pointer;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-muted);
            transition: all 0.2s;
            letter-spacing: 0.06em;
        }

        .toggle-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        /* SEARCH */
        .search-wrap {
            position: relative;
            margin-bottom: 16px;
        }

        .search-wrap input {
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 8px;
            padding: 10px 14px 10px 36px;
            font-family: 'DM Mono', monospace;
            font-size: 0.82em;
            width: 100%;
            max-width: 320px;
            transition: border-color 0.2s;
        }

        .search-wrap input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .search-wrap::before {
            content: '⌕';
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.1em;
        }

        /* TABLE */
        .table-wrap {
            overflow-x: auto;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82em;
        }

        thead { background: var(--surface2); }

        th {
            padding: 10px 14px;
            text-align: left;
            font-family: 'DM Mono', monospace;
            font-size: 0.82em;
            color: var(--text-muted);
            letter-spacing: 0.06em;
            white-space: nowrap;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            user-select: none;
            transition: color 0.15s;
        }

        th:hover { color: var(--accent); }
        th.sorted { color: var(--accent); }

        th.date-col { color: var(--accent); text-align: right; }
        th.total-col { color: var(--accent2); text-align: right; }
        th.avg-col { color: var(--accent3); text-align: right; }

        td {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        tr:last-child td { border-bottom: none; }

        td.name-col {
            font-weight: 700;
            color: var(--text);
            position: sticky;
            left: 0;
            background: var(--surface);
            z-index: 1;
        }

        tr:hover td { background: rgba(124, 106, 247, 0.04); }
        tr:hover td.name-col { background: rgba(124, 106, 247, 0.08); }

        td.meter-val {
            font-family: 'DM Mono', monospace;
            color: var(--accent3);
            text-align: right;
        }

        td.meter-val.zero { color: var(--text-dim); }
        td.meter-val.sick {
            color: var(--warning);
            font-size: 0.78em;
            letter-spacing: 0.06em;
            font-style: italic;
            text-align: right;
        }

        td.meter-val.aaup {
            color: var(--accent2);
            font-size: 0.78em;
            letter-spacing: 0.06em;
            font-style: italic;
            text-align: right;
        }

        td.total-val {
            font-family: 'DM Mono', monospace;
            color: var(--accent2);
            font-weight: 700;
            text-align: right;
        }

        td.avg-val {
            font-family: 'DM Mono', monospace;
            color: var(--accent3);
            text-align: right;
        }

        /* HEAT CELLS */
        td.meter-val.heat-low { background: rgba(52, 217, 160, 0.04); }
        td.meter-val.heat-mid { background: rgba(52, 217, 160, 0.10); }
        td.meter-val.heat-high { background: rgba(52, 217, 160, 0.20); }

        /* SUMMARY VIEW TABLE */
        td.rank-col {
            font-family: 'DM Mono', monospace;
            font-size: 0.75em;
            color: var(--text-dim);
            width: 36px;
        }

        td.rank-col.top1 { color: var(--warning); font-weight: 700; }
        td.rank-col.top2 { color: var(--text-muted); font-weight: 600; }
        td.rank-col.top3 { color: #cd7f32; font-weight: 600; }

        /* EMPTY STATE */
        .empty-state {
            padding: 60px 20px;
            text-align: center;
        }

        .empty-state .icon {
            font-size: 3em;
            margin-bottom: 12px;
            opacity: 0.4;
        }

        .empty-state p {
            font-family: 'DM Mono', monospace;
            font-size: 0.8em;
            color: var(--text-muted);
        }

        /* LOADING */
        .loading-bar {
            height: 2px;
            background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3));
            border-radius: 2px;
            margin-bottom: 24px;
            display: none;
            animation: loadSlide 1.4s ease infinite;
            background-size: 200% 100%;
        }

        @keyframes loadSlide {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .loading-bar.visible { display: block; }

        /* TOAST */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 16px 24px;
            border-radius: 12px;
            font-family: 'DM Mono', monospace;
            font-size: 0.85em;
            font-weight: 500;
            transform: translateY(80px);
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 999;
            max-width: 380px;
        }

        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { background: rgba(52,217,160,0.15); border: 1px solid rgba(52,217,160,0.4); color: var(--accent3); }
        .toast.error { background: rgba(247,106,106,0.15); border: 1px solid rgba(247,106,106,0.4); color: var(--error); }
        .toast.warning { background: rgba(247,199,106,0.15); border: 1px solid rgba(247,199,106,0.4); color: var(--warning); }

        /* SORT INDICATOR */
        .sort-arrow { display: inline-block; margin-left: 4px; font-size: 0.75em; opacity: 0.5; }
        .sort-arrow.asc::after { content: ' ▲'; }
        .sort-arrow.desc::after { content: ' ▼'; }
        .sort-arrow.active { opacity: 1; }

        @media print {
            body { background: white; color: black; padding: 16px; }
            .filter-card, .stats-bar, .view-toggle, .search-wrap, .export-row, .back-link, .step-divider { display: none !important; }
            .results-card { border: none; padding: 0; }
            table { font-size: 11px; }
            td, th { padding: 6px 8px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo-block">
                <div class="label">OES Performance</div>
                <h1>Quarterly <span>Bonus View</span></h1>
            </div>
            <a href="index.html" class="back-link">← Back to Home</a>
        </div>

        <!-- FILTER -->
        <div class="step-divider">Configure Query</div>
        <div class="filter-card">
            <h2>Select Date Range</h2>
            <div class="filter-row">
                <div class="filter-group">
                    <label>From Date</label>
                    <input type="date" id="dateFrom" />
                </div>
                <div class="filter-group">
                    <label>To Date</label>
                    <input type="date" id="dateTo" />
                </div>
                <div class="filter-group" style="max-width:180px;">
                    <label>Quick Range</label>
                    <select id="quickRange" onchange="applyQuickRange()">
                        <option value="">Custom</option>
                        <option value="this_month">This Month</option>
                        <option value="last_month">Last Month</option>
                        <option value="this_quarter">This Quarter</option>
                        <option value="last_quarter">Last Quarter</option>
                        <option value="this_year">This Year</option>
                    </select>
                </div>
                <button class="btn-fetch" onclick="fetchData()">🔍 Fetch Data</button>
            </div>
        </div>

        <!-- LOADING -->
        <div class="loading-bar" id="loadingBar"></div>

        <!-- STATS -->
        <div class="stats-bar" id="statsBar">
            <div class="stat-card">
                <div class="stat-label">Engineers</div>
                <div class="stat-value purple" id="statEngineers">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Meters</div>
                <div class="stat-value pink" id="statTotal">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Working Days</div>
                <div class="stat-value green" id="statDays">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Top Performer</div>
                <div class="stat-value yellow" id="statTop" style="font-size:1em; padding-top:4px;">—</div>
            </div>
        </div>

        <!-- RESULTS -->
        <div class="step-divider">Results</div>
        <div class="results-card" id="resultsCard">
            <div class="results-header">
                <h2>
                    Data Table
                    <span class="badge" id="resultsBadge">0 records</span>
                </h2>
                <div class="export-row">
                    <button class="btn-export-csv" id="btnCsv" onclick="exportCSV()">⬇ Export CSV</button>
                    <button class="btn-export" id="btnExcel" onclick="exportExcel()">⬇ Export Excel</button>
                    <button class="btn-export" id="btnPrint" onclick="window.print()" style="color:var(--text-muted);border-color:var(--border);">🖨 Print</button>
                </div>
            </div>

            <div class="view-toggle">
                <button class="toggle-btn active" id="toggleDetailed" onclick="setView('detailed')">Detailed (per day)</button>
                <button class="toggle-btn" id="toggleSummary" onclick="setView('summary')">Summary (totals)</button>
            </div>

            <div class="search-wrap">
                <input type="text" id="searchInput" placeholder="Filter by engineer name..." oninput="applyFilter()" />
            </div>

            <div class="table-wrap" id="tableWrap">
                <div class="empty-state">
                    <div class="icon">📊</div>
                    <p>No data yet — select a date range and fetch.</p>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
            authDomain: "oesperformance-a54c0.firebaseapp.com",
            projectId: "oesperformance-a54c0",
            storageBucket: "oesperformance-a54c0.firebasestorage.app",
            messagingSenderId: "484894102454",
            appId: "1:484894102454:web:17535ee497eac2d90d6717",
            measurementId: "G-R56BGZYV8N"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ── State ─────────────────────────────────────────────────────────────
        let allData = [];        // raw merged engineer data
        let filteredData = [];   // after search filter
        let allDates = [];       // sorted unique dates in range
        let currentView = 'detailed';
        let sortCol = null;
        let sortDir = 'desc';

        // ── Quick Range ───────────────────────────────────────────────────────
        window.applyQuickRange = function() {
            const val = document.getElementById('quickRange').value;
            if (!val) return;
            const now = new Date();
            const y = now.getFullYear();
            const m = now.getMonth();
            let from, to;

            if (val === 'this_month') {
                from = new Date(y, m, 1);
                to = new Date(y, m + 1, 0);
            } else if (val === 'last_month') {
                from = new Date(y, m - 1, 1);
                to = new Date(y, m, 0);
            } else if (val === 'this_quarter') {
                const q = Math.floor(m / 3);
                from = new Date(y, q * 3, 1);
                to = new Date(y, q * 3 + 3, 0);
            } else if (val === 'last_quarter') {
                const q = Math.floor(m / 3);
                const lq = q === 0 ? 3 : q - 1;
                const ly = q === 0 ? y - 1 : y;
                from = new Date(ly, lq * 3, 1);
                to = new Date(ly, lq * 3 + 3, 0);
            } else if (val === 'this_year') {
                from = new Date(y, 0, 1);
                to = new Date(y, 11, 31);
            }

            document.getElementById('dateFrom').value = fmtDateInput(from);
            document.getElementById('dateTo').value = fmtDateInput(to);
        };

        function fmtDateInput(d) {
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        }

        // ── Fetch ─────────────────────────────────────────────────────────────
        window.fetchData = async function() {
            const fromVal = document.getElementById('dateFrom').value;
            const toVal   = document.getElementById('dateTo').value;

            if (!fromVal || !toVal) {
                showToast('Please select both From and To dates.', 'warning');
                return;
            }

            if (fromVal > toVal) {
                showToast('From date must be before To date.', 'warning');
                return;
            }

            const lb = document.getElementById('loadingBar');
            lb.classList.add('visible');

            try {
                const snap = await getDocs(collection(db, 'Quarterly Figures'));
                const docs = [];
                snap.forEach(d => docs.push(d.data()));

                // Filter entries within date range
                // Merge: one row per engineer, aggregate across multiple docs
                const engineerMap = {}; // engineerName -> { dates: {dateStr: {meters, status}} }

                docs.forEach(doc => {
                    if (!doc.entries) return;
                    const name = doc.engineerName;
                    if (!engineerMap[name]) engineerMap[name] = {};

                    doc.entries.forEach(entry => {
                        if (entry.date >= fromVal && entry.date <= toVal) {
                            // If duplicate date for same engineer, latest wins (or sum? — using latest)
                            if (!engineerMap[name][entry.date]) {
                                engineerMap[name][entry.date] = {
                                    meters: entry.meters || 0,
                                    status: entry.status || null
                                };
                            }
                        }
                    });
                });

                // Collect all dates in range that have data
                const dateSet = new Set();
                Object.values(engineerMap).forEach(dateMap => {
                    Object.keys(dateMap).forEach(d => dateSet.add(d));
                });
                allDates = Array.from(dateSet).sort();

                // Build allData array
                allData = Object.entries(engineerMap)
                    .map(([name, dateMap]) => {
                        let total = 0;
                        let workDays = 0;
                        allDates.forEach(d => {
                            const e = dateMap[d];
                            if (e && !e.status) {
                                total += e.meters;
                                if (e.meters > 0) workDays++;
                            }
                        });
                        return {
                            name,
                            dateMap,
                            total,
                            workDays,
                            avg: workDays > 0 ? total / workDays : 0
                        };
                    })
                    .filter(e => allDates.some(d => e.dateMap[d])); // only engineers with data in range

                if (!allData.length) {
                    showToast('No data found for the selected date range.', 'warning');
                    document.getElementById('resultsCard').classList.remove('visible');
                    document.getElementById('statsBar').classList.remove('visible');
                    lb.classList.remove('visible');
                    return;
                }

                // Sort by total desc by default
                allData.sort((a, b) => b.total - a.total);
                filteredData = [...allData];

                updateStats();
                renderTable();
                document.getElementById('resultsCard').classList.add('visible');
                document.getElementById('statsBar').classList.add('visible');
                document.getElementById('btnCsv').classList.add('visible');
                document.getElementById('btnExcel').classList.add('visible');
                document.getElementById('btnPrint').classList.add('visible');
                showToast(`✓ Loaded ${allData.length} engineer(s) across ${allDates.length} date(s).`, 'success');

            } catch (err) {
                console.error(err);
                showToast('Error fetching from Firebase. Check console.', 'error');
            } finally {
                lb.classList.remove('visible');
            }
        };

        // ── Stats ─────────────────────────────────────────────────────────────
        function updateStats() {
            document.getElementById('statEngineers').textContent = allData.length;
            const grandTotal = allData.reduce((s, e) => s + e.total, 0);
            document.getElementById('statTotal').textContent = grandTotal.toFixed(1) + 'm';
            document.getElementById('statDays').textContent = allDates.length;
            const top = allData[0];
            document.getElementById('statTop').textContent = top ? top.name.split(' ')[0] : '—';
        }

        // ── View toggle ───────────────────────────────────────────────────────
        window.setView = function(v) {
            currentView = v;
            document.getElementById('toggleDetailed').classList.toggle('active', v === 'detailed');
            document.getElementById('toggleSummary').classList.toggle('active', v === 'summary');
            renderTable();
        };

        // ── Filter ────────────────────────────────────────────────────────────
        window.applyFilter = function() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            filteredData = allData.filter(e => e.name.toLowerCase().includes(q));
            renderTable();
        };

        // ── Render ─────────────────────────────────────────────────────────────
        function renderTable() {
            const wrap = document.getElementById('tableWrap');
            document.getElementById('resultsBadge').textContent = filteredData.length + ' engineers';

            if (!filteredData.length) {
                wrap.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><p>No matching engineers.</p></div>';
                return;
            }

            if (currentView === 'detailed') {
                renderDetailed(wrap);
            } else {
                renderSummary(wrap);
            }
        }

        // Find max meters for heat coloring
        function getHeatClass(meters) {
            if (meters <= 0) return '';
            const maxM = Math.max(...allData.map(e =>
                Math.max(...allDates.map(d => e.dateMap[d] && !e.dateMap[d].status ? e.dateMap[d].meters : 0))
            ));
            if (maxM <= 0) return '';
            const ratio = meters / maxM;
            if (ratio < 0.33) return 'heat-low';
            if (ratio < 0.66) return 'heat-mid';
            return 'heat-high';
        }

        function renderDetailed(wrap) {
            const table = document.createElement('table');

            // THEAD
            const thead = document.createElement('thead');
            const hr = document.createElement('tr');

            const thName = document.createElement('th');
            thName.textContent = 'Engineer';
            thName.onclick = () => sortBy('name');
            thName.innerHTML = 'Engineer <span class="sort-arrow' + getSortArrow('name') + '"></span>';
            hr.appendChild(thName);

            allDates.forEach(d => {
                const th = document.createElement('th');
                th.className = 'date-col';
                const dt = new Date(d + 'T00:00:00');
                th.innerHTML = (dt.getDate()) + '/' + (dt.getMonth()+1) + '<br><span style="font-size:0.75em;color:var(--text-dim);">' + dt.toLocaleDateString('en-GB', {weekday:'short'}) + '</span>';
                th.onclick = () => sortBy('date_' + d);
                hr.appendChild(th);
            });

            const thTotal = document.createElement('th');
            thTotal.className = 'total-col';
            thTotal.innerHTML = 'Total m <span class="sort-arrow' + getSortArrow('total') + '"></span>';
            thTotal.onclick = () => sortBy('total');
            hr.appendChild(thTotal);

            const thAvg = document.createElement('th');
            thAvg.className = 'avg-col';
            thAvg.innerHTML = 'Avg/day <span class="sort-arrow' + getSortArrow('avg') + '"></span>';
            thAvg.onclick = () => sortBy('avg');
            hr.appendChild(thAvg);

            thead.appendChild(hr);
            table.appendChild(thead);

            // TBODY
            const tbody = document.createElement('tbody');
            filteredData.forEach(eng => {
                const tr = document.createElement('tr');

                const tdName = document.createElement('td');
                tdName.className = 'name-col';
                tdName.textContent = eng.name;
                tr.appendChild(tdName);

                allDates.forEach(d => {
                    const td = document.createElement('td');
                    const entry = eng.dateMap[d];
                    if (!entry) {
                        td.className = 'meter-val zero';
                        td.textContent = '—';
                    } else if (entry.status === 'SICK') {
                        td.className = 'meter-val sick';
                        td.textContent = 'SICK';
                    } else if (entry.status === 'AAUP') {
                        td.className = 'meter-val aaup';
                        td.textContent = 'AAUP';
                    } else if (entry.meters === 0) {
                        td.className = 'meter-val zero';
                        td.textContent = '—';
                    } else {
                        const hc = getHeatClass(entry.meters);
                        td.className = 'meter-val' + (hc ? ' ' + hc : '');
                        td.textContent = entry.meters.toFixed(1);
                    }
                    tr.appendChild(td);
                });

                const tdTotal = document.createElement('td');
                tdTotal.className = 'total-val';
                tdTotal.textContent = eng.total.toFixed(1);
                tr.appendChild(tdTotal);

                const tdAvg = document.createElement('td');
                tdAvg.className = 'avg-val';
                tdAvg.textContent = eng.avg > 0 ? eng.avg.toFixed(1) : '—';
                tr.appendChild(tdAvg);

                tbody.appendChild(tr);
            });

            table.appendChild(tbody);
            wrap.innerHTML = '';
            wrap.appendChild(table);
        }

        function renderSummary(wrap) {
            const table = document.createElement('table');

            const thead = document.createElement('thead');
            const hr = document.createElement('tr');
            ['#', 'Engineer', 'Total m', 'Working Days', 'Avg m/day', 'Best Day', 'Best Score'].forEach((label, i) => {
                const th = document.createElement('th');
                th.textContent = label;
                if (i > 1) th.style.textAlign = 'right';
                hr.appendChild(th);
            });
            thead.appendChild(hr);
            table.appendChild(thead);

            const tbody = document.createElement('tbody');
            filteredData.forEach((eng, idx) => {
                const tr = document.createElement('tr');

                const tdRank = document.createElement('td');
                tdRank.className = 'rank-col' + (idx === 0 ? ' top1' : idx === 1 ? ' top2' : idx === 2 ? ' top3' : '');
                tdRank.textContent = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : '#' + (idx+1);
                tr.appendChild(tdRank);

                const tdName = document.createElement('td');
                tdName.className = 'name-col';
                tdName.textContent = eng.name;
                tr.appendChild(tdName);

                const tdTotal = document.createElement('td');
                tdTotal.className = 'total-val';
                tdTotal.textContent = eng.total.toFixed(1);
                tr.appendChild(tdTotal);

                const tdDays = document.createElement('td');
                tdDays.style.textAlign = 'right';
                tdDays.style.fontFamily = "'DM Mono', monospace";
                tdDays.style.color = 'var(--text-muted)';
                tdDays.textContent = eng.workDays;
                tr.appendChild(tdDays);

                const tdAvg = document.createElement('td');
                tdAvg.className = 'avg-val';
                tdAvg.textContent = eng.avg > 0 ? eng.avg.toFixed(1) : '—';
                tr.appendChild(tdAvg);

                // Best day
                let bestDate = '—', bestScore = 0;
                allDates.forEach(d => {
                    const e = eng.dateMap[d];
                    if (e && !e.status && e.meters > bestScore) {
                        bestScore = e.meters;
                        const dt = new Date(d + 'T00:00:00');
                        bestDate = dt.getDate() + '/' + (dt.getMonth()+1);
                    }
                });

                const tdBestDate = document.createElement('td');
                tdBestDate.style.textAlign = 'right';
                tdBestDate.style.fontFamily = "'DM Mono', monospace";
                tdBestDate.style.color = 'var(--text-muted)';
                tdBestDate.textContent = bestDate;
                tr.appendChild(tdBestDate);

                const tdBestScore = document.createElement('td');
                tdBestScore.style.textAlign = 'right';
                tdBestScore.style.fontFamily = "'DM Mono', monospace";
                tdBestScore.style.color = 'var(--accent3)';
                tdBestScore.textContent = bestScore > 0 ? bestScore.toFixed(1) : '—';
                tr.appendChild(tdBestScore);

                tbody.appendChild(tr);
            });

            table.appendChild(tbody);
            wrap.innerHTML = '';
            wrap.appendChild(table);
        }

        // ── Sort ──────────────────────────────────────────────────────────────
        window.sortBy = function(col) {
            if (sortCol === col) {
                sortDir = sortDir === 'asc' ? 'desc' : 'asc';
            } else {
                sortCol = col;
                sortDir = 'desc';
            }

            filteredData.sort((a, b) => {
                let va, vb;
                if (col === 'name') {
                    va = a.name.toLowerCase();
                    vb = b.name.toLowerCase();
                } else if (col === 'total') {
                    va = a.total; vb = b.total;
                } else if (col === 'avg') {
                    va = a.avg; vb = b.avg;
                } else if (col.startsWith('date_')) {
                    const d = col.replace('date_', '');
                    va = a.dateMap[d] && !a.dateMap[d].status ? a.dateMap[d].meters : -1;
                    vb = b.dateMap[d] && !b.dateMap[d].status ? b.dateMap[d].meters : -1;
                }

                if (typeof va === 'string') {
                    return sortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
                }
                return sortDir === 'asc' ? va - vb : vb - va;
            });

            renderTable();
        };

        function getSortArrow(col) {
            if (sortCol !== col) return '';
            return ' ' + sortDir;
        }

        // ── Export CSV ────────────────────────────────────────────────────────
        window.exportCSV = function() {
            const fromVal = document.getElementById('dateFrom').value;
            const toVal   = document.getElementById('dateTo').value;

            const headers = ['Engineer', ...allDates.map(d => {
                const dt = new Date(d + 'T00:00:00');
                return dt.getDate() + '/' + (dt.getMonth()+1) + '/' + dt.getFullYear();
            }), 'Total m', 'Avg m/day'];

            const rows = filteredData.map(eng => {
                const cells = [eng.name];
                allDates.forEach(d => {
                    const e = eng.dateMap[d];
                    if (!e) cells.push('');
                    else if (e.status) cells.push(e.status);
                    else cells.push(e.meters.toFixed(1));
                });
                cells.push(eng.total.toFixed(1));
                cells.push(eng.avg > 0 ? eng.avg.toFixed(1) : '');
                return cells;
            });

            const csvContent = [headers, ...rows].map(r =>
                r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')
            ).join('\n');

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `OES_BonusData_${fromVal}_to_${toVal}.csv`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('CSV exported!', 'success');
        };

        // ── Export Excel (simple HTML table in .xls) ──────────────────────────
        window.exportExcel = function() {
            const fromVal = document.getElementById('dateFrom').value;
            const toVal   = document.getElementById('dateTo').value;

            let html = `<html><head><meta charset="UTF-8"></head><body><table border="1">`;
            html += '<tr><th>Engineer</th>';
            allDates.forEach(d => {
                const dt = new Date(d + 'T00:00:00');
                html += `<th>${dt.getDate()}/${dt.getMonth()+1}/${dt.getFullYear()}</th>`;
            });
            html += '<th>Total m</th><th>Avg m/day</th></tr>';

            filteredData.forEach(eng => {
                html += `<tr><td>${eng.name}</td>`;
                allDates.forEach(d => {
                    const e = eng.dateMap[d];
                    if (!e) html += '<td></td>';
                    else if (e.status) html += `<td>${e.status}</td>`;
                    else html += `<td>${e.meters.toFixed(1)}</td>`;
                });
                html += `<td>${eng.total.toFixed(1)}</td><td>${eng.avg > 0 ? eng.avg.toFixed(1) : ''}</td></tr>`;
            });

            html += '</table></body></html>';

            const blob = new Blob([html], { type: 'application/vnd.ms-excel;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `OES_BonusData_${fromVal}_to_${toVal}.xls`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('Excel file exported!', 'success');
        };

        // ── Toast ─────────────────────────────────────────────────────────────
        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `toast ${type} show`;
            setTimeout(() => t.className = 'toast', 4000);
        }

        // ── Init: set default dates ───────────────────────────────────────────
        const now = new Date();
        const firstOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
        document.getElementById('dateFrom').value = fmtDateInput(firstOfMonth);
        document.getElementById('dateTo').value = fmtDateInput(now);
        document.getElementById('monthSelect') && null; // only on upload page
    </script>
</body>
</html>
