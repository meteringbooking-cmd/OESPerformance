<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calisen Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --border: #e1e0d9; --grid: #e1e0d9;
  --text: #0b0b0b; --text-2: #52514e; --muted: #898781; --accent: #2a78d6;
  --good: #0ca30c; --serious: #ec835a; --critical: #d03b3b; --other: #b5b3ab;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --border: #2c2c2a; --grid: #2c2c2a;
    --text: #f0efec; --text-2: #c3c2b7; --muted: #898781; --accent: #3987e5; --other: #5b5a55;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --border: #2c2c2a; --grid: #2c2c2a;
  --text: #f0efec; --text-2: #c3c2b7; --muted: #898781; --accent: #3987e5; --other: #5b5a55;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 24px 16px 48px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 15px; margin: 0 0 12px; }
.sub { color: var(--text-2); font-size: 13px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
.btn { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 9px 14px; font: inherit; font-weight: 600; }
.btn input { display: none; }
#drop { border: 2px dashed var(--border); border-radius: 12px; padding: 48px 16px; text-align: center; color: var(--text-2); background: var(--surface); }
#drop.over { border-color: var(--accent); }
#drop strong { color: var(--text); display: block; font-size: 16px; margin-bottom: 6px; }
.filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-bottom: 16px; }
.filters label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text-2); }
.filters select, .filters input, #sheetSel { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; min-width: 160px; }
.link { background: none; border: 0; color: var(--accent); cursor: pointer; font: inherit; padding: 6px 0; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi .label { font-size: 12px; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
.kpi .value { font-size: 28px; font-weight: 650; margin-top: 4px; font-variant-numeric: tabular-nums; }
.kpi .note { font-size: 12px; color: var(--muted); margin-top: 2px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.section { margin-bottom: 16px; }
.chart-box { position: relative; height: 280px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 10px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font-size: 12px; color: var(--text-2); font-weight: 600; cursor: pointer; user-select: none; }
th:hover { color: var(--text); }
tfoot td { font-weight: 650; border-bottom: 0; }
details.notes { font-size: 13px; color: var(--text-2); }
details.notes summary { cursor: pointer; font-weight: 600; color: var(--text); }
details.notes ul { margin: 6px 0 0; padding-left: 18px; }
.hidden { display: none !important; }
.err { color: var(--critical); margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Calisen Dashboard</h1>
      <div class="sub" id="fileInfo">Upload an .xlsx export to see weekly job stats</div>
    </div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <select id="sheetSel" class="hidden" title="Sheet"></select>
      <label class="btn">Upload .xlsx<input type="file" id="file" accept=".xlsx,.xlsm,.xls"></label>
    </div>
  </header>

  <div id="drop">
    <strong>Drop your spreadsheet here</strong>
    or use the Upload button. Everything is processed in your browser; nothing is sent anywhere.
    <div id="err" class="err"></div>
  </div>

  <main id="dash" class="hidden">
    <div class="card filters">
      <label>Week comm<select id="fWeek"></select></label>
      <label>Engineer (OP_Name)<select id="fOp"></select></label>
      <label>Appt date from<input type="date" id="fFrom"></label>
      <label>Appt date to<input type="date" id="fTo"></label>
      <button class="link" id="reset">Reset filters</button>
    </div>

    <div class="kpis" id="kpis"></div>

    <div class="card section"><h2>Weekly jobs by outcome</h2><div class="chart-box"><canvas id="cWeek"></canvas></div></div>
    <div class="card section"><h2>By week comm</h2><div class="table-wrap" id="tblWeek"></div></div>
    <div class="card section"><h2>By engineer</h2><div class="table-wrap" id="tblOp"></div></div>

    <details class="card notes" id="notes"></details>
  </main>
</div>

<script>
// ---- Column positions (0-based) ----
const COL = { week: 1 /*B*/, job: 3 /*D*/, dual: 5 /*F*/, appt: 11 /*L*/, op: 20 /*U*/, result: 28 /*AC*/ };
const PRIORITY = { Completed: 4, Failed: 3, Aborted: 2, Other: 1 };

let workbook = null, records = [], meta = {}, charts = {};
const sortState = {};

const $ = id => document.getElementById(id);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const fmt = n => n.toLocaleString('en-GB');
const pct = (a, b) => b ? (a / b * 100).toFixed(1) + '%' : '–';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---- File handling ----
$('file').addEventListener('change', e => e.target.files[0] && loadFile(e.target.files[0]));
const drop = $('drop');
['dragover', 'dragenter'].forEach(t => document.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(t => document.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
document.addEventListener('drop', e => e.dataTransfer.files[0] && loadFile(e.dataTransfer.files[0]));

// ---- Password-protected workbook support (Excel "Encrypt with Password", Agile encryption) ----
const FILE_PASSWORD = 'Password123';
const HASHES = { SHA1: 'SHA-1', SHA256: 'SHA-256', SHA384: 'SHA-384', SHA512: 'SHA-512' };
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const u32 = n => new Uint8Array([n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255]);
function cat(...arrs) {
  const out = new Uint8Array(arrs.reduce((s, a) => s + a.length, 0));
  let o = 0; for (const a of arrs) { out.set(a, o); o += a.length; }
  return out;
}
function fit(buf, len) { // truncate, or pad with 0x36, per MS-OFFCRYPTO
  if (buf.length >= len) return buf.slice(0, len);
  const out = new Uint8Array(len).fill(0x36); out.set(buf); return out;
}
const isCFB = d => d.length > 8 && d[0] === 0xD0 && d[1] === 0xCF && d[2] === 0x11 && d[3] === 0xE0;

// AES-CBC decrypt without padding using Web Crypto (append a synthetic PKCS#7 block)
async function aesNoPad(key, iv, data) {
  const last = data.slice(data.length - 16);
  const extra = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-CBC', iv: last }, key, new Uint8Array(16).fill(16))).slice(0, 16);
  return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-CBC', iv }, key, cat(data, extra)));
}

async function decryptWorkbook(data, password) {
  if (!crypto || !crypto.subtle) throw new Error('This browser cannot decrypt files here. Try opening the dashboard in Chrome or Edge.');
  const cfb = XLSX.CFB.read(data, { type: 'array' });
  const infoE = XLSX.CFB.find(cfb, 'EncryptionInfo'), pkgE = XLSX.CFB.find(cfb, 'EncryptedPackage');
  if (!infoE || !pkgE) return data; // not encrypted (e.g. legacy .xls)
  const info = new Uint8Array(infoE.content), pkg = new Uint8Array(pkgE.content);
  if (!(info[0] === 4 && info[2] === 4)) throw new Error('This file uses an older encryption type that is not supported. Re-save it in a current version of Excel.');

  const xml = new DOMParser().parseFromString(new TextDecoder().decode(info.slice(8)), 'application/xml');
  const kd = xml.getElementsByTagNameNS('*', 'keyData')[0];
  const ek = xml.getElementsByTagNameNS('*', 'encryptedKey')[0];
  const kdSalt = b64(kd.getAttribute('saltValue')), kdBlock = +kd.getAttribute('blockSize'), kdBits = +kd.getAttribute('keyBits');
  const kdHash = HASHES[kd.getAttribute('hashAlgorithm')];
  const ekSalt = b64(ek.getAttribute('saltValue')), ekBits = +ek.getAttribute('keyBits'), ekBlock = +ek.getAttribute('blockSize');
  const ekHash = HASHES[ek.getAttribute('hashAlgorithm')], spin = +ek.getAttribute('spinCount');
  const H = async (alg, b) => new Uint8Array(await crypto.subtle.digest(alg, b));

  // Derive the password key
  const pw = new Uint8Array(password.length * 2);
  for (let i = 0; i < password.length; i++) { const c = password.charCodeAt(i); pw[2 * i] = c & 255; pw[2 * i + 1] = c >> 8; }
  let h = await H(ekHash, cat(ekSalt, pw));
  const buf = new Uint8Array(4 + h.length);
  for (let i = 0; i < spin; i++) { buf.set(u32(i)); buf.set(h, 4); h = await H(ekHash, buf); }
  const blockKey = new Uint8Array([0x14, 0x6e, 0x0b, 0xe7, 0xab, 0xac, 0xd0, 0xd6]);
  const pwKey = await crypto.subtle.importKey('raw', fit(await H(ekHash, cat(h, blockKey)), ekBits / 8), 'AES-CBC', false, ['encrypt', 'decrypt']);

  // Unwrap the file key
  let fileKeyBytes;
  try { fileKeyBytes = await aesNoPad(pwKey, fit(ekSalt, ekBlock), b64(ek.getAttribute('encryptedKeyValue'))); }
  catch (e) { throw new Error('Wrong password for this file.'); }
  const fileKey = await crypto.subtle.importKey('raw', fileKeyBytes.slice(0, kdBits / 8), 'AES-CBC', false, ['encrypt', 'decrypt']);

  // Decrypt the package in 4096-byte segments
  const size = pkg[0] + pkg[1] * 2 ** 8 + pkg[2] * 2 ** 16 + pkg[3] * 2 ** 24 + (pkg[4] + pkg[5] * 2 ** 8) * 2 ** 32;
  const out = new Uint8Array(Math.ceil((pkg.length - 8) / 16) * 16);
  let o = 0;
  for (let i = 0, p = 8; p < pkg.length; i++, p += 4096) {
    let seg = pkg.subarray(p, Math.min(p + 4096, pkg.length));
    if (seg.length % 16) seg = seg.subarray(0, seg.length - (seg.length % 16));
    if (!seg.length) break;
    const iv = fit(await H(kdHash, cat(kdSalt, u32(i))), kdBlock);
    const plain = await aesNoPad(fileKey, iv, seg);
    out.set(plain, o); o += plain.length;
  }
  const result = out.slice(0, size);
  if (!(result[0] === 0x50 && result[1] === 0x4B)) throw new Error('Wrong password for this file.');
  return result;
}

function loadFile(file) {
  $('err').textContent = '';
  const reader = new FileReader();
  reader.onload = async ev => {
    try {
      let bytes = new Uint8Array(ev.target.result);
      if (isCFB(bytes)) {
        $('fileInfo').textContent = 'Unlocking ' + file.name + '…';
        bytes = await decryptWorkbook(bytes, FILE_PASSWORD);
      }
      workbook = XLSX.read(bytes, { type: 'array', cellDates: false });
      const best = pickDataSheet(workbook);
      const sel = $('sheetSel');
      sel.innerHTML = workbook.SheetNames.map(n => `<option${n === best ? ' selected' : ''}>${esc(n)}</option>`).join('');
      sel.classList.toggle('hidden', workbook.SheetNames.length < 2);
      $('fileInfo').textContent = file.name;
      processSheet(best);
    } catch (err) {
      $('fileInfo').textContent = file.name;
      $('err').textContent = 'Could not read that file: ' + err.message;
    }
  };
  reader.readAsArrayBuffer(file);
}
$('sheetSel').addEventListener('change', e => processSheet(e.target.value));

// Choose the raw data sheet (not a pivot) by checking the header row
function pickDataSheet(wb) {
  const head = (ws, a) => String((ws[a] && ws[a].v) ?? '').toLowerCase();
  let best = wb.SheetNames[0], bestScore = -1;
  for (const n of wb.SheetNames) {
    const ws = wb.Sheets[n];
    if (!ws['!ref']) continue;
    const rows = XLSX.utils.decode_range(ws['!ref']).e.r;
    let score = 0;
    if (head(ws, 'B1').includes('week')) score += 10;
    if (head(ws, 'AC1').includes('result')) score += 10;
    if (head(ws, 'U1').includes('op')) score += 10;
    if (head(ws, 'L1').includes('appt')) score += 10;
    if (head(ws, 'A1').includes('row labels') || head(ws, 'A3').includes('row labels')) score -= 50;
    score = score * 1e7 + rows;
    if (score > bestScore) { bestScore = score; best = n; }
  }
  return best;
}

// ---- Parsing helpers ----
const okYear = y => y >= 2000 && y <= 2100;
function toDate(v) {
  if (v === '' || v == null) return null;
  if (typeof v === 'number') {
    if (v < 36526) return null; // before 2000 = not a real appointment date
    const d = XLSX.SSF.parse_date_code(v);
    return d && okYear(d.y) ? iso(d.y, d.m, d.d) : null;
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/); // UK dd/mm/yyyy
  if (m) { let y = +m[3]; if (y < 100) y += 2000; return okYear(y) ? iso(y, +m[2], +m[1]) : null; }
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return okYear(+m[1]) ? iso(+m[1], +m[2], +m[3]) : null;
  return null;
}
const iso = (y, m, d) => `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
const ukDate = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s); return m ? `${m[3]}/${m[2]}/${m[1]}` : s; };

function normResult(v) {
  const s = String(v).trim().toLowerCase();
  if (s === 'completed' || s === 'assigned deprog') return 'Completed';
  if (s === 'failed') return 'Failed';
  if (s === 'aborted') return 'Aborted';
  return 'Other';
}
const metersFor = jobType => /DUAL/i.test(jobType) ? 2 : 1;

function processSheet(name) {
  const ws = workbook.Sheets[name];
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
  const body = rows.slice(1); // row 1 = headers
  const groups = new Map();
  records = [];
  meta = { sheet: name, rows: 0, dupes: 0, groups: 0, otherResults: new Map(), conflicts: 0 };

  for (const r of body) {
    const jobRaw = String(r[COL.job] ?? '').trim();
    const resRaw = String(r[COL.result] ?? '').trim();
    if (!jobRaw && !resRaw && !String(r[COL.week] ?? '').trim()) continue; // blank row
    meta.rows++;

    const rec = {
      week: toDate(r[COL.week]) || (String(r[COL.week]).trim() || '(blank)'),
      op: String(r[COL.op] ?? '').trim() || '(blank)',
      appt: toDate(r[COL.appt]),
      outcome: normResult(resRaw),
      rawResult: resRaw || '(blank)',
      meters: metersFor(jobRaw),
    };

    const dual = String(r[COL.dual] ?? '').trim();
    if (dual) {
      if (groups.has(dual)) {
        meta.dupes++;
        const kept = groups.get(dual);
        if (kept.outcome !== rec.outcome) meta.conflicts++;
        if (PRIORITY[rec.outcome] > PRIORITY[kept.outcome]) { kept.outcome = rec.outcome; kept.rawResult = rec.rawResult; }
        continue;
      }
      groups.set(dual, rec);
    }
    records.push(rec);
  }
  meta.groups = groups.size;
  for (const r of records) if (r.outcome === 'Other') meta.otherResults.set(r.rawResult, (meta.otherResults.get(r.rawResult) || 0) + 1);

  if (!records.length) {
    $('err').textContent = `No job rows found on sheet "${name}". Pick the raw data sheet from the drop-down.`;
  }
  buildFilters();
  drop.classList.add('hidden');
  $('dash').classList.remove('hidden');
  render();
}

// ---- Filters ----
function opts(sel, values, label, fmtFn = v => v) {
  sel.innerHTML = `<option value="">All ${label}</option>` + values.map(v => `<option value="${esc(v)}">${esc(fmtFn(v))}</option>`).join('');
}
function buildFilters() {
  const uniq = k => [...new Set(records.map(r => r[k]))].sort((a, b) => String(a).localeCompare(String(b)));
  opts($('fWeek'), uniq('week'), 'weeks', ukDate);
  opts($('fOp'), uniq('op'), 'engineers');
  const dates = records.map(r => r.appt).filter(Boolean).sort();
  for (const id of ['fFrom', 'fTo']) {
    const el = $(id);
    el.value = '';
    el.min = dates[0] || '';
    el.max = dates[dates.length - 1] || '';
  }
}
['fWeek', 'fOp', 'fFrom', 'fTo'].forEach(id => $(id).addEventListener('change', render));
$('reset').addEventListener('click', () => { ['fWeek', 'fOp', 'fFrom', 'fTo'].forEach(id => $(id).value = ''); render(); });

function filtered() {
  const w = $('fWeek').value, op = $('fOp').value, from = $('fFrom').value, to = $('fTo').value;
  return records.filter(r =>
    (!w || r.week === w) && (!op || r.op === op) &&
    (!from || (r.appt && r.appt >= from)) && (!to || (r.appt && r.appt <= to)));
}

// ---- Aggregation ----
const blank = () => ({ jobs: 0, Completed: 0, Failed: 0, Aborted: 0, Other: 0, mCompleted: 0 });
function add(a, r) { a.jobs++; a[r.outcome]++; if (r.outcome === 'Completed') a.mCompleted += r.meters; }
function groupBy(rows, key) {
  const m = new Map();
  for (const r of rows) { const k = r[key] || '(blank)'; if (!m.has(k)) m.set(k, blank()); add(m.get(k), r); }
  return new Map([...m.entries()].sort((a, b) => String(a[0]).localeCompare(String(b[0]))));
}
const rateNum = a => { const d = a.Completed + a.Failed + a.Aborted; return d ? a.Completed / d : -1; };
const rate = a => pct(a.Completed, a.Completed + a.Failed + a.Aborted);

// ---- Render ----
function render() {
  const rows = filtered();
  const t = blank(); rows.forEach(r => add(t, r));

  const kpi = (label, value, note, color) =>
    `<div class="card kpi"><div class="label">${color ? `<span class="dot" style="background:${color}"></span>` : ''}${label}</div><div class="value">${value}</div><div class="note">${note}</div></div>`;
  $('kpis').innerHTML =
    kpi('Total jobs', fmt(t.jobs), 'Dual-linked jobs counted once') +
    kpi('Completion rate', rate(t), 'Completed ÷ (Completed + Failed + Aborted)') +
    kpi('Meters completed', fmt(t.mCompleted), `${fmt(t.Completed)} jobs completed · incl. Assigned Deprog`, css('--good')) +
    kpi('Total failed', fmt(t.Failed), 'jobs', css('--critical')) +
    kpi('Total aborted', fmt(t.Aborted), 'jobs', css('--serious'));

  const byWeek = groupBy(rows, 'week');
  drawChart('cWeek', byWeek);
  $('tblWeek').innerHTML = table('week', byWeek, 'Week comm', t, ukDate);
  $('tblOp').innerHTML = table('op', groupBy(rows, 'op'), 'Engineer', t);

  const list = m => [...m.entries()].map(([k, v]) => `<li>${esc(k)}: ${fmt(v)}</li>`).join('');
  $('notes').innerHTML = `<summary>Data notes</summary>
    <div style="margin-top:8px">Sheet used: <strong>${esc(meta.sheet)}</strong> · ${fmt(meta.rows)} rows read · ${fmt(meta.dupes)} duplicate dual-link rows removed · ${fmt(records.length)} jobs counted (${fmt(rows.length)} after filters).</div>
    ${meta.conflicts ? `<div style="margin-top:6px">${fmt(meta.conflicts)} dual-link rows had a different result from their partner; the job was counted using the best result (Completed &gt; Failed &gt; Aborted).</div>` : ''}
    ${meta.otherResults.size ? `<div style="margin-top:6px">Results not Completed / Failed / Aborted / Assigned Deprog (counted in Total jobs only):<ul>${list(meta.otherResults)}</ul></div>` : ''}`;
}

const COLS = [
  { k: 'label', h: null },
  { k: 'jobs', h: 'Jobs', v: a => a.jobs, f: fmt },
  { k: 'rate', h: 'Completion rate', v: rateNum, f: (_, a) => rate(a) },
  { k: 'mCompleted', h: 'Meters completed', v: a => a.mCompleted, f: fmt },
  { k: 'Failed', h: 'Failed', v: a => a.Failed, f: fmt },
  { k: 'Aborted', h: 'Aborted', v: a => a.Aborted, f: fmt },
];
function table(id, map, label, total, labelFmt = s => s) {
  let entries = [...map.entries()];
  const s = sortState[id];
  if (s) {
    const c = COLS.find(c => c.k === s.k);
    entries.sort((x, y) => {
      const d = c.k === 'label' ? String(x[0]).localeCompare(String(y[0])) : c.v(x[1]) - c.v(y[1]);
      return s.dir * d;
    });
  }
  const arrow = k => s && s.k === k ? (s.dir > 0 ? ' ▲' : ' ▼') : '';
  const row = (k, a) => `<tr><td>${esc(labelFmt(k))}</td>` + COLS.slice(1).map(c => `<td>${c.f(c.v(a), a)}</td>`).join('') + '</tr>';
  return `<table><thead><tr>${COLS.map(c => `<th data-t="${id}" data-k="${c.k}">${c.h || label}${arrow(c.k)}</th>`).join('')}</tr></thead>
    <tbody>${entries.map(([k, a]) => row(k, a)).join('')}</tbody>
    <tfoot>${row('Total', total)}</tfoot></table>`;
}
document.addEventListener('click', e => {
  const th = e.target.closest('th[data-t]'); if (!th) return;
  const { t, k } = th.dataset, cur = sortState[t];
  sortState[t] = { k, dir: cur && cur.k === k ? -cur.dir : (k === 'label' ? 1 : -1) };
  render();
});

function drawChart(id, map) {
  const labels = [...map.keys()].map(ukDate);
  const vals = [...map.values()];
  const colors = { Completed: css('--good'), Failed: css('--critical'), Aborted: css('--serious'), Other: css('--other') };
  const datasets = ['Completed', 'Failed', 'Aborted', 'Other']
    .filter(o => vals.some(a => a[o] > 0))
    .map(o => ({
      label: o === 'Other' ? 'Other / no result' : o, data: vals.map(a => a[o]),
      backgroundColor: colors[o], borderColor: css('--surface'), borderWidth: { top: 2 },
      borderRadius: 2, borderSkipped: 'start', maxBarThickness: 40,
    }));
  if (charts[id]) charts[id].destroy();
  charts[id] = new Chart($(id), {
    type: 'bar',
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'top', align: 'start', labels: { color: css('--text-2'), boxWidth: 10, boxHeight: 10, usePointStyle: true, pointStyle: 'rectRounded' } },
        tooltip: {
          callbacks: {
            footer: items => {
              const a = vals[items[0].dataIndex];
              return `Jobs: ${fmt(a.jobs)}\nCompletion rate: ${rate(a)}\nMeters completed: ${fmt(a.mCompleted)}`;
            }
          }
        }
      },
      scales: {
        x: { stacked: true, grid: { display: false }, ticks: { color: css('--muted'), maxRotation: 45, autoSkip: true } },
        y: { stacked: true, beginAtZero: true, grid: { color: css('--grid') }, border: { display: false }, ticks: { color: css('--muted'), precision: 0 } }
      }
    }
  });
}

matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => records.length && render());
</script>
</body>
</html>
