<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Data - OES Performance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        .back-link-top {
            position: absolute;
            left: 0;
            top: 0;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .back-link-top:hover {
            text-decoration: underline;
        }

        .logo {
            font-size: 2em;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .filter-section {
            margin-bottom: 30px;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .date-filters {
            display: flex;
            gap: 20px;
            align-items: end;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .view-tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }

        .tab-btn {
            padding: 10px 20px;
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            background: #667eea;
            color: white;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }

        .filter-group {
            flex: 1;
            min-width: 200px;
        }

        .filter-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        .filter-group input {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
        }

        .btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #28a745;
        }

        .btn-secondary:hover {
            box-shadow: 0 10px 25px rgba(40, 167, 69, 0.4);
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        .results-table thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .results-table th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            position: relative;
        }

        .results-table th:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .sort-indicator {
            margin-left: 5px;
            font-size: 0.8em;
        }

        .results-table tbody {
        }

        .results-table tbody tr {
            border-bottom: 1px solid #e0e0e0;
        }

        .results-table tbody tr:hover {
            background-color: #f8f9fa;
        }

        .results-table td {
            padding: 12px 15px;
        }

        .team-leader-cell {
            color: #666;
            font-size: 0.9em;
        }

        .number-cell {
            text-align: center;
            font-weight: 600;
        }

        .date-cell {
            color: #667eea;
            font-weight: 600;
        }

        .summary-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .summary-card .label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .summary-card .value {
            font-size: 2em;
            font-weight: bold;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 1.1em;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .chart-section {
            display: none;
            margin-bottom: 30px;
        }

        .chart-filters {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .chart-filters select {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            min-width: 200px;
        }

        #chartCanvas {
            max-height: 400px;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        .absence-summary {
            margin-top: 15px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            overflow-x: auto;
        }

        .absence-summary-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            text-align: center;
        }

        .absence-by-date {
            display: flex;
            gap: 0;
            justify-content: space-evenly;
            min-width: 100%;
        }

        .date-absence-column {
            flex: 1;
            text-align: center;
            padding: 0 5px;
        }

        .date-label {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 8px;
            padding-bottom: 5px;
            border-bottom: 2px solid #667eea;
            font-size: 0.85em;
        }

        .date-absences {
            display: flex;
            flex-direction: column;
            gap: 5px;
            align-items: center;
        }

        .absence-count {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: 600;
            white-space: nowrap;
        }

        .absence-count.holiday {
            background: rgba(0, 123, 255, 0.15);
            color: #007bff;
        }

        .absence-count.sick {
            background: rgba(220, 53, 69, 0.15);
            color: #dc3545;
        }

        .absence-count.aaup {
            background: rgba(253, 126, 20, 0.15);
            color: #fd7e14;
        }

        .absence-count.other {
            background: rgba(108, 117, 125, 0.15);
            color: #6c757d;
        }

        .no-absences-date {
            color: #28a745;
            font-size: 0.8em;
            font-weight: 600;
        }

        .absence-section {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .absence-title {
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
        }

        .absence-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }

        .absence-item {
            padding: 12px;
            background: white;
            border-left: 4px solid #dc3545;
            border-radius: 5px;
        }

        .absence-item.holiday {
            border-left-color: #007bff;
        }

        .absence-item.sick {
            border-left-color: #dc3545;
        }

        .absence-item.aaup {
            border-left-color: #fd7e14;
        }

        .absence-item.other {
            border-left-color: #6c757d;
        }

        .absence-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .absence-details {
            font-size: 0.9em;
            color: #666;
        }

        .absence-status {
            display: inline-block;
            padding: 3px 8px;
            color: white;
            border-radius: 3px;
            font-size: 0.85em;
            margin-top: 5px;
        }

        .absence-status.holiday {
            background: #007bff;
        }

        .absence-status.sick {
            background: #dc3545;
        }

        .absence-status.aaup {
            background: #fd7e14;
        }

        .absence-status.other {
            background: #6c757d;
        }

        .no-absences {
            text-align: center;
            color: #28a745;
            font-weight: 600;
            padding: 20px;
        }
        .bonus-section {
    margin-top: 30px;
    padding: 20px;
    background: #f8f9fa;
    border-radius: 10px;
}

.bonus-title {
    font-size: 1.2em;
    font-weight: 600;
    color: #333;
    margin-bottom: 15px;
}

.bonus-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 15px;
}

.bonus-item {
    padding: 12px;
    background: white;
    border-left: 4px solid #28a745;
    border-radius: 5px;
}

.bonus-name {
    font-weight: 600;
    color: #333;
    margin-bottom: 5px;
}

.bonus-details {
    font-size: 0.9em;
    color: #666;
}

.bonus-amount {
    display: inline-block;
    padding: 3px 8px;
    background: #28a745;
    color: white;
    border-radius: 3px;
    font-size: 0.85em;
    margin-top: 5px;

}

    text-align: center;
    color: #666;
    padding: 20px;
}

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .filter-section {
                flex-direction: column;
            }

            .results-table {
                font-size: 0.85em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="index.html" class="back-link-top">← Back to Home</a>
            <div class="logo">OES Performance</div>
            <div class="subtitle">View Performance Data</div>
        </div>

        <div class="filter-section">
            <div class="date-filters">
                <div class="filter-group">
                    <label for="startDate">Start Date</label>
                    <input type="date" id="startDate" required>
                </div>
                <div class="filter-group">
                    <label for="endDate">End Date</label>
                    <input type="date" id="endDate" required>
                </div>
                <div class="button-group">
                    <button class="btn" onclick="loadData()">Load Data</button>
                    <button class="btn btn-secondary" onclick="generatePDF()" id="pdfBtn" style="display: none;">📄 Create PDF</button>
                </div>
            </div>
            
            <div class="view-tabs">
                <button class="tab-btn active" onclick="switchView('table')">📊 View Table</button>
                <button class="tab-btn" onclick="switchView('jobs')">📈 View Jobs Chart</button>
                <button class="tab-btn" onclick="switchView('completed')">✅ View Completed Chart</button>
                <button class="tab-btn" onclick="switchView('aborted')">❌ View Aborted Chart</button>
                <button class="tab-btn" onclick="switchView('meters')">📏 View Meters Chart</button>
            </div>
        </div>

        <div id="summarySection" class="summary-section" style="display: none;"></div>

        <div id="chartSection" class="chart-section">
            <div class="chart-filters">
                <select id="teamLeaderFilter" onchange="updateEngineerDropdown(); updateChart();">
                    <option value="all">All Team Leaders</option>
                </select>
                <select id="chartFilter" onchange="updateChart()">
                    <option value="all">All Engineers</option>
                </select>
            </div>
            <canvas id="chartCanvas"></canvas>
            
            <div id="absenceSummary" class="absence-summary" style="display: none;">
                <div class="absence-summary-title">Absences by Date</div>
                <div id="absenceByDate" class="absence-by-date"></div>
            </div>
            
            <div id="absenceSection" class="absence-section" style="display: none;">
                <div class="absence-title">🚫 Absences During Selected Period</div>
                <div id="absenceList" class="absence-list"></div>
            </div>

            <div id="bonusSection" class="bonus-section" style="display: none;">
    <div class="bonus-title">💰 Bonuses Earned During Selected Period</div>
    <div id="bonusList" class="bonus-list"></div>
</div>
            
        </div>

        <div id="loadingDiv" class="loading" style="display: none;">Loading data...</div>
        <div id="noDataDiv" class="no-data" style="display: none;">No data found for the selected date range.</div>

        <div id="tableContainer" style="display: none;">
            <div class="table-wrapper">
                <table class="results-table">
                    <thead>
                        <tr>
                            <th onclick="sortTable('date')">Date <span class="sort-indicator" id="sort-date"></span></th>
                            <th onclick="sortTable('engineer')">Engineer <span class="sort-indicator" id="sort-engineer"></span></th>
                            <th onclick="sortTable('teamLeader')">Team Leader <span class="sort-indicator" id="sort-teamLeader"></span></th>
                            <th onclick="sortTable('jobs')">Jobs <span class="sort-indicator" id="sort-jobs"></span></th>
                            <th onclick="sortTable('completed')">Completed <span class="sort-indicator" id="sort-completed"></span></th>
                            <th onclick="sortTable('aborted')">Aborted <span class="sort-indicator" id="sort-aborted"></span></th>
                            <th onclick="sortTable('meters')">Meters <span class="sort-indicator" id="sort-meters"></span></th>
                        </tr>
                    </thead>
                    <tbody id="resultsBody">
                    </tbody>
                </table>
            </div>
        </div>

        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { Chart, registerables } from 'https://cdn.jsdelivr.net/npm/chart.js@4.4.0/+esm';
        import html2canvas from 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/+esm';
        import jsPDF from 'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/+esm';

        Chart.register(...registerables);

        const firebaseConfig = {
            apiKey: "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
            authDomain: "oesperformance-a54c0.firebaseapp.com",
            projectId: "oesperformance-a54c0",
            storageBucket: "oesperformance-a54c0.firebasestorage.app",
            messagingSenderId: "484894102454",
            appId: "1:484894102454:web:17535ee497eac2d90d6717",
            measurementId: "G-R56BGZYV8N"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allData = [];
        let allAttendance = [];
        let currentView = 'table';
        let currentChart = null;
        let sortColumn = 'date';
        let sortDirection = 'desc';

        // Set default dates (last 7 days)
        const today = new Date();
        const lastWeek = new Date(today);
        lastWeek.setDate(lastWeek.getDate() - 7);
        
        document.getElementById('endDate').valueAsDate = today;
        document.getElementById('startDate').valueAsDate = lastWeek;

        window.loadData = async function() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;

            if (!startDate || !endDate) {
                alert('Please select both start and end dates');
                return;
            }

            if (startDate > endDate) {
                alert('Start date must be before end date');
                return;
            }

            document.getElementById('loadingDiv').style.display = 'block';
            document.getElementById('noDataDiv').style.display = 'none';
            document.getElementById('tableContainer').style.display = 'none';
            document.getElementById('summarySection').style.display = 'none';

            try {
                const q = query(
                    collection(db, "performance"),
                    where("date", ">=", startDate),
                    where("date", "<=", endDate),
                    orderBy("date", "desc"),
                    orderBy("engineerName")
                );

                const querySnapshot = await getDocs(q);
                
                allData = [];
                querySnapshot.forEach((doc) => {
                    allData.push(doc.data());
                });

                // Load attendance data for the same date range
                const attendanceQuery = query(
                    collection(db, "attendance"),
                    where("date", ">=", startDate),
                    where("date", "<=", endDate),
                    orderBy("date", "desc"),
                    orderBy("engineerName")
                );

                const attendanceSnapshot = await getDocs(attendanceQuery);
                allAttendance = [];
                attendanceSnapshot.forEach((doc) => {
                    const data = doc.data();
                    // Only include non-"X" (not in) attendance
                    if (data.attendance && data.attendance !== 'X') {
                        allAttendance.push(data);
                    }
                });

                if (currentView === 'table') {
                    displayData(allData);
                } else {
                    displayChart(currentView);
                }

                // Show PDF button only when viewing charts
                document.getElementById('pdfBtn').style.display = currentView === 'table' ? 'none' : 'inline-block';

            } catch (error) {
                console.error("Error loading data:", error);
                
                // Check if it's an index error
                if (error.message && error.message.includes('index')) {
                    const match = error.message.match(/https:\/\/[^\s]+/);
                    if (match) {
                        const indexUrl = match[0];
                        document.getElementById('noDataDiv').innerHTML = `
                            <strong>Index Required</strong><br><br>
                            Firestore needs to create an index for this query.<br><br>
                            <a href="${indexUrl}" target="_blank" style="color: #667eea; font-weight: bold; text-decoration: underline;">
                                Click here to create the index
                            </a><br><br>
                            After creating it, wait 1-2 minutes and refresh this page.
                        `;
                        document.getElementById('noDataDiv').style.display = 'block';
                    } else {
                        alert('Index error. Check console for the link to create it.');
                    }
                } else {
                    alert('Error loading data: ' + error.message);
                }
                
                document.getElementById('loadingDiv').style.display = 'none';
            }
        }

        async function displayBonuses(engineerFilter, teamLeaderFilter) {
    const bonusSection = document.getElementById('bonusSection');
    const bonusList = document.getElementById('bonusList');

    const startDate = document.getElementById('startDate').value;
    const endDate = document.getElementById('endDate').value;

    try {
        // Query bonuses where weekStartDate falls within the selected range
        const bonusQuery = query(
            collection(db, "bonuses"),
            where("weekStartDate", ">=", startDate),
            where("weekStartDate", "<=", endDate),
            orderBy("weekStartDate", "desc"),
            orderBy("engineerName")
        );

        const bonusSnapshot = await getDocs(bonusQuery);
        let allBonuses = [];
        bonusSnapshot.forEach((doc) => {
            allBonuses.push(doc.data());
        });

        // Filter bonuses based on selected filters
        if (teamLeaderFilter !== 'all') {
            allBonuses = allBonuses.filter(b => b.teamLeader === teamLeaderFilter);
        }
        if (engineerFilter !== 'all') {
            allBonuses = allBonuses.filter(b => b.engineerName === engineerFilter);
        }

        if (allBonuses.length === 0) {
            bonusList.innerHTML = '<div class="no-bonus">No bonuses recorded for this period</div>';
            bonusSection.style.display = 'block';
            return;
        }

        // Sort by week total (highest first)
        allBonuses.sort((a, b) => (b.weekTotal || 0) - (a.weekTotal || 0));

        bonusList.innerHTML = '';
        allBonuses.forEach(bonus => {
            const item = document.createElement('div');
            item.className = 'bonus-item';

            item.innerHTML = `
                <div class="bonus-name">${bonus.engineerName}</div>
                <div class="bonus-details">Team Leader: ${bonus.teamLeader}</div>
                <div class="bonus-details">Week Starting: ${bonus.weekStartDate}</div>
                <span class="bonus-amount">£${bonus.weekTotal}</span>
            `;
            bonusList.appendChild(item);
        });

        bonusSection.style.display = 'block';

    } catch (error) {
        console.error("Error loading bonuses:", error);
        bonusList.innerHTML = '<div class="no-bonus">Error loading bonus data</div>';
        bonusSection.style.display = 'block';
    }
}

        function displayData(data) {
            document.getElementById('loadingDiv').style.display = 'none';
            document.getElementById('chartSection').style.display = 'none';
            document.getElementById('tableContainer').style.display = 'none';

            if (data.length === 0) {
                document.getElementById('noDataDiv').style.display = 'block';
                document.getElementById('summarySection').style.display = 'none';
                return;
            }

            // Sort data
            const sortedData = [...data].sort((a, b) => {
                let aVal, bVal;
                
                switch(sortColumn) {
                    case 'date':
                        aVal = a.date;
                        bVal = b.date;
                        break;
                    case 'engineer':
                        aVal = a.engineerName.toLowerCase();
                        bVal = b.engineerName.toLowerCase();
                        break;
                    case 'teamLeader':
                        aVal = a.teamLeader.toLowerCase();
                        bVal = b.teamLeader.toLowerCase();
                        break;
                    case 'jobs':
                        aVal = a.jobs;
                        bVal = b.jobs;
                        break;
                    case 'completed':
                        aVal = a.completed;
                        bVal = b.completed;
                        break;
                    case 'aborted':
                        aVal = a.aborted;
                        bVal = b.aborted;
                        break;
                    case 'meters':
                        aVal = a.meters;
                        bVal = b.meters;
                        break;
                    default:
                        aVal = a.date;
                        bVal = b.date;
                }

                if (aVal < bVal) return sortDirection === 'asc' ? -1 : 1;
                if (aVal > bVal) return sortDirection === 'asc' ? 1 : -1;
                return 0;
            });

            // Update sort indicators
            document.querySelectorAll('.sort-indicator').forEach(el => el.textContent = '');
            const indicator = document.getElementById(`sort-${sortColumn}`);
            if (indicator) {
                indicator.textContent = sortDirection === 'asc' ? '▲' : '▼';
            }

            // Calculate summaries
            let totalJobs = 0;
            let totalCompleted = 0;
            let totalAborted = 0;
            let totalMeters = 0;

            data.forEach(record => {
                totalJobs += record.jobs || 0;
                totalCompleted += record.completed || 0;
                totalAborted += record.aborted || 0;
                totalMeters += record.meters || 0;
            });

            // Display summary
            const summarySection = document.getElementById('summarySection');
            summarySection.innerHTML = `
                <div class="summary-card">
                    <div class="label">Total Jobs</div>
                    <div class="value">${totalJobs}</div>
                </div>
                <div class="summary-card">
                    <div class="label">Total Completed</div>
                    <div class="value">${totalCompleted}</div>
                </div>
                <div class="summary-card">
                    <div class="label">Total Aborted</div>
                    <div class="value">${totalAborted}</div>
                </div>
                <div class="summary-card">
                    <div class="label">Total Meters</div>
                    <div class="value">${Math.round(totalMeters)}</div>
                </div>
            `;
            summarySection.style.display = 'grid';

            // Display table
            const tbody = document.getElementById('resultsBody');
            tbody.innerHTML = '';

            sortedData.forEach(record => {
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td class="date-cell">${record.date}</td>
                    <td>${record.engineerName}</td>
                    <td class="team-leader-cell">${record.teamLeader}</td>
                    <td class="number-cell">${record.jobs}</td>
                    <td class="number-cell">${record.completed}</td>
                    <td class="number-cell">${record.aborted}</td>
                    <td class="number-cell">${Math.round(record.meters)}</td>
                `;
            });

            document.getElementById('tableContainer').style.display = 'block';
        }

        window.sortTable = function(column) {
            if (sortColumn === column) {
                sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                sortColumn = column;
                sortDirection = 'asc';
            }

        window.switchView = function(view) {
            currentView = view;
            
            // Update active tab
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (allData.length === 0) {
                return;
            }

            if (view === 'table') {
                displayData(allData);
                document.getElementById('pdfBtn').style.display = 'none';
            } else {
                displayChart(view);
                document.getElementById('pdfBtn').style.display = 'inline-block';
            }
        }

        window.generatePDF = async function() {
            const pdfBtn = document.getElementById('pdfBtn');
            pdfBtn.disabled = true;
            pdfBtn.textContent = '⏳ Generating...';

            try {
                const pdf = new jsPDF('p', 'mm', 'a4');
                const pageWidth = pdf.internal.pageSize.getWidth();
                const pageHeight = pdf.internal.pageSize.getHeight();
                let yPosition = 20;

                // Get filter values for filename
                const teamLeaderFilter = document.getElementById('teamLeaderFilter').value;
                const engineerFilter = document.getElementById('chartFilter').value;
                const startDate = document.getElementById('startDate').value;
                const endDate = document.getElementById('endDate').value;

                // Create filename
                let filename = '';
                if (teamLeaderFilter !== 'all') {
                    filename += teamLeaderFilter.replace(/\s+/g, '_');
                }
                if (engineerFilter !== 'all') {
                    filename += (filename ? '_' : '') + engineerFilter.replace(/\s+/g, '_');
                }
                if (!filename) {
                    filename = 'All_Engineers';
                }
                filename += `_${startDate}_to_${endDate}.pdf`;

                // Add title
                pdf.setFontSize(16);
                pdf.setFont(undefined, 'bold');
                const title = `Performance Report: ${teamLeaderFilter === 'all' ? 'All Team Leaders' : teamLeaderFilter}${engineerFilter !== 'all' ? ' - ' + engineerFilter : ''}`;
                pdf.text(title, pageWidth / 2, yPosition, { align: 'center' });
                yPosition += 10;

                // Add date range
                pdf.setFontSize(10);
                pdf.setFont(undefined, 'normal');
                pdf.text(`Period: ${startDate} to ${endDate}`, pageWidth / 2, yPosition, { align: 'center' });
                yPosition += 15;

                // Capture chart
                const chartCanvas = document.getElementById('chartCanvas');
                const chartImage = await html2canvas(chartCanvas, { 
                    backgroundColor: '#ffffff',
                    scale: 1.5
                });
                const chartImgData = chartImage.toDataURL('image/jpeg', 0.85);
                const chartWidth = pageWidth - 20;
                const chartHeight = (chartImage.height * chartWidth) / chartImage.width;
                
                pdf.addImage(chartImgData, 'JPEG', 10, yPosition, chartWidth, chartHeight);
                yPosition += chartHeight + 10;

                // Capture absence summary if visible
                const absenceSummary = document.getElementById('absenceSummary');
                if (absenceSummary.style.display !== 'none') {
                    const summaryCanvas = await html2canvas(absenceSummary, {
                        backgroundColor: '#ffffff',
                        scale: 1.5
                    });
                    const summaryImgData = summaryCanvas.toDataURL('image/jpeg', 0.85);
                    const summaryWidth = pageWidth - 20;
                    const summaryHeight = (summaryCanvas.height * summaryWidth) / summaryCanvas.width;

                    // Check if we need a new page
                    if (yPosition + summaryHeight > pageHeight - 10) {
                        pdf.addPage();
                        yPosition = 20;
                    }

                    pdf.addImage(summaryImgData, 'JPEG', 10, yPosition, summaryWidth, summaryHeight);
                    yPosition += summaryHeight + 10;
                }

                // Capture detailed absence section
                const absenceSection = document.getElementById('absenceSection');
                if (absenceSection.style.display !== 'none') {
                    const absenceCanvas = await html2canvas(absenceSection, {
                        backgroundColor: '#ffffff',
                        scale: 1.5
                    });
                    const absenceImgData = absenceCanvas.toDataURL('image/jpeg', 0.85);
                    const absenceWidth = pageWidth - 20;
                    const absenceHeight = (absenceCanvas.height * absenceWidth) / absenceCanvas.width;

                    // Check if we need a new page
                    if (yPosition + absenceHeight > pageHeight - 10) {
                        pdf.addPage();
                        yPosition = 20;
                    }

                    pdf.addImage(absenceImgData, 'JPEG', 10, yPosition, absenceWidth, absenceHeight);
                }

                // Save PDF
                pdf.save(filename);

            } catch (error) {
                console.error('Error generating PDF:', error);
                alert('Error generating PDF. Please try again.');
            } finally {
                pdfBtn.disabled = false;
                pdfBtn.textContent = '📄 Create PDF';
            }
        }

            document.getElementById('tableContainer').style.display = 'none';
            document.getElementById('summarySection').style.display = 'none';
            document.getElementById('chartSection').style.display = 'block';

            // Populate filter dropdowns
            const engineers = [...new Set(allData.map(d => d.engineerName))].sort();

        // Display absences
displayAbsences(engineerFilter, teamLeaderFilter);

        window.updateEngineerDropdown = updateEngineerDropdown;

        window.updateChart = async function() {
            const metric = currentView;
            const engineerFilter = document.getElementById('chartFilter').value;
            const teamLeaderFilter = document.getElementById('teamLeaderFilter').value;

            // Filter data for selected period
            let filteredData = allData;
            if (teamLeaderFilter !== 'all') {
                filteredData = filteredData.filter(d => d.teamLeader === teamLeaderFilter);
            }
            if (engineerFilter !== 'all') {
                filteredData = filteredData.filter(d => d.engineerName === engineerFilter);
            }

            // Get all weekday dates in the selected range
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const start = new Date(startDate);
            const end = new Date(endDate);
            const allWeekdayDates = [];
            
            for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
                const dayOfWeek = d.getDay();
                // Skip weekends (0 = Sunday, 6 = Saturday)
                if (dayOfWeek !== 0 && dayOfWeek !== 6) {
                    allWeekdayDates.push(d.toISOString().split('T')[0]);
                }
            }

            // Group by date (including zeros for missing dates)
            const dateMap = {};
            allWeekdayDates.forEach(date => {
                dateMap[date] = 0;
            });
            
            filteredData.forEach(record => {
                if (dateMap.hasOwnProperty(record.date)) {
                    dateMap[record.date] += record[metric] || 0;
                }
            });

            const dates = allWeekdayDates;
            const values = dates.map(date => dateMap[date]);

            // Calculate previous 4 weeks average
            const startDateStr = document.getElementById('startDate').value;
            const startDateObj = new Date(startDateStr);
            const fourWeeksAgo = new Date(startDateObj);
            fourWeeksAgo.setDate(fourWeeksAgo.getDate() - 28);
            const fourWeeksAgoStr = fourWeeksAgo.toISOString().split('T')[0];

            // Fetch data from 4 weeks before the selected start date
            let previous4WeeksAvg = 0;
            try {
                const prevQuery = query(
                    collection(db, "performance"),
                    where("date", ">=", fourWeeksAgoStr),
                    where("date", "<", startDateStr),
                    orderBy("date", "desc")
                );

                const prevSnapshot = await getDocs(prevQuery);
                let prevData = [];
                prevSnapshot.forEach((doc) => {
                    prevData.push(doc.data());
                });

                // Filter previous data by same team leader/engineer if selected
                if (teamLeaderFilter !== 'all') {
                    prevData = prevData.filter(d => d.teamLeader === teamLeaderFilter);
                }
                if (engineerFilter !== 'all') {
                    prevData = prevData.filter(d => d.engineerName === engineerFilter);
                }

                // Group by date and sum values (to match how current data is grouped)
                const prevDateMap = {};
                prevData.forEach(record => {
                    if (!prevDateMap[record.date]) {
                        prevDateMap[record.date] = 0;
                    }
                    prevDateMap[record.date] += record[metric] || 0;
                });

                // Calculate average of daily totals
                const prevDailyTotals = Object.values(prevDateMap);
                if (prevDailyTotals.length > 0) {
                    const prevSum = prevDailyTotals.reduce((sum, val) => sum + val, 0);
                    previous4WeeksAvg = prevSum / prevDailyTotals.length;
                }
            } catch (error) {
                console.log("Could not fetch previous 4 weeks data:", error);
            }

            // Destroy existing chart
            if (currentChart) {
                currentChart.destroy();
            }

            // Create new chart
            const ctx = document.getElementById('chartCanvas').getContext('2d');
            const metricLabels = {
                jobs: 'Jobs',
                completed: 'Completed',
                aborted: 'Aborted',
                meters: 'Meters'
            };

            // Calculate trend line using linear regression
            const n = values.length;
            let sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0;
            
            values.forEach((y, x) => {
                sumX += x;
                sumY += y;
                sumXY += x * y;
                sumX2 += x * x;
            });

            const slope = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX);
            const intercept = (sumY - slope * sumX) / n;
            
            const trendValues = values.map((_, x) => slope * x + intercept);

            // Create average line (same value for all dates)
            const avgValues = new Array(dates.length).fill(previous4WeeksAvg);

            const datasets = [{
                label: metricLabels[metric],
                data: values,
                borderColor: '#667eea',
                backgroundColor: 'rgba(102, 126, 234, 0.1)',
                borderWidth: 3,
                tension: 0.4,
                fill: true,
                order: 3
            },
            {
                label: 'Trend',
                data: trendValues,
                borderColor: '#ff6b6b',
                backgroundColor: 'transparent',
                borderWidth: 2,
                borderDash: [5, 5],
                pointRadius: 0,
                fill: false,
                order: 2
            }];

            // Only add previous 4 weeks average if we have data
            if (previous4WeeksAvg > 0) {
                datasets.push({
                    label: 'Previous 4 Weeks Avg',
                    data: avgValues,
                    borderColor: '#28a745',
                    backgroundColor: 'transparent',
                    borderWidth: 2,
                    borderDash: [10, 5],
                    pointRadius: 0,
                    fill: false,
                    order: 1
                });
            }

            currentChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: dates,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top'
                        },
                        title: {
                            display: true,
                            text: `${metricLabels[metric]} Over Time`,
                            font: {
                                size: 18,
                                weight: 'bold'
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                precision: 0
                            }
                        }
                    }
                }
            });

            // Display absences
            displayAbsences(engineerFilter, teamLeaderFilter);
        }

        function displayAbsences(engineerFilter, teamLeaderFilter) {
            const absenceSection = document.getElementById('absenceSection');
            const absenceList = document.getElementById('absenceList');
            const absenceSummary = document.getElementById('absenceSummary');
            const absenceByDate = document.getElementById('absenceByDate');

            // Filter absences based on selected filters
            let filteredAbsences = allAttendance;
            if (teamLeaderFilter !== 'all') {
                filteredAbsences = filteredAbsences.filter(a => a.teamLeader === teamLeaderFilter);
            }
            if (engineerFilter !== 'all') {
                filteredAbsences = filteredAbsences.filter(a => a.engineerName === engineerFilter);
            }

            if (filteredAbsences.length === 0) {
                absenceList.innerHTML = '<div class="no-absences">✅ No absences recorded for this period</div>';
                absenceSection.style.display = 'block';
                absenceSummary.style.display = 'none';
                return;
            }

            // Get all weekday dates from the chart
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const start = new Date(startDate);
            const end = new Date(endDate);
            const allDates = [];
            
            for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
                const dayOfWeek = d.getDay();
                // Skip weekends (0 = Sunday, 6 = Saturday)
                if (dayOfWeek !== 0 && dayOfWeek !== 6) {
                    allDates.push(d.toISOString().split('T')[0]);
                }
            }

            // Check if range is more than 2 weeks (10 working days)
            if (allDates.length > 10) {
                absenceSummary.style.display = 'none';
            } else {
                // Group absences by date
                const absencesByDate = {};
                allDates.forEach(date => {
                    absencesByDate[date] = [];
                });

                filteredAbsences.forEach(absence => {
                    if (absencesByDate[absence.date] !== undefined) {
                        absencesByDate[absence.date].push(absence.attendance);
                    }
                });

                // Display absences by date
                absenceByDate.innerHTML = '';
                
                allDates.forEach(date => {
                    const columnDiv = document.createElement('div');
                    columnDiv.className = 'date-absence-column';

                    // Format date for display (just day/month)
                    const dateObj = new Date(date + 'T00:00:00');
                    const displayDate = dateObj.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit' });

                    const dateLabelDiv = document.createElement('div');
                    dateLabelDiv.className = 'date-label';
                    dateLabelDiv.textContent = displayDate;
                    columnDiv.appendChild(dateLabelDiv);

                    const absencesDiv = document.createElement('div');
                    absencesDiv.className = 'date-absences';

                    const dateAbsences = absencesByDate[date];
                    
                    if (dateAbsences.length === 0) {
                        const noAbsenceDiv = document.createElement('div');
                        noAbsenceDiv.className = 'no-absences-date';
                        noAbsenceDiv.textContent = '✓';
                        absencesDiv.appendChild(noAbsenceDiv);
                    } else {
                        // Count absences by type for this date
                        const counts = {};
                        dateAbsences.forEach(type => {
                            counts[type] = (counts[type] || 0) + 1;
                        });

                        // Display in order
                        const displayOrder = [
                            { keys: ['H', 'H/H'], label: 'Hol', class: 'holiday' },
                            { keys: ['Sick'], label: 'Sick', class: 'sick' },
                            { keys: ['AAUP'], label: 'AAUP', class: 'aaup' },
                            { keys: ['TOFD'], label: 'TOFD', class: 'other' },
                            { keys: ['AAP'], label: 'AAP', class: 'other' }
                        ];

                        displayOrder.forEach(item => {
                            let count = 0;
                            item.keys.forEach(key => {
                                count += counts[key] || 0;
                            });

                            if (count > 0) {
                                const countDiv = document.createElement('div');
                                countDiv.className = `absence-count ${item.class}`;
                                countDiv.textContent = `${count} × ${item.label}`;
                                absencesDiv.appendChild(countDiv);
                            }
                        });
                    }

                    columnDiv.appendChild(absencesDiv);
                    absenceByDate.appendChild(columnDiv);
                });

                absenceSummary.style.display = 'block';
            }

            // Sort by date and engineer name for detailed view
            filteredAbsences.sort((a, b) => {
                if (a.date !== b.date) return b.date.localeCompare(a.date);
                return a.engineerName.localeCompare(b.engineerName);
            });

            absenceList.innerHTML = '';
            filteredAbsences.forEach(absence => {
                const item = document.createElement('div');
                
                const statusLabels = {
                    'H': 'Holiday',
                    'H/H': 'Half Day Holiday',
                    'Sick': 'Sick',
                    'AAUP': 'Authorised Absence Unpaid',
                    'TOFD': 'Time Off For Dependants',
                    'AAP': 'Authorised Absence Paid'
                };

                const statusLabel = statusLabels[absence.attendance] || absence.attendance;

                // Determine color class based on absence type
                let colorClass = 'other';
                if (absence.attendance === 'H' || absence.attendance === 'H/H') {
                    colorClass = 'holiday';
                } else if (absence.attendance === 'Sick') {
                    colorClass = 'sick';
                } else if (absence.attendance === 'AAUP') {
                    colorClass = 'aaup';
                }

                item.className = `absence-item ${colorClass}`;

                item.innerHTML = `
                    <div class="absence-name">${absence.engineerName}</div>
                    <div class="absence-details">Team Leader: ${absence.teamLeader}</div>
                    <div class="absence-details">Date: ${absence.date}</div>
                    <span class="absence-status ${colorClass}">${statusLabel}</span>
                `;
                absenceList.appendChild(item);
            });

            absenceSection.style.display = 'block';
        }

        // Auto-load data on page load
        window.addEventListener('load', () => {
            loadData();
        });
    </script>
