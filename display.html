<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Data - OES Performance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        .back-link-top {
            position: absolute;
            left: 0;
            top: 0;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .back-link-top:hover {
            text-decoration: underline;
        }

        .logo {
            font-size: 2em;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .filter-section {
            margin-bottom: 30px;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .date-filters {
            display: flex;
            gap: 20px;
            align-items: end;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .view-tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }

        .tab-btn {
            padding: 10px 20px;
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            background: #667eea;
            color: white;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }

        .filter-group {
            flex: 1;
            min-width: 200px;
        }

        .filter-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        .filter-group input {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
        }

        .btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        .results-table thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .results-table th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            position: relative;
        }

        .results-table th:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .sort-indicator {
            margin-left: 5px;
            font-size: 0.8em;
        }

        .results-table tbody {
        }

        .results-table tbody tr {
            border-bottom: 1px solid #e0e0e0;
        }

        .results-table tbody tr:hover {
            background-color: #f8f9fa;
        }

        .results-table td {
            padding: 12px 15px;
        }

        .team-leader-cell {
            color: #666;
            font-size: 0.9em;
        }

        .number-cell {
            text-align: center;
            font-weight: 600;
        }

        .date-cell {
            color: #667eea;
            font-weight: 600;
        }

        .summary-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .summary-card .label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .summary-card .value {
            font-size: 2em;
            font-weight: bold;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 1.1em;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .chart-section {
            display: none;
            margin-bottom: 30px;
        }

        .chart-filters {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .chart-filters select {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            min-width: 200px;
        }

        #chartCanvas {
            max-height: 400px;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .filter-section {
                flex-direction: column;
            }

            .results-table {
                font-size: 0.85em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="index.html" class="back-link-top">← Back to Home</a>
            <div class="logo">OES Performance</div>
            <div class="subtitle">View Performance Data</div>
        </div>

        <div class="filter-section">
            <div class="date-filters">
                <div class="filter-group">
                    <label for="startDate">Start Date</label>
                    <input type="date" id="startDate" required>
                </div>
                <div class="filter-group">
                    <label for="endDate">End Date</label>
                    <input type="date" id="endDate" required>
                </div>
                <div>
                    <button class="btn" onclick="loadData()">Load Data</button>
                </div>
            </div>
            
            <div class="view-tabs">
                <button class="tab-btn active" onclick="switchView('table')">📊 View Table</button>
                <button class="tab-btn" onclick="switchView('jobs')">📈 View Jobs Chart</button>
                <button class="tab-btn" onclick="switchView('completed')">✅ View Completed Chart</button>
                <button class="tab-btn" onclick="switchView('aborted')">❌ View Aborted Chart</button>
                <button class="tab-btn" onclick="switchView('meters')">📏 View Meters Chart</button>
            </div>
        </div>

        <div id="summarySection" class="summary-section" style="display: none;"></div>

        <div id="chartSection" class="chart-section">
            <div class="chart-filters">
                <select id="teamLeaderFilter" onchange="updateEngineerDropdown(); updateChart();">
                    <option value="all">All Team Leaders</option>
                </select>
                <select id="chartFilter" onchange="updateChart()">
                    <option value="all">All Engineers</option>
                </select>
            </div>
            <canvas id="chartCanvas"></canvas>
        </div>

        <div id="loadingDiv" class="loading" style="display: none;">Loading data...</div>
        <div id="noDataDiv" class="no-data" style="display: none;">No data found for the selected date range.</div>

        <div id="tableContainer" style="display: none;">
            <div class="table-wrapper">
                <table class="results-table">
                    <thead>
                        <tr>
                            <th onclick="sortTable('date')">Date <span class="sort-indicator" id="sort-date"></span></th>
                            <th onclick="sortTable('engineer')">Engineer <span class="sort-indicator" id="sort-engineer"></span></th>
                            <th onclick="sortTable('teamLeader')">Team Leader <span class="sort-indicator" id="sort-teamLeader"></span></th>
                            <th onclick="sortTable('jobs')">Jobs <span class="sort-indicator" id="sort-jobs"></span></th>
                            <th onclick="sortTable('completed')">Completed <span class="sort-indicator" id="sort-completed"></span></th>
                            <th onclick="sortTable('aborted')">Aborted <span class="sort-indicator" id="sort-aborted"></span></th>
                            <th onclick="sortTable('meters')">Meters <span class="sort-indicator" id="sort-meters"></span></th>
                        </tr>
                    </thead>
                    <tbody id="resultsBody">
                    </tbody>
                </table>
            </div>
        </div>

        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { Chart, registerables } from 'https://cdn.jsdelivr.net/npm/chart.js@4.4.0/+esm';

        Chart.register(...registerables);

        const firebaseConfig = {
            apiKey: "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
            authDomain: "oesperformance-a54c0.firebaseapp.com",
            projectId: "oesperformance-a54c0",
            storageBucket: "oesperformance-a54c0.firebasestorage.app",
            messagingSenderId: "484894102454",
            appId: "1:484894102454:web:17535ee497eac2d90d6717",
            measurementId: "G-R56BGZYV8N"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allData = [];
        let currentView = 'table';
        let currentChart = null;
        let sortColumn = 'date';
        let sortDirection = 'desc';

        // Set default dates (last 7 days)
        const today = new Date();
        const lastWeek = new Date(today);
        lastWeek.setDate(lastWeek.getDate() - 7);
        
        document.getElementById('endDate').valueAsDate = today;
        document.getElementById('startDate').valueAsDate = lastWeek;

        window.loadData = async function() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;

            if (!startDate || !endDate) {
                alert('Please select both start and end dates');
                return;
            }

            if (startDate > endDate) {
                alert('Start date must be before end date');
                return;
            }

            document.getElementById('loadingDiv').style.display = 'block';
            document.getElementById('noDataDiv').style.display = 'none';
            document.getElementById('tableContainer').style.display = 'none';
            document.getElementById('summarySection').style.display = 'none';

            try {
                const q = query(
                    collection(db, "performance"),
                    where("date", ">=", startDate),
                    where("date", "<=", endDate),
                    orderBy("date", "desc"),
                    orderBy("engineerName")
                );

                const querySnapshot = await getDocs(q);
                
                allData = [];
                querySnapshot.forEach((doc) => {
                    allData.push(doc.data());
                });

                if (currentView === 'table') {
                    displayData(allData);
                } else {
                    displayChart(currentView);
                }

            } catch (error) {
                console.error("Error loading data:", error);
                
                // Check if it's an index error
                if (error.message && error.message.includes('index')) {
                    const match = error.message.match(/https:\/\/[^\s]+/);
                    if (match) {
                        const indexUrl = match[0];
                        document.getElementById('noDataDiv').innerHTML = `
                            <strong>Index Required</strong><br><br>
                            Firestore needs to create an index for this query.<br><br>
                            <a href="${indexUrl}" target="_blank" style="color: #667eea; font-weight: bold; text-decoration: underline;">
                                Click here to create the index
                            </a><br><br>
                            After creating it, wait 1-2 minutes and refresh this page.
                        `;
                        document.getElementById('noDataDiv').style.display = 'block';
                    } else {
                        alert('Index error. Check console for the link to create it.');
                    }
                } else {
                    alert('Error loading data: ' + error.message);
                }
                
                document.getElementById('loadingDiv').style.display = 'none';
            }
        }

        function displayData(data) {
            document.getElementById('loadingDiv').style.display = 'none';
            document.getElementById('chartSection').style.display = 'none';
            document.getElementById('tableContainer').style.display = 'none';

            if (data.length === 0) {
                document.getElementById('noDataDiv').style.display = 'block';
                document.getElementById('summarySection').style.display = 'none';
                return;
            }

            // Sort data
            const sortedData = [...data].sort((a, b) => {
                let aVal, bVal;
                
                switch(sortColumn) {
                    case 'date':
                        aVal = a.date;
                        bVal = b.date;
                        break;
                    case 'engineer':
                        aVal = a.engineerName.toLowerCase();
                        bVal = b.engineerName.toLowerCase();
                        break;
                    case 'teamLeader':
                        aVal = a.teamLeader.toLowerCase();
                        bVal = b.teamLeader.toLowerCase();
                        break;
                    case 'jobs':
                        aVal = a.jobs;
                        bVal = b.jobs;
                        break;
                    case 'completed':
                        aVal = a.completed;
                        bVal = b.completed;
                        break;
                    case 'aborted':
                        aVal = a.aborted;
                        bVal = b.aborted;
                        break;
                    case 'meters':
                        aVal = a.meters;
                        bVal = b.meters;
                        break;
                    default:
                        aVal = a.date;
                        bVal = b.date;
                }

                if (aVal < bVal) return sortDirection === 'asc' ? -1 : 1;
                if (aVal > bVal) return sortDirection === 'asc' ? 1 : -1;
                return 0;
            });

            // Update sort indicators
            document.querySelectorAll('.sort-indicator').forEach(el => el.textContent = '');
            const indicator = document.getElementById(`sort-${sortColumn}`);
            if (indicator) {
                indicator.textContent = sortDirection === 'asc' ? '▲' : '▼';
            }

            // Calculate summaries
            let totalJobs = 0;
            let totalCompleted = 0;
            let totalAborted = 0;
            let totalMeters = 0;

            data.forEach(record => {
                totalJobs += record.jobs || 0;
                totalCompleted += record.completed || 0;
                totalAborted += record.aborted || 0;
                totalMeters += record.meters || 0;
            });

            // Display summary
            const summarySection = document.getElementById('summarySection');
            summarySection.innerHTML = `
                <div class="summary-card">
                    <div class="label">Total Jobs</div>
                    <div class="value">${totalJobs}</div>
                </div>
                <div class="summary-card">
                    <div class="label">Total Completed</div>
                    <div class="value">${totalCompleted}</div>
                </div>
                <div class="summary-card">
                    <div class="label">Total Aborted</div>
                    <div class="value">${totalAborted}</div>
                </div>
                <div class="summary-card">
                    <div class="label">Total Meters</div>
                    <div class="value">${Math.round(totalMeters)}</div>
                </div>
            `;
            summarySection.style.display = 'grid';

            // Display table
            const tbody = document.getElementById('resultsBody');
            tbody.innerHTML = '';

            sortedData.forEach(record => {
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td class="date-cell">${record.date}</td>
                    <td>${record.engineerName}</td>
                    <td class="team-leader-cell">${record.teamLeader}</td>
                    <td class="number-cell">${record.jobs}</td>
                    <td class="number-cell">${record.completed}</td>
                    <td class="number-cell">${record.aborted}</td>
                    <td class="number-cell">${Math.round(record.meters)}</td>
                `;
            });

            document.getElementById('tableContainer').style.display = 'block';
        }

        window.sortTable = function(column) {
            if (sortColumn === column) {
                sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                sortColumn = column;
                sortDirection = 'asc';
            }
            displayData(allData);
        }

        window.switchView = function(view) {
            currentView = view;
            
            // Update active tab
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (allData.length === 0) {
                return;
            }

            if (view === 'table') {
                displayData(allData);
            } else {
                displayChart(view);
            }
        }

        function displayChart(metric) {
            document.getElementById('tableContainer').style.display = 'none';
            document.getElementById('summarySection').style.display = 'none';
            document.getElementById('chartSection').style.display = 'block';

            // Populate filter dropdowns
            const engineers = [...new Set(allData.map(d => d.engineerName))].sort();
            const teamLeaders = [...new Set(allData.map(d => d.teamLeader))].sort();

            const chartFilter = document.getElementById('chartFilter');
            const teamLeaderFilter = document.getElementById('teamLeaderFilter');

            // Keep current selections
            const currentEngineer = chartFilter.value;
            const currentTeamLeader = teamLeaderFilter.value;

            // Populate team leader dropdown
            teamLeaderFilter.innerHTML = '<option value="all">All Team Leaders</option>';
            teamLeaders.forEach(tl => {
                teamLeaderFilter.innerHTML += `<option value="${tl}">${tl}</option>`;
            });

            // Restore team leader selection if it still exists
            if (currentTeamLeader && teamLeaders.includes(currentTeamLeader)) {
                teamLeaderFilter.value = currentTeamLeader;
            }

            // Populate engineer dropdown based on team leader selection
            updateEngineerDropdown();

            updateChart();
        }

        function updateEngineerDropdown() {
            const teamLeaderFilter = document.getElementById('teamLeaderFilter');
            const chartFilter = document.getElementById('chartFilter');
            const selectedTeamLeader = teamLeaderFilter.value;

            // Filter engineers based on selected team leader
            let filteredEngineers;
            if (selectedTeamLeader === 'all') {
                filteredEngineers = [...new Set(allData.map(d => d.engineerName))].sort();
            } else {
                filteredEngineers = [...new Set(
                    allData
                        .filter(d => d.teamLeader === selectedTeamLeader)
                        .map(d => d.engineerName)
                )].sort();
            }

            const currentEngineer = chartFilter.value;

            chartFilter.innerHTML = '<option value="all">All Engineers</option>';
            filteredEngineers.forEach(eng => {
                chartFilter.innerHTML += `<option value="${eng}">${eng}</option>`;
            });

            // Restore engineer selection only if it's in the filtered list
            if (currentEngineer && currentEngineer !== 'all' && filteredEngineers.includes(currentEngineer)) {
                chartFilter.value = currentEngineer;
            }
        }

        window.updateChart = function() {
            const metric = currentView;
            const engineerFilter = document.getElementById('chartFilter').value;
            const teamLeaderFilter = document.getElementById('teamLeaderFilter').value;

            // Filter data
            let filteredData = allData;
            if (engineerFilter !== 'all') {
                filteredData = filteredData.filter(d => d.engineerName === engineerFilter);
            }
            if (teamLeaderFilter !== 'all') {
                filteredData = filteredData.filter(d => d.teamLeader === teamLeaderFilter);
            }

            // Group by date
            const dateMap = {};
            filteredData.forEach(record => {
                if (!dateMap[record.date]) {
                    dateMap[record.date] = 0;
                }
                dateMap[record.date] += record[metric] || 0;
            });

            const dates = Object.keys(dateMap).sort();
            const values = dates.map(date => dateMap[date]);

            // Destroy existing chart
            if (currentChart) {
                currentChart.destroy();
            }

            // Create new chart
            const ctx = document.getElementById('chartCanvas').getContext('2d');
            const metricLabels = {
                jobs: 'Jobs',
                completed: 'Completed',
                aborted: 'Aborted',
                meters: 'Meters'
            };

            currentChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: dates,
                    datasets: [{
                        label: metricLabels[metric],
                        data: values,
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        borderWidth: 3,
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top'
                        },
                        title: {
                            display: true,
                            text: `${metricLabels[metric]} Over Time`,
                            font: {
                                size: 18,
                                weight: 'bold'
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                precision: 0
                            }
                        }
                    }
                }
            });
        }

        // Auto-load data on page load
        window.addEventListener('load', () => {
            loadData();
        });
    </script>
</body>
</html>
