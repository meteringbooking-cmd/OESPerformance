<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OES Previous Working Day Performance</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #6366f1;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
      --border: #334155;
      --success: #10b981;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 2rem; line-height: 1.5; }
    .container { max-width: 1400px; margin: 0 auto; }
    h1 { font-size: 2.2rem; margin-bottom: 0.5rem; background: linear-gradient(90deg, var(--accent), #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; }
    .date-subtitle { text-align: center; color: var(--text-dim); font-size: 1.1rem; margin-bottom: 1rem; }
    .day-nav { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 2rem; }
    .day-pill { padding: 7px 18px; border-radius: 20px; border: 1px solid var(--border); background: var(--card); color: var(--text-dim); font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease; white-space: nowrap; }
    .day-pill:hover { border-color: var(--accent); color: var(--text); background: rgba(99,102,241,0.15); }
    .day-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 12px rgba(99,102,241,0.5); }
    .summary-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 3rem; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: all 0.3s ease; }
    .stat-card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 8px 25px rgba(99,102,241,0.3); }
    .stat-label { font-size: 0.85rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.5rem; font-weight: 600; }
    .stat-value { font-size: 2.5rem; font-weight: 700; color: var(--accent); line-height: 1; }
    .stat-value.highlight { color: var(--success); }
    .team-section { background: var(--card); border-radius: 12px; border: 1px solid var(--border); margin-bottom: 2rem; overflow: hidden; box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
    .team-header { background: rgba(99,102,241,0.25); padding: 1.2rem 1.8rem; font-size: 1.4rem; font-weight: 700; border-bottom: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: 0.98rem; }
    th, td { padding: 1rem 1.2rem; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: rgba(99,102,241,0.12); font-weight: 600; color: var(--text-dim); text-transform: uppercase; font-size: 0.88rem; letter-spacing: 0.4px; }
    tr:last-child td { border-bottom: none; }
    .engineer-row:hover { background: rgba(99,102,241,0.08); }
    .meters-col { background: rgba(251,191,36,0.1); font-weight: 600; }
    .total-row { font-weight: bold; background: rgba(16,185,129,0.12); color: var(--success); }
    .total-row td:first-child { text-align: right; padding-right: 1.5rem; }
    .loading, .error-msg { text-align: center; padding: 4rem 2rem; color: var(--text-dim); font-size: 1.3rem; }
    .error-msg { color: #f87171; font-weight: 500; }
    @media (max-width: 900px) {
      body { padding: 1.5rem; }
      table, thead, tbody, th, td, tr { display: block; }
      thead tr { position: absolute; top: -9999px; left: -9999px; }
      tr { margin-bottom: 1.5rem; border: 1px solid var(--border); border-radius: 8px; }
      td { border: none; border-bottom: 1px solid var(--border); position: relative; padding-left: 50%; }
      td:before { position: absolute; top: 1rem; left: 1.2rem; width: 45%; padding-right: 1rem; white-space: nowrap; font-weight: 600; color: var(--text-dim); }
      td:nth-of-type(1):before { content: "Engineer"; }
      td:nth-of-type(2):before { content: "Jobs"; }
      td:nth-of-type(3):before { content: "Completed"; }
      td:nth-of-type(4):before { content: "Comp%"; }
      td:nth-of-type(5):before { content: "Aborts"; }
      td:nth-of-type(6):before { content: "Abort%"; }
      td:nth-of-type(7):before { content: "Meters"; }
      td:nth-of-type(8):before { content: "Duals"; }
      td:nth-of-type(9):before { content: "Singles"; }
      td:nth-of-type(10):before { content: "Comms/Site Visits"; }
      td:nth-of-type(11):before { content: "Dual Removal"; }
      td:nth-of-type(12):before { content: "Single Removal"; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Daily Performance</h1>
    <div class="date-subtitle" id="dateDisplay">Loading...</div>
    <div class="day-nav" id="dayNav"></div>
    <div id="summaryStats"></div>
    <div id="dataContainer"><div class="loading">Loading data…</div></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
      authDomain: "oesperformance-a54c0.firebaseapp.com",
      projectId: "oesperformance-a54c0",
      storageBucket: "oesperformance-a54c0.firebasestorage.app",
      messagingSenderId: "484894102454",
      appId: "1:484894102454:web:17535ee497eac2d90d6717",
      measurementId: "G-R56BGZYV8N"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Normalise FTL 4 / FTL4 -> Tom Green
    const normTL = tl => /^ftl\s*4$/i.test((tl||'').trim()) ? 'Tom Green' : (tl || 'Unknown Team');

    function getNthPreviousWorkingDay(n) {
      let d = new Date(); let count = 0;
      while (count < n) { d.setDate(d.getDate() - 1); if (d.getDay() !== 0 && d.getDay() !== 6) count++; }
      return d;
    }
    function formatISO(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
    function formatShort(d) {
      const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      return `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]}`;
    }
    function formatLong(d) {
      const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],months=['January','February','March','April','May','June','July','August','September','October','November','December'];
      return `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
    }

    const workingDays = Array.from({ length: 5 }, (_, i) => getNthPreviousWorkingDay(i + 1));
    const urlParams = new URLSearchParams(window.location.search);
    const paramDate = urlParams.get('date');
    let activeDayIndex = 0;
    if (paramDate) { const found = workingDays.findIndex(d => formatISO(d) === paramDate); if (found !== -1) activeDayIndex = found; }

    function buildNav() {
      const nav = document.getElementById('dayNav');
      nav.innerHTML = workingDays.map((d, i) => `
        <button class="day-pill${i === activeDayIndex ? ' active' : ''}" id="pill-${i}" onclick="switchDay(${i})">
          ${i === 0 ? '⬅ ' : ''}${formatShort(d)}${i === 0 ? ' (latest)' : ''}
        </button>`).join('');
    }

    window.switchDay = function(index) {
      activeDayIndex = index;
      workingDays.forEach((_, i) => { const pill = document.getElementById(`pill-${i}`); pill.classList.toggle('active', i === index); });
      loadDayData(workingDays[index]);
    };

    async function loadDayData(targetDate) {
      const container = document.getElementById('dataContainer');
      const summaryStats = document.getElementById('summaryStats');
      const dateDisplay = document.getElementById('dateDisplay');
      container.innerHTML = '<div class="loading">Loading data…</div>';
      summaryStats.innerHTML = '';
      dateDisplay.textContent = formatLong(targetDate);
      const dateStr = formatISO(targetDate);
      try {
        const q = query(collection(db, "performance"), where("date", "==", dateStr));
        const snapshot = await getDocs(q);
        if (snapshot.empty) { container.innerHTML = `<div class="error-msg">No data found for ${formatLong(targetDate)}.</div>`; return; }
        const teamMap = {};
        snapshot.forEach(doc => {
          const d = doc.data();
          // Normalise FTL 4 -> Tom Green
          const team = normTL(d.teamLeader);
          const eng  = d.engineerName || "Unknown Engineer";
          if (!teamMap[team]) teamMap[team] = { engineers: {}, totals: { jobs:0, completed:0, aborts:0, meters:0, duals:0, singles:0, commsSiteVisits:0, dualRemoval:0, singleRemoval:0 } };
          const engData = teamMap[team].engineers[eng] || { jobs:0, completed:0, aborts:0, meters:0, duals:0, singles:0, commsSiteVisits:0, dualRemoval:0, singleRemoval:0 };
          engData.jobs            += Number(d.jobs         || 0);
          engData.completed       += Number(d.completed    || 0);
          engData.aborts          += Number(d.aborted      || 0);
          engData.meters          += Number(d.meters       || 0);
          engData.duals           += Number(d.duals        || 0);
          engData.singles         += Number(d.singles      || 0);
          engData.commsSiteVisits += Number(d.comms        || 0);
          engData.dualRemoval     += Number(d.dualRemoval  || 0);
          engData.singleRemoval   += Number(d.singleRemoval|| 0);
          teamMap[team].engineers[eng] = engData;
          const t = teamMap[team].totals;
          t.jobs+=Number(d.jobs||0);t.completed+=Number(d.completed||0);t.aborts+=Number(d.aborted||0);
          t.meters+=Number(d.meters||0);t.duals+=Number(d.duals||0);t.singles+=Number(d.singles||0);
          t.commsSiteVisits+=Number(d.comms||0);t.dualRemoval+=Number(d.dualRemoval||0);t.singleRemoval+=Number(d.singleRemoval||0);
        });
        let html = '';
        Object.keys(teamMap).sort().forEach(team => {
          const data = teamMap[team];
          html += `<div class="team-section"><div class="team-header">${team}</div><table><thead><tr>
            <th>Engineer</th><th>Jobs</th><th>Completed</th><th>Comp%</th>
            <th>Aborts</th><th>Abort%</th><th>Meters</th><th>Duals</th>
            <th>Singles</th><th>Comms/Site Visits</th><th>Dual Removal</th><th>Single Removal</th>
          </tr></thead><tbody>`;
          Object.keys(data.engineers).sort().forEach(eng => {
            const row = data.engineers[eng];
            const compPerc  = row.jobs > 0 ? ((row.completed / row.jobs) * 100).toFixed(1) : '0.0';
            const abortPerc = row.jobs > 0 ? ((row.aborts    / row.jobs) * 100).toFixed(1) : '0.0';
            html += `<tr class="engineer-row"><td>${eng}</td><td>${row.jobs}</td><td>${row.completed}</td><td>${compPerc}%</td>
              <td>${row.aborts}</td><td>${abortPerc}%</td><td class="meters-col">${row.meters}</td>
              <td>${row.duals}</td><td>${row.singles}</td><td>${row.commsSiteVisits}</td><td>${row.dualRemoval}</td><td>${row.singleRemoval}</td></tr>`;
          });
          const tt = data.totals;
          const tCompPerc  = tt.jobs > 0 ? ((tt.completed / tt.jobs) * 100).toFixed(1) : '0.0';
          const tAbortPerc = tt.jobs > 0 ? ((tt.aborts    / tt.jobs) * 100).toFixed(1) : '0.0';
          html += `<tr class="total-row"><td>Team Total</td><td>${tt.jobs}</td><td>${tt.completed}</td><td>${tCompPerc}%</td>
            <td>${tt.aborts}</td><td>${tAbortPerc}%</td><td class="meters-col">${tt.meters}</td>
            <td>${tt.duals}</td><td>${tt.singles}</td><td>${tt.commsSiteVisits}</td><td>${tt.dualRemoval}</td><td>${tt.singleRemoval}</td>
          </tr></tbody></table></div>`;
        });
        const grand = { jobs:0, completed:0, aborts:0, meters:0, duals:0, singles:0, commsSiteVisits:0, dualRemoval:0, singleRemoval:0 };
        Object.values(teamMap).forEach(t => { Object.keys(grand).forEach(k => grand[k] += t.totals[k]); });
        const grandCompPerc = grand.jobs > 0 ? ((grand.completed / grand.jobs) * 100).toFixed(1) : '0.0';
        summaryStats.innerHTML = `<div class="summary-stats">
          <div class="stat-card"><div class="stat-label">Total Meters</div><div class="stat-value highlight">${grand.meters}</div></div>
          <div class="stat-card"><div class="stat-label">Total Jobs</div><div class="stat-value">${grand.jobs}</div></div>
          <div class="stat-card"><div class="stat-label">Completed</div><div class="stat-value">${grand.completed}</div></div>
          <div class="stat-card"><div class="stat-label">Completion %</div><div class="stat-value">${grandCompPerc}%</div></div>
          <div class="stat-card"><div class="stat-label">Aborts</div><div class="stat-value">${grand.aborts}</div></div>
          <div class="stat-card"><div class="stat-label">Duals</div><div class="stat-value">${grand.duals}</div></div>
          <div class="stat-card"><div class="stat-label">Singles</div><div class="stat-value">${grand.singles}</div></div>
          <div class="stat-card"><div class="stat-label">Comms/Site Visits</div><div class="stat-value">${grand.commsSiteVisits}</div></div>
        </div>`;
        container.innerHTML = html;
      } catch (err) {
        console.error(err);
        container.innerHTML = `<div class="error-msg">Error loading data: ${err.message || 'Unknown error'}</div>`;
      }
    }

    buildNav();
    loadDayData(workingDays[activeDayIndex]);
  </script>
</body>
</html>
