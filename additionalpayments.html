
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Additional Payments - Approval Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1600px;
            margin: 0 auto;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 2em;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .filter-section {
            margin-bottom: 30px;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 1.05em;
        }

        .filter-group select,
        .filter-group input {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        .filter-group select:focus,
        .filter-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
        }

        .stat-card.pending {
            background: linear-gradient(135deg, #ffc107 0%, #ff9800 100%);
        }

        .stat-card.approved {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
        }

        .stat-card.rejected {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
        }

        .btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 1.1em;
        }

        .no-data {
            text-align: center;
            padding: 60px 40px;
            color: #666;
            font-size: 1.2em;
            background: #f8f9fa;
            border-radius: 10px;
            margin-top: 20px;
        }

        .payments-container {
            margin-top: 30px;
        }

        .payment-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border-left: 5px solid #ffc107;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .payment-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .payment-card.approved {
            border-left-color: #28a745;
        }

        .payment-card.rejected {
            border-left-color: #dc3545;
        }

        .payment-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
            flex-wrap: wrap;
            gap: 15px;
        }

        .payment-info {
            flex: 1;
            min-width: 200px;
        }

        .engineer-name {
            font-size: 1.4em;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .payment-date {
            color: #667eea;
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .payment-meta {
            color: #666;
            font-size: 0.9em;
        }

        .status-badge {
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-badge.pending {
            background: #fff3cd;
            color: #856404;
            border: 2px solid #ffc107;
        }

        .status-badge.approved {
            background: #d4edda;
            color: #155724;
            border: 2px solid #28a745;
        }

        .status-badge.rejected {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #dc3545;
        }

        .payment-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .detail-section {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
        }

        .detail-title {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 0.95em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            font-size: 0.95em;
        }

        .detail-label {
            color: #666;
        }

        .detail-value {
            color: #333;
            font-weight: 600;
        }

        .detail-value.amount {
            color: #28a745;
            font-size: 1.1em;
        }

        .jobs-list {
            margin-top: 10px;
        }

        .job-item {
            background: white;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 8px;
            border-left: 3px solid #667eea;
            font-size: 0.9em;
        }

        .job-item-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 3px;
        }

        .total-section {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.2em;
            font-weight: bold;
            margin-top: 20px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn-approve {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            flex: 1;
            min-width: 120px;
        }

        .btn-approve:hover:not(:disabled) {
            box-shadow: 0 10px 25px rgba(40, 167, 69, 0.4);
        }

        .btn-reject {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            flex: 1;
            min-width: 120px;
        }

        .btn-reject:hover:not(:disabled) {
            box-shadow: 0 10px 25px rgba(220, 53, 69, 0.4);
        }

        .btn-view {
            background: linear-gradient(135deg, #17a2b8 0%, #138496 100%);
            flex: 1;
            min-width: 120px;
        }

        .btn-view:hover:not(:disabled) {
            box-shadow: 0 10px 25px rgba(23, 162, 184, 0.4);
        }

        .team-leader-badge {
            display: inline-block;
            padding: 4px 10px;
            background: #667eea;
            color: white;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: 600;
            margin-left: 10px;
        }

        .expand-toggle {
            cursor: pointer;
            color: #667eea;
            font-weight: 600;
            margin-top: 10px;
            user-select: none;
            display: inline-block;
        }

        .expand-toggle:hover {
            text-decoration: underline;
        }

        .expanded-details {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #e0e0e0;
        }

        .expanded-details.show {
            display: block;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .filter-grid {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .payment-header {
                flex-direction: column;
            }

            .payment-details {
                grid-template-columns: 1fr;
            }

            .action-buttons {
                flex-direction: column;
            }

            .btn-approve,
            .btn-reject,
            .btn-view {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">💳 Additional Payments Management</div>
            <div class="subtitle">Review and approve payment submissions</div>
        </div>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card pending">
                <div class="stat-label">Pending Approval</div>
                <div class="stat-value" id="pendingCount">0</div>
            </div>
            <div class="stat-card approved">
                <div class="stat-label">Approved</div>
                <div class="stat-value" id="approvedCount">0</div>
            </div>
            <div class="stat-card rejected">
                <div class="stat-label">Rejected</div>
                <div class="stat-value" id="rejectedCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Amount (Pending)</div>
                <div class="stat-value" id="totalAmount">£0</div>
            </div>
        </div>

        <div class="filter-section">
            <div class="filter-grid">
                <div class="filter-group">
                    <label for="teamLeaderFilter">Filter by Team Leader:</label>
                    <select id="teamLeaderFilter" onchange="applyFilters()">
                        <option value="">All Team Leaders</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="statusFilter">Filter by Status:</label>
                    <select id="statusFilter" onchange="applyFilters()">
                        <option value="">All Statuses</option>
                        <option value="pending" selected>Pending</option>
                        <option value="approved">Approved</option>
                        <option value="rejected">Rejected</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="engineerFilter">Filter by Engineer:</label>
                    <select id="engineerFilter" onchange="applyFilters()">
                        <option value="">All Engineers</option>
                    </select>
                </div>
            </div>
            <button class="btn" onclick="loadPayments()">Refresh Data</button>
        </div>

        <div id="loadingDiv" class="loading" style="display: none;">Loading payments...</div>
        <div id="noDataDiv" class="no-data" style="display: none;">
            📭 No payment submissions found
        </div>

        <div id="paymentsContainer" class="payments-container"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, doc, updateDoc, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
            authDomain: "oesperformance-a54c0.firebaseapp.com",
            projectId: "oesperformance-a54c0",
            storageBucket: "oesperformance-a54c0.firebasestorage.app",
            messagingSenderId: "484894102454",
            appId: "1:484894102454:web:17535ee497eac2d90d6717",
            measurementId: "G-R56BGZYV8N"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allPayments = [];
        let engineerTeamLeaders = {};

        // Load engineer-team leader mappings
        async function loadTeamLeaderMappings() {
            try {
                // Try to get team leader info from performance or attendance data
                const perfSnapshot = await getDocs(collection(db, "performance"));
                const teamLeaderSet = new Set();
                
                perfSnapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.engineerName && data.teamLeader) {
                        engineerTeamLeaders[data.engineerName] = data.teamLeader;
                        teamLeaderSet.add(data.teamLeader);
                    }
                });

                // If no team leader data in performance, try attendance
                if (teamLeaderSet.size === 0) {
                    const attendSnapshot = await getDocs(collection(db, "attendance"));
                    attendSnapshot.forEach((doc) => {
                        const data = doc.data();
                        if (data.engineerName && data.teamLeader) {
                            engineerTeamLeaders[data.engineerName] = data.teamLeader;
                            teamLeaderSet.add(data.teamLeader);
                        }
                    });
                }

                // Populate team leader filter
                const teamLeaderFilter = document.getElementById('teamLeaderFilter');
                const sortedTeamLeaders = Array.from(teamLeaderSet).sort();
                
                sortedTeamLeaders.forEach(leader => {
                    const option = document.createElement('option');
                    option.value = leader;
                    option.textContent = leader;
                    teamLeaderFilter.appendChild(option);
                });

                console.log("Loaded", sortedTeamLeaders.length, "team leaders");
            } catch (error) {
                console.error("Error loading team leader mappings:", error);
            }
        }

        async function loadPayments() {
            document.getElementById('loadingDiv').style.display = 'block';
            document.getElementById('noDataDiv').style.display = 'none';
            document.getElementById('paymentsContainer').style.display = 'none';

            try {
                // Load all payments
                const paymentsSnapshot = await getDocs(collection(db, "additionalPayments"));
                allPayments = [];

                paymentsSnapshot.forEach((doc) => {
                    const data = doc.data();
                    allPayments.push({
                        id: doc.id,
                        ...data,
                        teamLeader: engineerTeamLeaders[data.engineerName] || 'Unassigned'
                    });
                });

                // Sort by date (newest first) and then by submission time
                allPayments.sort((a, b) => {
                    if (b.date !== a.date) {
                        return b.date.localeCompare(a.date);
                    }
                    if (a.submittedAt && b.submittedAt) {
                        return b.submittedAt.toMillis() - a.submittedAt.toMillis();
                    }
                    return 0;
                });

                console.log("Loaded", allPayments.length, "payments");

                // Populate engineer filter
                const engineerSet = new Set(allPayments.map(p => p.engineerName));
                const engineerFilter = document.getElementById('engineerFilter');
                engineerFilter.innerHTML = '<option value="">All Engineers</option>';
                Array.from(engineerSet).sort().forEach(engineer => {
                    const option = document.createElement('option');
                    option.value = engineer;
                    option.textContent = engineer;
                    engineerFilter.appendChild(option);
                });

                applyFilters();

            } catch (error) {
                console.error("Error loading payments:", error);
                document.getElementById('loadingDiv').style.display = 'none';
                document.getElementById('noDataDiv').innerHTML = '❌ Error loading payments: ' + error.message;
                document.getElementById('noDataDiv').style.display = 'block';
            }
        }

        window.applyFilters = function() {
            const teamLeaderFilter = document.getElementById('teamLeaderFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;
            const engineerFilter = document.getElementById('engineerFilter').value;

            let filteredPayments = allPayments.filter(payment => {
                const matchesTeamLeader = !teamLeaderFilter || payment.teamLeader === teamLeaderFilter;
                const matchesStatus = !statusFilter || payment.status === statusFilter;
                const matchesEngineer = !engineerFilter || payment.engineerName === engineerFilter;
                
                return matchesTeamLeader && matchesStatus && matchesEngineer;
            });

            displayPayments(filteredPayments);
            updateStats(filteredPayments);
        }

        function updateStats(payments) {
            const pending = payments.filter(p => p.status === 'pending').length;
            const approved = payments.filter(p => p.status === 'approved').length;
            const rejected = payments.filter(p => p.status === 'rejected').length;
            
            let totalAmount = 0;
            payments.filter(p => p.status === 'pending').forEach(payment => {
                totalAmount += calculatePaymentTotal(payment);
            });

            document.getElementById('pendingCount').textContent = pending;
            document.getElementById('approvedCount').textContent = approved;
            document.getElementById('rejectedCount').textContent = rejected;
            document.getElementById('totalAmount').textContent = '£' + totalAmount.toFixed(2);
        }

        function displayPayments(payments) {
            const container = document.getElementById('paymentsContainer');
            container.innerHTML = '';

            document.getElementById('loadingDiv').style.display = 'none';

            if (payments.length === 0) {
                document.getElementById('noDataDiv').style.display = 'block';
                return;
            }

            document.getElementById('noDataDiv').style.display = 'none';
            container.style.display = 'block';

            payments.forEach(payment => {
                const card = createPaymentCard(payment);
                container.appendChild(card);
            });
        }

        function createPaymentCard(payment) {
            const card = document.createElement('div');
            card.className = `payment-card ${payment.status || 'pending'}`;
            card.id = `payment-${payment.id}`;

            const dateObj = new Date(payment.date + 'T00:00:00');
            const displayDate = dateObj.toLocaleDateString('en-GB', { 
                day: '2-digit', 
                month: 'long',
                year: 'numeric',
                weekday: 'long'
            });

            const submittedDate = payment.submittedAt ? 
                new Date(payment.submittedAt.toMillis()).toLocaleString('en-GB') : 
                'Unknown';

            const totalAmount = calculatePaymentTotal(payment);
            const breakdown = calculatePaymentBreakdown(payment, dateObj);

            let detailsHTML = '';

            // Standby
            if (payment.standby === 'yes') {
                detailsHTML += `
                    <div class="detail-section">
                        <div class="detail-title">💼 Standby Payment</div>
                        <div class="detail-item">
                            <span class="detail-label">${breakdown.standby.label}</span>
                            <span class="detail-value amount">£${breakdown.standby.amount}</span>
                        </div>
                    </div>
                `;
            }

            // Working Away
            if (payment.workingAway === 'yes') {
                detailsHTML += `
                    <div class="detail-section">
                        <div class="detail-title">🏨 Working Away Allowance</div>
                        <div class="detail-item">
                            <span class="detail-label">Allowance</span>
                            <span class="detail-value amount">£${breakdown.workingAway.amount}</span>
                        </div>
                    </div>
                `;
            }

            // Overtime
            if (payment.overtime === 'yes' && payment.overtimeHours > 0) {
                detailsHTML += `
                    <div class="detail-section">
                        <div class="detail-title">⏰ Overtime</div>
                        <div class="detail-item">
                            <span class="detail-label">Hours</span>
                            <span class="detail-value">${payment.overtimeHours.toFixed(2)} hrs</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Rate</span>
                            <span class="detail-value">£${breakdown.overtime.rate}/hr (${breakdown.overtime.rateLabel})</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Reason</span>
                            <span class="detail-value">${payment.overtimeReason}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Total</span>
                            <span class="detail-value amount">£${breakdown.overtime.amount}</span>
                        </div>
                    </div>
                `;
            }

            // Jobs
            if (payment.hasJobs && payment.jobs && payment.jobs.length > 0) {
                const claimedJobs = payment.jobs.filter(j => j.claimPricePerJob === 'yes');
                if (claimedJobs.length > 0) {
                    let jobsListHTML = '';
                    claimedJobs.forEach(job => {
                        let jobAmount = 0;
                        if (job.jobType === 'Dual') jobAmount = 80;
                        else if (job.jobType === 'Single') jobAmount = 50;
                        else if (job.jobType === 'Comms') jobAmount = 25;

                        jobsListHTML += `
                            <div class="job-item">
                                <div class="job-item-row">
                                    <strong>Job #${job.jobNumber}</strong>
                                    <span style="color: #28a745; font-weight: 600;">£${jobAmount}</span>
                                </div>
                                <div class="job-item-row">
                                    <span>${job.postcode}</span>
                                    <span>${job.jobType}</span>
                                </div>
                            </div>
                        `;
                    });

                    detailsHTML += `
                        <div class="detail-section">
                            <div class="detail-title">📋 Price Per Job Claims</div>
                            <div class="jobs-list">
                                ${jobsListHTML}
                            </div>
                            <div class="detail-item" style="margin-top: 10px; padding-top: 10px; border-top: 2px solid #e0e0e0;">
                                <span class="detail-label">Total (${claimedJobs.length} jobs)</span>
                                <span class="detail-value amount">£${breakdown.jobs.amount}</span>
                            </div>
                        </div>
                    `;
                }
            }

            // Action buttons for pending payments
            let actionButtonsHTML = '';
            if (payment.status === 'pending') {
                actionButtonsHTML = `
                    <div class="action-buttons">
                        <button class="btn btn-approve" onclick="updatePaymentStatus('${payment.id}', 'approved')">
                            ✅ Approve
                        </button>
                        <button class="btn btn-reject" onclick="updatePaymentStatus('${payment.id}', 'rejected')">
                            ❌ Reject
                        </button>
                    </div>
                `;
            }

            card.innerHTML = `
                <div class="payment-header">
                    <div class="payment-info">
                        <div class="engineer-name">
                            ${payment.engineerName}
                            <span class="team-leader-badge">${payment.teamLeader}</span>
                        </div>
                        <div class="payment-date">📅 ${displayDate}</div>
                        <div class="payment-meta">Submitted: ${submittedDate}</div>
                    </div>
                    <div>
                        <span class="status-badge ${payment.status || 'pending'}">
                            ${(payment.status || 'pending').toUpperCase()}
                        </span>
                    </div>
                </div>

                <div class="payment-details">
                    ${detailsHTML}
                </div>

                <div class="total-section">
                    <span>Total Claimed Amount</span>
                    <span>£${totalAmount.toFixed(2)}</span>
                </div>

                ${actionButtonsHTML}
            `;

            return card;
        }

        function calculatePaymentTotal(payment) {
            const dateObj = new Date(payment.date + 'T00:00:00');
            const breakdown = calculatePaymentBreakdown(payment, dateObj);
            
            let total = 0;
            if (payment.standby === 'yes') total += breakdown.standby.amount;
            if (payment.workingAway === 'yes') total += breakdown.workingAway.amount;
            if (payment.overtime === 'yes') total += breakdown.overtime.amount;
            if (payment.hasJobs) total += breakdown.jobs.amount;
            
            return total;
        }

        function calculatePaymentBreakdown(payment, dateObj) {
            const dayOfWeek = dateObj.getDay();
            const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
            const isSaturday = dayOfWeek === 6;
            const isSunday = dayOfWeek === 0;

            const month = dateObj.getMonth() + 1;
            const day = dateObj.getDate();
            const isChristmas = month === 12 && day === 25;
            const isBoxingDay = month === 12 && day === 26;
            const isNewYear = month === 1 && day === 1;
            const isSpecialHoliday = isChristmas || isBoxingDay || isNewYear;

            let breakdown = {
                standby: { amount: 0, label: '' },
                workingAway: { amount: 50 },
                overtime: { amount: 0, rate: 0, rateLabel: '' },
                jobs: { amount: 0 }
            };

            // Standby
            if (payment.standby === 'yes') {
                if (isSpecialHoliday) {
                    breakdown.standby.amount = 100;
                    breakdown.standby.label = 'Special Holiday';
                } else if (isWeekend) {
                    breakdown.standby.amount = 50;
                    breakdown.standby.label = isSaturday ? 'Saturday' : 'Sunday';
                } else {
                    breakdown.standby.amount = 20;
                    breakdown.standby.label = 'Weekday';
                }
            }

            // Overtime
            if (payment.overtime === 'yes' && payment.overtimeHours > 0) {
                if (isSunday || payment.isBankHoliday) {
                    breakdown.overtime.rate = 37.50;
                    breakdown.overtime.rateLabel = isSunday ? 'Sunday' : 'Bank Holiday';
                } else if (isSaturday) {
                    breakdown.overtime.rate = 28.13;
                    breakdown.overtime.rateLabel = 'Saturday';
                } else {
                    breakdown.overtime.rate = 24.94;
                    breakdown.overtime.rateLabel = 'Weekday';
                }
                breakdown.overtime.amount = payment.overtimeHours * breakdown.overtime.rate;
            }

            // Jobs
            if (payment.hasJobs && payment.jobs) {
                payment.jobs.forEach(job => {
                    if (job.claimPricePerJob === 'yes') {
                        if (job.jobType === 'Dual') breakdown.jobs.amount += 80;
                        else if (job.jobType === 'Single') breakdown.jobs.amount += 50;
                        else if (job.jobType === 'Comms') breakdown.jobs.amount += 25;
                    }
                });
            }

            return breakdown;
        }

        window.updatePaymentStatus = async function(paymentId, newStatus) {
            const confirmMessage = newStatus === 'approved' 
                ? 'Are you sure you want to APPROVE this payment?' 
                : 'Are you sure you want to REJECT this payment?';

            if (!confirm(confirmMessage)) {
                return;
            }

            try {
                const paymentRef = doc(db, "additionalPayments", paymentId);
                await updateDoc(paymentRef, {
                    status: newStatus,
                    reviewedAt: new Date()
                });

                // Update local data
                const payment = allPayments.find(p => p.id === paymentId);
                if (payment) {
                    payment.status = newStatus;
                }

                alert(`Payment ${newStatus === 'approved' ? 'approved' : 'rejected'} successfully!`);
                
                // Reload to refresh display
                await loadPayments();

            } catch (error) {
                console.error("Error updating payment status:", error);
                alert('Error updating payment status: ' + error.message);
            }
        }

        // Initialize
        window.addEventListener('load', async () => {
            await loadTeamLeaderMappings();
            await loadPayments();
        });

        // Make loadPayments available globally
        window.loadPayments = loadPayments;
    </script>
</body>
</html>
