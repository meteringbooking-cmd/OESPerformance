<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineer Compliance Comparison</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 { border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        textarea {
            width: 100%;
            height: 200px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: monospace;
            resize: vertical;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        button:hover { background-color: #0056b3; }
        #results {
            margin-top: 30px;
            padding: 20px;
            border-radius: 4px;
        }
        .match-card {
            background: #fff3cd;
            border-left: 5px solid #ffc107;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 2px;
        }
        .no-matches { color: #28a745; font-weight: bold; }
        .instructions { font-size: 0.9em; color: #666; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Engineer Date Comparison Tool</h2>
    <p class="instructions">
        Paste data in the format: <b>Name Date</b> (e.g., John Doe 15/04/2026). <br>
        This will flag entries in Box 2 that share a name with Box 1 and are within 3 days of each other.
    </p>

    <div class="grid">
        <div>
            <label for="box1">Reference List (Box 1)</label>
            <textarea id="box1" placeholder="Engineer Name 01/01/2026&#10;Jane Smith 05/01/2026"></textarea>
        </div>
        <div>
            <label for="box2">Comparison List (Box 2)</label>
            <textarea id="box2" placeholder="Engineer Name 02/01/2026&#10;Bob Jones 10/01/2026"></textarea>
        </div>
    </div>

    <button onclick="compareLogs()">Compare Entries</button>

    <div id="results"></div>
</div>

<script>
    function parseInput(text) {
        const lines = text.split('\n');
        const data = [];
        
        lines.forEach(line => {
            if (!line.trim()) return;
            
            // Regex to find a date-like pattern at the end of the string
            const dateMatch = line.match(/(\d{1,2}[/-]\d{1,2}[/-]\d{2,4})/);
            if (dateMatch) {
                const name = line.replace(dateMatch[0], '').trim().toLowerCase();
                const dateParts = dateMatch[0].split(/[/-]/);
                
                // Normalizing to JS Date (assumes DD/MM/YYYY)
                let day, month, year;
                if (dateParts[2].length === 2) {
                    year = parseInt("20" + dateParts[2]);
                } else {
                    year = parseInt(dateParts[2]);
                }
                month = parseInt(dateParts[1]) - 1;
                day = parseInt(dateParts[0]);
                
                const dateObj = new Date(year, month, day);
                if (!isNaN(dateObj)) {
                    data.push({ name, date: dateObj, originalDateStr: dateMatch[0], originalLine: line });
                }
            }
        });
        return data;
    }

    function compareLogs() {
        const box1Data = parseInput(document.getElementById('box1').value);
        const box2Data = parseInput(document.getElementById('box2').value);
        const resultsDiv = document.getElementById('results');
        resultsDiv.innerHTML = '';

        let matches = [];

        box2Data.forEach(entry2 => {
            box1Data.forEach(entry1 => {
                if (entry1.name === entry2.name) {
                    const diffTime = Math.abs(entry2.date - entry1.date);
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                    if (diffDays <= 3) {
                        matches.push({
                            name: entry1.name.toUpperCase(),
                            date1: entry1.originalDateStr,
                            date2: entry2.originalDateStr,
                            diff: diffDays
                        });
                    }
                }
            });
        });

        if (matches.length > 0) {
            resultsDiv.innerHTML = '<h3>⚠️ Potential Compliance Conflicts Found:</h3>';
            matches.forEach(m => {
                resultsDiv.innerHTML += `
                    <div class="match-card">
                        <strong>${m.name}</strong><br>
                        Box 1: ${m.date1} vs Box 2: ${m.date2}<br>
                        <em>Difference: ${m.diff} day(s)</em>
                    </div>
                `;
            });
        } else {
            resultsDiv.innerHTML = '<p class="no-matches">✅ No conflicting entries found within a 3-day window.</p>';
        }
    }
</script>

</body>
</html>
