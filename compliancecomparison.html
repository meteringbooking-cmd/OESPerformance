<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compliance Audit Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #059669;
            --warning: #d97706;
            --danger: #dc2626;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .header p {
            color: var(--text-muted);
        }

        .input-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 30px;
        }

        .input-group {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .input-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 12px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.025em;
            color: var(--text-muted);
        }

        textarea {
            width: 100%;
            height: 280px;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
            resize: none;
            box-sizing: border-box;
            background-color: #fafafa;
        }

        textarea:focus {
            outline: 2px solid var(--primary);
            border-color: transparent;
        }

        .action-bar {
            display: flex;
            gap: 16px;
            margin-bottom: 40px;
        }

        button {
            cursor: pointer;
            font-weight: 600;
            padding: 14px 28px;
            border-radius: 8px;
            border: none;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .btn-compare {
            background-color: var(--primary);
            color: white;
            flex: 2;
        }

        .btn-compare:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-export {
            background-color: var(--success);
            color: white;
            flex: 1;
            display: none;
        }

        .btn-export:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* Results Styling */
        .match-card {
            background: var(--card-bg);
            border-radius: 12px;
            margin-bottom: 24px;
            border-left: 6px solid var(--warning);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .match-card-header {
            background: #fffbeb;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #fef3c7;
        }

        .engineer-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #92400e;
        }

        .diff-badge {
            background: #fef3c7;
            color: #92400e;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
            border: 1px solid #fde68a;
        }

        .result-table {
            width: 100%;
            border-collapse: collapse;
        }

        .result-table th {
            text-align: left;
            padding: 12px 20px;
            background: #f8fafc;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            border-bottom: 1px solid #e2e8f0;
        }

        .result-table td {
            padding: 14px 20px;
            font-size: 0.9rem;
            border-bottom: 1px solid #f1f5f9;
        }

        .box-label {
            font-weight: 600;
            color: var(--primary);
        }

        .no-matches {
            text-align: center;
            padding: 60px;
            background: #ecfdf5;
            border: 2px dashed #10b981;
            border-radius: 12px;
            color: #065f46;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Compliance Audit Pro</h1>
        <p>Cross-reference engineer activity and job records within a 3-day window.</p>
    </div>

    <div class="input-section">
        <div class="input-group">
            <label>Box 1: Primary Data</label>
            <textarea id="box1" placeholder="Example:&#10;John Doe 10/05/2026 Pass JOB123"></textarea>
        </div>
        <div class="input-group">
            <label>Box 2: Comparison Data</label>
            <textarea id="box2" placeholder="Example:&#10;John Doe 12/05/2026 Fail JOB999"></textarea>
        </div>
    </div>

    <div class="action-bar">
        <button class="btn-compare" onclick="compareData()">Compare Records</button>
        <button id="exportBtn" class="btn-export" onclick="exportToExcel()">Export to Excel (.xlsx)</button>
    </div>

    <div id="results"></div>
</div>

<script>
    let globalMatches = [];

    function parseData(text) {
        const lines = text.split('\n');
        const results = [];
        const dateRegex = /(\d{1,2}[/-]\d{1,2}[/-]\d{2,4})/;

        lines.forEach(line => {
            const trimmed = line.trim();
            if (!trimmed) return;

            const dateMatch = trimmed.match(dateRegex);
            if (dateMatch) {
                const dateStr = dateMatch[0];
                const dateIndex = trimmed.indexOf(dateStr);
                const name = trimmed.substring(0, dateIndex).trim();
                const rest = trimmed.substring(dateIndex + dateStr.length).trim();
                
                // Split Outcome and Job by spaces/tabs
                const partsAfterDate = rest.split(/\s+/).filter(p => p.trim() !== "");
                const outcome = partsAfterDate[0] || "N/A";
                const jobNo = partsAfterDate[1] || "N/A";

                const d = dateStr.split(/[/-]/);
                const dateObj = new Date(
                    d[2].length === 2 ? "20"+d[2] : d[2], 
                    d[1]-1, 
                    d[0]
                );

                if (!isNaN(dateObj)) {
                    results.push({ name, date: dateObj, dateStr, outcome, jobNo });
                }
            }
        });
        return results;
    }

    function compareData() {
        const box1 = parseData(document.getElementById('box1').value);
        const box2 = parseData(document.getElementById('box2').value);
        const container = document.getElementById('results');
        const exportBtn = document.getElementById('exportBtn');
        
        container.innerHTML = '';
        globalMatches = [];

        box2.forEach(b2 => {
            box1.forEach(b1 => {
                if (b1.name.toLowerCase() === b2.name.toLowerCase()) {
                    const diffTime = Math.abs(b2.date - b1.date);
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                    if (diffDays <= 3) {
                        const matchObj = {
                            "Engineer": b1.name,
                            "Day_Overlap": diffDays,
                            "Box1_Date": b1.dateStr,
                            "Box1_Outcome": b1.outcome,
                            "Box1_Job": b1.jobNo,
                            "Box2_Date": b2.dateStr,
                            "Box2_Outcome": b2.outcome,
                            "Box2_Job": b2.jobNo
                        };
                        globalMatches.push(matchObj);
                        renderMatchCard(matchObj, container);
                    }
                }
            });
        });

        if (globalMatches.length > 0) {
            exportBtn.style.display = 'flex';
        } else {
            exportBtn.style.display = 'none';
            container.innerHTML = '<div class="no-matches"><h3>✅ No Compliance Risks Found</h3><p>All engineer visits are sufficiently spaced out.</p></div>';
        }
    }

    function renderMatchCard(m, container) {
        const div = document.createElement('div');
        div.className = 'match-card';
        div.innerHTML = `
            <div class="match-card-header">
                <span class="engineer-name">${m.Engineer}</span>
                <span class="diff-badge">${m.Day_Overlap} Day Window</span>
            </div>
            <table class="result-table">
                <thead>
                    <tr>
                        <th>Source</th><th>Date</th><th>Outcome</th><th>Job Reference</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="box-label">Box 1</td><td>${m.Box1_Date}</td><td>${m.Box1_Outcome}</td><td>${m.Box1_Job}</td>
                    </tr>
                    <tr>
                        <td class="box-label">Box 2</td><td>${m.Box2_Date}</td><td>${m.Box2_Outcome}</td><td>${m.Box2_Job}</td>
                    </tr>
                </tbody>
            </table>
        `;
        container.appendChild(div);
    }

    function exportToExcel() {
        if (globalMatches.length === 0) return;

        // Create a new worksheet from our data
        const worksheet = XLSX.utils.json_to_sheet(globalMatches);
        
        // Create a new workbook
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Audit Matches");

        // Format column widths for Excel
        const wscols = [
            {wch: 25}, {wch: 15}, {wch: 15}, {wch: 20}, {wch: 15}, {wch: 15}, {wch: 20}, {wch: 15}
        ];
        worksheet['!cols'] = wscols;

        // Export the file
        XLSX.writeFile(workbook, "Compliance_Report.xlsx");
    }
</script>

</body>
</html>
