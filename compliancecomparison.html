<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compliance Audit Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --success: #059669;
            --warning: #d97706;
            --danger: #dc2626;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
        }

        .container { max-width: 1100px; margin: 0 auto; }
        
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-size: 2rem; margin-bottom: 10px; color: var(--text-main); }

        .input-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 30px;
        }

        .input-group {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        textarea {
            width: 100%;
            height: 280px;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-family: monospace;
            font-size: 13px;
            box-sizing: border-box;
            background-color: #fafafa;
        }

        .action-bar { display: flex; gap: 16px; margin-bottom: 40px; }

        button {
            cursor: pointer;
            font-weight: 600;
            padding: 14px 28px;
            border-radius: 8px;
            border: none;
            transition: all 0.2s;
            font-size: 1rem;
        }

        .btn-compare { background-color: var(--primary); color: white; flex: 2; }
        .btn-export { background-color: var(--success); color: white; flex: 1; display: none; }

        .match-card {
            background: var(--card-bg);
            border-radius: 12px;
            margin-bottom: 24px;
            border-left: 6px solid var(--warning);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .match-card-header {
            background: #fffbeb;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
        }

        .result-table { width: 100%; border-collapse: collapse; }
        .result-table th { text-align: left; padding: 12px 20px; background: #f8fafc; font-size: 0.75rem; border-bottom: 1px solid #e2e8f0; }
        .result-table td { padding: 14px 20px; font-size: 0.9rem; border-bottom: 1px solid #f1f5f9; }

        .status-pass { color: var(--success); font-weight: bold; }
        .status-fail { color: var(--danger); font-weight: bold; }

        .no-matches { text-align: center; padding: 60px; background: #ecfdf5; border: 2px dashed #10b981; border-radius: 12px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Compliance Audit Pro</h1>
        <p>Format: Name | Date | Outcome (Pass/Fail) | Job Number</p>
    </div>

    <div class="input-section">
        <div class="input-group">
            <label style="font-weight:bold; display:block; margin-bottom:10px;">Box 1: Primary Data</label>
            <textarea id="box1" placeholder="John Doe 14/04/2026 Category 1 fail JOB123"></textarea>
        </div>
        <div class="input-group">
            <label style="font-weight:bold; display:block; margin-bottom:10px;">Box 2: Comparison Data</label>
            <textarea id="box2" placeholder="John Doe 16/04/2026 Pass JOB456"></textarea>
        </div>
    </div>

    <div class="action-bar">
        <button class="btn-compare" onclick="compareData()">Compare Records</button>
        <button id="exportBtn" class="btn-export" onclick="exportToExcel()">Export to Excel (.xlsx)</button>
    </div>

    <div id="results"></div>
</div>

<script>
    let globalMatches = [];

    function parseData(text) {
        const lines = text.split('\n');
        const results = [];
        const dateRegex = /(\d{1,2}[/-]\d{1,2}[/-]\d{2,4})/;
        // Pattern to catch the specific categories or Pass
        const outcomeRegex = /(Pass|Category 1 fail|Category 2 fail|Category 3 fail)/i;

        lines.forEach(line => {
            const trimmed = line.trim();
            if (!trimmed) return;

            const dateMatch = trimmed.match(dateRegex);
            if (dateMatch) {
                const dateStr = dateMatch[0];
                const dateIndex = trimmed.indexOf(dateStr);
                const name = trimmed.substring(0, dateIndex).trim();
                const afterDate = trimmed.substring(dateIndex + dateStr.length).trim();
                
                // Identify the outcome
                const outcomeMatch = afterDate.match(outcomeRegex);
                const outcome = outcomeMatch ? outcomeMatch[0] : "Unknown";
                
                // Job Number is usually what remains after removing the outcome
                const jobNo = afterDate.replace(outcome, "").trim() || "N/A";

                const d = dateStr.split(/[/-]/);
                const dateObj = new Date(d[2].length === 2 ? "20"+d[2] : d[2], d[1]-1, d[0]);

                if (!isNaN(dateObj)) {
                    results.push({ name, date: dateObj, dateStr, outcome, jobNo });
                }
            }
        });
        return results;
    }

    function compareData() {
        const box1 = parseData(document.getElementById('box1').value);
        const box2 = parseData(document.getElementById('box2').value);
        const container = document.getElementById('results');
        const exportBtn = document.getElementById('exportBtn');
        
        container.innerHTML = '';
        globalMatches = [];

        box2.forEach(b2 => {
            box1.forEach(b1 => {
                if (b1.name.toLowerCase() === b2.name.toLowerCase()) {
                    const diffDays = Math.ceil(Math.abs(b2.date - b1.date) / (1000 * 60 * 60 * 24));

                    if (diffDays <= 3) {
                        const match = {
                            "Engineer": b1.name,
                            "Window": diffDays + " Days",
                            "Box1_Date": b1.dateStr,
                            "Box1_Outcome": b1.outcome,
                            "Box1_Job": b1.jobNo,
                            "Box2_Date": b2.dateStr,
                            "Box2_Outcome": b2.outcome,
                            "Box2_Job": b2.jobNo
                        };
                        globalMatches.push(match);
                        renderCard(match, container);
                    }
                }
            });
        });

        exportBtn.style.display = globalMatches.length > 0 ? 'block' : 'none';
        if (globalMatches.length === 0) {
            container.innerHTML = '<div class="no-matches"><h3>✅ No Overlaps Detected</h3></div>';
        }
    }

    function renderCard(m, container) {
        const getStyle = (s) => s.toLowerCase().includes('fail') ? 'status-fail' : 'status-pass';
        const div = document.createElement('div');
        div.className = 'match-card';
        div.innerHTML = `
            <div class="match-card-header">
                <strong style="color:#92400e">${m.Engineer}</strong>
                <span style="font-size:0.8rem; background:#fef3c7; padding:2px 8px; border-radius:10px;">${m.Window}</span>
            </div>
            <table class="result-table">
                <tr><th>Source</th><th>Date</th><th>Outcome</th><th>Job #</th></tr>
                <tr><td>Box 1</td><td>${m.Box1_Date}</td><td class="${getStyle(m.Box1_Outcome)}">${m.Box1_Outcome}</td><td>${m.Box1_Job}</td></tr>
                <tr><td>Box 2</td><td>${m.Box2_Date}</td><td class="${getStyle(m.Box2_Outcome)}">${m.Box2_Outcome}</td><td>${m.Box2_Job}</td></tr>
            </table>
        `;
        container.appendChild(div);
    }

    function exportToExcel() {
        const ws = XLSX.utils.json_to_sheet(globalMatches);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Compliance");
        ws['!cols'] = [{wch:20}, {wch:10}, {wch:12}, {wch:15}, {wch:12}, {wch:12}, {wch:15}, {wch:12}];
        XLSX.writeFile(wb, "Audit_Comparison_Report.xlsx");
    }
</script>

</body>
</html>
