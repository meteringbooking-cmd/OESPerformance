<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contract Finances Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .date-selector {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .date-selector label {
            font-weight: 600;
            color: #333;
        }

        .date-selector input {
            padding: 10px 15px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        .date-selector input:focus {
            border-color: #764ba2;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card h3 {
            color: #667eea;
            font-size: 1.1em;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #333;
            margin: 10px 0;
        }

        .stat-subtitle {
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .forecast {
            color: #28a745;
            font-size: 0.9em;
            margin-top: 10px;
            font-weight: 600;
        }

        .upload-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .upload-section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .upload-area {
            display: grid;
            gap: 20px;
            margin-bottom: 20px;
        }

        .upload-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .upload-group label {
            font-weight: 600;
            color: #333;
        }

        input[type="file"] {
            padding: 10px;
            border: 2px dashed #667eea;
            border-radius: 8px;
            cursor: pointer;
            background: #f8f9ff;
            transition: all 0.3s;
        }

        input[type="file"]:hover {
            background: #eef0ff;
            border-color: #764ba2;
        }

        input[type="date"], input[type="number"], select {
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        input[type="date"]:focus, input[type="number"]:focus, select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .btn:active {
            transform: translateY(0);
        }

        .manual-entry-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .status-message {
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }

        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Contract Finances Dashboard</h1>

        <!-- Date Range Selector -->
        <div class="date-selector">
            <label for="startDate">Start Date:</label>
            <input type="date" id="startDate">
            <label for="endDate">End Date:</label>
            <input type="date" id="endDate">
            <button class="btn" onclick="updateDashboard()">Update</button>
        </div>

        <!-- Stats Cards -->
        <div class="stats-container">
            <div class="stat-card">
                <h3>OES Contract</h3>
                <div class="stat-value">£<span id="oesTotal">0.00</span></div>
                <div class="stat-subtitle">Current Period</div>
                <div class="forecast">Forecast: £<span id="oesForecast">0.00</span></div>
            </div>
            <div class="stat-card">
                <h3>SP Contract</h3>
                <div class="stat-value">£<span id="spTotal">0.00</span></div>
                <div class="stat-subtitle">Current Period</div>
                <div class="forecast">Forecast: £<span id="spForecast">0.00</span></div>
            </div>
            <div class="stat-card">
                <h3>EDF Contract</h3>
                <div class="stat-value">£<span id="edfTotal">0.00</span></div>
                <div class="stat-subtitle">Current Period</div>
                <div class="forecast">Forecast: £<span id="edfForecast">0.00</span></div>
            </div>
        </div>

        <!-- Upload SP Data -->
        <div class="upload-section">
            <h2>Upload SP Data</h2>
            <div class="upload-area">
                <div class="upload-group">
                    <label>Excel/CSV File (Columns: Date | Job Type | Outcome Resource | Job Status | Value)</label>
                    <input type="file" id="spFile" accept=".xlsx,.xls,.csv">
                    <button class="btn" onclick="uploadSPData()">Upload SP Data</button>
                </div>
                <div id="spStatus" class="status-message"></div>
            </div>
        </div>

        <!-- Upload OES Data -->
        <div class="upload-section">
            <h2>Upload OES Data</h2>
            <div class="upload-area">
                <div class="upload-group">
                    <label>Select Date:</label>
                    <input type="date" id="oesDate">
                </div>
                <div class="upload-group">
                    <label>Excel/CSV File (Columns: Team Leader | Engineer | Value)</label>
                    <input type="file" id="oesFile" accept=".xlsx,.xls,.csv">
                    <button class="btn" onclick="uploadOESData()">Upload OES Data</button>
                </div>
                <div id="oesStatus" class="status-message"></div>
            </div>
        </div>

        <!-- Manual Entry -->
        <div class="upload-section">
            <h2>Manual Entry</h2>
            <div class="manual-entry-grid">
                <div class="upload-group">
                    <label>Date:</label>
                    <input type="date" id="manualDate">
                </div>
                <div class="upload-group">
                    <label>Contract:</label>
                    <select id="manualContract">
                        <option value="SP">SP (£405/day)</option>
                        <option value="EDF">EDF (£396/day)</option>
                    </select>
                </div>
                <div class="upload-group">
                    <label>Days:</label>
                    <input type="number" id="manualDays" min="0" step="0.5" placeholder="0">
                </div>
            </div>
            <button class="btn" onclick="addManualEntry()">Add Manual Entry</button>
            <div id="manualStatus" class="status-message"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
            authDomain: "oesperformance-a54c0.firebaseapp.com",
            projectId: "oesperformance-a54c0",
            storageBucket: "oesperformance-a54c0.firebasestorage.app",
            messagingSenderId: "484894102454",
            appId: "1:484894102454:web:17535ee497eac2d90d6717",
            measurementId: "G-R56BGZYV8N"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Make db available globally
        window.db = db;
        window.addDoc = addDoc;
        window.collection = collection;
        window.serverTimestamp = serverTimestamp;
        window.query = query;
        window.where = where;
        window.getDocs = getDocs;

        // Initialize dashboard
        initializeDashboard();
    </script>

    <script>
        function initializeDashboard() {
            const today = new Date();
            const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
            const lastDay = new Date(today.getFullYear(), today.getMonth() + 1, 0);

            document.getElementById('startDate').valueAsDate = firstDay;
            document.getElementById('endDate').valueAsDate = lastDay;
            document.getElementById('manualDate').valueAsDate = today;
            document.getElementById('oesDate').valueAsDate = today;

            updateDashboard();
        }

        async function updateDashboard() {
            const startDate = new Date(document.getElementById('startDate').value);
            const endDate = new Date(document.getElementById('endDate').value);

            try {
                const q = query(
                    collection(window.db, "all contract financial"),
                    where("date", ">=", startDate),
                    where("date", "<=", endDate)
                );

                const querySnapshot = await getDocs(q);
                
                let oesTotal = 0;
                let spTotal = 0;
                let edfTotal = 0;

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const value = parseFloat(data.value) || 0;
                    
                    if (data.contract === 'OES') {
                        oesTotal += value;
                    } else if (data.contract === 'SP') {
                        spTotal += value;
                    } else if (data.contract === 'EDF') {
                        edfTotal += value;
                    }
                });

                // Calculate forecasts
                const today = new Date();
                const daysInPeriod = getWeekdaysInRange(startDate, endDate);
                const daysElapsed = getWeekdaysInRange(startDate, today < endDate ? today : endDate);
                
                const oesForecast = daysElapsed > 0 ? (oesTotal / daysElapsed) * daysInPeriod : 0;
                const spForecast = daysElapsed > 0 ? (spTotal / daysElapsed) * daysInPeriod : 0;
                const edfForecast = daysElapsed > 0 ? (edfTotal / daysElapsed) * daysInPeriod : 0;

                // Update UI
                document.getElementById('oesTotal').textContent = oesTotal.toFixed(2);
                document.getElementById('spTotal').textContent = spTotal.toFixed(2);
                document.getElementById('edfTotal').textContent = edfTotal.toFixed(2);
                
                document.getElementById('oesForecast').textContent = oesForecast.toFixed(2);
                document.getElementById('spForecast').textContent = spForecast.toFixed(2);
                document.getElementById('edfForecast').textContent = edfForecast.toFixed(2);

            } catch (error) {
                console.error("Error updating dashboard:", error);
                showStatus('Error loading data', 'error', 'spStatus');
            }
        }

        function getWeekdaysInRange(startDate, endDate) {
            let count = 0;
            let current = new Date(startDate);
            
            while (current <= endDate) {
                const day = current.getDay();
                if (day !== 0 && day !== 6) { // Not Sunday (0) or Saturday (6)
                    count++;
                }
                current.setDate(current.getDate() + 1);
            }
            
            return count;
        }

        async function uploadSPData() {
            const fileInput = document.getElementById('spFile');
            if (!fileInput.files.length) {
                showStatus('Please select a file', 'error', 'spStatus');
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });

                    let savedCount = 0;

                    for (let i = 1; i < rows.length; i++) {
                        const row = rows[i];
                        if (row.length < 5) continue;

                        const date = parseExcelDate(row[0]);
                        const jobType = row[1];
                        const outcomeResource = row[2];
                        const jobStatus = row[3];
                        const value = parseFloat(row[4]) || 0;

                        if (jobStatus && jobStatus.toString().toLowerCase() === 'completed') {
                            await addDoc(collection(window.db, "all contract financial"), {
                                contract: 'SP',
                                date: date,
                                jobType: jobType,
                                outcomeResource: outcomeResource,
                                jobStatus: jobStatus,
                                value: value,
                                timestamp: serverTimestamp()
                            });
                            savedCount++;
                        }
                    }

                    showStatus(`Successfully uploaded ${savedCount} SP records`, 'success', 'spStatus');
                    updateDashboard();
                    fileInput.value = '';

                } catch (error) {
                    console.error('Error processing SP file:', error);
                    showStatus('Error processing file: ' + error.message, 'error', 'spStatus');
                }
            };

            reader.readAsArrayBuffer(file);
        }

        async function uploadOESData() {
            const dateInput = document.getElementById('oesDate').value;
            const fileInput = document.getElementById('oesFile');
            
            if (!dateInput) {
                showStatus('Please select a date', 'error', 'oesStatus');
                return;
            }
            
            if (!fileInput.files.length) {
                showStatus('Please select a file', 'error', 'oesStatus');
                return;
            }

            const selectedDate = new Date(dateInput);
            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });

                    let savedCount = 0;

                    for (let i = 1; i < rows.length; i++) {
                        const row = rows[i];
                        if (row.length < 3) continue;

                        const teamLeader = row[0];
                        const engineer = row[1];
                        const value = parseFloat(row[2]) || 0;

                        await addDoc(collection(window.db, "all contract financial"), {
                            contract: 'OES',
                            date: selectedDate,
                            teamLeader: teamLeader,
                            engineer: engineer,
                            value: value,
                            timestamp: serverTimestamp()
                        });
                        savedCount++;
                    }

                    showStatus(`Successfully uploaded ${savedCount} OES records`, 'success', 'oesStatus');
                    updateDashboard();
                    fileInput.value = '';

                } catch (error) {
                    console.error('Error processing OES file:', error);
                    showStatus('Error processing file: ' + error.message, 'error', 'oesStatus');
                }
            };

            reader.readAsArrayBuffer(file);
        }

        async function addManualEntry() {
            const dateInput = document.getElementById('manualDate').value;
            const contract = document.getElementById('manualContract').value;
            const days = parseFloat(document.getElementById('manualDays').value);

            if (!dateInput || !days || days <= 0) {
                showStatus('Please fill in all fields', 'error', 'manualStatus');
                return;
            }

            const rate = contract === 'SP' ? 405 : 396;
            const value = days * rate;
            const selectedDate = new Date(dateInput);

            try {
                await addDoc(collection(window.db, "all contract financial"), {
                    contract: contract,
                    date: selectedDate,
                    days: days,
                    rate: rate,
                    value: value,
                    manualEntry: true,
                    timestamp: serverTimestamp()
                });

                showStatus(`Successfully added ${contract} entry: ${days} days × £${rate} = £${value.toFixed(2)}`, 'success', 'manualStatus');
                updateDashboard();
                document.getElementById('manualDays').value = '';

            } catch (error) {
                console.error('Error adding manual entry:', error);
                showStatus('Error adding entry: ' + error.message, 'error', 'manualStatus');
            }
        }

        function parseExcelDate(excelDate) {
            if (excelDate instanceof Date) {
                return excelDate;
            }
            
            if (typeof excelDate === 'string') {
                return new Date(excelDate);
            }
            
            // Excel dates are stored as numbers (days since 1900-01-01)
            if (typeof excelDate === 'number') {
                const date = new Date((excelDate - 25569) * 86400 * 1000);
                return date;
            }
            
            return new Date();
        }

        function showStatus(message, type, elementId) {
            const statusEl = document.getElementById(elementId);
            statusEl.textContent = message;
            statusEl.className = `status-message ${type}`;
            statusEl.style.display = 'block';
            
            setTimeout(() => {
                statusEl.style.display = 'none';
            }, 5000);
        }

        // Make functions globally available
        window.uploadSPData = uploadSPData;
        window.uploadOESData = uploadOESData;
        window.addManualEntry = addManualEntry;
        window.updateDashboard = updateDashboard;
    </script>
</body>
</html>
