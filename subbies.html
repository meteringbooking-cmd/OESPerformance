<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subcontractor Income Calculator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh; padding: 20px; position: relative;
            color: white;
        }
        body::before {
            content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.03) 2px, rgba(255,255,255,0.03) 4px),
                repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(255,255,255,0.03) 2px, rgba(255,255,255,0.03) 4px);
            pointer-events: none; z-index: 0;
        }
        .container { max-width: 1000px; margin: 0 auto; position: relative; z-index: 1; }
        .header { text-align: center; color: white; margin-bottom: 40px; animation: fadeInDown 0.8s ease; position: relative; }
        
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        
        .logo {
            font-size: 2.5em; font-weight: 900; margin-bottom: 15px;
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 50%, #00d2ff 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            text-transform: uppercase; letter-spacing: 4px;
        }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; margin-bottom: 30px; }
        
        .card {
            background: linear-gradient(135deg, rgba(26,32,44,0.9), rgba(45,55,72,0.9));
            border-radius: 16px; padding: 28px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
            position: relative; overflow: hidden; border: 1px solid rgba(0,210,255,0.2);
            animation: slideUp 0.8s ease;
        }
        .card:hover {
            border-color: rgba(0,210,255,0.4);
            box-shadow: 0 12px 40px rgba(0,210,255,0.2), inset 0 1px 0 rgba(255,255,255,0.15);
        }
        
        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        
        .card-title {
            font-size: 0.9em; color: #00d2ff; text-transform: uppercase; letter-spacing: 2px; font-weight: 800;
            margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px solid rgba(0,210,255,0.2);
            display: flex; justify-content: space-between; align-items: center;
        }

        .input-group { margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .input-group label { font-size: 0.9em; color: #a8dadc; font-weight: 600; }
        .input-group input {
            background: rgba(0,0,0,0.4); border: 1px solid rgba(0,210,255,0.3);
            border-radius: 8px; padding: 10px; color: #ffffff; font-size: 1.1em;
            font-weight: 700; width: 100px; text-align: right; font-family: inherit;
            transition: all 0.3s ease; outline: none;
        }
        .input-group input:focus {
            border-color: #00d2ff; box-shadow: 0 0 10px rgba(0,210,255,0.3);
        }

        .rate-hint { font-size: 0.75em; color: #6b7280; margin-left: 8px; font-weight: normal; }

        .value-display {
            font-size: 3em; font-weight: 900; margin-bottom: 12px; letter-spacing: -1px; line-height: 1;
            background: linear-gradient(135deg, #ffffff 0%, #00d2ff 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .value-display.final {
            background: linear-gradient(135deg, #10b981 0%, #34d399 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .value-display.deduction {
            background: linear-gradient(135deg, #ef4444 0%, #fca5a5 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        
        .sub-stat { font-size: 0.85em; color: #a8dadc; font-weight: 500; margin-bottom: 10px; }
        
        .final-card {
            background: linear-gradient(135deg, rgba(26,32,44,0.95), rgba(16,185,129,0.1));
            border: 2px solid rgba(16,185,129,0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">Subcontractor Income</div>
            <div style="color: #a8dadc; font-size: 0.9em;">Enter job quantities below to calculate remaining income</div>
        </div>

        <div class="grid">
            <!-- Job Inputs -->
            <div class="card">
                <div class="card-title">Completed Jobs <span>🪛</span></div>
                
                <div class="input-group">
                    <label>Dual <span class="rate-hint">(£139.05)</span></label>
                    <input type="number" id="qtyDual" class="job-input" min="0" value="0">
                </div>
                <div class="input-group">
                    <label>Single <span class="rate-hint">(£113.30)</span></label>
                    <input type="number" id="qtySingle" class="job-input" min="0" value="0">
                </div>
                <div class="input-group">
                    <label>Comms <span class="rate-hint">(£72.10)</span></label>
                    <input type="number" id="qtyComms" class="job-input" min="0" value="0">
                </div>
                <div class="input-group">
                    <label>Dual Removal <span class="rate-hint">(£133.90)</span></label>
                    <input type="number" id="qtyDualRem" class="job-input" min="0" value="0">
                </div>
                <div class="input-group">
                    <label>Single Removal <span class="rate-hint">(£92.70)</span></label>
                    <input type="number" id="qtySingleRem" class="job-input" min="0" value="0">
                </div>
                
                <div style="margin-top: 20px; padding-top: 15px; border-top: 1px solid rgba(0,210,255,0.2);">
                    <div class="sub-stat">Total Jobs Entered: <strong id="totalJobsCount" style="color: #00d2ff; font-size: 1.2em;">0</strong></div>
                </div>
            </div>

            <!-- Income & Deductions -->
            <div style="display: flex; flex-direction: column; gap: 24px;">
                
                <!-- Generated Income -->
                <div class="card">
                    <div class="card-title">Gross Generated Income <span>💷</span></div>
                    <div class="value-display" id="grossIncome">£0.00</div>
                    <div class="sub-stat">Total before deductions</div>
                </div>

                <!-- Deductions -->
                <div class="card">
                    <div class="card-title">Deductions <span>🔻</span></div>
                    
                    <div class="input-group">
                        <label>Van Cost</label>
                        <input type="number" id="costVan" min="0" step="0.01" value="49.00">
                    </div>
                    
                    <div class="input-group" style="margin-top: 15px;">
                        <label>Rubix Cost <span class="rate-hint">(Auto-calculated)</span></label>
                        <div id="costRubixDisplay" style="font-size: 1.2em; font-weight: 700; color: #ef4444;">£0.00</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Final Remaining Income -->
        <div class="card final-card">
            <div class="card-title" style="color: #34d399; border-color: rgba(16,185,129,0.3);">Remaining Income <span>✅</span></div>
            <div class="value-display final" id="netIncome">£0.00</div>
            <div class="sub-stat">Gross Income - Van Cost - Rubix Cost</div>
        </div>
    </div>

    <script>
        // Pricing structure
        const rates = {
            dual: 139.05,
            single: 113.30,
            comms: 72.10,
            dualRem: 133.90,
            singleRem: 92.70
        };

        // Rubix cost structure based on total jobs
        const rubixCosts = {
            1: 130.00,
            2: 160.00,
            3: 207.50,
            4: 270.00,
            5: 332.50,
            6: 400.00,
            7: 467.50,
            8: 545.00,
            9: 622.50,
            10: 700.00,
            11: 777.50
        };

        // Format number as GBP currency
        const formatCurrency = (amount) => {
            return '£' + amount.toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        };

        function calculate() {
            // 1. Get quantities
            const qDual = parseInt(document.getElementById('qtyDual').value) || 0;
            const qSingle = parseInt(document.getElementById('qtySingle').value) || 0;
            const qComms = parseInt(document.getElementById('qtyComms').value) || 0;
            const qDualRem = parseInt(document.getElementById('qtyDualRem').value) || 0;
            const qSingleRem = parseInt(document.getElementById('qtySingleRem').value) || 0;

            // 2. Calculate Total Jobs
            const totalJobs = qDual + qSingle + qComms + qDualRem + qSingleRem;
            document.getElementById('totalJobsCount').innerText = totalJobs;

            // 3. Calculate Gross Income
            const grossIncome = (qDual * rates.dual) + 
                                (qSingle * rates.single) + 
                                (qComms * rates.comms) + 
                                (qDualRem * rates.dualRem) + 
                                (qSingleRem * rates.singleRem);
            document.getElementById('grossIncome').innerText = formatCurrency(grossIncome);

            // 4. Calculate Rubix Cost
            let rubixCost = 0;
            if (totalJobs > 0) {
                // If 11 or more jobs, cap the lookup at 11
                const lookupTier = totalJobs > 11 ? 11 : totalJobs;
                rubixCost = rubixCosts[lookupTier];
            }
            document.getElementById('costRubixDisplay').innerText = formatCurrency(rubixCost);

            // 5. Get Van Cost
            const vanCost = parseFloat(document.getElementById('costVan').value) || 0;

            // 6. Calculate Net (Remaining) Income
            const netIncome = grossIncome - vanCost - rubixCost;
            document.getElementById('netIncome').innerText = formatCurrency(netIncome);
        }

        // Attach event listeners to all inputs to trigger recalculation immediately
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', calculate);
            
            // Clear '0' on focus for easier typing
            input.addEventListener('focus', function() {
                if(this.value === '0') this.value = '';
            });
            // Re-add '0' on blur if empty
            input.addEventListener('blur', function() {
                if(this.value === '') this.value = '0';
                calculate();
            });
        });

        // Run calculation on initial load
        calculate();
    </script>
</body>
</html>
