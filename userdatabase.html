<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Database — OES Performance</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Karla:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00D2FF;
            --secondary: #3a7bd5;
            --dark: #0f1a2e;
            --darker: #0a1020;
            --card: rgba(26,32,44,0.95);
            --text: #e1e8ed;
            --muted: #a8dadc;
            --error: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --border: rgba(0,210,255,0.15);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Karla', sans-serif;
            background: linear-gradient(135deg, #0a1020 0%, #0f1a2e 100%);
            min-height: 100vh;
            color: var(--text);
            padding: 30px 20px;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(0,210,255,0.02) 40px, rgba(0,210,255,0.02) 41px),
                repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(0,210,255,0.02) 40px, rgba(0,210,255,0.02) 41px);
            pointer-events: none;
        }

        .container { max-width: 1000px; margin: 0 auto; position: relative; }

        /* Header */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-left { display: flex; align-items: center; gap: 16px; }

        .header-logo {
            height: 42px;
            filter: drop-shadow(0 0 12px rgba(0,210,255,0.4));
        }

        .page-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3em;
            font-weight: 900;
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .page-subtitle { color: var(--muted); font-size: 0.82em; font-weight: 300; margin-top: 3px; }

        .back-btn {
            padding: 10px 20px;
            background: rgba(0,210,255,0.08);
            border: 1px solid rgba(0,210,255,0.25);
            border-radius: 8px;
            color: var(--primary);
            text-decoration: none;
            font-size: 0.85em;
            font-weight: 600;
            transition: all 0.3s;
            letter-spacing: 0.5px;
        }

        .back-btn:hover {
            background: rgba(0,210,255,0.15);
            transform: translateX(-3px);
        }

        /* Admin check gate */
        #authGate {
            text-align: center;
            padding: 80px 20px;
            color: var(--muted);
        }

        /* Stat strip */
        .stats-strip {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }

        .stat-pill {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }

        .stat-pill-val {
            font-size: 2em;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 5px;
        }

        .stat-pill-label {
            font-size: 0.72em;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* Card */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
        }

        .card-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8em;
            color: var(--primary);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 22px;
        }

        /* Form grid */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        @media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } }

        .form-group label {
            display: block;
            color: var(--muted);
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 14px;
            background: rgba(0,0,0,0.3);
            border: 1.5px solid rgba(0,210,255,0.18);
            border-radius: 9px;
            color: var(--text);
            font-family: 'Karla', sans-serif;
            font-size: 0.95em;
            transition: all 0.3s;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--primary);
            background: rgba(0,210,255,0.05);
            box-shadow: 0 0 0 3px rgba(0,210,255,0.08);
        }

        .form-group input::placeholder { color: rgba(255,255,255,0.2); }

        .form-group select option { background: #0f1a2e; }

        .form-hint {
            font-size: 0.78em;
            color: rgba(168,218,220,0.5);
            margin-top: 5px;
        }

        /* Buttons */
        .btn {
            padding: 11px 24px;
            border: none;
            border-radius: 9px;
            font-family: 'Karla', sans-serif;
            font-size: 0.9em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #0a1020;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,210,255,0.35);
        }

        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .btn-danger {
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.35);
            color: #f87171;
        }

        .btn-danger:hover {
            background: rgba(239,68,68,0.25);
            transform: translateY(-1px);
        }

        .btn-warning {
            background: rgba(245,158,11,0.12);
            border: 1px solid rgba(245,158,11,0.35);
            color: #fbbf24;
            padding: 7px 14px;
            font-size: 0.82em;
        }

        .btn-warning:hover { background: rgba(245,158,11,0.22); }

        /* Alert */
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.88em;
            font-weight: 600;
            margin-bottom: 16px;
            display: none;
        }

        .alert-success { background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.4); color: #34d399; }
        .alert-error   { background: rgba(239,68,68,0.12);  border: 1px solid rgba(239,68,68,0.4);  color: #f87171; }

        /* Users table */
        .table-wrap { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
        }

        thead th {
            text-align: left;
            padding: 11px 14px;
            background: rgba(0,210,255,0.08);
            color: var(--primary);
            font-size: 0.72em;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            border-bottom: 1px solid rgba(0,210,255,0.2);
        }

        tbody td {
            padding: 13px 14px;
            border-bottom: 1px solid rgba(0,210,255,0.07);
            color: var(--text);
            vertical-align: middle;
        }

        tbody tr:hover { background: rgba(0,210,255,0.04); }
        tbody tr:last-child td { border-bottom: none; }

        .role-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .role-admin   { background: rgba(0,210,255,0.15); color: var(--primary); border: 1px solid rgba(0,210,255,0.3); }
        .role-viewer  { background: rgba(168,218,220,0.1); color: var(--muted); border: 1px solid rgba(168,218,220,0.2); }
        .role-manager { background: rgba(245,158,11,0.12); color: #fbbf24; border: 1px solid rgba(245,158,11,0.3); }

        .status-active   { color: var(--success); font-weight: 700; font-size: 0.85em; }
        .status-inactive { color: var(--muted);   font-weight: 600; font-size: 0.85em; opacity: 0.6; }

        .action-btns { display: flex; gap: 8px; flex-wrap: wrap; }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--muted);
            opacity: 0.6;
        }

        .loading-row td { text-align: center; padding: 40px; color: var(--muted); }

        /* Password reset modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(6px);
            z-index: 999;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.show { display: flex; }

        .modal-box {
            background: #131f2e;
            border: 1px solid rgba(0,210,255,0.3);
            border-radius: 16px;
            padding: 30px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            animation: fadeUp 0.3s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9em;
            color: var(--primary);
            letter-spacing: 1.5px;
            margin-bottom: 20px;
        }

        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .modal-actions .btn { flex: 1; }

        /* Spinner */
        .spinner {
            display: inline-block;
            width: 14px; height: 14px;
            border: 2px solid rgba(10,16,32,0.3);
            border-top-color: #0a1020;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="container">

    <div class="page-header">
        <div class="header-left">
            <img src="https://www.dropbox.com/scl/fi/kkujm1u6y7vvnp7luq8d7/ngu-main-white.png?rlkey=kgq2uh48qh4xssh4vlbz868lr&st=481r4vh1&raw=1" alt="NGU" class="header-logo">
            <div>
                <div class="page-title">User Database</div>
                <div class="page-subtitle">Manage access to OES Performance</div>
            </div>
        </div>
        <a href="index.html" class="back-btn">← Back to Home</a>
    </div>

    <div id="authGate">
        <div style="font-size:2em;margin-bottom:12px;">🔒</div>
        <div style="font-size:1.1em;font-weight:600;">Checking access...</div>
    </div>

    <div id="mainContent" style="display:none;">

        <!-- Stats -->
        <div class="stats-strip">
            <div class="stat-pill">
                <div class="stat-pill-val" id="statTotal">—</div>
                <div class="stat-pill-label">Total Users</div>
            </div>
            <div class="stat-pill">
                <div class="stat-pill-val" id="statAdmins">—</div>
                <div class="stat-pill-label">Admins</div>
            </div>
            <div class="stat-pill">
                <div class="stat-pill-val" id="statViewers">—</div>
                <div class="stat-pill-label">Viewers</div>
            </div>
        </div>

        <!-- Add user -->
        <div class="card">
            <div class="card-title">➕ Create New User</div>
            <div class="alert alert-success" id="addSuccess"></div>
            <div class="alert alert-error"   id="addError"></div>

            <div class="form-grid">
                <div class="form-group">
                    <label>Display Name</label>
                    <input type="text" id="newName" placeholder="e.g. Barry Dixon">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="newEmail" placeholder="barry@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="newPassword" placeholder="Min. 6 characters">
                    <div class="form-hint">User can change this after logging in.</div>
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <select id="newRole">
                        <option value="viewer">Viewer — Read only</option>
                        <option value="manager">Manager — Approve payments etc.</option>
                        <option value="admin">Admin — Full access</option>
                    </select>
                </div>
            </div>

            <button class="btn btn-primary" id="addUserBtn" onclick="createUser()">Create User</button>
        </div>

        <!-- Users list -->
        <div class="card">
            <div class="card-title" style="display:flex;justify-content:space-between;align-items:center;">
                <span>👥 All Users</span>
                <button class="btn btn-warning" onclick="loadUsers()" style="font-family:'Karla',sans-serif;">↻ Refresh</button>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>UID</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <tr class="loading-row"><td colspan="5">Loading users...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div><!-- end mainContent -->

    <!-- Password Reset Modal -->
    <div class="modal-overlay" id="resetModal">
        <div class="modal-box">
            <div class="modal-title">🔑 Reset Password</div>
            <p style="color:var(--muted);font-size:0.9em;margin-bottom:16px;">
                Set a new password for: <strong id="resetUserEmail" style="color:var(--text)"></strong>
            </p>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="resetPasswordInput" placeholder="Min. 6 characters">
            </div>
            <div class="alert alert-success" id="resetSuccess"></div>
            <div class="alert alert-error"   id="resetError"></div>
            <div class="modal-actions">
                <button class="btn btn-warning" onclick="closeResetModal()">Cancel</button>
                <button class="btn btn-primary" onclick="submitPasswordReset()">Set Password</button>
            </div>
        </div>
    </div>

</div><!-- end container -->

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import {
        getAuth, onAuthStateChanged, createUserWithEmailAndPassword,
        updatePassword, sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import {
        getFirestore, collection, doc, setDoc, getDocs, deleteDoc, updateDoc, getDoc
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
        authDomain: "oesperformance-a54c0.firebaseapp.com",
        projectId: "oesperformance-a54c0",
        storageBucket: "oesperformance-a54c0.firebasestorage.app",
        messagingSenderId: "484894102454",
        appId: "1:484894102454:web:17535ee497eac2d90d6717"
    };

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    let currentUser = null;
    let currentUserRole = null;
    let resetTargetUID = null;
    let resetTargetEmail = null;
    let allUsersCache = [];

    // ── Auth gate ──────────────────────────────────────────────────
    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            window.location.href = 'login.html?redirect=userdatabase.html';
            return;
        }
        currentUser = user;

        // Check role in Firestore
        const roleDoc = await getDoc(doc(db, 'users', user.uid));
        if (!roleDoc.exists() || roleDoc.data().role !== 'admin') {
            document.getElementById('authGate').innerHTML = `
                <div style="font-size:2em;margin-bottom:12px;">⛔</div>
                <div style="font-size:1.1em;font-weight:600;color:#f87171;">Admin access required.</div>
                <div style="margin-top:10px;color:var(--muted);font-size:0.9em;">This page is restricted to admin users only.</div>
                <a href="index.html" style="display:inline-block;margin-top:20px;color:var(--primary);text-decoration:none;">← Back to Home</a>
            `;
            return;
        }

        currentUserRole = 'admin';
        document.getElementById('authGate').style.display   = 'none';
        document.getElementById('mainContent').style.display = 'block';
        await loadUsers();
    });

    // ── Load users ─────────────────────────────────────────────────
    window.loadUsers = async function() {
        const tbody = document.getElementById('usersTableBody');
        tbody.innerHTML = '<tr class="loading-row"><td colspan="5">Loading users...</td></tr>';

        try {
            const snap = await getDocs(collection(db, 'users'));
            allUsersCache = [];
            snap.forEach(d => allUsersCache.push({ uid: d.id, ...d.data() }));
            allUsersCache.sort((a, b) => (a.name || '').localeCompare(b.name || ''));

            const admins  = allUsersCache.filter(u => u.role === 'admin').length;
            const viewers = allUsersCache.filter(u => u.role === 'viewer').length;
            document.getElementById('statTotal').textContent   = allUsersCache.length;
            document.getElementById('statAdmins').textContent  = admins;
            document.getElementById('statViewers').textContent = viewers;

            if (allUsersCache.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5"><div class="empty-state">No users found. Create the first one above.</div></td></tr>`;
                return;
            }

            tbody.innerHTML = allUsersCache.map(u => {
                const roleClass = u.role === 'admin' ? 'role-admin' : u.role === 'manager' ? 'role-manager' : 'role-viewer';
                const roleLabel = u.role || 'viewer';
                const isSelf    = u.uid === currentUser.uid;
                const uidShort  = u.uid ? u.uid.substring(0, 10) + '…' : '—';

                return `
                <tr>
                    <td><strong>${u.name || '—'}</strong>${isSelf ? ' <span style="color:var(--primary);font-size:0.75em;">(you)</span>' : ''}</td>
                    <td style="color:var(--muted);font-size:0.88em;">${u.email || '—'}</td>
                    <td><span class="role-badge ${roleClass}">${roleLabel}</span></td>
                    <td style="font-size:0.78em;color:rgba(168,218,220,0.5);font-family:monospace;" title="${u.uid}">${uidShort}</td>
                    <td>
                        <div class="action-btns">
                            <button class="btn btn-warning" onclick="openResetModal('${u.uid}', '${(u.email || '').replace(/'/g,"\\'")}')">🔑 Password</button>
                            ${!isSelf ? `<button class="btn btn-danger" onclick="deleteUser('${u.uid}', '${(u.name || u.email || '').replace(/'/g,"\\'")}')">🗑 Delete</button>` : ''}
                        </div>
                    </td>
                </tr>`;
            }).join('');

        } catch (err) {
            console.error(err);
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;color:#f87171;padding:30px;">Error loading users: ${err.message}</td></tr>`;
        }
    };

    // ── Create user ─────────────────────────────────────────────────
    window.createUser = async function() {
        const name     = document.getElementById('newName').value.trim();
        const email    = document.getElementById('newEmail').value.trim();
        const password = document.getElementById('newPassword').value;
        const role     = document.getElementById('newRole').value;
        const btn      = document.getElementById('addUserBtn');
        const successEl = document.getElementById('addSuccess');
        const errorEl   = document.getElementById('addError');

        successEl.style.display = 'none';
        errorEl.style.display   = 'none';

        if (!name || !email || !password) {
            errorEl.textContent  = 'Please fill in all fields.';
            errorEl.style.display = 'block';
            return;
        }

        if (password.length < 6) {
            errorEl.textContent  = 'Password must be at least 6 characters.';
            errorEl.style.display = 'block';
            return;
        }

        btn.disabled  = true;
        btn.innerHTML = '<span class="spinner"></span>Creating user...';

        try {
            // Create auth account
            const userCred = await createUserWithEmailAndPassword(auth, email, password);
            const newUID   = userCred.user.uid;

            // Save profile to Firestore
            await setDoc(doc(db, 'users', newUID), {
                name,
                email,
                role,
                createdAt: new Date().toISOString(),
                createdBy: currentUser.uid
            });

            // Re-sign in as admin (creating a user signs you in as them momentarily)
            // The onAuthStateChanged will fire again — we just need to reload users
            successEl.textContent  = `✓ User "${name}" created successfully with role: ${role}`;
            successEl.style.display = 'block';

            document.getElementById('newName').value     = '';
            document.getElementById('newEmail').value    = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('newRole').value     = 'viewer';

            await loadUsers();

        } catch (err) {
            console.error(err);
            let msg = err.message;
            if (err.code === 'auth/email-already-in-use') msg = 'That email is already registered.';
            if (err.code === 'auth/invalid-email')        msg = 'Please enter a valid email address.';
            errorEl.textContent  = msg;
            errorEl.style.display = 'block';
        }

        btn.disabled  = false;
        btn.innerHTML = 'Create User';
    };

    // ── Delete user ─────────────────────────────────────────────────
    window.deleteUser = async function(uid, nameLabel) {
        if (!confirm(`Delete user "${nameLabel}"?\n\nThis will remove their access immediately. This cannot be undone.`)) return;
        try {
            await deleteDoc(doc(db, 'users', uid));
            // Note: deleting from Firebase Auth requires Admin SDK (server-side).
            // Removing from Firestore is enough to block access via the auth guard.
            alert(`✓ "${nameLabel}" has been removed. They will be blocked on their next page load.`);
            await loadUsers();
        } catch (err) {
            console.error(err);
            alert('Error removing user: ' + err.message);
        }
    };

    // ── Password reset ─────────────────────────────────────────────
    window.openResetModal = function(uid, email) {
        resetTargetUID   = uid;
        resetTargetEmail = email;
        document.getElementById('resetUserEmail').textContent  = email;
        document.getElementById('resetPasswordInput').value    = '';
        document.getElementById('resetSuccess').style.display  = 'none';
        document.getElementById('resetError').style.display    = 'none';
        document.getElementById('resetModal').classList.add('show');
    };

    window.closeResetModal = function() {
        document.getElementById('resetModal').classList.remove('show');
        resetTargetUID   = null;
        resetTargetEmail = null;
    };

    window.submitPasswordReset = async function() {
        const newPw = document.getElementById('resetPasswordInput').value;
        if (newPw.length < 6) {
            document.getElementById('resetError').textContent  = 'Password must be at least 6 characters.';
            document.getElementById('resetError').style.display = 'block';
            return;
        }

        // Send password reset email (works without Admin SDK)
        try {
            await sendPasswordResetEmail(auth, resetTargetEmail);
            document.getElementById('resetSuccess').textContent  = `✓ Password reset email sent to ${resetTargetEmail}`;
            document.getElementById('resetSuccess').style.display = 'block';
            document.getElementById('resetError').style.display   = 'none';
            setTimeout(closeResetModal, 2500);
        } catch (err) {
            console.error(err);
            document.getElementById('resetError').textContent  = 'Error: ' + err.message;
            document.getElementById('resetError').style.display = 'block';
        }
    };

    // Close modal on backdrop click
    document.getElementById('resetModal').addEventListener('click', (e) => {
        if (e.target.id === 'resetModal') closeResetModal();
    });
</script>
</body>
</html>
