<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GSOS Submission</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap');

    :root {
      --bg:        #0f1624;
      --bg2:       #161f30;
      --card:      #1a2740;
      --border:    rgba(0,210,255,0.18);
      --accent:    #00d2ff;
      --accent2:   #3a7bd5;
      --text:      #e1e8ed;
      --text-dim:  #6b8097;
      --success:   #10b981;
      --danger:    #ef4444;
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }

    /* Grid background */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(0,210,255,0.03) 40px, rgba(0,210,255,0.03) 41px),
        repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(0,210,255,0.03) 40px, rgba(0,210,255,0.03) 41px);
      pointer-events: none;
      z-index: 0;
    }

    /* Glow orb */
    body::after {
      content: '';
      position: fixed;
      top: -200px; left: 50%;
      transform: translateX(-50%);
      width: 700px; height: 400px;
      background: radial-gradient(ellipse, rgba(0,210,255,0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 540px;
    }

    /* Header */
    .page-header {
      text-align: center;
      margin-bottom: 32px;
      animation: fadeDown 0.6s ease both;
    }

    .page-header .brand {
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
      display: block;
    }

    .page-header h1 {
      font-family: 'Rajdhani', sans-serif;
      font-size: 2.6rem;
      font-weight: 700;
      line-height: 1;
      background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 1px;
    }

    .page-header p {
      color: var(--text-dim);
      font-size: 0.88rem;
      margin-top: 8px;
      font-weight: 400;
    }

    /* Card */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
      animation: fadeUp 0.6s ease 0.1s both;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent);
    }

    /* Form groups */
    .form-group {
      margin-bottom: 24px;
    }

    .form-group:last-of-type {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
    }

    /* Inputs & selects */
    input[type="date"],
    select {
      width: 100%;
      padding: 14px 16px;
      background: rgba(0,0,0,0.35);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      transition: border-color 0.2s, box-shadow 0.2s;
      appearance: none;
      -webkit-appearance: none;
    }

    input[type="date"]:focus,
    select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,210,255,0.12);
    }

    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(0.7) sepia(1) saturate(3) hue-rotate(165deg);
      cursor: pointer;
    }

    /* Custom select arrow */
    .select-wrap {
      position: relative;
    }

    .select-wrap::after {
      content: '▾';
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--accent);
      pointer-events: none;
      font-size: 1rem;
    }

    select option {
      background: #1a2740;
      color: var(--text);
    }

    select option:disabled {
      color: var(--text-dim);
    }

    /* Job type cards */
    .job-options {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .job-option {
      position: relative;
    }

    .job-option input[type="radio"] {
      position: absolute;
      opacity: 0;
      width: 0; height: 0;
    }

    .job-option label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: none;
      letter-spacing: 0;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text);
    }

    .job-option label:hover {
      border-color: rgba(0,210,255,0.4);
      background: rgba(0,210,255,0.05);
    }

    .job-option input[type="radio"]:checked + label {
      border-color: var(--accent);
      background: rgba(0,210,255,0.12);
      box-shadow: 0 0 0 1px var(--accent), inset 0 0 20px rgba(0,210,255,0.05);
    }

    .job-name {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .job-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      border: 2px solid var(--text-dim);
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .job-option input[type="radio"]:checked + label .job-dot {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 8px rgba(0,210,255,0.7);
    }

    .job-price {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    /* Divider */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 28px 0;
    }

    /* Summary box */
    .summary {
      background: rgba(0,210,255,0.06);
      border: 1px solid rgba(0,210,255,0.2);
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 24px;
      display: none;
    }

    .summary.visible { display: block; }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    .summary-row:last-child { margin-bottom: 0; }

    .summary-row span:last-child {
      color: var(--text);
      font-weight: 600;
    }

    .summary-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      margin-top: 12px;
      border-top: 1px solid var(--border);
    }

    .summary-total .label {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--accent);
    }

    .summary-total .amount {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
      line-height: 1;
    }

    /* Submit button */
    .btn-submit {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(0,210,255,0.25);
      position: relative;
      overflow: hidden;
    }

    .btn-submit::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 100%);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .btn-submit:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0,210,255,0.4);
    }

    .btn-submit:hover:not(:disabled)::before { opacity: 1; }

    .btn-submit:active:not(:disabled) { transform: translateY(0); }

    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      z-index: 1000;
      transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
      white-space: nowrap;
    }

    .toast.show { transform: translateX(-50%) translateY(0); }

    .toast.success { border-color: rgba(16,185,129,0.4); }
    .toast.error   { border-color: rgba(239,68,68,0.4); }

    .toast-icon {
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    /* Loading spinner on button */
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    /* Animations */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Loading state */
    .loading-engineers {
      text-align: center;
      padding: 14px;
      color: var(--text-dim);
      font-size: 0.85rem;
      font-style: italic;
    }

    /* Recent submissions */
    .recent-section {
      margin-top: 28px;
      animation: fadeUp 0.6s ease 0.2s both;
    }

    .recent-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 12px;
      text-align: center;
    }

    .recent-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .recent-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(0,210,255,0.08);
      border-radius: 10px;
      font-size: 0.82rem;
    }

    .recent-item-left { color: var(--text); font-weight: 500; }
    .recent-item-sub  { color: var(--text-dim); font-size: 0.75rem; margin-top: 2px; }
    .recent-item-price {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent);
    }

    /* View GSOS button */
    .btn-view {
      width: 100%;
      padding: 14px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text-dim);
      font-family: 'Inter', sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-top: 12px;
    }
    .btn-view:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(0,210,255,0.05);
    }

    /* ── GSOS View Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(6px);
      z-index: 500;
      align-items: flex-start;
      justify-content: center;
      padding: 24px;
      overflow-y: auto;
    }
    .modal-overlay.active { display: flex; }

    .modal-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      width: 100%;
      max-width: 780px;
      margin: auto;
      box-shadow: 0 32px 80px rgba(0,0,0,0.7);
      animation: fadeUp 0.35s ease both;
      position: relative;
      overflow: hidden;
    }
    .modal-panel::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent);
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 28px 20px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 14px;
    }
    .modal-head-left h2 {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 1px;
    }
    .modal-head-left p { font-size: 0.8rem; color: var(--text-dim); margin-top: 2px; }
    .modal-head-right { display: flex; align-items: center; gap: 10px; }

    /* Month navigator */
    .month-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 10px;
    }
    .month-nav button {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 1rem;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
      transition: background 0.2s;
      line-height: 1;
    }
    .month-nav button:hover { background: rgba(0,210,255,0.12); }
    .month-nav button:disabled { opacity: 0.25; cursor: not-allowed; }
    .month-label {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      min-width: 110px;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .btn-modal-close {
      background: rgba(239,68,68,0.15);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 8px;
      color: #ef4444;
      font-size: 1rem;
      width: 34px; height: 34px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
      font-weight: 700;
    }
    .btn-modal-close:hover { background: rgba(239,68,68,0.3); }

    .modal-body { padding: 24px 28px 28px; }

    /* Month stat tiles */
    .month-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .month-stat {
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }
    .month-stat-label {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 8px;
    }
    .month-stat-value {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.7rem;
      font-weight: 700;
      color: #fff;
      line-height: 1;
    }
    .month-stat-value.highlight { color: var(--accent); }
    .month-stat-value.green     { color: var(--success); }

    /* Job type chips */
    .job-breakdown { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
    .job-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.82rem;
    }
    .job-chip-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .job-chip-name  { color: var(--text-dim); }
    .job-chip-count { font-weight: 700; color: var(--text); margin-left: 2px; }
    .job-chip-total { color: var(--accent); font-family: 'Rajdhani', sans-serif; font-size: 0.95rem; font-weight: 700; }

    /* Section heading */
    .section-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 12px;
    }

    /* Engineer table */
    .eng-table-wrap { border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
    .eng-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .eng-table th {
      background: rgba(0,210,255,0.1);
      color: var(--accent);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .eng-table th:nth-child(3),
    .eng-table th:nth-child(4),
    .eng-table th:nth-child(5),
    .eng-table th:last-child,
    .eng-table td:nth-child(3),
    .eng-table td:nth-child(4),
    .eng-table td:nth-child(5),
    .eng-table td:last-child { text-align: right; }
    .eng-table td {
      padding: 13px 14px;
      border-bottom: 1px solid rgba(0,210,255,0.06);
      color: var(--text);
    }
    .eng-table tr:last-child td { border-bottom: none; }
    .eng-table tr:hover td { background: rgba(0,210,255,0.04); }
    .eng-name { font-weight: 600; }
    .eng-total {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent);
    }

    /* Empty / loading state */
    .modal-placeholder { text-align: center; padding: 48px 24px; color: var(--text-dim); }
    .modal-placeholder .big-icon { font-size: 2.5rem; margin-bottom: 12px; }
    .modal-placeholder p { font-size: 0.9rem; }

    @media (max-width: 480px) {
      .card { padding: 28px 20px; }
      .page-header h1 { font-size: 2rem; }
      .modal-head { padding: 18px 18px 16px; }
      .modal-body { padding: 18px; }
      .month-stats { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

<div class="wrapper">

  <div class="page-header">
    <span class="brand">NGU · OES</span>
    <h1>GSOS Submission</h1>
    <p>Record additional payment jobs for engineers</p>
  </div>

  <div class="card">

    <!-- Engineer -->
    <div class="form-group">
      <label for="engineerSelect">Engineer</label>
      <div class="select-wrap">
        <select id="engineerSelect">
          <option value="" disabled selected>Loading engineers…</option>
        </select>
      </div>
    </div>

    <!-- Date -->
    <div class="form-group">
      <label for="jobDate">Date</label>
      <input type="date" id="jobDate" />
    </div>

    <!-- Job Type -->
    <div class="form-group">
      <label>Job Type</label>
      <div class="job-options">

        <div class="job-option">
          <input type="radio" name="jobType" id="job-dual" value="Dual Exchange" data-price="139.05" />
          <label for="job-dual">
            <span class="job-name">
              <span class="job-dot"></span>
              Dual Exchange
            </span>
            <span class="job-price">£139.05</span>
          </label>
        </div>

        <div class="job-option">
          <input type="radio" name="jobType" id="job-single" value="Single" data-price="113.30" />
          <label for="job-single">
            <span class="job-name">
              <span class="job-dot"></span>
              Single
            </span>
            <span class="job-price">£113.30</span>
          </label>
        </div>

        <div class="job-option">
          <input type="radio" name="jobType" id="job-comms" value="Comms" data-price="72.10" />
          <label for="job-comms">
            <span class="job-name">
              <span class="job-dot"></span>
              Comms
            </span>
            <span class="job-price">£72.10</span>
          </label>
        </div>

      </div>
    </div>

    <div class="divider"></div>

    <!-- Summary -->
    <div class="summary" id="summary">
      <div class="summary-row">
        <span>Engineer</span>
        <span id="sum-engineer">—</span>
      </div>
      <div class="summary-row">
        <span>Date</span>
        <span id="sum-date">—</span>
      </div>
      <div class="summary-row">
        <span>Job Type</span>
        <span id="sum-job">—</span>
      </div>
      <div class="summary-total">
        <span class="label">Payment</span>
        <span class="amount" id="sum-price">—</span>
      </div>
    </div>

    <!-- Submit -->
    <button class="btn-submit" id="submitBtn" onclick="submitForm()">
      Submit GSOS
    </button>

    <!-- View GSOS -->
    <button class="btn-view" onclick="openGSOSView()">
      📊 View GSOS Information
    </button>

  </div>

  <!-- Recent submissions (session only) -->
  <div class="recent-section" id="recentSection" style="display:none;">
    <div class="recent-title">Submitted this session</div>
    <div class="recent-list" id="recentList"></div>
  </div>

</div>

<!-- GSOS View Modal -->
<div class="modal-overlay" id="gsosModal" onclick="handleModalClick(event)">
  <div class="modal-panel" onclick="event.stopPropagation()">
    <div class="modal-head">
      <div class="modal-head-left">
        <h2>GSOS Overview</h2>
        <p>Monthly breakdown by engineer</p>
      </div>
      <div class="modal-head-right">
        <div class="month-nav">
          <button id="prevMonthBtn" onclick="changeMonth(-1)">◀</button>
          <span class="month-label" id="modalMonthLabel">—</span>
          <button id="nextMonthBtn" onclick="changeMonth(1)">▶</button>
        </div>
        <button class="btn-modal-close" onclick="closeGSOSView()">✕</button>
      </div>
    </div>
    <div class="modal-body">
      <div id="modalContent">
        <div class="modal-placeholder">
          <div class="big-icon">⏳</div>
          <p>Loading GSOS data…</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">
  <span class="toast-icon" id="toastIcon"></span>
  <span id="toastMsg"></span>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, getDocs, addDoc, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
    authDomain: "oesperformance-a54c0.firebaseapp.com",
    projectId: "oesperformance-a54c0",
    storageBucket: "oesperformance-a54c0.firebasestorage.app",
    messagingSenderId: "484894102454",
    appId: "1:484894102454:web:17535ee497eac2d90d6717",
    measurementId: "G-R56BGZYV8N"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);

  // ── Preset today's date ──────────────────────────────────────
  const dateInput = document.getElementById('jobDate');
  const today = new Date();
  dateInput.value = today.toISOString().split('T')[0];

  // ── Load engineers from Firestore ────────────────────────────
  async function loadEngineers() {
    const select = document.getElementById('engineerSelect');
    try {
      const snap = await getDocs(collection(db, 'engineers'));
      const names = [];
      snap.forEach(doc => {
        const name = doc.data().engineerName;
        if (name) names.push(name);
      });
      names.sort();

      select.innerHTML = '<option value="" disabled selected>Select an engineer…</option>';
      names.forEach(name => {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        select.appendChild(opt);
      });
    } catch (err) {
      console.error('Error loading engineers:', err);
      select.innerHTML = '<option value="" disabled selected>Error loading engineers</option>';
    }
  }

  loadEngineers();

  // ── Live summary update ───────────────────────────────────────
  const JOB_PRICES = { 'Dual Exchange': 139.05, 'Single': 113.30, 'Comms': 72.10 };

  function updateSummary() {
    const engineer = document.getElementById('engineerSelect').value;
    const date     = document.getElementById('jobDate').value;
    const jobRadio = document.querySelector('input[name="jobType"]:checked');

    const summary = document.getElementById('summary');

    if (!engineer || !date || !jobRadio) {
      summary.classList.remove('visible');
      return;
    }

    const jobType = jobRadio.value;
    const price   = JOB_PRICES[jobType];

    // Format date nicely
    const [y, m, d] = date.split('-');
    const formatted  = new Date(+y, +m - 1, +d).toLocaleDateString('en-GB', {
      weekday: 'short', day: 'numeric', month: 'short', year: 'numeric'
    });

    document.getElementById('sum-engineer').textContent = engineer;
    document.getElementById('sum-date').textContent     = formatted;
    document.getElementById('sum-job').textContent      = jobType;
    document.getElementById('sum-price').textContent    = `£${price.toFixed(2)}`;

    summary.classList.add('visible');
  }

  document.getElementById('engineerSelect').addEventListener('change', updateSummary);
  document.getElementById('jobDate').addEventListener('change', updateSummary);
  document.querySelectorAll('input[name="jobType"]').forEach(r => r.addEventListener('change', updateSummary));

  // ── Toast helper ──────────────────────────────────────────────
  let toastTimer;
  function showToast(msg, type = 'success') {
    const toast = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    document.getElementById('toastIcon').textContent = type === 'success' ? '✅' : '❌';
    toast.className = `toast ${type} show`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.className = `toast ${type}`; }, 3500);
  }

  // ── Session recent submissions ────────────────────────────────
  const sessionSubmissions = [];

  function addRecentItem(engineer, jobType, price, dateStr) {
    sessionSubmissions.unshift({ engineer, jobType, price, dateStr });

    const section = document.getElementById('recentSection');
    const list    = document.getElementById('recentList');
    section.style.display = 'block';

    const [y, m, d] = dateStr.split('-');
    const formatted = new Date(+y, +m - 1, +d).toLocaleDateString('en-GB', {
      day: 'numeric', month: 'short'
    });

    const item = document.createElement('div');
    item.className = 'recent-item';
    item.innerHTML = `
      <div class="recent-item-left">
        ${engineer}
        <div class="recent-item-sub">${jobType} · ${formatted}</div>
      </div>
      <div class="recent-item-price">£${price.toFixed(2)}</div>
    `;

    list.insertBefore(item, list.firstChild);

    // Keep max 5
    while (list.children.length > 5) list.removeChild(list.lastChild);
  }

  // ── GSOS View Modal ───────────────────────────────────────────
  const MONTHS = ['January','February','March','April','May','June',
                  'July','August','September','October','November','December'];
  const JOB_COLORS = { 'Dual Exchange': '#00d2ff', 'Single': '#7eb3ff', 'Comms': '#10b981' };

  let viewYear  = today.getFullYear();
  let viewMonth = today.getMonth(); // 0-based
  let gsosCache = null; // all GSOS docs, fetched once

  window.openGSOSView = async function() {
    document.getElementById('gsosModal').classList.add('active');
    updateMonthLabel();
    if (!gsosCache) {
      document.getElementById('modalContent').innerHTML = `
        <div class="modal-placeholder"><div class="big-icon">⏳</div><p>Loading GSOS data…</p></div>`;
      try {
        const snap = await getDocs(collection(db, 'GSOS'));
        gsosCache = [];
        snap.forEach(d => gsosCache.push(d.data()));
      } catch (err) {
        document.getElementById('modalContent').innerHTML = `
          <div class="modal-placeholder"><div class="big-icon">⚠️</div><p>Error loading data</p></div>`;
        return;
      }
    }
    renderModal();
  };

  window.closeGSOSView = function() {
    document.getElementById('gsosModal').classList.remove('active');
  };

  window.handleModalClick = function(e) {
    if (e.target === document.getElementById('gsosModal')) closeGSOSView();
  };

  window.changeMonth = function(delta) {
    viewMonth += delta;
    if (viewMonth > 11) { viewMonth = 0;  viewYear++; }
    if (viewMonth < 0)  { viewMonth = 11; viewYear--; }
    updateMonthLabel();
    renderModal();
  };

  function updateMonthLabel() {
    document.getElementById('modalMonthLabel').textContent = `${MONTHS[viewMonth]} ${viewYear}`;
    // Disable next if we're already on current month
    const now = new Date();
    const isCurrentOrFuture = (viewYear > now.getFullYear()) ||
      (viewYear === now.getFullYear() && viewMonth >= now.getMonth());
    document.getElementById('nextMonthBtn').disabled = isCurrentOrFuture;
  }

  function renderModal() {
    if (!gsosCache) return;

    // Filter to selected month
    const records = gsosCache.filter(r => {
      if (!r.date) return false;
      const [y, m] = r.date.split('-').map(Number);
      return y === viewYear && (m - 1) === viewMonth;
    });

    if (records.length === 0) {
      document.getElementById('modalContent').innerHTML = `
        <div class="modal-placeholder">
          <div class="big-icon">📭</div>
          <p>No GSOS submissions for ${MONTHS[viewMonth]} ${viewYear}</p>
        </div>`;
      return;
    }

    // ── Aggregate ──
    const totalJobs  = records.length;
    const totalValue = records.reduce((s, r) => s + (r.price || 0), 0);
    const engineerSet = new Set(records.map(r => r.engineerName));
    const totalEngineers = engineerSet.size;

    // By job type
    const byJobType = {};
    records.forEach(r => {
      const jt = r.jobType || 'Unknown';
      if (!byJobType[jt]) byJobType[jt] = { count: 0, value: 0 };
      byJobType[jt].count++;
      byJobType[jt].value += r.price || 0;
    });

    // By engineer
    const byEngineer = {};
    records.forEach(r => {
      const eng = r.engineerName || 'Unknown';
      if (!byEngineer[eng]) byEngineer[eng] = { total: 0, value: 0, jobs: {} };
      byEngineer[eng].total++;
      byEngineer[eng].value += r.price || 0;
      const jt = r.jobType || 'Unknown';
      byEngineer[eng].jobs[jt] = (byEngineer[eng].jobs[jt] || 0) + 1;
    });

    // Sort engineers by total value desc
    const sortedEngineers = Object.entries(byEngineer)
      .sort((a, b) => b[1].value - a[1].value);

    // ── Render ──
    const jobChips = Object.entries(byJobType).map(([jt, d]) => `
      <div class="job-chip">
        <span class="job-chip-dot" style="background:${JOB_COLORS[jt]||'#888'}"></span>
        <span class="job-chip-name">${jt}</span>
        <span class="job-chip-count">×${d.count}</span>
        <span class="job-chip-total">£${d.value.toFixed(2)}</span>
      </div>`).join('');

    const tableRows = sortedEngineers.map(([eng, d]) => {
      const dualCount   = d.jobs['Dual Exchange'] || 0;
      const singleCount = d.jobs['Single'] || 0;
      const commsCount  = d.jobs['Comms'] || 0;
      const pills = [
        dualCount   ? `<span class="job-pill pill-dual">D×${dualCount}</span>` : '',
        singleCount ? `<span class="job-pill pill-single">S×${singleCount}</span>` : '',
        commsCount  ? `<span class="job-pill pill-comms">C×${commsCount}</span>` : '',
      ].join('');
      return `<tr>
        <td class="eng-name">${eng}</td>
        <td>${pills}</td>
        <td>${dualCount}</td>
        <td>${singleCount}</td>
        <td>${commsCount}</td>
        <td class="eng-total">£${d.value.toFixed(2)}</td>
      </tr>`;
    }).join('');

    document.getElementById('modalContent').innerHTML = `
      <div class="month-stats">
        <div class="month-stat">
          <div class="month-stat-label">Total Jobs</div>
          <div class="month-stat-value highlight">${totalJobs}</div>
        </div>
        <div class="month-stat">
          <div class="month-stat-label">Total Value</div>
          <div class="month-stat-value green">£${totalValue.toFixed(2)}</div>
        </div>
        <div class="month-stat">
          <div class="month-stat-label">Engineers</div>
          <div class="month-stat-value">${totalEngineers}</div>
        </div>
        <div class="month-stat">
          <div class="month-stat-label">Avg / Engineer</div>
          <div class="month-stat-value">£${(totalValue / totalEngineers).toFixed(2)}</div>
        </div>
      </div>

      <div class="job-breakdown">${jobChips}</div>

      <div class="section-label">Engineer Breakdown</div>
      <div class="eng-table-wrap">
        <table class="eng-table">
          <thead>
            <tr>
              <th>Engineer</th>
              <th>Jobs</th>
              <th>Dual</th>
              <th>Single</th>
              <th>Comms</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody>${tableRows}</tbody>
        </table>
      </div>`;
  }

  // Invalidate cache when a new record is submitted so view reflects latest data
  const _origSubmit = window.submitForm;
  window.submitForm = async function() {
    await _origSubmit();
    gsosCache = null; // force refresh next time modal opens
  };

  window.submitForm = async function() {
    const engineer = document.getElementById('engineerSelect').value;
    const date     = document.getElementById('jobDate').value;
    const jobRadio = document.querySelector('input[name="jobType"]:checked');

    if (!engineer) { showToast('Please select an engineer', 'error'); return; }
    if (!date)     { showToast('Please select a date', 'error'); return; }
    if (!jobRadio) { showToast('Please select a job type', 'error'); return; }

    const jobType = jobRadio.value;
    const price   = JOB_PRICES[jobType];

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Submitting…';

    try {
      await addDoc(collection(db, 'GSOS'), {
        engineerName: engineer,
        date:         date,
        jobType:      jobType,
        price:        price,
        submittedAt:  serverTimestamp()
      });

      showToast(`Submitted — ${engineer} · ${jobType}`, 'success');
      addRecentItem(engineer, jobType, price, date);

      // Reset form — keep engineer selected, reset date to today, clear job type
      dateInput.value = today.toISOString().split('T')[0];
      document.querySelectorAll('input[name="jobType"]').forEach(r => r.checked = false);
      document.getElementById('summary').classList.remove('visible');

    } catch (err) {
      console.error('Submission error:', err);
      showToast('Submission failed — please try again', 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = 'Submit GSOS';
    }
  };
</script>
</body>
</html>
