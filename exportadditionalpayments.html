<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Export Payment Summary</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 1200px; margin: 0 auto; padding: 40px; }
        .header { text-align: center; margin-bottom: 40px; }
        .back-link { display: inline-block; color: #667eea; text-decoration: none; font-weight: 600; margin-bottom: 20px; transition: transform 0.2s ease; }
        .back-link:hover { transform: translateX(-5px); }
        .logo { font-size: 2em; font-weight: bold; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 10px; }
        .subtitle { color: #666; font-size: 1.1em; }
        .export-section { background: #f8f9fa; border-radius: 15px; padding: 30px; margin-bottom: 30px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-bottom: 25px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { margin-bottom: 8px; color: #333; font-weight: 600; font-size: 1.05em; }
        .form-group input { padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1em; transition: border-color 0.3s ease; }
        .form-group input:focus { outline: none; border-color: #667eea; }
        .btn { padding: 15px 40px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; font-size: 1.1em; font-weight: 600; cursor: pointer; transition: transform 0.2s ease, box-shadow 0.2s ease; width: 100%; }
        .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(102,126,234,0.4); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-export { background: linear-gradient(135deg, #28a745 0%, #20c997 100%); }
        .btn-export:hover:not(:disabled) { box-shadow: 0 10px 25px rgba(40,167,69,0.4); }
        .stats-section { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { color: white; padding: 25px; border-radius: 12px; text-align: center; }
        .stat-card.payments { background: linear-gradient(135deg, #28a745 0%, #20c997 100%); }
        .stat-card.bonus    { background: linear-gradient(135deg, #ffc107 0%, #ff9800 100%); }
        .stat-card.total    { background: linear-gradient(135deg, #17a2b8 0%, #138496 100%); }
        .stat-label { font-size: 0.9em; opacity: 0.9; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 2.5em; font-weight: bold; }
        .preview-section { margin-top: 30px; }
        .preview-header { font-size: 1.3em; font-weight: 600; color: #333; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 3px solid #667eea; }
        .export-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .loading { text-align: center; padding: 40px; color: #666; font-size: 1.1em; }
        .no-data { text-align: center; padding: 60px 40px; color: #666; font-size: 1.2em; background: #f8f9fa; border-radius: 10px; }
        .info-box { background: #d1ecf1; border-left: 4px solid #17a2b8; padding: 15px; border-radius: 8px; margin-bottom: 20px; color: #0c5460; }
        
        /* Claim Cards */
        .engineer-block { margin-bottom: 30px; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .engineer-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; }
        .engineer-header-name { font-size: 1.05em; font-weight: 700; }
        .claim-section { padding: 18px 20px; background: #f0fdf4; border-left: 4px solid #10b981; border-bottom: 1px solid #e0e0e0; }
        .claim-section.changes { background: #ecfeff; border-left-color: #0891b2; }
        .claim-section.pending { background: #fffbeb; border-left-color: #f59e0b; }
        .claim-section.rejected { background: #fff1f2; border-left-color: #ef4444; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 8px; font-size: 0.8em; font-weight: 700; }
        .badge-approved  { background: #10b981; color: white; }
        .badge-changes   { background: #0891b2; color: white; }
        .badge-pending   { background: #fbbf24; color: #78350f; }
        .badge-rejected  { background: #ef4444; color: white; }
        .payment-details { background: white; padding: 14px; border-radius: 10px; font-size: 0.88em; }
        .detail-item { padding: 5px 0; color: #475569; border-bottom: 1px solid #f1f5f9; }
        .detail-total { margin-top: 10px; padding: 10px 14px; border-top: 2px solid #10b981; font-weight: 700; color: #065f46; }
        .preview-table { width: 100%; border-collapse: collapse; background: white; margin-bottom: 20px; }
        .preview-table th { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px; text-align: left; }
        .preview-table td { padding: 12px 15px; border-bottom: 1px solid #e0e0e0; }
        .avg-bonus-badge { background: #e9f7ef; color: #1a7a4a; border: 1px solid #a3d9b7; padding: 2px 7px; border-radius: 5px; font-size: 0.8em; margin-left: 5px; }

        @media (max-width: 768px) {
            .container { padding: 20px; }
            .form-grid, .stats-section, .export-buttons { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <a href="index.html" class="back-link">← Back to Home</a>
        <div class="logo">📊 Export Payment Summary</div>
        <div class="subtitle">Download additional payments and bonus summary as CSV</div>
    </div>

    <div class="export-section">
        <div class="info-box">
            ℹ️ Bonus totals include performance bonuses plus monthly-specific average bonus for Holiday/Training days.
        </div>
        <div class="form-grid">
            <div class="form-group">
                <label for="startDate">Start Date:</label>
                <input type="date" id="startDate" required>
            </div>
            <div class="form-group">
                <label for="endDate">End Date:</label>
                <input type="date" id="endDate" required>
            </div>
        </div>
        <button class="btn" onclick="loadPreview()">🔍 Load Preview</button>
    </div>

    <div id="loadingDiv" class="loading" style="display:none;">Loading data...</div>
    <div id="statsSection" class="stats-section" style="display:none;"></div>

    <div id="previewSection" class="preview-section" style="display:none;">
        <div class="preview-header">📋 Additional Payments Summary</div>
        <div id="paymentsContainer"></div>

        <div class="preview-header" style="margin-top:40px;">🎁 Bonus Summary</div>
        <div style="overflow-x:auto;">
            <table class="preview-table" id="bonusTable"></table>
        </div>

        <div class="export-buttons">
            <button class="btn btn-export" onclick="exportPaymentsCSV()">💾 Export Payments CSV</button>
            <button class="btn btn-export" onclick="exportBonusCSV()">💾 Export Bonus CSV</button>
        </div>
    </div>

    <div id="noDataDiv" class="no-data" style="display:none;">📭 No data found for selected range</div>
</div>

<script type="module">
import { initializeApp }  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
    authDomain: "oesperformance-a54c0.firebaseapp.com",
    projectId: "oesperformance-a54c0",
    storageBucket: "oesperformance-a54c0.firebasestorage.app",
    messagingSenderId: "484894102454",
    appId: "1:484894102454:web:17535ee497eac2d90d6717",
    measurementId: "G-R56BGZYV8N"
};
const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

// Calculation Helpers
function calcPayBreakdown(payment, dateObj) {
    const dow = dateObj.getDay();
    const isSat = dow === 6, isSun = dow === 0, isWknd = isSat || isSun;
    const m = dateObj.getMonth() + 1, d = dateObj.getDate();
    const isSpecial = (m===12&&d===25)||(m===12&&d===26)||(m===1&&d===1);

    let bd = { standby: { amount: 0 }, workingAway:{ amount: 0 }, overtime: { amount: 0, rate: 0 }, jobs: { amount: 0 } };

    if (payment.standby === 'yes') {
        if (isSpecial) bd.standby.amount = 100;
        else if (isWknd) bd.standby.amount = 50;
        else bd.standby.amount = 20;
    }
    if (payment.workingAway === 'yes') bd.workingAway.amount = 50;
    if (payment.overtime === 'yes' && payment.overtimeHours > 0) {
        if (isSun || payment.isBankHoliday) bd.overtime.rate = 39.90;
        else if (isSat) bd.overtime.rate = 29.93;
        else bd.overtime.rate = 24.94;
        bd.overtime.amount = payment.overtimeHours * bd.overtime.rate;
    }
    if (payment.hasJobs && payment.jobs) {
        payment.jobs.forEach(j => {
            if (j.claimPricePerJob === 'yes') {
                if (j.jobType === 'Dual') bd.jobs.amount += 80;
                else if (j.jobType === 'Single') bd.jobs.amount += 50;
                else if (j.jobType === 'Comms') bd.jobs.amount += 25;
            }
        });
    }
    return bd;
}

function calcApprovedTotal(payment, dateObj) {
    const bd = calcPayBreakdown(payment, dateObj);
    if (payment.status !== 'approved' && payment.status !== 'approved-with-changes') return 0;
    
    let total = 0;
    const am = payment.amendments || {};
    if (payment.standby === 'yes' && am.standby !== false) total += bd.standby.amount;
    if (payment.workingAway === 'yes' && am.workingAway !== false) total += bd.workingAway.amount;
    if (payment.overtime === 'yes' && am.overtime !== false) {
        total += am.overtimeHours ? am.overtimeHours * bd.overtime.rate : bd.overtime.amount;
    }
    if (payment.hasJobs && payment.jobs) {
        const rm = am.removeJobs || [];
        payment.jobs.forEach(j => {
            if (j.claimPricePerJob === 'yes' && !rm.includes(j.jobNumber)) {
                if (j.jobType === 'Dual') total += 80;
                else if (j.jobType === 'Single') total += 50;
                else if (j.jobType === 'Comms') total += 25;
            }
        });
    }
    return total;
}

let allClaimsByEngineer = {};
let bonusSummary = [];

window.loadPreview = async function() {
    const startDate = document.getElementById('startDate').value;
    const endDate = document.getElementById('endDate').value;
    if (!startDate || !endDate) return;

    document.getElementById('loadingDiv').style.display = 'block';
    document.getElementById('previewSection').style.display = 'none';

    try {
        // 1. Payments
        const pmSnap = await getDocs(collection(db, 'additionalPayments'));
        allClaimsByEngineer = {};
        pmSnap.forEach(doc => {
            const d = doc.data();
            if (d.date >= startDate && d.date <= endDate) {
                if (!allClaimsByEngineer[d.engineerName]) allClaimsByEngineer[d.engineerName] = [];
                allClaimsByEngineer[d.engineerName].push(d);
            }
        });

        // 2. Performance Bonuses
        const bSnap = await getDocs(collection(db, 'bonuses'));
        const perfBonusMap = {};
        bSnap.forEach(doc => {
            const d = doc.data();
            if (d.dailyBonuses && d.engineerName) {
                if (!perfBonusMap[d.engineerName]) perfBonusMap[d.engineerName] = 0;
                Object.entries(d.dailyBonuses).forEach(([date, amt]) => {
                    if (date >= startDate && date <= endDate) perfBonusMap[d.engineerName] += parseFloat(amt || 0);
                });
            }
        });

        // 3. Average Bonuses (Month-Aware)
        const avgSnap = await getDocs(collection(db, 'Average Bonuses'));
        const avgConfig = {}; // { "Name": { "January": 50 } }
        avgSnap.forEach(doc => {
            const d = doc.data();
            if (d.name && d.month) {
                if (!avgConfig[d.name]) avgConfig[d.name] = {};
                avgConfig[d.name][d.month] = parseFloat(d.fullDay) || 0;
            }
        });

        // 4. Attendance
        const attSnap = await getDocs(collection(db, 'attendance'));
        const attendanceBonusMap = {};
        attSnap.forEach(doc => {
            const d = doc.data();
            if (d.date >= startDate && d.date <= endDate && ['H', 'H/H', 'Training'].includes(d.attendance)) {
                const dateObj = new Date(d.date + 'T00:00:00');
                const monthName = dateObj.toLocaleString('en-GB', { month: 'long' });
                const dailyAvg = (avgConfig[d.engineerName] && avgConfig[d.engineerName][monthName]) ? avgConfig[d.engineerName][monthName] : 0;
                
                let amount = (d.attendance === 'H/H') ? dailyAvg / 2 : dailyAvg;
                if (amount > 0) {
                    if (!attendanceBonusMap[d.engineerName]) attendanceBonusMap[d.engineerName] = 0;
                    attendanceBonusMap[d.engineerName] += amount;
                }
            }
        });

        // Build Summary
        bonusSummary = [];
        const names = new Set([...Object.keys(perfBonusMap), ...Object.keys(attendanceBonusMap)]);
        names.forEach(name => {
            const perf = perfBonusMap[name] || 0;
            const att = attendanceBonusMap[name] || 0;
            if (perf + att > 0) bonusSummary.push({ engineerName: name, perfTotal: perf, avgBonusTotal: att, totalBonus: perf + att });
        });

        document.getElementById('loadingDiv').style.display = 'none';
        displayStats();
        displayPreview();
    } catch (e) { console.error(e); }
};

function displayStats() {
    const totalPayments = Object.values(allClaimsByEngineer).reduce((sum, claims) => 
        sum + claims.reduce((s, p) => s + calcApprovedTotal(p, new Date(p.date+'T00:00:00')), 0), 0);
    const totalBonus = bonusSummary.reduce((s,b) => s + b.totalBonus, 0);
    document.getElementById('statsSection').style.display = 'grid';
    document.getElementById('statsSection').innerHTML = `
        <div class="stat-card payments"><div class="stat-label">Approved Payments</div><div class="stat-value">£${totalPayments.toFixed(2)}</div></div>
        <div class="stat-card bonus"><div class="stat-label">Total Bonuses</div><div class="stat-value">£${totalBonus.toFixed(2)}</div></div>
        <div class="stat-card total"><div class="stat-label">Grand Total</div><div class="stat-value">£${(totalPayments+totalBonus).toFixed(2)}</div></div>`;
}

function displayPreview() {
    document.getElementById('previewSection').style.display = 'block';
    const container = document.getElementById('paymentsContainer');
    container.innerHTML = Object.keys(allClaimsByEngineer).sort().map(name => {
        const claims = allClaimsByEngineer[name];
        const approved = claims.reduce((s,p) => s + calcApprovedTotal(p, new Date(p.date+'T00:00:00')), 0);
        return `<div class="engineer-block"><div class="engineer-header"><span>👷 ${name}</span><span>Approved: £${approved.toFixed(2)}</span></div>
                ${claims.map((p,i) => `<div class="claim-section"><strong>${p.date}</strong> - Status: ${p.status} - Total: £${calcApprovedTotal(p, new Date(p.date+'T00:00:00')).toFixed(2)}</div>`).join('')}</div>`;
    }).join('');

    document.getElementById('bonusTable').innerHTML = `<thead><tr><th>Name</th><th>Performance</th><th>Avg Bonus</th><th>Total</th></tr></thead>
        <tbody>${bonusSummary.map(b => `<tr><td>${b.engineerName}</td><td>£${b.perfTotal.toFixed(2)}</td><td>£${b.avgBonusTotal.toFixed(2)}</td><td><strong>£${b.totalBonus.toFixed(2)}</strong></td></tr>`).join('')}</tbody>`;
}

window.exportPaymentsCSV = function() {
    let csv = 'Engineer Name,Date,Status,Standby,Working Away,Overtime,Jobs,Total Approved\n';
    Object.keys(allClaimsByEngineer).sort().forEach(name => {
        allClaimsByEngineer[name].forEach(p => {
            const dateObj = new Date(p.date+'T00:00:00');
            const bd = calcPayBreakdown(p, dateObj);
            const approved = calcApprovedTotal(p, dateObj);
            const isApproved = p.status.includes('approved');
            csv += [esc(name), p.date, p.status, (isApproved?bd.standby.amount:0).toFixed(2), (isApproved?bd.workingAway.amount:0).toFixed(2), (isApproved?bd.overtime.amount:0).toFixed(2), (isApproved?bd.jobs.amount:0).toFixed(2), approved.toFixed(2)].join(',') + '\n';
        });
    });
    download(csv, 'payments_export.csv');
};

window.exportBonusCSV = function() {
    let csv = 'Engineer Name,Performance Bonus,Avg Bonus (Holiday/Training),Total Bonus\n';
    bonusSummary.forEach(b => { csv += `${esc(b.engineerName)},${b.perfTotal.toFixed(2)},${b.avgBonusTotal.toFixed(2)},${b.totalBonus.toFixed(2)}\n`; });
    download(csv, 'bonus_export.csv');
};

function download(csv, filename) {
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click();
}
function esc(str) { return `"${str.toString().replace(/"/g, '""')}"`; }

window.addEventListener('load', () => {
    const today = new Date();
    document.getElementById('endDate').value = today.toISOString().split('T')[0];
    today.setDate(today.getDate() - 30);
    document.getElementById('startDate').value = today.toISOString().split('T')[0];
});
</script>
</body>
</html>
