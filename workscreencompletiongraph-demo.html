<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Completion % Dashboard • OES</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --accent: #10b981; --text: #e2e8f0; --text-dim: #94a3b8; --border: #334155; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 2rem; }
    .card { background: var(--card); border-radius: 16px; border: 1px solid var(--border); padding: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.35); }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    h1 { font-size: 2.1rem; font-weight: 700; color: white; }
    .stats-box { background: rgba(16,185,129,0.15); border: 1px solid var(--accent); border-radius: 12px; padding: 1rem 2rem; text-align: center; }
    .stats-label { font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
    .stats-value { font-size: 2.5rem; font-weight: 700; color: var(--accent); }
    #chartContainer { height: 500px; position: relative; }
  </style>
</head>
<body>

<header>
  <h1>Completion %</h1>
  <div class="stats-box">
    <div class="stats-label">15-Day Average</div>
    <div class="stats-value" id="avgValue">0%</div>
  </div>
</header>

<div class="card">
  <div id="chartContainer">
    <canvas id="completionChart"></canvas>
  </div>
</div>

<script>
  // Data matched to the 15-day range provided in the Work Screen
  const completionData = [
    { date: "30/04", val: 91.0 }, { date: "01/05", val: 90.0 }, { date: "05/05", val: 89.0 },
    { date: "06/05", val: 92.0 }, { date: "07/05", val: 90.0 }, { date: "08/05", val: 88.0 },
    { date: "11/05", val: 90.0 }, { date: "12/05", val: 93.0 }, { date: "13/05", val: 89.0 },
    { date: "14/05", val: 91.0 }, { date: "15/05", val: 90.0 }, { date: "18/05", val: 89.0 },
    { date: "19/05", val: 90.0 }, { date: "20/05", val: 91.0 }, { date: "21/05", val: 90.0 }
  ];

  const ctx = document.getElementById('completionChart').getContext('2d');
  
  const avg = (completionData.reduce((acc, curr) => acc + curr.val, 0) / completionData.length).toFixed(1);
  document.getElementById('avgValue').textContent = `${avg}%`;

  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: completionData.map(d => d.date),
      datasets: [{
        label: 'Completion %',
        data: completionData.map(d => d.val),
        backgroundColor: 'rgba(16,185,129,0.75)',
        borderColor: '#10b981',
        borderWidth: 1,
        borderRadius: 6
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        datalabels: {
          anchor: 'end',
          align: 'top',
          color: '#e2e8f0',
          formatter: (value) => `${value.toFixed(0)}%`
        }
      },
      scales: {
        y: { 
          beginAtZero: false, 
          min: 80, 
          max: 100,
          grid: { color: '#334155' },
          ticks: { color: '#94a3b8' }
        },
        x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
      }
    },
    plugins: [ChartDataLabels]
  });
</script>

</body>
</html>
