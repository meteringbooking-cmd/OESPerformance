<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashleigh's Safety Board</title>
    <style>
        /* Hazard stripe background for the whole screen */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: repeating-linear-gradient(
                -45deg,
                #ffcc00,
                #ffcc00 50px,
                #222 50px,
                #222 100px
            );
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Impact', 'Arial Black', sans-serif;
            overflow: hidden;
        }

        /* The main TV display box */
        .dashboard {
            background-color: #111;
            width: 92vw;
            height: 88vh;
            border: 15px solid #333;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            position: relative;
        }

        /* Top yellow warning bar */
        .header-bar {
            background-color: #ffcc00;
            color: black;
            width: 100%;
            padding: 2vh 0;
            font-size: 3vw;
            position: absolute;
            top: 0;
            border-top-left-radius: 5px;
            border-top-right-radius: 5px;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        .main-text {
            font-size: 4.5vw;
            margin-top: 10vh;
            color: #e0e0e0;
            text-shadow: 4px 4px 10px #000;
            line-height: 1.2;
            padding: 0 20px;
        }

        /* The box holding the number */
        .counter-box {
            background-color: #222;
            border: 10px inset #555;
            margin: 4vh 0;
            padding: 20px 100px;
            border-radius: 20px;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
        }

        /* Massive glowing number */
        .number {
            font-size: 28vw;
            line-height: 1;
            color: #00ff00; /* Neon green to celebrate the achievement */
            text-shadow: 0 0 20px #00ff00, 0 0 60px #00ff00;
            animation: pulse 2s infinite alternate;
        }

        /* Scrolling news ticker at the bottom */
        .ticker-tape {
            position: absolute;
            bottom: 0;
            background-color: #aa0000;
            width: 100%;
            color: white;
            font-size: 2.5vw;
            padding: 1.5vh 0;
            white-space: nowrap;
            overflow: hidden;
            border-bottom-left-radius: 5px;
            border-bottom-right-radius: 5px;
        }

        .ticker-tape span {
            display: inline-block;
            padding-left: 100%;
            animation: marquee 20s linear infinite;
        }

        /* Animations */
        @keyframes pulse {
            from { text-shadow: 0 0 10px #00ff00, 0 0 30px #00ff00; transform: scale(1); }
            to { text-shadow: 0 0 30px #00ff00, 0 0 80px #00ff00; transform: scale(1.05); }
        }

        @keyframes marquee {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="header-bar">⚠️ OFFICIAL WORKPLACE SAFETY DASHBOARD ⚠️</div>
        
        <div class="main-text">ASHLEIGH'S DAYS WITHOUT INCIDENT</div>
        
        <div class="counter-box">
            <div class="number">1</div>
        </div>
        
        <div class="ticker-tape">
            <span>ATTENTION ALL STAFF: CURRENT RECORD IS 1 DAY. PLEASE PROCEED WITH CAUTION. DO NOT STARTLE ASHLEIGH. PREVIOUS INCIDENTS ARE CLASSIFIED.</span>
        </div>
    </div>

</body>
</html>
