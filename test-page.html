<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Dashboard</title>
    <style>
        body {
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .safety-sign {
            background-color: #ffcc00; /* Industrial Yellow */
            padding: 20px;
            border: 10px solid #000;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 90%;
        }

        .header {
            background-color: #000;
            color: #ffcc00;
            padding: 10px;
            font-weight: bold;
            font-size: 2rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .text-line {
            color: #000;
            font-size: 1.5rem;
            font-weight: 900;
            margin: 10px 0;
            text-transform: uppercase;
        }

        .counter-box {
            background-color: #fff;
            border: 5px solid #000;
            display: inline-block;
            padding: 10px 30px;
            margin: 20px 0;
        }

        .number {
            font-family: 'Courier New', Courier, monospace;
            font-size: 5rem;
            font-weight: bold;
            color: #d32f2f; /* Alert Red */
        }

        .footer {
            font-style: italic;
            margin-top: 15px;
            font-weight: bold;
            color: #333;
        }

        /* Fun blinking animation for the "1" */
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        .blink {
            animation: blink 2s infinite;
        }
    </style>
</head>
<body>

    <div class="safety-sign">
        <div class="header">Safety First</div>
        
        <div class="text-line">Ashleigh's days without</div>
        <div class="text-line">Incident</div>
        
        <div class="counter-box">
            <div class="number blink">1</div>
        </div>
        
        <div class="footer">
            Work Safely. Stay Alert.
        </div>
    </div>

</body>
</html>
