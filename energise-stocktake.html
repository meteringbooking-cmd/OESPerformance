<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1d4ed8" />
  <title>Energise Stock Take</title>
  <style>
    :root {
      --bg:        #f1f4f9;
      --card:      #ffffff;
      --border:    #e3e8ef;
      --accent:    #1d4ed8;
      --accent-dk: #1e40af;
      --accent-lt: #eff4ff;
      --text:      #0f172a;
      --muted:     #64748b;
      --success:   #059669;
      --success-lt:#ecfdf5;
      --danger:    #dc2626;
      --warn:      #b45309;
      --radius:    16px;
      --shadow:    0 1px 2px rgba(15,23,42,.06), 0 4px 14px rgba(15,23,42,.05);
      --safe-b:    env(safe-area-inset-bottom, 0px);
      --safe-t:    env(safe-area-inset-top, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
    }

    button, input { font-family: inherit; }
    button { touch-action: manipulation; }

    /* ── Header ── */
    .page-header {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dk) 100%);
      color: #fff;
      padding: calc(14px + var(--safe-t)) 16px 14px;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 2px 12px rgba(29,78,216,.3);
    }
    .header-row { display: flex; align-items: center; gap: 12px; max-width: 680px; margin: 0 auto; }
    .header-logo {
      width: 38px; height: 38px; flex-shrink: 0;
      background: rgba(255,255,255,.18);
      border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
    }
    .header-text h1 { font-size: 18px; font-weight: 700; letter-spacing: -.3px; line-height: 1.2; }
    .header-text p  { font-size: 12.5px; opacity: .8; margin-top: 1px; }

    /* ── Container ── */
    .container { max-width: 680px; margin: 0 auto; padding: 16px 14px calc(110px + var(--safe-b)); }

    /* ── Name card ── */
    .name-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }
    .field-label {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: .6px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .text-input {
      width: 100%;
      height: 52px;
      padding: 0 16px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 16px;               /* 16px stops iOS zooming on focus */
      color: var(--text);
      background: var(--bg);
      outline: none;
      transition: border-color .18s, background .18s, box-shadow .18s;
      -webkit-appearance: none;
      appearance: none;
    }
    .text-input:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 4px rgba(29,78,216,.12); }
    .text-input.invalid { border-color: var(--danger); box-shadow: 0 0 0 4px rgba(220,38,38,.1); }

    .name-prompt-note {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13.5px;
      color: var(--warn);
      font-weight: 600;
      margin-bottom: 12px;
      display: none;
    }
    .name-prompt-note.show { display: block; }

    /* ── Search ── */
    .search-wrap { position: relative; margin-bottom: 4px; }
    .search-wrap svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    .search-wrap .text-input { padding-left: 44px; background: var(--card); box-shadow: var(--shadow); border-color: transparent; }
    .search-wrap .text-input:focus { border-color: var(--accent); }

    /* ── Section label ── */
    .section-label {
      display: flex; align-items: center; gap: 8px;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: .8px;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0 4px;
      margin: 22px 0 10px;
    }
    .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .section-label.hidden { display: none; }

    /* ── Item card ── */
    .item-card {
      background: var(--card);
      border: 2px solid transparent;
      border-radius: var(--radius);
      margin-bottom: 10px;
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: border-color .2s, box-shadow .2s;
    }
    .item-card.has-count { border-color: var(--success); }
    .item-card.hidden { display: none; }

    .item-top { display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px; }
    .item-info { flex: 1; min-width: 0; }
    .item-name { font-size: 15.5px; font-weight: 600; line-height: 1.35; word-break: break-word; }
    .item-sku {
      font-size: 12px; color: var(--muted); margin-top: 3px;
      font-family: ui-monospace, 'SF Mono', Consolas, monospace;
    }
    .tick {
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--success); color: #fff;
      display: none; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .item-card.has-count .tick { display: flex; }

    /* ── Inputs row ── */
    .item-inputs {
      display: flex; align-items: stretch; gap: 10px;
      padding: 12px 16px 14px;
      background: #f8fafd;
      border-top: 1px solid var(--border);
    }

    .count-wrap {
      flex: 1;
      display: flex; align-items: stretch;
      height: 52px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
      min-width: 0;
    }
    .count-btn {
      width: 54px; flex-shrink: 0;
      background: var(--accent-lt);
      border: none;
      color: var(--accent);
      font-size: 26px; font-weight: 400; line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .12s;
      user-select: none; -webkit-user-select: none;
    }
    .count-btn:active { background: #dbe6ff; }
    .count-input {
      flex: 1; min-width: 0; width: 100%;
      border: none;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      text-align: center;
      font-size: 20px; font-weight: 700;
      color: var(--text);
      outline: none;
      background: #fff;
      -moz-appearance: textfield;
      appearance: textfield;
    }
    .count-input:focus { background: var(--accent-lt); }
    .count-input::placeholder { color: #c3cbd8; }
    .count-input::-webkit-outer-spin-button,
    .count-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

    /* ── Summary bar ── */
    .summary-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(255,255,255,.96);
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      padding: 12px 16px calc(12px + var(--safe-b));
      z-index: 100;
      box-shadow: 0 -4px 20px rgba(15,23,42,.08);
    }
    .summary-inner { max-width: 680px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
    .summary-info { flex: 1; min-width: 0; }
    .count-text { font-size: 15px; font-weight: 700; }
    .count-sub  { font-size: 12px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .progress { height: 4px; background: var(--border); border-radius: 4px; margin-top: 6px; overflow: hidden; }
    .progress > i { display: block; height: 100%; width: 0; background: var(--success); border-radius: 4px; transition: width .25s; }

    .btn-submit {
      height: 52px; padding: 0 28px;
      background: var(--accent); color: #fff;
      border: none; border-radius: 12px;
      font-size: 16px; font-weight: 700;
      cursor: pointer; white-space: nowrap;
      transition: background .18s, transform .1s;
    }
    .btn-submit:active { transform: scale(.97); background: var(--accent-dk); }
    .btn-submit:disabled { background: var(--border); color: #94a3b8; cursor: not-allowed; transform: none; }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: calc(96px + var(--safe-b)); left: 50%;
      transform: translateX(-50%) translateY(20px);
      max-width: calc(100vw - 32px);
      background: var(--text); color: #fff;
      padding: 13px 20px; border-radius: 12px;
      font-size: 14px; font-weight: 600;
      opacity: 0; transition: opacity .25s, transform .25s;
      z-index: 200; pointer-events: none; text-align: center;
    }
    .toast.success { background: var(--success); }
    .toast.error   { background: var(--danger); }
    .toast.show    { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Loading ── */
    .loading-state { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 14px; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .7s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty { color: var(--muted); text-align: center; padding: 32px 16px; font-size: 14px; }

    /* ── Submitted state ── */
    .submitted-overlay {
      display: none; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 80px 28px; min-height: 80vh; min-height: 80dvh;
    }
    .submitted-overlay.show { display: flex; }
    .submitted-icon {
      width: 84px; height: 84px; background: var(--success-lt); border-radius: 50%;
      display: flex; align-items: center; justify-content: center; margin-bottom: 22px;
    }
    .submitted-overlay h2 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    .submitted-overlay p  { font-size: 15px; color: var(--muted); margin-bottom: 28px; max-width: 320px; line-height: 1.5; }
    .btn-new {
      height: 52px; padding: 0 30px;
      background: var(--accent); color: #fff;
      border: none; border-radius: 12px;
      font-size: 16px; font-weight: 700; cursor: pointer;
    }

    @media (max-width: 380px) {
      .count-btn { width: 46px; }
      .btn-submit { padding: 0 20px; }
      .count-sub { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation-duration: 1.5s !important; } }
  </style>
</head>
<body>

<div class="page-header">
  <div class="header-row">
    <div class="header-logo">
      <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3.3 7.5L12 12l8.7-4.5M12 22V12"/>
      </svg>
    </div>
    <div class="header-text">
      <h1>Stock Take</h1>
      <p>Energise Inventory</p>
    </div>
  </div>
</div>

<div class="container" id="mainContent">

  <div class="name-card">
    <label class="field-label" for="staffName">Your Full Name</label>
    <input class="text-input" type="text" id="staffName" placeholder="e.g. Barry Dixon" autocomplete="name" autocapitalize="words" enterkeyhint="done" />
  </div>

  <div class="name-prompt-note" id="namePrompt">Please enter your name before submitting.</div>

  <div class="search-wrap" id="searchWrap" style="display:none">
    <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input class="text-input" type="search" id="searchBox" placeholder="Search items or SKU" autocomplete="off" autocapitalize="off" enterkeyhint="search" />
  </div>

  <div class="loading-state" id="loadingState">
    <div class="spinner"></div>
    <p>Loading inventory items...</p>
  </div>

  <div id="itemsContainer"></div>
</div>

<div class="submitted-overlay" id="submittedOverlay">
  <div class="submitted-icon">
    <svg width="40" height="40" fill="none" viewBox="0 0 24 24" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
  </div>
  <h2>Stock Take Submitted</h2>
  <p>Thank you. Your stock take has been recorded successfully.</p>
  <button class="btn-new" onclick="resetForm()">Start New Stock Take</button>
</div>

<div class="summary-bar" id="summaryBar">
  <div class="summary-inner">
    <div class="summary-info">
      <div class="count-text" id="countedText">0 items counted</div>
      <div class="count-sub">Enter quantities, then tap Submit</div>
      <div class="progress"><i id="progressBar"></i></div>
    </div>
    <button class="btn-submit" id="btnSubmit" onclick="submitStocktake()">Submit</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp }            from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
  import { getFirestore, collection, getDocs, addDoc, serverTimestamp }
    from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

  const firebaseConfig = {
    apiKey:            'AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g',
    authDomain:        'oesperformance-a54c0.firebaseapp.com',
    projectId:         'oesperformance-a54c0',
    storageBucket:     'oesperformance-a54c0.firebasestorage.app',
    messagingSenderId: '123456789',
    appId:             '1:123456789:web:abc123'
  };

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);

  const MIN_PRICE = 5.00;

  let items = [];

  const $ = id => document.getElementById(id);
  const skuOf = item => item.sku || item.id;

  function packQty(uom) {
    if (!uom) return 1;
    const m = String(uom).match(/(\d+)/);
    return m ? Math.max(1, parseInt(m[1])) : 1;
  }
  function unitPrice(item) {
    const raw = parseFloat(item.price);
    if (isNaN(raw)) return 0;
    return raw / packQty(item.uom);
  }

  // ── Load inventory ──
  async function loadInventory() {
    try {
      const snap = await getDocs(collection(db, 'Energise Inventory'));
      const all = [];
      snap.forEach(d => {
        const item = { id: d.id, ...d.data() };
        const perUnit = unitPrice(item);
        if (perUnit > MIN_PRICE) { item._unitPrice = perUnit; all.push(item); }
      });
      items = all;
      $('loadingState').style.display = 'none';
      $('searchWrap').style.display = items.length ? 'block' : 'none';
      renderItems();
    } catch (e) {
      $('loadingState').innerHTML =
        '<p style="color:var(--danger);font-weight:600;">Failed to load inventory. Please refresh.</p>';
      console.error(e);
    }
  }

  // ── Render ──
  function renderItems() {
    const container = $('itemsContainer');
    container.innerHTML = '';

    if (items.length === 0) {
      container.innerHTML = '<p class="empty">No items found.</p>';
      return;
    }

    const sorted    = [...items].sort((a, b) => b._unitPrice - a._unitPrice);
    const top10     = sorted.slice(0, 10);
    const top10SKUs = new Set(top10.map(skuOf));
    const remaining = items
      .filter(i => !top10SKUs.has(skuOf(i)))
      .sort((a, b) => (a.name || '').localeCompare(b.name || ''));

    const topLabel = document.createElement('div');
    topLabel.className = 'section-label';
    topLabel.id = 'label-top';
    topLabel.textContent = 'Top 10 — highest value';
    container.appendChild(topLabel);
    top10.forEach(item => container.appendChild(buildCard(item)));

    if (remaining.length > 0) {
      const remLabel = document.createElement('div');
      remLabel.className = 'section-label';
      remLabel.id = 'label-rest';
      remLabel.textContent = `All other items · ${remaining.length} (A–Z)`;
      container.appendChild(remLabel);
      remaining.forEach(item => container.appendChild(buildCard(item)));
    }

    const none = document.createElement('p');
    none.className = 'empty'; none.id = 'noMatch'; none.style.display = 'none';
    none.textContent = 'No items match your search.';
    container.appendChild(none);
  }

  function buildCard(item) {
    const sku = skuOf(item);
    const card = document.createElement('div');
    card.className = 'item-card';
    card.dataset.sku = sku;
    card.dataset.search = `${item.name || ''} ${sku}`.toLowerCase();

    card.innerHTML = `
      <div class="item-top">
        <div class="item-info">
          <div class="item-name">${escHtml(item.name || sku)}</div>
          <div class="item-sku">${escHtml(sku)}</div>
        </div>
        <div class="tick">
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
      </div>
      <div class="item-inputs">
        <div class="count-wrap">
          <button class="count-btn" data-act="dec" aria-label="Decrease quantity" type="button">−</button>
          <input class="count-input" type="number" value="" min="0" placeholder="0"
                 inputmode="numeric" pattern="[0-9]*" aria-label="Quantity" />
          <button class="count-btn" data-act="inc" aria-label="Increase quantity" type="button">+</button>
        </div>
      </div>
    `;
    return card;
  }

  // ── Event delegation (no inline handlers, safe for any SKU text) ──
  const container = $('itemsContainer');

  container.addEventListener('click', e => {
    const btn = e.target.closest('.count-btn');
    if (!btn) return;
    const card  = btn.closest('.item-card');
    const input = card.querySelector('.count-input');
    const cur   = parseInt(input.value) || 0;
    const next  = Math.max(0, cur + (btn.dataset.act === 'inc' ? 1 : -1));
    input.value = next === 0 ? '' : next;
    refreshCard(card);
    if (navigator.vibrate) navigator.vibrate(8);
  });

  container.addEventListener('input', e => {
    if (e.target.classList.contains('count-input')) refreshCard(e.target.closest('.item-card'));
  });

  function refreshCard(card) {
    const val = parseInt(card.querySelector('.count-input').value);
    card.classList.toggle('has-count', !isNaN(val) && val >= 0 && card.querySelector('.count-input').value !== '');
    updateSummary();
  }

  function updateSummary() {
    let counted = 0;
    container.querySelectorAll('.count-input').forEach(inp => {
      if (inp.value !== '' && !isNaN(parseInt(inp.value))) counted++;
    });
    $('countedText').textContent = `${counted} of ${items.length} item${items.length !== 1 ? 's' : ''} counted`;
    $('progressBar').style.width = items.length ? `${Math.round(counted / items.length * 100)}%` : '0';
    $('btnSubmit').disabled = counted === 0;
  }

  // ── Search ──
  $('searchBox').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    let shown = 0, shownTop = 0, shownRest = 0;
    const topSet = new Set([...container.querySelectorAll('.item-card')].slice(0, 10));
    container.querySelectorAll('.item-card').forEach(card => {
      const match = !q || card.dataset.search.includes(q);
      card.classList.toggle('hidden', !match);
      if (match) { shown++; topSet.has(card) ? shownTop++ : shownRest++; }
    });
    $('label-top')?.classList.toggle('hidden', shownTop === 0);
    $('label-rest')?.classList.toggle('hidden', shownRest === 0);
    const nm = $('noMatch'); if (nm) nm.style.display = shown === 0 ? 'block' : 'none';
  });

  // ── Submit ──
  window.submitStocktake = async function() {
    const nameEl = $('staffName');
    const staffName = nameEl.value.trim();
    if (!staffName) {
      $('namePrompt').classList.add('show');
      nameEl.classList.add('invalid');
      window.scrollTo({ top: 0, behavior: 'smooth' });
      setTimeout(() => nameEl.focus(), 350);
      return;
    }
    $('namePrompt').classList.remove('show');
    nameEl.classList.remove('invalid');

    const btn = $('btnSubmit');
    btn.disabled = true;
    btn.textContent = 'Submitting...';

    const lines = [];
    for (const item of items) {
      const sku   = skuOf(item);
      const card  = container.querySelector(`.item-card[data-sku="${CSS.escape(sku)}"]`);
      const input = card && card.querySelector('.count-input');
      if (!input || input.value === '') continue;
      const qty = parseInt(input.value);
      if (isNaN(qty) || qty < 0) continue;

      lines.push({
        sku,
        name:     item.name || sku,
        category: item.category || '',
        price:    parseFloat(item.price),
        uom:      item.uom || '',
        qty
      });
    }

    if (lines.length === 0) {
      showToast('No quantities entered.', 'error');
      btn.disabled = false; btn.textContent = 'Submit';
      return;
    }

    try {
      await addDoc(collection(db, 'Energise Stock Take'), {
        staffName,
        submittedAt: serverTimestamp(),
        submittedAtISO: new Date().toISOString(),
        items: lines
      });
      $('mainContent').style.display = 'none';
      $('summaryBar').style.display = 'none';
      $('submittedOverlay').classList.add('show');
      window.scrollTo({ top: 0 });
    } catch (err) {
      console.error(err);
      showToast('Submission failed. Please try again.', 'error');
      btn.disabled = false; btn.textContent = 'Submit';
    }
  };

  $('staffName').addEventListener('input', e => {
    if (e.target.value.trim()) { e.target.classList.remove('invalid'); $('namePrompt').classList.remove('show'); }
  });

  // ── Reset ──
  window.resetForm = function() {
    $('staffName').value = '';
    $('searchBox').value = '';
    $('submittedOverlay').classList.remove('show');
    $('mainContent').style.display = 'block';
    $('summaryBar').style.display = 'block';
    $('btnSubmit').textContent = 'Submit';
    renderItems();
    updateSummary();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  // ── Helpers ──
  function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  let toastTimer;
  function showToast(msg, type = '') {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast' + (type ? ' ' + type : '');
    void t.offsetWidth;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
  }

  // ── Boot ──
  $('btnSubmit').disabled = true;
  loadInventory();
</script>
</body>
</html>
