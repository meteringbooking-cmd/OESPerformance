<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Completion % Dashboard • OES</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --accent: #10b981; --text: #e2e8f0; --text-dim: #94a3b8; --border: #334155; --error: #f87171; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: grid; grid-template-columns: 280px 1fr; }
    aside { background: var(--card); border-right: 1px solid var(--border); padding: 2rem 1.5rem; height: 100vh; position: sticky; top: 0; overflow-y: auto; }
    .logo { font-size: 1.6rem; font-weight: 700; background: linear-gradient(90deg, var(--accent), #34d399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 2.5rem; text-align: center; }
    h2 { font-size: 1.1rem; color: var(--text-dim); margin: 1.8rem 0 0.9rem; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
    .period-btn, .team-btn { display: block; width: 100%; padding: 0.95rem 1.2rem; margin: 0.4rem 0; background: transparent; border: 1px solid var(--border); border-radius: 10px; color: var(--text); text-align: left; cursor: pointer; transition: all 0.18s ease; font-size: 0.97rem; font-family: inherit; }
    .period-btn:hover, .team-btn:hover { background: rgba(16,185,129,0.08); border-color: var(--accent); }
    .period-btn.active { background: var(--accent); color: white; border-color: var(--accent); box-shadow: 0 3px 12px rgba(16,185,129,0.3); }
    .team-btn.active { background: rgba(16,185,129,0.25); color: white; font-weight: 600; border-color: var(--accent); }

    /* Month picker */
    .month-picker { display: none; margin-top: 0.5rem; }
    .month-picker.visible { display: block; }
    .month-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.35rem; margin-top: 0.5rem; }
    .month-cell { padding: 0.5rem 0.3rem; background: transparent; border: 1px solid var(--border); border-radius: 8px; color: var(--text-dim); font-size: 0.8rem; font-family: inherit; cursor: pointer; text-align: center; transition: all 0.15s; }
    .month-cell:hover { background: rgba(16,185,129,0.1); border-color: var(--accent); color: var(--text); }
    .month-cell.active { background: rgba(16,185,129,0.25); border-color: var(--accent); color: white; font-weight: 600; }
    .month-cell.disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }
    .year-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.4rem; }
    .year-nav span { font-size: 0.88rem; color: var(--text); font-weight: 600; }
    .year-btn { background: transparent; border: 1px solid var(--border); border-radius: 6px; color: var(--text-dim); cursor: pointer; padding: 0.25rem 0.6rem; font-size: 0.8rem; transition: all 0.15s; font-family: inherit; }
    .year-btn:hover { border-color: var(--accent); color: var(--text); }

    main { padding: 2.5rem 3rem; max-width: 1600px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    h1 { font-size: 2.1rem; font-weight: 700; background: linear-gradient(90deg, #e2e8f0, #d1d5db); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .stats-box { background: linear-gradient(135deg, rgba(16,185,129,0.15), rgba(52,211,153,0.1)); border: 1px solid var(--accent); border-radius: 12px; padding: 1.25rem 1.75rem; box-shadow: 0 4px 15px rgba(16,185,129,0.2); min-width: 180px; }
    .stats-label { font-size: 0.85rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.5rem; font-weight: 600; }
    .stats-value { font-size: 2.5rem; font-weight: 700; background: linear-gradient(90deg, var(--accent), #34d399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; }
    .card { background: var(--card); border-radius: 16px; border: 1px solid var(--border); padding: 1.8rem 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.35); }
    #chartContainer { height: 580px; position: relative; margin-top: 1.5rem; }
    .loading, .error-msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--text-dim); font-size: 1.2rem; background: rgba(15,23,42,0.6); border-radius: 12px; text-align: center; padding: 2rem; z-index: 10; }
    .error-msg { color: var(--error) !important; font-weight: 500; }
    @media (max-width: 1100px) { body { grid-template-columns: 1fr; } aside { height: auto; position: relative; border-right: none; border-bottom: 1px solid var(--border); } main { padding: 2rem 1.5rem; } header { flex-direction: column; gap: 1.5rem; align-items: flex-start; } }
  </style>
</head>
<body>

<aside>
  <div class="logo">OES Completion</div>
  <h2>Time Period</h2>
  <button class="period-btn active" data-period="7days">Last 7 days (bar)</button>
  <button class="period-btn" data-period="4weeks">4 week rolling (bar)</button>
  <button class="period-btn" data-period="6months">6 months (by month)</button>
  <button class="period-btn" data-period="year">Year to date (line)</button>
  <button class="period-btn" data-period="specificMonth">Specific Month…</button>

  <div class="month-picker" id="monthPicker">
    <div class="year-nav">
      <button class="year-btn" id="yearPrev">‹</button>
      <span id="yearLabel">2025</span>
      <button class="year-btn" id="yearNext">›</button>
    </div>
    <div class="month-grid" id="monthGrid"></div>
  </div>

  <h2>Team Leader</h2>
  <button class="team-btn active" data-team="all">All Teams</button>
  <button class="team-btn" data-team="Richard Wiecko">Richard Wiecko</button>
  <button class="team-btn" data-team="Scott Carson">Scott Carson</button>
  <button class="team-btn" data-team="Scott Carson - Scot">Scott Carson - Scot</button>
  <button class="team-btn" data-team="Stuart Whyte">Stuart Whyte</button>
  <button class="team-btn" data-team="Tom Green">Tom Green</button>
</aside>

<main>
  <header>
    <h1>Completion %</h1>
    <div class="stats-box">
      <div class="stats-label">Average</div>
      <div class="stats-value" id="avgValue">—</div>
    </div>
  </header>
  <div class="card">
    <div id="chartContainer">
      <div class="loading">Loading performance data…</div>
    </div>
  </div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
    authDomain: "oesperformance-a54c0.firebaseapp.com",
    projectId: "oesperformance-a54c0",
    storageBucket: "oesperformance-a54c0.firebasestorage.app",
    messagingSenderId: "484894102454",
    appId: "1:484894102454:web:17535ee497eac2d90d6717",
    measurementId: "G-R56BGZYV8N"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const normTL = tl => /^ftl\s*4$/i.test((tl||'').trim()) ? 'Tom Green' : (tl||'');

  const ctx = document.createElement('canvas');
  document.querySelector('#chartContainer').appendChild(ctx);
  let chart = null;

  const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  const periods = {
    "7days":   { label: "Last 7 days",    daysBack: 7,   color: "#10b981", type: "bar",  groupBy: "day"   },
    "4weeks":  { label: "4 week rolling", daysBack: 28,  color: "#34d399", type: "bar",  groupBy: "day"   },
    "6months": { label: "Last 6 months",  daysBack: 180, color: "#6ee7b7", type: "bar",  groupBy: "month" },
    "year":    { label: "Year to date",   daysBack: 365, color: "#a7f3d0", type: "line", groupBy: "day"   },
  };

  let currentPeriod = "7days";
  let currentTeam   = "all";

  const today = new Date();
  let pickerYear  = today.getFullYear();
  let pickerMonth = null; 

  // HELPER: Convert date object to YYYY-MM-DD reliably using local time
  const toLocalISODate = (dateObj) => {
    const y = dateObj.getFullYear();
    const m = String(dateObj.getMonth() + 1).padStart(2, '0');
    const d = String(dateObj.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  };

  function renderMonthGrid() {
    const grid = document.getElementById('monthGrid');
    grid.innerHTML = MONTH_NAMES.map((name, i) => {
      const isFuture = pickerYear > today.getFullYear() ||
                       (pickerYear === today.getFullYear() && i > today.getMonth());
      const isActive = pickerYear === (pickerMonth !== null ? pickerYear : -1) &&
                       i === pickerMonth && currentPeriod === 'specificMonth';
      return `<button class="month-cell${isActive ? ' active' : ''}${isFuture ? ' disabled' : ''}"
                data-month="${i}">${name}</button>`;
    }).join('');

    grid.querySelectorAll('.month-cell:not(.disabled)').forEach(btn => {
      btn.addEventListener('click', () => {
        pickerMonth = parseInt(btn.dataset.month);
        renderMonthGrid();
        updateChart();
      });
    });
  }

  document.getElementById('yearLabel').textContent = pickerYear;

  document.getElementById('yearPrev').addEventListener('click', () => {
    if (pickerYear > today.getFullYear() - 5) {
      pickerYear--;
      document.getElementById('yearLabel').textContent = pickerYear;
      renderMonthGrid();
    }
  });

  document.getElementById('yearNext').addEventListener('click', () => {
    if (pickerYear < today.getFullYear()) {
      pickerYear++;
      document.getElementById('yearLabel').textContent = pickerYear;
      renderMonthGrid();
    }
  });

  renderMonthGrid();

  async function fetchAndAggregateCompletion(periodKey, team) {
    let startDate, endDate, chartType, color, titleLabel, groupBy;

    if (periodKey === 'specificMonth' && pickerMonth !== null) {
      const firstDay = new Date(pickerYear, pickerMonth, 1);
      const lastDay  = new Date(pickerYear, pickerMonth + 1, 0);
      startDate  = toLocalISODate(firstDay);
      endDate    = toLocalISODate(lastDay);
      chartType  = 'bar';
      color      = '#10b981';
      groupBy    = 'day';
      titleLabel = `${MONTH_NAMES[pickerMonth]} ${pickerYear} – Daily Completion %`;
    } else {
      const cfg   = periods[periodKey];
      const now   = new Date();
      const start = new Date(now);
      start.setDate(start.getDate() - cfg.daysBack);
      startDate  = toLocalISODate(start);
      endDate    = toLocalISODate(now);
      chartType  = cfg.type;
      color      = cfg.color;
      groupBy    = cfg.groupBy;
      titleLabel = cfg.groupBy === 'month'
        ? `${cfg.label} – Monthly Average Completion %`
        : `${cfg.label} – Completion %`;
    }

    const q = query(
      collection(db, "performance"),
      where("date", ">=", startDate),
      where("date", "<=", endDate),
      orderBy("date", "asc")
    );
    const snapshot = await getDocs(q);
    let records = [];
    snapshot.forEach(doc => {
      const d = doc.data();
      const recTL = normTL(d.teamLeader);
      if (team === "all" || recTL === team) records.push(d);
    });

    if (groupBy === "month") {
      const now = new Date();
      const monthsMap = {};
      const monthLabels = [];
      for (let i = 5; i >= 0; i--) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        const label = d.toLocaleDateString('en-GB', { month: 'short', year: 'numeric' });
        monthsMap[key] = { completed: 0, jobs: 0, label };
        monthLabels.push(key);
      }
      records.forEach(r => {
        const k = r.date.substring(0, 7);
        if (monthsMap[k]) { monthsMap[k].completed += Number(r.completed || 0); monthsMap[k].jobs += Number(r.jobs || 0); }
      });
      return {
        labels: monthLabels.map(k => monthsMap[k].label),
        values: monthLabels.map(k => { const { completed, jobs } = monthsMap[k]; return jobs > 0 ? Number(((completed / jobs) * 100).toFixed(1)) : 0; }),
        chartType, color, titleLabel
      };
    }

    const allDates = [];
    const cur = new Date(startDate + 'T00:00:00');
    const end = new Date(endDate + 'T00:00:00');
    while (cur <= end) {
      const day = cur.getDay();
      if (periodKey === 'specificMonth' || (day !== 0 && day !== 6)) {
        // FIXED: Using local time formatting to avoid the previous day timezone shift
        allDates.push(toLocalISODate(cur)); 
      }
      cur.setDate(cur.getDate() + 1);
    }

    const dateMap = {};
    allDates.forEach(date => dateMap[date] = { completed: 0, jobs: 0 });
    records.forEach(r => {
      if (dateMap[r.date]) {
        dateMap[r.date].completed += Number(r.completed || 0);
        dateMap[r.date].jobs += Number(r.jobs || 0);
      }
    });

    const values = allDates.map(date => {
      const { completed, jobs } = dateMap[date];
      return jobs > 0 ? Number(((completed / jobs) * 100).toFixed(1)) : 0;
    });
    const labels = allDates.map(dateStr => {
      // ADDED 'T00:00:00' to guarantee we read back the date in local timezone
      const dateObj = new Date(dateStr + 'T00:00:00');
      const ddmm    = `${String(dateObj.getDate()).padStart(2,'0')}/${String(dateObj.getMonth()+1).padStart(2,'0')}`;
      const weekday = dateObj.toLocaleDateString('en-GB', { weekday: 'short' });
      return chartType === 'bar' ? [ddmm, weekday] : ddmm;
    });

    return { labels, values, chartType, color, titleLabel };
  }

  function updateAverageDisplay(values) {
    const avgElement = document.getElementById('avgValue');
    const validValues = values.filter(v => v > 0);
    if (validValues.length === 0) { avgElement.textContent = '—'; return; }
    avgElement.textContent = `${(validValues.reduce((s, v) => s + v, 0) / validValues.length).toFixed(1)}%`;
  }

  async function updateChart() {
    if (currentPeriod === 'specificMonth' && pickerMonth === null) return;

    const container = document.querySelector('#chartContainer');
    container.innerHTML = '<div class="loading">Loading completion data…</div>';
    document.getElementById('avgValue').textContent = '—';

    try {
      const data = await fetchAndAggregateCompletion(currentPeriod, currentTeam);
      updateAverageDisplay(data.values);
      container.innerHTML = '';
      container.appendChild(ctx);
      if (chart) chart.destroy();

      chart = new Chart(ctx, {
        type: data.chartType,
        data: {
          labels: data.labels,
          datasets: [{
            label: `Completion % (${currentTeam === 'all' ? 'All Teams' : currentTeam})`,
            data: data.values,
            backgroundColor: data.chartType === 'bar' ? 'rgba(16,185,129,0.75)' : 'rgba(16,185,129,0.18)',
            borderColor: data.color,
            borderWidth: data.chartType === 'bar' ? 1 : 3,
            borderRadius: data.chartType === 'bar' ? 6 : 0,
            tension: data.chartType === 'line' ? 0.35 : 0,
            fill: data.chartType === 'line',
            pointRadius: data.chartType === 'bar' ? 0 : 3,
            pointHoverRadius: 7,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            title: { display: true, text: data.titleLabel, color: '#e2e8f0', font: { size: 18, weight: '600' }, padding: { bottom: 20 } },
            legend: { labels: { color: '#cbd5e1', font: { size: 14 } } },
            datalabels: data.chartType === 'bar' ? {
              anchor: 'end', align: 'top', offset: 4, color: '#e2e8f0',
              font: { weight: 'bold', size: 12 },
              formatter: (value) => value > 0 ? `${value.toFixed(1)}%` : '',
              textShadowColor: 'rgba(0,0,0,0.8)', textShadowBlur: 4
            } : false
          },
          scales: {
            x: { ticks: { color: '#94a3b8', font: { size: 11 }, padding: 8 }, grid: { color: '#334155' } },
            y: { beginAtZero: true, max: 100, ticks: { color: '#94a3b8', stepSize: 10, callback: value => `${value}%` }, grid: { color: '#334155' } }
          }
        },
        plugins: [ChartDataLabels]
      });
    } catch (err) {
      console.error("Error:", err);
      document.querySelector('#chartContainer').innerHTML = `<div class="error-msg">${err.message || "Unknown error"}<br><br><small>Press F12 → Console for details</small></div>`;
    }
  }

  document.querySelectorAll('.period-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentPeriod = btn.dataset.period;

      const picker = document.getElementById('monthPicker');
      if (currentPeriod === 'specificMonth') {
        picker.classList.add('visible');
        if (pickerMonth === null) {
          pickerYear  = today.getFullYear();
          pickerMonth = today.getMonth();
          document.getElementById('yearLabel').textContent = pickerYear;
          renderMonthGrid();
        }
      } else {
        picker.classList.remove('visible');
      }

      updateChart();
    });
  });

  document.querySelectorAll('.team-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.team-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTeam = btn.dataset.team;
      updateChart();
    });
  });

  updateChart();
</script>

</body>
</html>
