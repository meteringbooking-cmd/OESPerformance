<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Completion % Dashboard • OES</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #10b981;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
      --border: #334155;
      --error: #f87171;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      grid-template-columns: 280px 1fr;
    }
    aside {
      background: var(--card);
      border-right: 1px solid var(--border);
      padding: 2rem 1.5rem;
      height: 100vh;
      position: sticky;
      top: 0;
      overflow-y: auto;
    }
    .logo {
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(90deg, var(--accent), #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 2.5rem;
      text-align: center;
    }
    h2 {
      font-size: 1.1rem;
      color: var(--text-dim);
      margin: 1.8rem 0 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }
    .period-btn, .team-btn {
      display: block;
      width: 100%;
      padding: 0.95rem 1.2rem;
      margin: 0.4rem 0;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: all 0.18s ease;
      font-size: 0.97rem;
    }
    .period-btn:hover, .team-btn:hover {
      background: rgba(16,185,129,0.08);
      border-color: var(--accent);
    }
    .period-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
      box-shadow: 0 3px 12px rgba(16,185,129,0.3);
    }
    .team-btn.active {
      background: rgba(16,185,129,0.25);
      color: white;
      font-weight: 600;
      border-color: var(--accent);
    }
    main {
      padding: 2.5rem 3rem;
      max-width: 1600px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    h1 {
      font-size: 2.1rem;
      font-weight: 700;
      background: linear-gradient(90deg, #e2e8f0, #d1d5db);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .stats-box {
      background: linear-gradient(135deg, rgba(16,185,129,0.15), rgba(52,211,153,0.1));
      border: 1px solid var(--accent);
      border-radius: 12px;
      padding: 1.25rem 1.75rem;
      box-shadow: 0 4px 15px rgba(16,185,129,0.2);
      min-width: 180px;
    }
    .stats-label {
      font-size: 0.85rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }
    .stats-value {
      font-size: 2.5rem;
      font-weight: 700;
      background: linear-gradient(90deg, var(--accent), #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 1.8rem 2rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    #chartContainer {
      height: 580px;
      position: relative;
      margin-top: 1.5rem;
    }
    .loading, .error-msg {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-size: 1.2rem;
      background: rgba(15,23,42,0.6);
      border-radius: 12px;
      text-align: center;
      padding: 2rem;
      z-index: 10;
    }
    .error-msg {
      color: var(--error) !important;
      font-weight: 500;
    }
    @media (max-width: 1100px) {
      body { grid-template-columns: 1fr; }
      aside { height: auto; position: relative; border-right: none; border-bottom: 1px solid var(--border); }
      main { padding: 2rem 1.5rem; }
      header { flex-direction: column; gap: 1.5rem; align-items: flex-start; }
    }
  </style>
</head>
<body>

<aside>
  <div class="logo">OES Completion</div>

  <h2>Time Period</h2>
  <button class="period-btn active" data-period="7days">Last 7 days (bar)</button>
  <button class="period-btn" data-period="4weeks">4 week rolling (bar)</button>
  <button class="period-btn" data-period="6months">6 months (by month)</button>
  <button class="period-btn" data-period="year">Year to date (line)</button>

  <h2>Team Leader</h2>
  <button class="team-btn active" data-team="all">All Teams</button>
  <button class="team-btn" data-team="Richard Wiecko2">Richard Wiecko2</button>
  <button class="team-btn" data-team="Richard Wiecko">Richard Wiecko</button>
  <button class="team-btn" data-team="Scott Carson">Scott Carson</button>
  <button class="team-btn" data-team="Stuart Whyte">Stuart Whyte</button>
  <button class="team-btn" data-team="FTL 4">FTL 4</button>
</aside>

<main>
  <header>
    <h1>Completion %</h1>
    <div class="stats-box">
      <div class="stats-label">Average</div>
      <div class="stats-value" id="avgValue">—</div>
    </div>
  </header>

  <div class="card">
    <div id="chartContainer">
      <div class="loading">Loading performance data…</div>
    </div>
  </div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
    authDomain: "oesperformance-a54c0.firebaseapp.com",
    projectId: "oesperformance-a54c0",
    storageBucket: "oesperformance-a54c0.firebasestorage.app",
    messagingSenderId: "484894102454",
    appId: "1:484894102454:web:17535ee497eac2d90d6717",
    measurementId: "G-R56BGZYV8N"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const ctx = document.createElement('canvas');
  document.querySelector('#chartContainer').appendChild(ctx);
  let chart = null;

  const periods = {
    "7days":   { label: "Last 7 days",    daysBack: 7,   color: "#10b981", type: "bar",  groupBy: "day"   },
    "4weeks":  { label: "4 week rolling", daysBack: 28,  color: "#34d399", type: "bar",  groupBy: "day"   },
    "6months": { label: "Last 6 months",  daysBack: 180, color: "#6ee7b7", type: "bar",  groupBy: "month" },
    "year":    { label: "Year to date",   daysBack: 365, color: "#a7f3d0", type: "line", groupBy: "day"   },
  };

  let currentPeriod = "7days";
  let currentTeam   = "all";

  async function fetchAndAggregateCompletion(periodKey, team) {
    const cfg = periods[periodKey];
    const today = new Date();
    const start = new Date(today);
    start.setDate(start.getDate() - cfg.daysBack);

    const startDate = start.toISOString().split('T')[0];
    const endDate   = today.toISOString().split('T')[0];

    const q = query(
      collection(db, "performance"),
      where("date", ">=", startDate),
      where("date", "<=", endDate),
      orderBy("date", "asc")
    );

    const snapshot = await getDocs(q);
    let records = [];

    snapshot.forEach(doc => {
      const d = doc.data();
      if (team === "all" || d.teamLeader === team) {
        records.push(d);
      }
    });

    // --- Monthly grouping for 6-month view ---
    if (cfg.groupBy === "month") {
      // Build list of months in range (e.g. last 6 calendar months)
      const monthsMap = {};
      const monthLabels = [];

      // Walk back 6 months from current month
      for (let i = 5; i >= 0; i--) {
        const d = new Date(today.getFullYear(), today.getMonth() - i, 1);
        const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        const label = d.toLocaleDateString('en-GB', { month: 'short', year: 'numeric' });
        monthsMap[key] = { completed: 0, jobs: 0, label };
        monthLabels.push(key);
      }

      records.forEach(r => {
        const monthKey = r.date.substring(0, 7); // "YYYY-MM"
        if (monthsMap[monthKey]) {
          monthsMap[monthKey].completed += Number(r.completed || 0);
          monthsMap[monthKey].jobs      += Number(r.jobs || 0);
        }
      });

      const labels = monthLabels.map(k => monthsMap[k].label);
      const values = monthLabels.map(k => {
        const { completed, jobs } = monthsMap[k];
        return jobs > 0 ? Number(((completed / jobs) * 100).toFixed(1)) : 0;
      });

      return { labels, values };
    }

    // --- Daily grouping (existing logic) ---
    const allWeekdayDates = [];
    const current = new Date(start);
    while (current <= today) {
      const dayOfWeek = current.getDay();
      if (dayOfWeek !== 0 && dayOfWeek !== 6) {
        allWeekdayDates.push(current.toISOString().split('T')[0]);
      }
      current.setDate(current.getDate() + 1);
    }

    const dateMap = {};
    allWeekdayDates.forEach(date => dateMap[date] = { completed: 0, jobs: 0 });

    records.forEach(r => {
      if (dateMap[r.date]) {
        dateMap[r.date].completed += Number(r.completed || 0);
        dateMap[r.date].jobs      += Number(r.jobs || 0);
      }
    });

    const values = allWeekdayDates.map(date => {
      const { completed, jobs } = dateMap[date];
      return jobs > 0 ? Number(((completed / jobs) * 100).toFixed(1)) : 0;
    });

    const labels = allWeekdayDates.map(dateStr => {
      const dateObj = new Date(dateStr);
      const day   = String(dateObj.getDate()).padStart(2, '0');
      const month = String(dateObj.getMonth() + 1).padStart(2, '0');
      const ddmm  = `${day}/${month}`;
      const weekday = dateObj.toLocaleDateString('en-GB', { weekday: 'short' });

      if (cfg.type === 'bar') {
        return [ddmm, weekday];
      }
      return ddmm;
    });

    return { labels, values };
  }

  function updateAverageDisplay(values) {
    const avgElement = document.getElementById('avgValue');
    const validValues = values.filter(v => v > 0);
    
    if (validValues.length === 0) {
      avgElement.textContent = '—';
      return;
    }
    
    const average = validValues.reduce((sum, val) => sum + val, 0) / validValues.length;
    avgElement.textContent = `${average.toFixed(1)}%`;
  }

  async function updateChart() {
    const container = document.querySelector('#chartContainer');
    container.innerHTML = '<div class="loading">Loading completion data…</div>';
    document.getElementById('avgValue').textContent = '—';

    try {
      const data = await fetchAndAggregateCompletion(currentPeriod, currentTeam);
      const cfg = periods[currentPeriod];

      updateAverageDisplay(data.values);

      container.innerHTML = '';
      container.appendChild(ctx);

      if (chart) chart.destroy();

      chart = new Chart(ctx, {
        type: cfg.type,
        data: {
          labels: data.labels,
          datasets: [{
            label: `Completion % (${currentTeam === 'all' ? 'All Teams' : currentTeam})`,
            data: data.values,
            backgroundColor: cfg.type === 'bar' 
              ? 'rgba(16,185,129,0.75)' 
              : 'rgba(16,185,129,0.18)',
            borderColor: cfg.color,
            borderWidth: cfg.type === 'bar' ? 1 : 3,
            borderRadius: cfg.type === 'bar' ? 6 : 0,
            tension: cfg.type === 'line' ? 0.35 : 0,
            fill: cfg.type === 'line',
            pointRadius: cfg.type === 'bar' ? 0 : 3,
            pointHoverRadius: 7,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            title: {
              display: true,
              text: cfg.groupBy === 'month'
                ? `${cfg.label} – Monthly Average Completion %`
                : `${cfg.label} – Completion %`,
              color: '#e2e8f0',
              font: { size: 18, weight: '600' },
              padding: { bottom: 20 }
            },
            legend: { labels: { color: '#cbd5e1', font: { size: 14 } } },
            datalabels: cfg.type === 'bar' ? {
              anchor: 'end',
              align: 'top',
              offset: 4,
              color: '#e2e8f0',
              font: { weight: 'bold', size: 12 },
              formatter: (value) => value > 0 ? `${value.toFixed(1)}%` : '',
              textShadowColor: 'rgba(0,0,0,0.8)',
              textShadowBlur: 4
            } : false
          },
          scales: {
            x: {
              ticks: {
                color: '#94a3b8',
                font: { size: cfg.groupBy === 'month' ? 13 : (cfg.type === 'bar' ? 11 : 12) },
                padding: 8,
                callback: function(value) {
                  return this.getLabelForValue(value);
                }
              },
              grid: { color: '#334155' }
            },
            y: {
              beginAtZero: true,
              max: 100,
              ticks: {
                color: '#94a3b8',
                stepSize: 10,
                callback: value => `${value}%`
              },
              grid: { color: '#334155' }
            }
          }
        },
        plugins: [ChartDataLabels]
      });
    } catch (err) {
      console.error("Error:", err);
      let msg = err.message || "Unknown error";
      container.innerHTML = `
        <div class="error-msg">
          ${msg}<br><br>
          <small>Press F12 → Console for details</small>
        </div>`;
    }
  }

  document.querySelectorAll('.period-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentPeriod = btn.dataset.period;
      updateChart();
    });
  });

  document.querySelectorAll('.team-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.team-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTeam = btn.dataset.team;
      updateChart();
    });
  });

  updateChart();
</script>

</body>
</html>
