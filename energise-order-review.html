<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Energise — Order Submissions</title>
<meta name="description" content="Review and manage all Energise stock order submissions">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #222222;
    --surface3: #2a2a2a;
    --border: #2e2e2e;
    --accent: #e8ff47;
    --accent2: #47c8ff;
    --text: #f0f0f0;
    --text-muted: #888;
    --green: #4ade80;
    --red: #f87171;
    --amber: #f59e0b;
    --radius: 6px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    min-height: 100vh;
  }

  /* ── HEADER ───────────────────────────────────────────── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    gap: 20px;
  }

  .header-left { display: flex; align-items: center; gap: 16px; }

  .logo {
    font-family: 'Syne', sans-serif;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
    white-space: nowrap;
  }
  .logo span { color: var(--accent); }

  .page-tag {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .refresh-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 16px;
    border-radius: var(--radius);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: border-color 0.15s, color 0.15s;
  }
  .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }
  .refresh-btn svg { transition: transform 0.5s; }
  .refresh-btn.loading svg { animation: spin 0.8s linear infinite; }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── SUMMARY CARDS ────────────────────────────────────── */
  .summary-bar {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    padding: 24px 32px 0;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .stat-label {
    font-family: 'Syne', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .stat-value {
    font-family: 'DM Mono', monospace;
    font-size: 28px;
    font-weight: 500;
    color: var(--accent);
    line-height: 1;
  }
  .stat-sub {
    font-size: 12px;
    color: var(--text-muted);
  }

  /* ── FILTERS ──────────────────────────────────────────── */
  .toolbar {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    padding: 20px 32px;
  }

  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
  }
  .search-wrap svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
    color: var(--text-muted);
  }
  input[type="search"], input[type="date"], select.filter-select {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: var(--radius);
    padding: 9px 12px 9px 36px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    width: 100%;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="date"] { padding-left: 12px; }
  select.filter-select { padding-left: 12px; cursor: pointer; min-width: 150px; width: auto; }
  input[type="search"]:focus,
  input[type="date"]:focus,
  select.filter-select:focus { border-color: var(--accent); }
  input[type="search"]::placeholder { color: var(--text-muted); }

  .filter-count {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
  }

  /* ── ORDERS LIST ──────────────────────────────────────── */
  .orders-wrap {
    padding: 0 32px 40px;
  }

  /* Loading / empty states */
  .state-box {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-muted);
  }
  .state-box .icon {
    font-size: 48px;
    margin-bottom: 16px;
    opacity: 0.4;
  }
  .state-box p { font-size: 15px; }

  /* ── ORDER CARD ───────────────────────────────────────── */
  .order-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 12px;
    overflow: hidden;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .order-card:hover { border-color: #444; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
  .order-card.expanded { border-color: var(--accent); }

  .order-card-head {
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    user-select: none;
  }

  .order-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #e8ff47 0%, #47c8ff 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 800;
    color: #000;
    flex-shrink: 0;
  }

  .order-meta { flex: 1; min-width: 0; }
  .order-name {
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .order-date {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
  }

  .order-badges { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: 20px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    white-space: nowrap;
  }
  .badge-items {
    background: rgba(232, 255, 71, 0.08);
    border: 1px solid rgba(232, 255, 71, 0.25);
    color: var(--accent);
  }

  .chevron {
    color: var(--text-muted);
    transition: transform 0.25s;
    flex-shrink: 0;
  }
  .order-card.expanded .chevron { transform: rotate(180deg); }

  /* ── EXPANDED ITEMS TABLE ─────────────────────────────── */
  .order-items {
    display: none;
    border-top: 1px solid var(--border);
    padding: 0 20px 16px;
  }
  .order-card.expanded .order-items { display: block; }

  .items-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 14px;
    font-size: 13px;
  }
  .items-table th {
    font-family: 'Syne', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 6px 10px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  .items-table td {
    padding: 9px 10px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    vertical-align: middle;
  }
  .items-table tr:last-child td { border-bottom: none; }
  .items-table tr:hover td { background: var(--surface2); }

  .item-thumb {
    width: 30px;
    height: 30px;
    border-radius: 4px;
    overflow: hidden;
    background: var(--surface2);
  }
  .item-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .sku-mono {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
  }
  .uom-pill {
    display: inline-block;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 7px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--accent2);
    white-space: nowrap;
  }
  .qty-bold {
    font-family: 'DM Mono', monospace;
    font-weight: 600;
    color: var(--accent);
  }

  /* ── DELETE BUTTON ────────────────────────────────────── */
  .order-actions {
    display: flex;
    justify-content: flex-end;
    margin-top: 12px;
    gap: 8px;
  }
  .btn-delete {
    background: none;
    border: 1px solid rgba(248, 113, 113, 0.3);
    color: var(--red);
    padding: 7px 14px;
    border-radius: var(--radius);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s, border-color 0.15s;
  }
  .btn-delete:hover { background: rgba(248, 113, 113, 0.08); border-color: var(--red); }

  /* ── CONFIRM DIALOG ───────────────────────────────────── */
  .confirm-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 300;
    align-items: center;
    justify-content: center;
  }
  .confirm-overlay.open { display: flex; }
  .confirm-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 28px;
    width: 360px;
    max-width: 90vw;
    text-align: center;
  }
  .confirm-box h3 {
    font-family: 'Syne', sans-serif;
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .confirm-box p { color: var(--text-muted); font-size: 13px; line-height: 1.6; margin-bottom: 22px; }
  .confirm-btns { display: flex; gap: 10px; }
  .confirm-btns button { flex: 1; padding: 10px; border-radius: var(--radius); font-family: 'Syne', sans-serif; font-weight: 700; font-size: 13px; cursor: pointer; border: none; }
  .confirm-cancel { background: var(--surface2); border: 1px solid var(--border) !important; color: var(--text); }
  .confirm-delete { background: var(--red); color: #000; }

  /* ── TOAST ────────────────────────────────────────────── */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1e3a1e;
    border: 1px solid var(--green);
    color: var(--green);
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    z-index: 9999;
    opacity: 0;
    transition: opacity 0.3s ease, transform 0.3s ease;
    white-space: nowrap;
  }
  .toast.error { background: #3a1e1e; border-color: var(--red); color: var(--red); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── RESPONSIVE ───────────────────────────────────────── */
  @media (max-width: 600px) {
    header, .toolbar, .orders-wrap, .summary-bar { padding-left: 16px; padding-right: 16px; }
    .order-badges { flex-direction: column; gap: 4px; }
    .summary-bar { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo">energise<span>.</span></div>
    <span class="page-tag">Order Submissions</span>
  </div>
  <button class="refresh-btn" id="refreshBtn" onclick="loadOrders()">
    <svg id="refreshIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
    </svg>
    Refresh
  </button>
</header>

<!-- Summary cards -->
<div class="summary-bar">
  <div class="stat-card">
    <div class="stat-label">Total Orders</div>
    <div class="stat-value" id="statTotal">—</div>
    <div class="stat-sub">all time</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Unique Submitters</div>
    <div class="stat-value" id="statPeople">—</div>
    <div class="stat-sub">individuals</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Total Line Items</div>
    <div class="stat-value" id="statItems">—</div>
    <div class="stat-sub">across all orders</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Latest Order</div>
    <div class="stat-value" id="statLatest" style="font-size:14px;margin-top:4px;">—</div>
    <div class="stat-sub" id="statLatestDate">—</div>
  </div>
</div>

<!-- Filters -->
<div class="toolbar">
  <div class="search-wrap">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
    </svg>
    <input type="search" id="searchInput" placeholder="Search by name…" oninput="applyFilters()">
  </div>
  <input type="date" id="dateFrom" title="From date" onchange="applyFilters()">
  <input type="date" id="dateTo" title="To date" onchange="applyFilters()">
  <select class="filter-select" id="sortOrder" onchange="applyFilters()">
    <option value="desc">Newest first</option>
    <option value="asc">Oldest first</option>
  </select>
  <span class="filter-count" id="filterCount"></span>
</div>

<!-- Orders -->
<div class="orders-wrap" id="ordersWrap">
  <div class="state-box">
    <div class="icon">⏳</div>
    <p>Loading orders…</p>
  </div>
</div>

<!-- Confirm delete dialog -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <h3>Delete Order?</h3>
    <p>This will permanently remove this order from the database. This cannot be undone.</p>
    <div class="confirm-btns">
      <button class="confirm-cancel" onclick="closeConfirm()">Cancel</button>
      <button class="confirm-delete" id="confirmDeleteBtn" onclick="doDelete()">Delete</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import {
    getFirestore, collection, getDocs, deleteDoc, doc, query, orderBy
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
    authDomain: "oesperformance-a54c0.firebaseapp.com",
    projectId: "oesperformance-a54c0",
    storageBucket: "oesperformance-a54c0.firebasestorage.app",
    messagingSenderId: "484894102454",
    appId: "1:484894102454:web:17535ee497eac2d90d6717",
    measurementId: "G-R56BGZYV8N"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const IMG = {
    pipe:        'img-pipe.png',
    electrical:  'img-electrical.png',
    meter:       'img-meter.png',
    consumable:  'img-consumables.png',
  };
  function catImg(cat) { return IMG[cat] || IMG.consumable; }

  let allOrders = [];
  let pendingDeleteId = null;

  // ── Load ────────────────────────────────────────────────
  window.loadOrders = async function() {
    const btn = document.getElementById('refreshBtn');
    btn.classList.add('loading');
    btn.disabled = true;

    try {
      const q = query(collection(db, "Energise Orders"), orderBy("submittedAt", "desc"));
      const snap = await getDocs(q);

      allOrders = snap.docs.map(d => {
        const data = d.data();
        return {
          id: d.id,
          submittedBy: data.submittedBy || 'Unknown',
          submittedAt: data.submittedAt ? data.submittedAt.toDate() : null,
          itemCount: data.itemCount || (data.items ? data.items.length : 0),
          items: data.items || []
        };
      });

      updateStats();
      applyFilters();
    } catch (err) {
      console.error(err);
      showState('⚠️', 'Failed to load orders: ' + err.message);
      showToast('Error: ' + err.message, true);
    } finally {
      btn.classList.remove('loading');
      btn.disabled = false;
    }
  };

  // ── Stats ───────────────────────────────────────────────
  function updateStats() {
    document.getElementById('statTotal').textContent = allOrders.length;

    const people = new Set(allOrders.map(o => o.submittedBy.toLowerCase().trim()));
    document.getElementById('statPeople').textContent = people.size;

    const totalItems = allOrders.reduce((s, o) => s + o.itemCount, 0);
    document.getElementById('statItems').textContent = totalItems;

    if (allOrders.length > 0) {
      const latest = allOrders[0];
      document.getElementById('statLatest').textContent = latest.submittedBy;
      document.getElementById('statLatestDate').textContent = latest.submittedAt
        ? formatDate(latest.submittedAt) : 'Unknown date';
    } else {
      document.getElementById('statLatest').textContent = '—';
      document.getElementById('statLatestDate').textContent = '—';
    }
  }

  // ── Filter + Sort ───────────────────────────────────────
  window.applyFilters = function() {
    const q = document.getElementById('searchInput').value.toLowerCase().trim();
    const fromVal = document.getElementById('dateFrom').value;
    const toVal = document.getElementById('dateTo').value;
    const sort = document.getElementById('sortOrder').value;

    let filtered = allOrders.filter(o => {
      if (q && !o.submittedBy.toLowerCase().includes(q)) return false;

      if (o.submittedAt) {
        const d = o.submittedAt;
        const dateStr = d.toISOString().split('T')[0];
        if (fromVal && dateStr < fromVal) return false;
        if (toVal && dateStr > toVal) return false;
      }
      return true;
    });

    if (sort === 'asc') filtered = filtered.slice().reverse();

    document.getElementById('filterCount').textContent =
      `${filtered.length} order${filtered.length !== 1 ? 's' : ''}`;

    renderOrders(filtered);
  };

  // ── Render ──────────────────────────────────────────────
  function renderOrders(orders) {
    const wrap = document.getElementById('ordersWrap');

    if (orders.length === 0) {
      if (allOrders.length === 0) {
        showState('📭', 'No orders have been submitted yet.');
      } else {
        showState('🔍', 'No orders match your current filters.');
      }
      return;
    }

    wrap.innerHTML = orders.map(order => orderCard(order)).join('');
  }

  function orderCard(order) {
    const initials = order.submittedBy.trim().split(' ')
      .map(w => w[0]).slice(0, 2).join('').toUpperCase();
    const dateStr = order.submittedAt ? formatDate(order.submittedAt) : 'Unknown date';
    const timeStr = order.submittedAt ? formatTime(order.submittedAt) : '';

    const itemRows = order.items.map(item => `
      <tr>
        <td><div class="item-thumb"><img src="${catImg(item.category)}" alt="${item.category || ''}"></div></td>
        <td>${escHtml(item.name || '')}</td>
        <td><span class="sku-mono">${escHtml(item.sku || '')}</span></td>
        <td><span class="uom-pill">${escHtml(item.uom || '')}</span></td>
        <td><span class="qty-bold">${item.qty || 1}</span></td>
      </tr>
    `).join('');

    return `
      <div class="order-card" id="card-${order.id}">
        <div class="order-card-head" onclick="toggleCard('${order.id}')">
          <div class="order-avatar">${initials || '?'}</div>
          <div class="order-meta">
            <div class="order-name">${escHtml(order.submittedBy)}</div>
            <div class="order-date">${dateStr}${timeStr ? ' · ' + timeStr : ''}</div>
          </div>
          <div class="order-badges">
            <span class="badge badge-items">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
              ${order.itemCount} item${order.itemCount !== 1 ? 's' : ''}
            </span>
          </div>
          <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </div>

        <div class="order-items">
          ${order.items.length > 0 ? `
            <table class="items-table">
              <thead>
                <tr>
                  <th style="width:40px"></th>
                  <th>Product</th>
                  <th>SKU</th>
                  <th>Unit</th>
                  <th>Qty</th>
                </tr>
              </thead>
              <tbody>${itemRows}</tbody>
            </table>
          ` : '<p style="color:var(--text-muted);font-size:13px;margin-top:12px;">No item details stored.</p>'}

          <div class="order-actions">
            <button class="btn-delete" onclick="confirmDelete('${order.id}')">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                <path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
              </svg>
              Delete Order
            </button>
          </div>
        </div>
      </div>
    `;
  }

  function showState(icon, msg) {
    document.getElementById('ordersWrap').innerHTML = `
      <div class="state-box">
        <div class="icon">${icon}</div>
        <p>${escHtml(msg)}</p>
      </div>`;
  }

  // ── Toggle card ─────────────────────────────────────────
  window.toggleCard = function(id) {
    const card = document.getElementById('card-' + id);
    if (!card) return;
    // Close others
    document.querySelectorAll('.order-card.expanded').forEach(c => {
      if (c !== card) c.classList.remove('expanded');
    });
    card.classList.toggle('expanded');
  };

  // ── Delete ──────────────────────────────────────────────
  window.confirmDelete = function(id) {
    pendingDeleteId = id;
    document.getElementById('confirmOverlay').classList.add('open');
  };

  window.closeConfirm = function() {
    pendingDeleteId = null;
    document.getElementById('confirmOverlay').classList.remove('open');
  };

  window.doDelete = async function() {
    if (!pendingDeleteId) return;
    const id = pendingDeleteId;
    const btn = document.getElementById('confirmDeleteBtn');
    btn.disabled = true;
    btn.textContent = 'Deleting…';

    try {
      await deleteDoc(doc(db, "Energise Orders", id));
      allOrders = allOrders.filter(o => o.id !== id);
      updateStats();
      applyFilters();
      showToast('Order deleted.', false);
    } catch (err) {
      showToast('Error deleting: ' + err.message, true);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Delete';
      closeConfirm();
    }
  };

  // ── Helpers ─────────────────────────────────────────────
  function formatDate(d) {
    return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
  }
  function formatTime(d) {
    return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  }
  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  window.showToast = function(msg, isError) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = 'toast' + (isError ? ' error' : '');
    void toast.offsetWidth;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3200);
  };

  // Init
  loadOrders();
</script>
</body>
</html>
