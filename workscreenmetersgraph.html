<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meters Dashboard • OES</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #6366f1;
      --accent-dark: #4f46e5;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
      --border: #334155;
      --green: #10b981;
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      grid-template-columns: 280px 1fr;
    }

    aside {
      background: var(--card);
      border-right: 1px solid var(--border);
      padding: 2rem 1.5rem;
      height: 100vh;
      position: sticky;
      top: 0;
      overflow-y: auto;
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(90deg, var(--accent), #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 2.5rem;
      text-align: center;
    }

    h2 {
      font-size: 1.1rem;
      color: var(--text-dim);
      margin: 1.8rem 0 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .period-btn {
      display: block;
      width: 100%;
      padding: 0.95rem 1.2rem;
      margin: 0.45rem 0;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: all 0.18s ease;
      font-size: 0.97rem;
    }

    .period-btn:hover {
      background: rgba(99,102,241,0.08);
      border-color: var(--accent);
    }

    .period-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
      box-shadow: 0 3px 12px rgba(99,102,241,0.3);
    }

    .team-btn {
      display: block;
      width: 100%;
      padding: 0.85rem 1.2rem;
      margin: 0.35rem 0;
      background: rgba(30,41,59,0.6);
      border: none;
      border-radius: 9px;
      color: var(--text-dim);
      text-align: left;
      cursor: pointer;
      transition: all 0.16s ease;
      font-size: 0.96rem;
    }

    .team-btn:hover {
      background: rgba(99,102,241,0.12);
      color: var(--text);
    }

    .team-btn.active {
      background: rgba(99,102,241,0.25);
      color: white;
      font-weight: 600;
    }

    main {
      padding: 2.5rem 3rem;
      max-width: 1600px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2.2rem;
    }

    h1 {
      font-size: 2.1rem;
      font-weight: 700;
      background: linear-gradient(90deg, #e2e8f0, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 1.8rem 2rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    #chartContainer {
      height: 520px;
      position: relative;
      margin-top: 1.5rem;
    }

    .loading, .no-data {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-size: 1.2rem;
      background: rgba(15,23,42,0.6);
      border-radius: 12px;
    }

    @media (max-width: 1100px) {
      body { grid-template-columns: 1fr; }
      aside { 
        height: auto; 
        position: relative; 
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      main { padding: 2rem 1.5rem; }
    }
  </style>
</head>
<body>

<aside>
  <div class="logo">OES Meters</div>

  <h2>Time Period</h2>
  <button class="period-btn active" data-period="7days">Last 7 working days (bar)</button>
  <button class="period-btn" data-period="4weeks">4 week rolling (line)</button>
  <button class="period-btn" data-period="6months">6 months (line)</button>
  <button class="period-btn" data-period="year">Year to date (line)</button>

  <h2>Team Leader</h2>
  <button class="team-btn active" data-team="all">All Teams</button>
  <button class="team-btn" data-team="Ali Cavan">Ali Cavan</button>
  <button class="team-btn" data-team="Craig Barnes">Craig Barnes</button>
  <button class="team-btn" data-team="Paul Simpson">Paul Simpson</button>
  <button class="team-btn" data-team="Richard Wiecko">Richard Wiecko</button>
  <button class="team-btn" data-team="Scott Carson">Scott Carson</button>
  <button class="team-btn" data-team="Stuart Whyte">Stuart Whyte</button>
  <button class="team-btn" data-team="Subbies">Subbies</button>
</aside>

<main>
  <header>
    <h1>Meters Installed</h1>
  </header>

  <div class="card">
    <div id="chartContainer">
      <div class="loading">Loading data…</div>
    </div>
  </div>
</main>

<script type="module">
// ────────────────────────────────────────────────
const ctx = document.createElement('canvas');
document.querySelector('#chartContainer').appendChild(ctx);
let chart = null;

const periods = {
  "7days":  { label: "Last 7 working days", days: 7,  type: "bar",   color: "#6366f1" },
  "4weeks": { label: "4 week rolling",      days: 28, type: "line",  color: "#8b5cf6" },
  "6months":{ label: "Last 6 months",       days: 180,type: "line",  color: "#a78bfa" },
  "year":   { label: "Year to date",        days: 365,type: "line",  color: "#c084fc" },
};

let currentPeriod = "7days";
let currentTeam   = "all";

// ─── Very simplified data layer ───────────────────────────────
// Replace this with your real Firestore / API fetch
async function fetchMetersData(periodKey, team) {
  // This is a FAKE implementation — replace with real query
  const daysBack = periods[periodKey].days;
  const today = new Date();
  const data = [];

  for (let i = daysBack - 1; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);

    // Skip weekends in simulation
    if (d.getDay() === 0 || d.getDay() === 6) continue;

    const dateStr = d.toISOString().split('T')[0];
    let value = Math.floor(Math.random() * 140) + 30; // fake

    // Fake team filtering effect
    if (team !== "all") value = Math.max(10, value - 40 + Math.floor(Math.random()*60));

    data.push({ date: dateStr, meters: value });
  }

  return data;
}

// ─── Chart update ─────────────────────────────────────────────
async function updateChart() {
  const loading = document.querySelector('.loading');
  if (loading) loading.remove();

  const data = await fetchMetersData(currentPeriod, currentTeam);

  const labels = data.map(d => d.date.slice(5)); // MM-DD
  const values = data.map(d => d.meters);

  const cfg = periods[currentPeriod];

  const datasets = [{
    label: `Meters (${currentTeam === 'all' ? 'All' : currentTeam})`,
    data: values,
    backgroundColor: currentPeriod === "7days" 
      ? "rgba(99,102,241,0.55)" 
      : "rgba(99,102,241,0.18)",
    borderColor: cfg.color,
    borderWidth: currentPeriod === "7days" ? 1 : 3,
    borderRadius: currentPeriod === "7days" ? 6 : 0,
    tension: 0.3,
    fill: currentPeriod !== "7days",
    pointRadius: currentPeriod === "7days" ? 0 : 3,
    pointHoverRadius: 6,
  }];

  if (chart) chart.destroy();

  chart = new Chart(ctx, {
    type: cfg.type,
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        title: {
          display: true,
          text: `${cfg.label} • ${currentTeam === 'all' ? 'All Teams' : currentTeam}`,
          color: '#e2e8f0',
          font: { size: 18, weight: '600' },
          padding: { bottom: 20 }
        },
        legend: { labels: { color: '#cbd5e1', font: { size: 14 } } }
      },
      scales: {
        x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
        y: {
          beginAtZero: true,
          ticks: { color: '#94a3b8', stepSize: 50 },
          grid: { color: '#334155' }
        }
      }
    }
  });
}

// ─── Event listeners ──────────────────────────────────────────
document.querySelectorAll('.period-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentPeriod = btn.dataset.period;
    updateChart();
  });
});

document.querySelectorAll('.team-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.team-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTeam = btn.dataset.team;
    updateChart();
  });
});

// Initial load
updateChart();

</script>
</body>
</html>
