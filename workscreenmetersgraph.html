<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meters Dashboard • OES</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #6366f1;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
      --border: #334155;
      --error: #f87171;
      --success: #10b981;
      --warning: #f59e0b;
      --orange: #f97316;
      --purple: #a78bfa;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      grid-template-columns: 280px 1fr;
    }
    aside {
      background: var(--card);
      border-right: 1px solid var(--border);
      padding: 2rem 1.5rem;
      height: 100vh;
      position: sticky;
      top: 0;
      overflow-y: auto;
    }
    .logo {
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(90deg, var(--accent), #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 2.5rem;
      text-align: center;
    }
    h2 {
      font-size: 1.1rem;
      color: var(--text-dim);
      margin: 1.8rem 0 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }
    .period-btn, .team-btn, .month-btn {
      display: block;
      width: 100%;
      padding: 0.95rem 1.2rem;
      margin: 0.4rem 0;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: all 0.18s ease;
      font-size: 0.97rem;
    }
    .period-btn:hover, .team-btn:hover, .month-btn:hover {
      background: rgba(99,102,241,0.08);
      border-color: var(--accent);
    }
    .period-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
      box-shadow: 0 3px 12px rgba(99,102,241,0.3);
    }
    .team-btn.active {
      background: rgba(99,102,241,0.25);
      color: white;
      font-weight: 600;
      border-color: var(--accent);
    }
    .month-btn {
      padding: 0.65rem 1rem;
      font-size: 0.88rem;
    }
    .month-btn.active {
      background: rgba(16,185,129,0.25);
      color: white;
      font-weight: 600;
      border-color: var(--success);
    }
    .month-btn:hover {
      background: rgba(16,185,129,0.08);
      border-color: var(--success);
    }
    .months-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.4rem;
    }
    .months-grid .month-btn {
      margin: 0;
      text-align: center;
      padding: 0.55rem 0.4rem;
      font-size: 0.82rem;
    }

    .view-toggle {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.35rem;
    }
    .view-tab {
      flex: 1;
      padding: 0.7rem 0.5rem;
      background: transparent;
      border: none;
      border-radius: 8px;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      transition: all 0.2s ease;
      text-align: center;
      line-height: 1.3;
    }
    .view-tab:hover { color: var(--text); background: rgba(255,255,255,0.05); }
    .view-tab.active {
      background: var(--accent);
      color: white;
      box-shadow: 0 2px 8px rgba(99,102,241,0.4);
    }
    .view-tab.active.tab-mix   { background: #6366f1; }
    .view-tab.active.tab-types { background: #10b981; }
    .view-tab.active.tab-abort { background: #f97316; }

    .headcount-badge {
      display: inline-block;
      background: rgba(99,102,241,0.18);
      border: 1px solid rgba(99,102,241,0.4);
      border-radius: 6px;
      font-size: 0.72rem;
      color: #a78bfa;
      padding: 2px 7px;
      margin-left: 6px;
      font-weight: 700;
      vertical-align: middle;
    }

    main {
      padding: 2.5rem 3rem;
      max-width: 1600px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      gap: 2rem;
    }
    h1 {
      font-size: 2.1rem;
      font-weight: 700;
      background: linear-gradient(90deg, #e2e8f0, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .stats-container {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .stats-box {
      background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(139,92,246,0.1));
      border: 1px solid var(--accent);
      border-radius: 12px;
      padding: 1rem 1.5rem;
      box-shadow: 0 4px 15px rgba(99,102,241,0.2);
      min-width: 130px;
    }
    .stats-box.green {
      background: linear-gradient(135deg, rgba(16,185,129,0.15), rgba(52,211,153,0.1));
      border-color: var(--success);
      box-shadow: 0 4px 15px rgba(16,185,129,0.2);
    }
    .stats-box.per-head {
      background: linear-gradient(135deg, rgba(167, 139, 250, 0.15), rgba(139, 92, 246, 0.1));
      border-color: var(--purple);
      box-shadow: 0 4px 15px rgba(167, 139, 250, 0.2);
    }
    .stats-box.orange {
      background: linear-gradient(135deg, rgba(249,115,22,0.15), rgba(251,146,60,0.1));
      border-color: var(--orange);
      box-shadow: 0 4px 15px rgba(249,115,22,0.2);
    }
    .stats-label {
      font-size: 0.75rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.4rem;
      font-weight: 600;
    }
    .stats-value {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(90deg, var(--accent), #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
    }
    .stats-value.large { font-size: 2rem; }
    .stats-value.success {
      background: linear-gradient(90deg, var(--success), #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .stats-value.purple-grad {
      background: linear-gradient(90deg, var(--purple), #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .stats-value.orange-grad {
      background: linear-gradient(90deg, var(--orange), #fb923c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 1.8rem 2rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    #chartContainer {
      height: 520px;
      position: relative;
      margin-top: 1.5rem;
    }

    #abortsContainer {
      display: none;
      margin-top: 1.5rem;
    }
    .abort-filters {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.2rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .abort-filter-label {
      font-size: 0.85rem;
      color: var(--text-dim);
      font-weight: 600;
    }
    .abort-date-range {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }
    .abort-date-input {
      padding: 0.55rem 0.75rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.85rem;
    }
    .abort-load-btn {
      padding: 0.55rem 1rem;
      background: var(--orange);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-size: 1.2rem;
      background: rgba(15,23,42,0.6);
      border-radius: 12px;
      z-index: 10;
    }

    @media (max-width: 1100px) {
      body { grid-template-columns: 1fr; }
      aside { height: auto; position: relative; border-right: none; }
      main { padding: 2rem 1.5rem; }
    }
  </style>
</head>
<body>

<aside>
  <div class="logo">OES Meters</div>

  <div class="view-toggle">
    <button class="view-tab tab-mix active" data-view="mix">📊 Meters &amp; Completion</button>
    <button class="view-tab tab-types" data-view="types">⚡ Install Types</button>
    <button class="view-tab tab-abort" data-view="aborts">🚫 Aborts</button>
  </div>

  <div id="periodSection">
    <h2>Time Period</h2>
    <button class="period-btn active" data-period="7days">Last 7 days (bar)</button>
    <button class="period-btn" data-period="4weeks">4 week rolling (bar)</button>
    <button class="period-btn" data-period="6months">6 months (line)</button>
    <button class="period-btn" data-period="year">Year to date (line)</button>
  </div>

  <h2>Team Leader</h2>
  <button class="team-btn active" data-team="all">All Teams <span class="headcount-badge" id="hc_all">…</span></button>
  <button class="team-btn" data-team="Richard Wiecko">Richard Wiecko <span class="headcount-badge" id="hc_richard">…</span></button>
  <button class="team-btn" data-team="Scott Carson">Scott Carson <span class="headcount-badge" id="hc_scott">…</span></button>
  <button class="team-btn" data-team="Scott Carson - Scot">Scott Carson - Scot <span class="headcount-badge" id="hc_scottscot">…</span></button>
  <button class="team-btn" data-team="Stuart Whyte">Stuart Whyte <span class="headcount-badge" id="hc_stuart">…</span></button>
  <button class="team-btn" data-team="Tom Green">Tom Green <span class="headcount-badge" id="hc_tom">…</span></button>

  <div id="monthSection">
    <h2>2026 Monthly View</h2>
    <div class="months-grid">
      <button class="month-btn" data-month="2026-01">Jan</button>
      <button class="month-btn" data-month="2026-02">Feb</button>
      <button class="month-btn" data-month="2026-03">Mar</button>
      <button class="month-btn" data-month="2026-04">Apr</button>
      <button class="month-btn" data-month="2026-05">May</button>
      <button class="month-btn" data-month="2026-06">Jun</button>
      <button class="month-btn" data-month="2026-07">Jul</button>
      <button class="month-btn" data-month="2026-08">Aug</button>
      <button class="month-btn" data-month="2026-09">Sep</button>
      <button class="month-btn" data-month="2026-10">Oct</button>
      <button class="month-btn" data-month="2026-11">Nov</button>
      <button class="month-btn" data-month="2026-12">Dec</button>
    </div>
  </div>
</aside>

<main>
  <header>
    <h1 id="pageTitle">Meters Installed</h1>
    <div class="stats-container" id="statsContainer"></div>
  </header>

  <div class="card">
    <div id="chartContainer">
      <div class="loading">Loading performance data…</div>
    </div>
    <div id="abortsContainer">
      <div class="abort-filters">
        <span class="abort-filter-label">Date range:</span>
        <div class="abort-date-range">
          <input type="date" class="abort-date-input" id="abortFrom">
          <span style="color:var(--text-dim)">→</span>
          <input type="date" class="abort-date-input" id="abortTo">
        </div>
        <button class="abort-load-btn" id="abortLoadBtn">Load</button>
      </div>
      <div id="abortsChartContainer" style="height:480px;position:relative;margin-top:1rem;"></div>
    </div>
  </div>
</main>

<script type="module">
  import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const perfConfig = {
    apiKey: "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
    authDomain: "oesperformance-a54c0.firebaseapp.com",
    projectId: "oesperformance-a54c0",
    storageBucket: "oesperformance-a54c0.firebasestorage.app",
    messagingSenderId: "484894102454",
    appId: "1:484894102454:web:17535ee497eac2d90d6717",
    measurementId: "G-R56BGZYV8N"
  };
  const staffConfig = {
    apiKey: "AIzaSyAc_yJQ_rkzuOBh-Yxg0Q4eooXtB-tQjm0",
    authDomain: "pingu-solar.firebaseapp.com",
    projectId: "pingu-solar",
    storageBucket: "pingu-solar.firebasestorage.app",
    messagingSenderId: "232764952866",
    appId: "1:232764952866:web:5923b7f419de6355d6157b",
    measurementId: "G-PFH059DZ64"
  };

  const existingApps = getApps();
  const perfApp  = existingApps.find(a=>a.name==='perf-graph')  || initializeApp(perfConfig,  'perf-graph');
  const staffApp = existingApps.find(a=>a.name==='staff-graph') || initializeApp(staffConfig, 'staff-graph');
  const db      = getFirestore(perfApp);
  const staffDb = getFirestore(staffApp);

  const normTeam = val => /^ftl\s*4$/i.test((val || '').trim()) ? 'Tom Green' : (val || '');
  const ctx = document.createElement('canvas');
  document.querySelector('#chartContainer').appendChild(ctx);
  let chart = null;

  const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const periods = {
    "7days":   { label: "Last 7 days",    daysBack: 7,   color: "#6366f1", type: "bar"  },
    "4weeks":  { label: "4 week rolling", daysBack: 28,  color: "#8b5cf6", type: "bar"  },
    "6months": { label: "Last 6 months",  daysBack: 180, color: "#a78bfa", type: "line" },
    "year":    { label: "Year to date",   daysBack: 365, color: "#c084fc", type: "line" },
  };

  let currentView   = "mix";
  let currentPeriod = "7days";
  let currentTeam   = "all";
  let currentMonth  = null;
  const today = new Date();

  let engineerHeadcount = { "all": 0, "Richard Wiecko": 0, "Scott Carson": 0, "Scott Carson - Scot": 0, "Stuart Whyte": 0, "Tom Green": 0 };

  async function loadHeadcount() {
    try {
      const staffSnap = await getDocs(collection(staffDb, "employees"));
      Object.keys(engineerHeadcount).forEach(k => engineerHeadcount[k] = 0);
      staffSnap.forEach(doc => {
        const d = doc.data();
        if (d.leaveDate) return;
        if ((d.Location || d.location || '').trim() !== 'OES') return;
        const rawTl = (d['Team Leader'] || d.teamLeader || '').trim();
        const tl = /^ftl\s*4$/i.test(rawTl) ? 'Tom Green' : rawTl;
        if (engineerHeadcount[tl] !== undefined) engineerHeadcount[tl]++;
      });
      engineerHeadcount["Scott Carson"] = 9;
      engineerHeadcount["Scott Carson - Scot"] = 4;
      engineerHeadcount["all"] = engineerHeadcount["Richard Wiecko"] + engineerHeadcount["Scott Carson"] + engineerHeadcount["Scott Carson - Scot"] + engineerHeadcount["Stuart Whyte"] + engineerHeadcount["Tom Green"];
      
      Object.entries(engineerHeadcount).forEach(([k, v]) => {
        const id = k === 'all' ? 'hc_all' : k === 'Richard Wiecko' ? 'hc_richard' : k === 'Scott Carson' ? 'hc_scott' : k === 'Scott Carson - Scot' ? 'hc_scottscot' : k === 'Stuart Whyte' ? 'hc_stuart' : 'hc_tom';
        if(document.getElementById(id)) document.getElementById(id).textContent = v;
      });
    } catch (err) { console.warn('Headcount Error', err); }
  }

  async function fetchRecordsForRange(startDate, endDate, team) {
    const q = query(collection(db, "performance"), where("date", ">=", startDate), where("date", "<=", endDate), orderBy("date", "asc"));
    const snap = await getDocs(q);
    const recs = [];
    snap.forEach(doc => {
      const d = doc.data();
      const normalisedTeam = normTeam(d.teamLeader);
      if (team === "all" || normalisedTeam === team) recs.push({ ...d, teamLeader: normalisedTeam });
    });
    return recs;
  }

  function getWeekdayDates(start, end) {
    const dates = [];
    const cur = new Date(start);
    while (cur <= end) {
      if (cur.getDay() !== 0 && cur.getDay() !== 6) dates.push(cur.toISOString().split('T')[0]);
      cur.setDate(cur.getDate() + 1);
    }
    return dates;
  }

  function formatDayLabel(dateStr, multiLine) {
    const d = new Date(dateStr);
    const dd = String(d.getDate()).padStart(2,'0');
    const mm = String(d.getMonth()+1).padStart(2,'0');
    return multiLine ? [`${dd}/${mm}`, d.toLocaleDateString('en-GB', { weekday: 'short' })] : `${dd}/${mm}`;
  }

  async function renderMix() {
    const container = document.querySelector('#chartContainer');
    container.innerHTML = '<div class="loading">Loading…</div>';
    const hc = engineerHeadcount[currentTeam] || engineerHeadcount["all"] || 1;

    let startDate, endDate, weekdays, label, isBar;
    if (currentMonth) {
      const [year, mon] = currentMonth.split('-').map(Number);
      const start = new Date(year, mon-1, 1);
      const end = new Date(year, mon, 0);
      const effEnd = end < today ? end : today;
      startDate = start.toISOString().split('T')[0];
      endDate = effEnd.toISOString().split('T')[0];
      weekdays = getWeekdayDates(start, effEnd);
      label = `${monthNames[mon-1]} ${year}`;
      isBar = true;
    } else {
      const cfg = periods[currentPeriod];
      const start = new Date(today); start.setDate(today.getDate() - cfg.daysBack);
      startDate = start.toISOString().split('T')[0];
      endDate = today.toISOString().split('T')[0];
      weekdays = getWeekdayDates(start, today);
      label = cfg.label;
      isBar = cfg.type === 'bar';
    }

    const records = await fetchRecordsForRange(startDate, endDate, currentTeam);
    const dateMap = {};
    weekdays.forEach(d => dateMap[d] = { meters:0, completed:0, jobs:0 });
    records.forEach(r => { if(dateMap[r.date]) { dateMap[r.date].meters += Number(r.meters||0); dateMap[r.date].completed += Number(r.completed||0); dateMap[r.date].jobs += Number(r.jobs||0); } });

    const metersValues = weekdays.map(d => Math.round(dateMap[d].meters));
    const completionValues = weekdays.map(d => dateMap[d].jobs > 0 ? Number(((dateMap[d].completed/dateMap[d].jobs)*100).toFixed(1)) : null);
    const total = metersValues.reduce((s,v)=>s+v,0);
    const metersPerHead = (total / hc).toFixed(1);

    let targetHTML = '';
    if (currentPeriod === '7days' && !currentMonth) {
      const l5 = metersValues.filter(v=>v>0).slice(-5);
      const l5tot = l5.reduce((s,v)=>s+v,0);
      const target = hc * 6 * 0.9 * l5.length;
      const pct = target > 0 ? (l5tot/target)*100 : 0;
      targetHTML = `<div class="stats-box"><div class="stats-label">vs Target</div><div class="stats-value ${pct>=100?'success':pct>=80?'warning':'error'}">${pct.toFixed(1)}%</div></div>`;
    }

    document.getElementById('statsContainer').innerHTML = 
      `<div class="stats-box"><div class="stats-label">Total Meters</div><div class="stats-value large">${total.toLocaleString()}</div></div>` +
      `<div class="stats-box per-head"><div class="stats-label">Meters Per Head</div><div class="stats-value purple-grad">${metersPerHead}</div></div>` +
      `<div class="stats-box green"><div class="stats-label">Avg Completion</div><div class="stats-value success">${completionValues.filter(v=>v).length ? (completionValues.filter(v=>v).reduce((a,b)=>a+b,0)/completionValues.filter(v=>v).length).toFixed(1)+'%' : '—'}</div></div>` +
      targetHTML;

    container.innerHTML = ''; container.appendChild(ctx);
    if(chart) chart.destroy();
    chart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: weekdays.map(d => formatDayLabel(d, isBar)),
        datasets: [
          { type:'bar', label:'Meters Installed', data:metersValues, backgroundColor:'rgba(99,102,241,0.75)', borderColor:'#6366f1', borderWidth:1, borderRadius:6, yAxisID:'yMeters', datalabels:{anchor:'end', align:'top', formatter: v=>v>0?v:''} },
          { type:'line', label:'Completion %', data:completionValues, borderColor:'#10b981', borderWidth:3, yAxisID:'yCompletion', spanGaps:true, datalabels: {anchor:'top', align:'top', formatter: v=>v?v+'%':''} }
        ]
      },
      options: {
        responsive:true, maintainAspectRatio:false,
        plugins: {
          title: { display:true, text:`${label} - Meters & Completion (${currentTeam==='all'?'All Teams':currentTeam})`, color:'#e2e8f0', font:{size:16} },
          tooltip: {
            callbacks: {
              footer: (items) => {
                const val = items[0].raw;
                return items[0].datasetIndex === 0 ? `Per Head: ${(val/hc).toFixed(1)}` : '';
              }
            }
          }
        },
        scales: {
          yMeters: { type:'linear', position:'left', grid:{color:'#334155'}, ticks:{color:'#94a3b8'} },
          yCompletion: { type:'linear', position:'right', max:100, grid:{drawOnChartArea:false}, ticks:{color:'#10b981', callback:v=>v+'%'} }
        }
      },
      plugins: [ChartDataLabels]
    });
  }

  async function renderTypes() {
    const container = document.querySelector('#chartContainer');
    container.innerHTML = '<div class="loading">Loading…</div>';
    let startDate, endDate, weekdays, label, isBar;
    if (currentMonth) {
      const [year, mon] = currentMonth.split('-').map(Number);
      const start = new Date(year, mon-1, 1);
      const end = new Date(year, mon, 0);
      const effEnd = end < today ? end : today;
      startDate = start.toISOString().split('T')[0]; endDate = effEnd.toISOString().split('T')[0];
      weekdays = getWeekdayDates(start, effEnd); label = `${monthNames[mon-1]} ${year}`; isBar = true;
    } else {
      const cfg = periods[currentPeriod];
      const start = new Date(today); start.setDate(today.getDate() - cfg.daysBack);
      startDate = start.toISOString().split('T')[0]; endDate = today.toISOString().split('T')[0];
      weekdays = getWeekdayDates(start, today); label = cfg.label; isBar = cfg.type === 'bar';
    }
    const records = await fetchRecordsForRange(startDate, endDate, "all");
    const dateMap = {}; weekdays.forEach(d => dateMap[d] = { duals:0, singles:0, comms:0 });
    records.forEach(r => { if(dateMap[r.date]) { dateMap[r.date].duals += Number(r.duals||0); dateMap[r.date].singles += Number(r.singles||0); dateMap[r.date].comms += Number(r.comms||0); } });
    
    const duals = weekdays.map(d=>dateMap[d].duals);
    const singles = weekdays.map(d=>dateMap[d].singles);
    const comms = weekdays.map(d=>dateMap[d].comms);
    const tot = duals.reduce((a,b)=>a+b,0) + singles.reduce((a,b)=>a+b,0) + comms.reduce((a,b)=>a+b,0);

    document.getElementById('statsContainer').innerHTML = 
      `<div class="stats-box green"><div class="stats-label">Duals</div><div class="stats-value success">${duals.reduce((a,b)=>a+b,0)}</div></div>` +
      `<div class="stats-box"><div class="stats-label">Singles</div><div class="stats-value">${singles.reduce((a,b)=>a+b,0)}</div></div>` +
      `<div class="stats-box orange"><div class="stats-label">Comms</div><div class="stats-value orange-grad">${comms.reduce((a,b)=>a+b,0)}</div></div>`;

    container.innerHTML = ''; container.appendChild(ctx);
    if(chart) chart.destroy();
    chart = new Chart(ctx, {
      type: isBar?'bar':'line',
      data: {
        labels: weekdays.map(d => formatDayLabel(d, isBar)),
        datasets: [
          { label:'Duals', data:duals, backgroundColor:'#10b981', borderColor:'#10b981' },
          { label:'Singles', data:singles, backgroundColor:'#6366f1', borderColor:'#6366f1' },
          { label:'Comms', data:comms, backgroundColor:'#f97316', borderColor:'#f97316' }
        ]
      },
      options: { responsive:true, maintainAspectRatio:false, plugins:{title:{display:true, text:label, color:'#e2e8f0'}} },
      plugins: [ChartDataLabels]
    });
  }

  async function loadAborts() {
    const f = document.getElementById('abortFrom').value, t = document.getElementById('abortTo').value;
    if(!f || !t) return;
    const cont = document.getElementById('abortsChartContainer');
    cont.innerHTML = '<div class="loading">Loading…</div>';
    const q = query(collection(db,"aborts"),where("date",">=",f),where("date","<=",t),orderBy("date","asc"));
    const snap = await getDocs(q);
    const reasons = {};
    snap.forEach(doc => { const d = doc.data(); reasons[d.reason] = (reasons[d.reason]||0) + (Number(d.total)||1); });
    cont.innerHTML = ''; const c = document.createElement('canvas'); cont.appendChild(c);
    new Chart(c, { type:'bar', data:{ labels:Object.keys(reasons), datasets:[{data:Object.values(reasons), backgroundColor:'#f97316'}] }, options:{responsive:true, maintainAspectRatio:false} });
  }

  async function updateView() {
    if(currentView==='aborts') {
      document.getElementById('chartContainer').style.display='none';
      document.getElementById('abortsContainer').style.display='block';
      await loadAborts();
    } else {
      document.getElementById('chartContainer').style.display='block';
      document.getElementById('abortsContainer').style.display='none';
      if(currentView==='mix') await renderMix(); else await renderTypes();
    }
  }

  document.querySelectorAll('.view-tab').forEach(b => b.addEventListener('click', e => {
    document.querySelectorAll('.view-tab').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); currentView = b.dataset.view; updateView();
  }));
  document.querySelectorAll('.period-btn').forEach(b => b.addEventListener('click', e => {
    document.querySelectorAll('.period-btn, .month-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); currentPeriod = b.dataset.period; currentMonth=null; updateView();
  }));
  document.querySelectorAll('.team-btn').forEach(b => b.addEventListener('click', e => {
    document.querySelectorAll('.team-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); currentTeam = b.dataset.team; updateView();
  }));
  document.querySelectorAll('.month-btn').forEach(b => b.addEventListener('click', e => {
    document.querySelectorAll('.month-btn, .period-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); currentMonth = b.dataset.month; currentPeriod=null; updateView();
  }));

  document.getElementById('abortLoadBtn').addEventListener('click', loadAborts);
  const sevenAgo = new Date(today); sevenAgo.setDate(today.getDate()-7);
  document.getElementById('abortFrom').value = sevenAgo.toISOString().split('T')[0];
  document.getElementById('abortTo').value = today.toISOString().split('T')[0];

  await loadHeadcount();
  updateView();
</script>
</body>
</html>
