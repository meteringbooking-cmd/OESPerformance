<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meters Dashboard • OES</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #6366f1;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
      --border: #334155;
      --error: #f87171;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      grid-template-columns: 280px 1fr;
    }
    aside {
      background: var(--card);
      border-right: 1px solid var(--border);
      padding: 2rem 1.5rem;
      height: 100vh;
      position: sticky;
      top: 0;
      overflow-y: auto;
    }
    .logo {
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(90deg, var(--accent), #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 2.5rem;
      text-align: center;
    }
    h2 {
      font-size: 1.1rem;
      color: var(--text-dim);
      margin: 1.8rem 0 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }
    .period-btn, .team-btn {
      display: block;
      width: 100%;
      padding: 0.95rem 1.2rem;
      margin: 0.4rem 0;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: all 0.18s ease;
      font-size: 0.97rem;
    }
    .period-btn:hover, .team-btn:hover {
      background: rgba(99,102,241,0.08);
      border-color: var(--accent);
    }
    .period-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
      box-shadow: 0 3px 12px rgba(99,102,241,0.3);
    }
    .team-btn.active {
      background: rgba(99,102,241,0.25);
      color: white;
      font-weight: 600;
      border-color: var(--accent);
    }
    main {
      padding: 2.5rem 3rem;
      max-width: 1600px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    h1 {
      font-size: 2.1rem;
      font-weight: 700;
      background: linear-gradient(90deg, #e2e8f0, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 1.8rem 2rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    #chartContainer {
      height: 540px;
      position: relative;
      margin-top: 1.5rem;
    }
    .loading, .error-msg {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-size: 1.2rem;
      background: rgba(15,23,42,0.6);
      border-radius: 12px;
      text-align: center;
      padding: 2rem;
    }
    .error-msg {
      color: var(--error) !important;
      font-weight: 500;
    }
    @media (max-width: 1100px) {
      body { grid-template-columns: 1fr; }
      aside { height: auto; position: relative; border-right: none; border-bottom: 1px solid var(--border); }
      main { padding: 2rem 1.5rem; }
    }
  </style>
</head>
<body>

<aside>
  <div class="logo">OES Meters</div>

  <h2>Time Period</h2>
  <button class="period-btn active" data-period="7days">Last 7 days</button>
  <button class="period-btn" data-period="4weeks">4 week rolling</button>
  <button class="period-btn" data-period="6months">6 months</button>
  <button class="period-btn" data-period="year">Year to date</button>

  <h2>Team Leader</h2>
  <button class="team-btn active" data-team="all">All Teams</button>
  <button class="team-btn" data-team="Ali Cavan">Ali Cavan</button>
  <button class="team-btn" data-team="Craig Barnes">Craig Barnes</button>
  <button class="team-btn" data-team="Paul Simpson">Paul Simpson</button>
  <button class="team-btn" data-team="Richard Wiecko">Richard Wiecko</button>
  <button class="team-btn" data-team="Scott Carson">Scott Carson</button>
  <button class="team-btn" data-team="Stuart Whyte">Stuart Whyte</button>
  <button class="team-btn" data-team="Subbies">Subbies</button>
</aside>

<main>
  <header>
    <h1>Meters Installed</h1>
  </header>

  <div class="card">
    <div id="chartContainer">
      <div class="loading">Loading performance data…</div>
    </div>
  </div>
</main>

<script type="module">
  // ──────────────────────────────────────────────────────────────
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
    authDomain: "oesperformance-a54c0.firebaseapp.com",
    projectId: "oesperformance-a54c0",
    storageBucket: "oesperformance-a54c0.firebasestorage.app",
    messagingSenderId: "484894102454",
    appId: "1:484894102454:web:17535ee497eac2d90d6717",
    measurementId: "G-R56BGZYV8N"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // ──────────────────────────────────────────────────────────────
  const ctx = document.createElement('canvas');
  document.querySelector('#chartContainer').appendChild(ctx);
  let chart = null;

  const periods = {
    "7days":   { label: "Last 7 days",          daysBack: 7,   color: "#6366f1" },
    "4weeks":  { label: "4 week rolling",       daysBack: 28,  color: "#8b5cf6" },
    "6months": { label: "Last 6 months",        daysBack: 180, color: "#a78bfa" },
    "year":    { label: "Year to date",         daysBack: 365, color: "#c084fc" },
  };

  let currentPeriod = "7days";
  let currentTeam   = "all";

  // ─── Fetch & aggregate meters ────────────────────────────────
  async function fetchAndAggregateMeters(periodKey, team) {
    const cfg = periods[periodKey];
    const today = new Date();
    const start = new Date(today);
    start.setDate(start.getDate() - cfg.daysBack);

    const startDate = start.toISOString().split('T')[0];
    const endDate   = today.toISOString().split('T')[0];

    const q = query(
      collection(db, "performance"),
      where("date", ">=", startDate),
      where("date", "<=", endDate),
      orderBy("date", "asc")
    );

    let snapshot;
    try {
      snapshot = await getDocs(q);
    } catch (err) {
      if (err.code === 'failed-precondition' || err.message?.includes('index')) {
        throw new Error(
          "Missing Firestore index. " +
          "Open browser console (F12) — look for a blue URL starting with https://console.firebase.google.com/…/indexes — click it, create the index, wait 2–5 minutes, then refresh this page."
        );
      }
      if (err.code === 'permission-denied') {
        throw new Error(
          "Permission denied. Your Firestore security rules do not allow unauthenticated reads. " +
          "Either enable Anonymous sign-in (Authentication → Sign-in method), or change rules to allow read: if true; for testing."
        );
      }
      throw err;
    }

    let records = [];
    snapshot.forEach(doc => {
      const d = doc.data();
      if (team === "all" || d.teamLeader === team) {
        records.push(d);
      }
    });

    // Build weekday dates (Mon–Fri) like original code
    const allWeekdayDates = [];
    const current = new Date(start);
    while (current <= today) {
      const dayOfWeek = current.getDay();
      if (dayOfWeek !== 0 && dayOfWeek !== 6) {
        allWeekdayDates.push(current.toISOString().split('T')[0]);
      }
      current.setDate(current.getDate() + 1);
    }

    const dateMap = {};
    allWeekdayDates.forEach(date => dateMap[date] = 0);

    records.forEach(r => {
      if (dateMap[r.date] !== undefined) {
        dateMap[r.date] += Number(r.meters || 0);
      }
    });

    return {
      labels: allWeekdayDates.map(d => d.slice(5)), // MM-DD
      values: allWeekdayDates.map(d => Math.round(dateMap[d] || 0)),
      dates: allWeekdayDates
    };
  }

  // ─── Update chart ─────────────────────────────────────────────
  async function updateChart() {
    const container = document.querySelector('#chartContainer');
    container.innerHTML = '<div class="loading">Loading performance data…</div>';

    try {
      const data = await fetchAndAggregateMeters(currentPeriod, currentTeam);
      const cfg = periods[currentPeriod];

      if (chart) chart.destroy();

      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: data.labels,
          datasets: [{
            label: `Meters (${currentTeam === 'all' ? 'All Teams' : currentTeam})`,
            data: data.values,
            borderColor: cfg.color,
            backgroundColor: 'rgba(99,102,241,0.12)',
            borderWidth: 3,
            tension: 0.35,
            fill: true,
            pointRadius: 3,
            pointHoverRadius: 7,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            title: {
              display: true,
              text: `${cfg.label} – Meters Installed`,
              color: '#e2e8f0',
              font: { size: 18, weight: '600' },
              padding: { bottom: 20 }
            },
            legend: { labels: { color: '#cbd5e1', font: { size: 14 } } }
          },
          scales: {
            x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
            y: {
              beginAtZero: true,
              ticks: { color: '#94a3b8', stepSize: 50 },
              grid: { color: '#334155' }
            }
          }
        }
      });
    } catch (err) {
      console.error("Error:", err);
      let msg = err.message || "Unknown error occurred";

      container.innerHTML = `
        <div class="error-msg">
          ${msg}<br><br>
          <small>Open DevTools (F12) → Console tab for full error details.</small>
        </div>`;
    }
  }

  // ─── Event listeners ──────────────────────────────────────────
  document.querySelectorAll('.period-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentPeriod = btn.dataset.period;
      updateChart();
    });
  });

  document.querySelectorAll('.team-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.team-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTeam = btn.dataset.team;
      updateChart();
    });
  });

  // Initial load — same as original page
  updateChart();
</script>

</body>
</html>
