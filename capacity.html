<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Capacity Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #151b2e;
            --bg-card: #1a2235;
            --accent-primary: #00d4ff;
            --accent-secondary: #7c3aed;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: #2d3748;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --shadow: rgba(0, 212, 255, 0.1);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, #0f1425 50%, var(--bg-primary) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 30%, rgba(0, 212, 255, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(124, 58, 237, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        .container {
            max-width: 1600px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        header {
            margin-bottom: 3rem;
            animation: slideDown 0.6s ease-out;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }
        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            font-weight: 300;
        }
        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            align-items: center;
            animation: fadeIn 0.6s ease-out 0.2s both;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .month-nav {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: var(--bg-card);
            padding: 1rem 1.5rem;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .month-nav button {
            background: transparent;
            border: none;
            color: var(--accent-primary);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .month-nav button:hover {
            background: rgba(0, 212, 255, 0.1);
            transform: scale(1.1);
        }
        .current-month {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.3rem;
            font-weight: 600;
            min-width: 200px;
            text-align: center;
            letter-spacing: 0.02em;
        }
        .filter-group {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }
        select, input, button.btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.75rem 1.25rem;
            border-radius: 12px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        select:focus, input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
        }
        select:hover, button.btn:hover {
            border-color: var(--accent-primary);
            background: var(--bg-secondary);
        }
        button.btn {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            font-weight: 600;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            font-size: 0.85rem;
            box-shadow: 0 4px 15px var(--shadow);
            position: relative;
            overflow: hidden;
        }
        button.btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        button.btn:hover::before {
            left: 100%;
        }
        button.btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px var(--shadow);
        }
        .action-buttons {
            margin-left: auto;
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
            animation: fadeIn 0.6s ease-out 0.4s both;
        }
        .day-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.25rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }
        .day-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }
        .day-card:hover::before {
            transform: scaleX(1);
        }
        .day-card:hover {
            transform: translateY(-4px);
        }
        .day-name {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 0.25rem;
            font-weight: 600;
        }
        .day-number {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 1rem;
            font-family: 'JetBrains Mono', monospace;
        }
        .capacity-info {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .capacity-bar {
            width: 100%;
            height: 8px;
            background: var(--bg-secondary);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        .capacity-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--success), var(--accent-primary));
            border-radius: 10px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .capacity-fill.medium {
            background: linear-gradient(90deg, var(--warning), #fbbf24);
        }
        .capacity-fill.high {
            background: linear-gradient(90deg, var(--danger), #f87171);
        }
        .capacity-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
        }
        .stat-card::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, var(--accent-primary), transparent);
            opacity: 0.05;
            transform: translate(30%, -30%);
        }
        .stat-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            background: linear-gradient(135deg, var(--accent-primary), var(--text-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease-out;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 2.5rem;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        .modal-title {
            font-size: 1.75rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .close-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
            transition: all 0.3s ease;
            border-radius: 8px;
        }
        .close-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
            transform: rotate(90deg);
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .form-group input,
        .form-group select {
            width: 100%;
        }
        .form-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 2rem;
        }
        .btn-secondary {
            background: var(--bg-card);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover {
            background: var(--bg-secondary);
            border-color: var(--text-muted);
        }
        .team-list {
            display: grid;
            gap: 0.75rem;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 1.5rem;
            padding-right: 0.5rem;
        }
        .team-member {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            gap: 0.75rem;
        }
        .team-member:hover {
            border-color: var(--accent-primary);
            transform: translateX(4px);
        }
        .member-info {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }
        .member-name {
            font-weight: 600;
            font-size: 1rem;
        }
        .member-details {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }
        .team-member-actions {
            display: flex;
            gap: 0.5rem;
        }
        .edit-btn {
            background: transparent;
            border: 1px solid var(--accent-primary);
            color: var(--accent-primary);
            padding: 0.4rem 0.9rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .edit-btn:hover {
            background: rgba(0, 212, 255, 0.15);
        }
        .delete-btn {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .delete-btn:hover {
            background: var(--danger);
            color: white;
        }
        .absence-list {
            display: grid;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }
        .absence-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }
        .absence-item:hover {
            border-color: var(--accent-primary);
        }
        .absence-info {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }
        .absence-name {
            font-weight: 600;
            font-size: 1rem;
        }
        .absence-type {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }
        .absence-dates {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }
        .empty-message {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent-primary);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-secondary);
        }
        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            font-size: 1.1rem;
        }
        .spinner {
            border: 3px solid var(--bg-secondary);
            border-top: 3px solid var(--accent-primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .controls { flex-direction: column; align-items: stretch; }
            .action-buttons { margin-left: 0; }
            .calendar-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Team Capacity</h1>
            <div class="subtitle">Engineer availability across teams and contracts</div>
        </header>
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-label">Total Engineers</div>
                <div class="stat-value" id="totalEngineers">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">On Holiday Today</div>
                <div class="stat-value" id="holidayToday">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Avg Capacity</div>
                <div class="stat-value" id="avgCapacity">100%</div>
            </div>
        </div>
        <div class="controls">
            <div class="month-nav">
                <button id="prevMonth">‹</button>
                <div class="current-month" id="currentMonth"></div>
                <button id="nextMonth">›</button>
            </div>
            <div class="filter-group">
                <select id="teamFilter">
                    <option value="all">All Teams</option>
                    <option value="Ali Cavan">Ali Cavan</option>
                    <option value="Craig Barnes">Craig Barnes</option>
                    <option value="Paul Simpson">Paul Simpson</option>
                    <option value="Richard Wiecko">Richard Wiecko</option>
                    <option value="Scott Carson">Scott Carson</option>
                    <option value="Stuart Whyte">Stuart Whyte</option>
                    <option value="Subbies">Subbies</option>
                </select>
                <select id="contractFilter">
                    <option value="all">All Contracts</option>
                    <option value="EDF">EDF</option>
                    <option value="Scottish Power">Scottish Power</option>
                    <option value="OES">OES</option>
                </select>
            </div>
            <div class="action-buttons">
                <button class="btn" onclick="openModal('holidayModal')">+ Holiday</button>
                <button class="btn" onclick="openModal('headcountModal')">Update Headcount</button>
                <button class="btn" onclick="openModal('memberModal')">+ Engineer</button>
            </div>
        </div>
        <div class="calendar-grid" id="calendarGrid">
            <div class="loading">
                <div class="spinner"></div>
                Loading calendar...
            </div>
        </div>
    </div>

    <!-- Day Details Modal -->
    <div id="dayDetailsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="dayDetailsTitle">Day Details</h2>
                <button class="close-btn" onclick="closeModal('dayDetailsModal')">×</button>
            </div>
            <div id="dayDetailsContent"></div>
        </div>
    </div>

    <!-- Holiday / AAUP Modal -->
    <div id="holidayModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Add/Edit Holiday / AAUP</h2>
                <button class="close-btn" onclick="closeModal('holidayModal')">×</button>
            </div>
            <form id="holidayForm">
                <div class="form-group">
                    <label>Engineer</label>
                    <select id="holidayEngineer" required>
                        <option value="">Select Engineer</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Start Date</label>
                    <input type="date" id="holidayStart" required>
                </div>
                <div class="form-group">
                    <label>End Date</label>
                    <input type="date" id="holidayEnd" required>
                </div>
                <div class="form-group">
                    <label>Type</label>
                    <select id="holidayType" required>
                        <option value="full">Full Day Holiday</option>
                        <option value="half">Half Day Holiday</option>
                        <option value="aaup">AAUP</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('holidayModal')">Cancel</button>
                    <button type="submit" class="btn">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Headcount Modal -->
    <div id="headcountModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Update Headcount</h2>
                <button class="close-btn" onclick="closeModal('headcountModal')">×</button>
            </div>
            <form id="headcountForm">
                <div class="form-group">
                    <label>Team Leader</label>
                    <select id="headcountTeam" required>
                        <option value="">Select Team</option>
                        <option value="Ali Cavan">Ali Cavan</option>
                        <option value="Craig Barnes">Craig Barnes</option>
                        <option value="Paul Simpson">Paul Simpson</option>
                        <option value="Scott Carson">Scott Carson</option>
                        <option value="Richard Wiecko">Richard Wiecko</option>
                        <option value="Stuart Whyte">Stuart Whyte</option>
                        <option value="Subbies">Subbies</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Total Engineers</label>
                    <input type="number" id="headcountNumber" min="0" required>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('headcountModal')">Cancel</button>
                    <button type="submit" class="btn">Update</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Member Modal (Add / Edit Engineers) -->
    <div id="memberModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Manage Engineers</h2>
                <button class="close-btn" onclick="closeModal('memberModal')">×</button>
            </div>
            <form id="memberForm">
                <input type="hidden" id="editingEngineerId" value="">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="memberName" required>
                </div>
                <div class="form-group">
                    <label>Team Leader</label>
                    <select id="memberTeam" required>
                        <option value="">Select Team</option>
                        <option value="Ali Cavan">Ali Cavan</option>
                        <option value="Craig Barnes">Craig Barnes</option>
                        <option value="Paul Simpson">Paul Simpson</option>
                        <option value="Richard Wiecko">Richard Wiecko</option>
                        <option value="Scott Carson">Scott Carson</option>
                        <option value="Stuart Whyte">Stuart Whyte</option>
                        <option value="Subbies">Subbies</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Contract</label>
                    <select id="memberContract" required>
                        <option value="">Select Contract</option>
                        <option value="EDF">EDF</option>
                        <option value="Scottish Power">Scottish Power</option>
                        <option value="OES">OES</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('memberModal')">Cancel</button>
                    <button type="submit" class="btn" id="memberSubmitBtn">Add Engineer</button>
                </div>
            </form>
            <div class="team-list" id="teamList"></div>
        </div>
    </div>

    <!-- Firebase SDK + Application Logic -->

        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
            authDomain: "oesperformance-a54c0.firebaseapp.com",
            projectId: "oesperformance-a54c0",
            storageBucket: "oesperformance-a54c0.firebasestorage.app",
            messagingSenderId: "484894102454",
            appId: "1:484894102454:web:17535ee497eac2d90d6717",
            measurementId: "G-R56BGZYV8N"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Helpers – display uses local parsing, comparison uses UTC
        function displayDate(str) {
            return new Date(str); // local midnight
        }

        function compareDate(str) {
            return new Date(str + "T00:00:00Z"); // UTC midnight for range checks
        }

        // Global state
        let currentDate = new Date();
        let engineers = [];
        let holidays = [];
        let headcounts = {};

        // Modal helpers
        window.openModal = function(modalId) {
            document.getElementById(modalId).classList.add('active');
        };

        window.closeModal = function(modalId) {
            document.getElementById(modalId).classList.remove('active');
            if (modalId === 'memberModal') resetMemberForm();
        };

        function resetMemberForm() {
            document.getElementById('memberForm').reset();
            document.getElementById('editingEngineerId').value = '';
            document.getElementById('memberSubmitBtn').textContent = 'Add Engineer';
        }

        async function loadData() {
            const engineersSnap = await getDocs(collection(db, 'capacity', 'data', 'engineers'));
            engineers = engineersSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            engineers.sort((a, b) => a.name.localeCompare(b.name));

            const holidaysSnap = await getDocs(collection(db, 'capacity', 'data', 'holidays'));
            holidays = holidaysSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));

            const headcountsSnap = await getDocs(collection(db, 'capacity', 'data', 'headcounts'));
            headcounts = {};
            headcountsSnap.docs.forEach(doc => {
                const data = doc.data();
                headcounts[data.team] = { id: doc.id, count: data.count };
            });

            const engineerSelect = document.getElementById('holidayEngineer');
            engineerSelect.innerHTML = '<option value="">Select Engineer</option>';
            engineers.forEach(eng => {
                const option = document.createElement('option');
                option.value = eng.id;
                option.textContent = `${eng.name} (${eng.team})`;
                engineerSelect.appendChild(option);
            });

            renderTeamList();
        }

        function renderTeamList() {
            const teamList = document.getElementById('teamList');
            teamList.innerHTML = '';
            engineers.forEach(eng => {
                const div = document.createElement('div');
                div.className = 'team-member';
                div.innerHTML = `
                    <div class="member-info">
                        <div class="member-name">${eng.name}</div>
                        <div class="member-details">${eng.team} • ${eng.contract}</div>
                    </div>
                    <div class="team-member-actions">
                        <button class="edit-btn" onclick="editMember('${eng.id}', '${eng.name.replace(/'/g,"\\'")}', '${eng.team.replace(/'/g,"\\'")}', '${eng.contract.replace(/'/g,"\\'")}')">Edit</button>
                        <button class="delete-btn" onclick="deleteMember('${eng.id}')">Delete</button>
                    </div>
                `;
                teamList.appendChild(div);
            });
        }

        window.editMember = function(id, name, team, contract) {
            document.getElementById('editingEngineerId').value = id;
            document.getElementById('memberName').value = name;
            document.getElementById('memberTeam').value = team;
            document.getElementById('memberContract').value = contract;
            document.getElementById('memberSubmitBtn').textContent = 'Save Changes';
            openModal('memberModal');
        };

        window.deleteMember = async function(id) {
            if (!confirm('Are you sure you want to delete this engineer?')) return;
            await deleteDoc(doc(db, 'capacity', 'data', 'engineers', id));
            engineers = engineers.filter(e => e.id !== id);
            renderTeamList();
            const engineerSelect = document.getElementById('holidayEngineer');
            engineerSelect.innerHTML = '<option value="">Select Engineer</option>';
            engineers.forEach(eng => {
                const option = document.createElement('option');
                option.value = eng.id;
                option.textContent = `${eng.name} (${eng.team})`;
                engineerSelect.appendChild(option);
            });
            renderCalendar();
            updateStats();
        };

        window.showDayDetails = function(dateStr, filteredEngineers) {
            const dispDate = displayDate(dateStr);

            document.getElementById('dayDetailsTitle').textContent = dispDate.toLocaleDateString('en-US', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });

            const currentComp = compareDate(dateStr);

            const absencesOnDay = holidays.filter(h => {
                const start = compareDate(h.startDate);
                const end   = compareDate(h.endDate);
                return currentComp >= start && currentComp <= end && filteredEngineers.some(e => e.id === h.engineerId);
            }).map(h => {
                const engineer = engineers.find(e => e.id === h.engineerId);
                return { ...h, engineerName: engineer ? engineer.name : 'Unknown' };
            });

            const content = document.getElementById('dayDetailsContent');

            if (absencesOnDay.length === 0) {
                content.innerHTML = '<div class="empty-message">✅ All engineers available on this day</div>';
            } else {
                content.innerHTML = `
                    <div class="absence-list">
                        ${absencesOnDay.map(absence => {
                            const typeLabel = absence.type === 'full' ? 'Full Day Holiday' :
                                             absence.type === 'half' ? 'Half Day Holiday' : 'AAUP';
                            const startDisp = displayDate(absence.startDate).toLocaleDateString('en-GB');
                            const endDisp   = displayDate(absence.endDate).toLocaleDateString('en-GB');
                            const dateRange = startDisp === endDisp ? startDisp : `${startDisp} - ${endDisp}`;

                            return `
                                <div class="absence-item">
                                    <div class="absence-info">
                                        <div class="absence-name">${absence.engineerName}</div>
                                        <div class="absence-type">${typeLabel}</div>
                                        <div class="absence-dates">Period: ${dateRange}</div>
                                    </div>
                                    <button class="delete-btn" onclick="deleteHolidayEntry('${absence.id}', '${dateStr}')">
                                        Delete for ${dispDate.getDate()}/${dispDate.getMonth() + 1}
                                    </button>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            }
            openModal('dayDetailsModal');
        };

        window.deleteHolidayEntry = async function(holidayId, dateStr) {
            const holiday = holidays.find(h => h.id === holidayId);
            if (!holiday) return;

            const targetComp = compareDate(dateStr);
            const startComp  = compareDate(holiday.startDate);
            const endComp    = compareDate(holiday.endDate);

            const targetDisp = displayDate(dateStr);

            if (confirm(`Delete this absence entry for ${targetDisp.toLocaleDateString('en-GB')}?`)) {
                if (startComp.toDateString() === endComp.toDateString()) {
                    await deleteDoc(doc(db, 'capacity', 'data', 'holidays', holidayId));
                } else if (targetComp.toDateString() === startComp.toDateString()) {
                    const newStart = new Date(targetComp);
                    newStart.setDate(newStart.getDate() + 1);
                    await updateDoc(doc(db, 'capacity', 'data', 'holidays', holidayId), {
                        startDate: newStart.toISOString().split('T')[0]
                    });
                } else if (targetComp.toDateString() === endComp.toDateString()) {
                    const newEnd = new Date(targetComp);
                    newEnd.setDate(newEnd.getDate() - 1);
                    await updateDoc(doc(db, 'capacity', 'data', 'holidays', holidayId), {
                        endDate: newEnd.toISOString().split('T')[0]
                    });
                } else {
                    const dayBefore = new Date(targetComp);
                    dayBefore.setDate(dayBefore.getDate() - 1);
                    const dayAfter = new Date(targetComp);
                    dayAfter.setDate(dayAfter.getDate() + 1);

                    await updateDoc(doc(db, 'capacity', 'data', 'holidays', holidayId), {
                        endDate: dayBefore.toISOString().split('T')[0]
                    });

                    await addDoc(collection(db, 'capacity', 'data', 'holidays'), {
                        engineerId: holiday.engineerId,
                        startDate: dayAfter.toISOString().split('T')[0],
                        endDate: holiday.endDate,
                        type: holiday.type
                    });
                }

                await loadData();
                renderCalendar();
                updateStats();

                const teamFilter = document.getElementById('teamFilter').value;
                const contractFilter = document.getElementById('contractFilter').value;
                let filteredEngineers = engineers;
                if (teamFilter !== 'all') filteredEngineers = filteredEngineers.filter(e => e.team === teamFilter);
                if (contractFilter !== 'all') filteredEngineers = filteredEngineers.filter(e => e.contract === contractFilter);

                showDayDetails(dateStr, filteredEngineers);
            }
        };

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            document.getElementById('currentMonth').textContent = currentDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);

            const teamFilter = document.getElementById('teamFilter').value;
            const contractFilter = document.getElementById('contractFilter').value;
            let filteredEngineers = engineers;
            if (teamFilter !== 'all') filteredEngineers = filteredEngineers.filter(e => e.team === teamFilter);
            if (contractFilter !== 'all') filteredEngineers = filteredEngineers.filter(e => e.contract === contractFilter);

            const totalEngineers = filteredEngineers.length;

            let d = new Date(firstDay);
            while (d <= lastDay) {
                // Create explicit local midnight to avoid DST transition bugs
                const currentDay = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, 0, 0, 0);
                const dayOfWeek = currentDay.getDay();

                // Only Monday to Friday
                if (dayOfWeek >= 1 && dayOfWeek <= 5) {
                    const dateStr = currentDay.toISOString().split('T')[0];
                    const currentComp = compareDate(dateStr);

                    const onHolidayCount = holidays.reduce((count, h) => {
                        const start = compareDate(h.startDate);
                        const end   = compareDate(h.endDate);
                        const isOnHoliday = currentComp >= start && currentComp <= end && filteredEngineers.some(e => e.id === h.engineerId);
                        return isOnHoliday ? count + (h.type === 'half' ? 0.5 : 1) : count;
                    }, 0);

                    const availablePercentage = totalEngineers > 0 ? Math.round(((totalEngineers - onHolidayCount) / totalEngineers) * 100) : 100;

                    const dispDate = displayDate(dateStr);

                    const dayCard = document.createElement('div');
                    dayCard.className = 'day-card';

                    let capacityClass = '';
                    let cardStyle = '';
                    if (availablePercentage < 85) {
                        capacityClass = 'high';
                        cardStyle = 'border: 2px solid var(--danger); box-shadow: 0 0 20px rgba(239,68,68,0.3);';
                    } else if (availablePercentage < 90) {
                        capacityClass = 'medium';
                        cardStyle = 'border: 2px solid var(--warning); box-shadow: 0 0 20px rgba(245,158,11,0.3);';
                    }
                    dayCard.setAttribute('style', cardStyle);

                    dayCard.innerHTML = `
                        <div class="day-name">${dispDate.toLocaleDateString('en-US', { weekday: 'short' })}</div>
                        <div class="day-number">${dispDate.getDate()}</div>
                        <div class="capacity-info">
                            <div class="capacity-bar">
                                <div class="capacity-fill ${capacityClass}" style="width: ${availablePercentage}%"></div>
                            </div>
                            <div class="capacity-text">${availablePercentage}% available</div>
                        </div>
                    `;

                    dayCard.addEventListener('click', () => showDayDetails(dateStr, filteredEngineers));
                    grid.appendChild(dayCard);
                }

                d.setDate(d.getDate() + 1);
            }
        }

        function updateStats() {
            const teamFilter = document.getElementById('teamFilter').value;
            const contractFilter = document.getElementById('contractFilter').value;
            let filteredEngineers = engineers;
            if (teamFilter !== 'all') filteredEngineers = filteredEngineers.filter(e => e.team === teamFilter);
            if (contractFilter !== 'all') filteredEngineers = filteredEngineers.filter(e => e.contract === contractFilter);

            document.getElementById('totalEngineers').textContent = filteredEngineers.length;

            const todayStr = new Date().toISOString().split('T')[0];
            const todayComp = compareDate(todayStr);

            const holidayToday = holidays.reduce((count, h) => {
                const start = compareDate(h.startDate);
                const end   = compareDate(h.endDate);
                const isOnHoliday = todayComp >= start && todayComp <= end && filteredEngineers.some(e => e.id === h.engineerId);
                return isOnHoliday ? count + (h.type === 'half' ? 0.5 : 1) : count;
            }, 0);
            document.getElementById('holidayToday').textContent = holidayToday;

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);

            let totalCapacity = 0;
            let workingDays = 0;

            let d = new Date(firstDay);
            while (d <= lastDay) {
                const currentDay = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, 0, 0, 0);
                const dayOfWeek = currentDay.getDay();

                if (dayOfWeek >= 1 && dayOfWeek <= 5) {
                    workingDays++;

                    const dateStr = currentDay.toISOString().split('T')[0];
                    const currentComp = compareDate(dateStr);

                    const onHolidayCount = holidays.reduce((count, h) => {
                        const start = compareDate(h.startDate);
                        const end   = compareDate(h.endDate);
                        const isOnHoliday = currentComp >= start && currentComp <= end && filteredEngineers.some(e => e.id === h.engineerId);
                        return isOnHoliday ? count + (h.type === 'half' ? 0.5 : 1) : count;
                    }, 0);

                    const capacity = filteredEngineers.length > 0 ? ((filteredEngineers.length - onHolidayCount) / filteredEngineers.length) * 100 : 100;
                    totalCapacity += capacity;
                }

                d.setDate(d.getDate() + 1);
            }

            const avgCapacity = workingDays > 0 ? Math.round(totalCapacity / workingDays) : 100;
            document.getElementById('avgCapacity').textContent = avgCapacity + '%';
        }

        function setupEventListeners() {
            document.getElementById('prevMonth').addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() - 1);
                renderCalendar();
                updateStats();
            });

            document.getElementById('nextMonth').addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() + 1);
                renderCalendar();
                updateStats();
            });

            document.getElementById('teamFilter').addEventListener('change', () => {
                renderCalendar();
                updateStats();
            });

            document.getElementById('contractFilter').addEventListener('change', () => {
                renderCalendar();
                updateStats();
            });

            document.getElementById('holidayForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const engineerId = document.getElementById('holidayEngineer').value;
                const startDate = document.getElementById('holidayStart').value;
                const endDate = document.getElementById('holidayEnd').value;
                const type = document.getElementById('holidayType').value;

                await addDoc(collection(db, 'capacity', 'data', 'holidays'), {
                    engineerId,
                    startDate,
                    endDate,
                    type
                });

                closeModal('holidayModal');
                document.getElementById('holidayForm').reset();
                await loadData();
                renderCalendar();
                updateStats();
            });

            document.getElementById('headcountForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const team = document.getElementById('headcountTeam').value;
                const count = parseInt(document.getElementById('headcountNumber').value);

                if (headcounts[team]) {
                    await updateDoc(doc(db, 'capacity', 'data', 'headcounts', headcounts[team].id), { count });
                } else {
                    await addDoc(collection(db, 'capacity', 'data', 'headcounts'), { team, count });
                }

                closeModal('headcountModal');
                document.getElementById('headcountForm').reset();
                await loadData();
                updateStats();
            });

            document.getElementById('memberForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const id = document.getElementById('editingEngineerId').value;
                const name = document.getElementById('memberName').value.trim();
                const team = document.getElementById('memberTeam').value;
                const contract = document.getElementById('memberContract').value;

                if (!name || !team || !contract) return;

                if (id) {
                    await updateDoc(doc(db, 'capacity', 'data', 'engineers', id), { name, team, contract });
                } else {
                    await addDoc(collection(db, 'capacity', 'data', 'engineers'), { name, team, contract });
                }

                closeModal('memberModal');
                await loadData();
                renderCalendar();
                updateStats();
            });
        }

        async function init() {
            await loadData();
            renderCalendar();
            setupEventListeners();
            updateStats();
        }

        init();
    </script>
</body>
</html>
