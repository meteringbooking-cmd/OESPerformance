<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Capacity Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #151b2e;
            --bg-card: #1a2235;
            --accent-primary: #00d4ff;
            --accent-secondary: #7c3aed;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: #2d3748;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --shadow: rgba(0, 212, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, #0f1425 50%, var(--bg-primary) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 212, 255, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(124, 58, 237, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        header {
            margin-bottom: 3rem;
            animation: slideDown 0.6s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            font-weight: 300;
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            align-items: center;
            animation: fadeIn 0.6s ease-out 0.2s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .month-nav {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: var(--bg-card);
            padding: 1rem 1.5rem;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .month-nav button {
            background: transparent;
            border: none;
            color: var(--accent-primary);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .month-nav button:hover {
            background: rgba(0, 212, 255, 0.1);
            transform: scale(1.1);
        }

        .current-month {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.3rem;
            font-weight: 600;
            min-width: 200px;
            text-align: center;
            letter-spacing: 0.02em;
        }

        .filter-group {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        select, input, button.btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.75rem 1.25rem;
            border-radius: 12px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
        }

        select:hover, button.btn:hover {
            border-color: var(--accent-primary);
            background: var(--bg-secondary);
        }

        button.btn {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            font-weight: 600;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            font-size: 0.85rem;
            box-shadow: 0 4px 15px var(--shadow);
            position: relative;
            overflow: hidden;
        }

        button.btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        button.btn:hover::before {
            left: 100%;
        }

        button.btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px var(--shadow);
        }

        .action-buttons {
            margin-left: auto;
            display: flex;
            gap: 0.75rem;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
            animation: fadeIn 0.6s ease-out 0.4s both;
        }

        .day-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.25rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .day-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .day-card:hover::before {
            transform: scaleX(1);
        }

        .day-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-primary);
            box-shadow: 0 8px 30px rgba(0, 212, 255, 0.2);
        }

        .day-card.weekend {
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.05), rgba(0, 212, 255, 0.05));
            border-color: rgba(124, 58, 237, 0.3);
        }

        .day-name {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 0.25rem;
            font-weight: 600;
        }

        .day-number {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 1rem;
            font-family: 'JetBrains Mono', monospace;
        }

        .capacity-info {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .capacity-bar {
            width: 100%;
            height: 8px;
            background: var(--bg-secondary);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .capacity-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--success), var(--accent-primary));
            border-radius: 10px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .capacity-fill.medium {
            background: linear-gradient(90deg, var(--warning), #fbbf24);
        }

        .capacity-fill.high {
            background: linear-gradient(90deg, var(--danger), #f87171);
        }

        .capacity-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .stat-card::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, var(--accent-primary), transparent);
            opacity: 0.05;
            transform: translate(30%, -30%);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            background: linear-gradient(135deg, var(--accent-primary), var(--text-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease-out;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 2.5rem;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .modal-title {
            font-size: 1.75rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .close-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
            transition: all 0.3s ease;
            border-radius: 8px;
        }

        .close-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
            transform: rotate(90deg);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-group input,
        .form-group select {
            width: 100%;
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 2rem;
        }

        .btn-secondary {
            background: var(--bg-card);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--bg-secondary);
            border-color: var(--text-muted);
        }

        .team-list {
            display: grid;
            gap: 0.75rem;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 1rem;
            padding-right: 0.5rem;
        }

        .team-member {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .team-member:hover {
            border-color: var(--accent-primary);
            transform: translateX(4px);
        }

        .member-info {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .member-name {
            font-weight: 600;
            font-size: 1rem;
        }

        .member-details {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .delete-btn {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .delete-btn:hover {
            background: var(--danger);
            color: white;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent-primary);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-secondary);
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .spinner {
            border: 3px solid var(--bg-secondary);
            border-top: 3px solid var(--accent-primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .action-buttons {
                margin-left: 0;
            }

            .calendar-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }
        }

        /* Establishment Report Styles */
        #establishmentTable {
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
        }

        #establishmentTable th {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            padding: 1rem 0.75rem;
            text-align: center;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            border: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        #establishmentTable th.name-column {
            text-align: left;
            position: sticky;
            left: 0;
            z-index: 11;
            min-width: 150px;
        }

        #establishmentTable td {
            border: 1px solid var(--border);
            padding: 0.5rem;
            text-align: center;
            transition: all 0.2s ease;
        }

        #establishmentTable td.name-cell {
            text-align: left;
            font-weight: 600;
            background: var(--bg-secondary);
            position: sticky;
            left: 0;
            z-index: 5;
        }

        #establishmentTable td.weekend {
            background: rgba(124, 58, 237, 0.05);
        }

        #establishmentTable td.attendance-cell {
            cursor: pointer;
            min-width: 50px;
            height: 40px;
        }

        #establishmentTable td.attendance-cell:hover {
            background: rgba(0, 212, 255, 0.1);
            transform: scale(1.05);
        }

        #establishmentTable td.attendance-cell.has-value {
            font-weight: 600;
        }

        #establishmentTable td.attendance-cell[data-status="X"] {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }

        #establishmentTable td.attendance-cell[data-status="Hol"] {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
        }

        #establishmentTable td.attendance-cell[data-status="Sick"] {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }

        #establishmentTable td.attendance-cell[data-status="AAUP"],
        #establishmentTable td.attendance-cell[data-status="AAP"] {
            background: rgba(124, 58, 237, 0.2);
            color: var(--accent-secondary);
        }

        #establishmentTable td.attendance-cell[data-status="H/H"] {
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning);
        }

        #establishmentTable td.attendance-cell[data-status="AWOL"] {
            background: rgba(239, 68, 68, 0.3);
            color: var(--danger);
            font-weight: 700;
        }

        .attendance-select {
            background: var(--bg-secondary);
            border: 1px solid var(--accent-primary);
            color: var(--text-primary);
            padding: 0.5rem;
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            width: 100%;
        }

        .attendance-select:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Team Capacity</h1>
            <div class="subtitle">Engineer availability across teams and contracts</div>
        </header>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-label">Total Engineers</div>
                <div class="stat-value" id="totalEngineers">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">On Holiday Today</div>
                <div class="stat-value" id="holidayToday">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Avg Capacity</div>
                <div class="stat-value" id="avgCapacity">100%</div>
            </div>
        </div>

        <div class="controls">
            <div class="month-nav">
                <button id="prevMonth">‹</button>
                <div class="current-month" id="currentMonth"></div>
                <button id="nextMonth">›</button>
            </div>

            <div class="filter-group">
                <select id="teamFilter">
                    <option value="all">All Teams</option>
                    <option value="Ali Cavan">Ali Cavan</option>
                    <option value="Craig Barnes">Craig Barnes</option>
                    <option value="Paul Simpson">Paul Simpson</option>
                    <option value="Scott Carson">Scott Carson</option>
                    <option value="Richard Wiecko">Richard Wiecko</option>
                    <option value="Stuart Whyte">Stuart Whyte</option>
                    <option value="Subbies">Subbies</option>
                </select>

                <select id="contractFilter">
                    <option value="all">All Contracts</option>
                    <option value="EDF">EDF</option>
                    <option value="Scottish Power">Scottish Power</option>
                    <option value="OES">OES</option>
                </select>
            </div>

            <div class="action-buttons">
                <button class="btn" onclick="openModal('establishmentModal')">Establishment Report</button>
                <button class="btn" onclick="openModal('holidayModal')">+ Holiday</button>
                <button class="btn" onclick="openModal('headcountModal')">Update Headcount</button>
                <button class="btn" onclick="openModal('memberModal')">+ Engineer</button>
            </div>
        </div>

        <div class="calendar-grid" id="calendarGrid">
            <div class="loading">
                <div class="spinner"></div>
                Loading calendar...
            </div>
        </div>
    </div>

    <!-- Holiday Modal -->
    <div id="holidayModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Add/Edit Holiday</h2>
                <button class="close-btn" onclick="closeModal('holidayModal')">×</button>
            </div>
            <form id="holidayForm">
                <div class="form-group">
                    <label>Engineer</label>
                    <select id="holidayEngineer" required>
                        <option value="">Select Engineer</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Start Date</label>
                    <input type="date" id="holidayStart" required>
                </div>
                <div class="form-group">
                    <label>End Date</label>
                    <input type="date" id="holidayEnd" required>
                </div>
                <div class="form-group">
                    <label>Holiday Type</label>
                    <select id="holidayType" required>
                        <option value="full">Full Day</option>
                        <option value="half">Half Day</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('holidayModal')">Cancel</button>
                    <button type="submit" class="btn">Save Holiday</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Headcount Modal -->
    <div id="headcountModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Update Headcount</h2>
                <button class="close-btn" onclick="closeModal('headcountModal')">×</button>
            </div>
            <form id="headcountForm">
                <div class="form-group">
                    <label>Team Leader</label>
                    <select id="headcountTeam" required>
                        <option value="">Select Team</option>
                        <option value="Ali Cavan">Ali Cavan</option>
                        <option value="Craig Barnes">Craig Barnes</option>
                        <option value="Paul Simpson">Paul Simpson</option>
                        <option value="Scott Carson">Scott Carson</option>
                        <option value="Richard Wiecko">Richard Wiecko</option>
                        <option value="Stuart Whyte">Stuart Whyte</option>
                        <option value="Subbies">Subbies</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Total Engineers</label>
                    <input type="number" id="headcountNumber" min="0" required>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('headcountModal')">Cancel</button>
                    <button type="submit" class="btn">Update</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Member Modal -->
    <div id="memberModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Manage Engineers</h2>
                <button class="close-btn" onclick="closeModal('memberModal')">×</button>
            </div>
            <form id="memberForm">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="memberName" required>
                </div>
                <div class="form-group">
                    <label>Team Leader</label>
                    <select id="memberTeam" required>
                        <option value="">Select Team</option>
                        <option value="Ali Cavan">Ali Cavan</option>
                        <option value="Craig Barnes">Craig Barnes</option>
                        <option value="Paul Simpson">Paul Simpson</option>
                        <option value="Scott Carson">Scott Carson</option>
                        <option value="Richard Wiecko">Richard Wiecko</option>
                        <option value="Stuart Whyte">Stuart Whyte</option>
                        <option value="Subbies">Subbies</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Contract</label>
                    <select id="memberContract" required>
                        <option value="">Select Contract</option>
                        <option value="EDF">EDF</option>
                        <option value="Scottish Power">Scottish Power</option>
                        <option value="OES">OES</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('memberModal')">Cancel</button>
                    <button type="submit" class="btn">Add Engineer</button>
                </div>
            </form>

            <div class="team-list" id="teamList"></div>
        </div>
    </div>

    <!-- Establishment Report Modal -->
    <div id="establishmentModal" class="modal">
        <div class="modal-content" style="max-width: 95%; max-height: 95vh;">
            <div class="modal-header">
                <h2 class="modal-title">Establishment Report</h2>
                <div style="display: flex; gap: 1rem; align-items: center;">
                    <button class="btn" style="padding: 0.5rem 1rem;" id="prevReportMonth">‹</button>
                    <div class="current-month" style="min-width: 180px;" id="reportMonth"></div>
                    <button class="btn" style="padding: 0.5rem 1rem;" id="nextReportMonth">›</button>
                    <button class="close-btn" onclick="closeModal('establishmentModal')">×</button>
                </div>
            </div>
            
            <div style="overflow: auto; max-height: calc(90vh - 120px);">
                <table id="establishmentTable" style="width: 100%; border-collapse: collapse; font-size: 0.9rem;">
                    <!-- Table will be generated by JavaScript -->
                </table>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, getDocs, query, where, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
            authDomain: "oesperformance-a54c0.firebaseapp.com",
            projectId: "oesperformance-a54c0",
            storageBucket: "oesperformance-a54c0.firebasestorage.app",
            messagingSenderId: "484894102454",
            appId: "1:484894102454:web:17535ee497eac2d90d6717",
            measurementId: "G-R56BGZYV8N"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Global state
        let currentDate = new Date();
        let reportDate = new Date();
        let engineers = [];
        let holidays = [];
        let headcounts = {};
        let attendance = {}; // Store attendance records

        // Modal functions
        window.openModal = function(modalId) {
            document.getElementById(modalId).classList.add('active');
        };

        window.closeModal = function(modalId) {
            document.getElementById(modalId).classList.remove('active');
        };

        function renderEstablishmentReport() {
            const table = document.getElementById('establishmentTable');
            const year = reportDate.getFullYear();
            const month = reportDate.getMonth();

            // Update month display
            document.getElementById('reportMonth').textContent = 
                reportDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

            // Get first and last day of month
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const daysInMonth = lastDay.getDate();

            // Sort engineers alphabetically
            const sortedEngineers = [...engineers].sort((a, b) => a.name.localeCompare(b.name));

            // Build table header
            let headerHTML = '<thead><tr><th class="name-column">Name</th>';
            for (let day = 1; day <= daysInMonth; day++) {
                const date = new Date(year, month, day);
                const dayOfWeek = date.getDay();
                const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
                const dayName = date.toLocaleDateString('en-US', { weekday: 'short' });
                
                headerHTML += `<th class="${isWeekend ? 'weekend' : ''}" title="${dayName} ${day}">
                    <div>${day}</div>
                    <div style="font-size: 0.7rem; opacity: 0.7;">${dayName}</div>
                </th>`;
            }
            headerHTML += '</tr></thead>';

            // Build table body
            let bodyHTML = '<tbody>';
            sortedEngineers.forEach(engineer => {
                bodyHTML += `<tr><td class="name-cell">${engineer.name}</td>`;
                
                for (let day = 1; day <= daysInMonth; day++) {
                    const date = new Date(year, month, day);
                    const dayOfWeek = date.getDay();
                    const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
                    const dateStr = date.toISOString().split('T')[0];
                    const key = `${engineer.id}_${dateStr}`;
                    const currentStatus = attendance[key]?.status || '';
                    
                    bodyHTML += `<td class="attendance-cell ${isWeekend ? 'weekend' : ''} ${currentStatus ? 'has-value' : ''}" 
                                    data-engineer="${engineer.id}" 
                                    data-date="${dateStr}"
                                    data-status="${currentStatus}"
                                    onclick="editAttendance(this)">
                        ${currentStatus}
                    </td>`;
                }
                
                bodyHTML += '</tr>';
            });
            bodyHTML += '</tbody>';

            table.innerHTML = headerHTML + bodyHTML;
        }

        window.editAttendance = async function(cell) {
            const engineerId = cell.getAttribute('data-engineer');
            const date = cell.getAttribute('data-date');
            const currentStatus = cell.getAttribute('data-status');
            const key = `${engineerId}_${date}`;

            // Create a select dropdown
            const select = document.createElement('select');
            select.className = 'attendance-select';
            
            const options = ['', 'X', 'Hol', 'Sick', 'AAUP', 'H/H', 'AWOL', 'AAP'];
            options.forEach(opt => {
                const option = document.createElement('option');
                option.value = opt;
                option.textContent = opt || '(Clear)';
                if (opt === currentStatus) option.selected = true;
                select.appendChild(option);
            });

            // Replace cell content with select
            const originalContent = cell.innerHTML;
            cell.innerHTML = '';
            cell.appendChild(select);
            select.focus();

            // Handle selection
            select.addEventListener('change', async () => {
                const newStatus = select.value;
                
                if (newStatus) {
                    // Update or create attendance record
                    if (attendance[key]) {
                        await updateDoc(doc(db, 'attendance', attendance[key].id), { status: newStatus });
                        attendance[key].status = newStatus;
                    } else {
                        const docRef = await addDoc(collection(db, 'attendance'), {
                            engineerId,
                            date,
                            status: newStatus
                        });
                        attendance[key] = { id: docRef.id, status: newStatus };
                    }
                    
                    cell.setAttribute('data-status', newStatus);
                    cell.innerHTML = newStatus;
                    cell.classList.add('has-value');
                } else {
                    // Delete attendance record
                    if (attendance[key]) {
                        await deleteDoc(doc(db, 'attendance', attendance[key].id));
                        delete attendance[key];
                    }
                    
                    cell.setAttribute('data-status', '');
                    cell.innerHTML = '';
                    cell.classList.remove('has-value');
                }
            });

            // Handle click outside
            select.addEventListener('blur', () => {
                cell.innerHTML = originalContent;
            });
        };

        // Initialize
        async function init() {
            await loadData();
            renderCalendar();
            setupEventListeners();
            updateStats();
        }

        async function loadData() {
            // Load engineers from Firebase
            const engineersSnap = await getDocs(collection(db, 'engineers'));
            engineers = engineersSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));

            // Load holidays from Firebase
            const holidaysSnap = await getDocs(collection(db, 'holidays'));
            holidays = holidaysSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));

            // Load headcounts
            const headcountsSnap = await getDocs(collection(db, 'headcounts'));
            headcounts = {};
            headcountsSnap.docs.forEach(doc => {
                const data = doc.data();
                headcounts[data.team] = { id: doc.id, count: data.count };
            });

            // Load attendance records
            const attendanceSnap = await getDocs(collection(db, 'attendance'));
            attendance = {};
            attendanceSnap.docs.forEach(doc => {
                const data = doc.data();
                const key = `${data.engineerId}_${data.date}`;
                attendance[key] = { id: doc.id, status: data.status };
            });

            // Populate engineer dropdown
            const engineerSelect = document.getElementById('holidayEngineer');
            engineerSelect.innerHTML = '<option value="">Select Engineer</option>';
            engineers.forEach(eng => {
                const option = document.createElement('option');
                option.value = eng.id;
                option.textContent = `${eng.name} (${eng.team})`;
                engineerSelect.appendChild(option);
            });

            // Render team list
            renderTeamList();
        }

        function renderTeamList() {
            const teamList = document.getElementById('teamList');
            teamList.innerHTML = '';

            engineers.forEach(eng => {
                const div = document.createElement('div');
                div.className = 'team-member';
                div.innerHTML = `
                    <div class="member-info">
                        <div class="member-name">${eng.name}</div>
                        <div class="member-details">${eng.team} • ${eng.contract}</div>
                    </div>
                    <button class="delete-btn" onclick="deleteMember('${eng.id}')">Delete</button>
                `;
                teamList.appendChild(div);
            });
        }

        window.deleteMember = async function(id) {
            if (confirm('Are you sure you want to delete this engineer?')) {
                // Delete from Firebase
                await deleteDoc(doc(db, 'engineers', id));
                
                // Reload data
                await loadData();
                renderCalendar();
                updateStats();
            }
        };

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            // Update month display
            document.getElementById('currentMonth').textContent = 
                currentDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

            // Get first and last day of month
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);

            // Get filter values
            const teamFilter = document.getElementById('teamFilter').value;
            const contractFilter = document.getElementById('contractFilter').value;

            // Filter engineers
            let filteredEngineers = engineers;
            if (teamFilter !== 'all') {
                filteredEngineers = filteredEngineers.filter(e => e.team === teamFilter);
            }
            if (contractFilter !== 'all') {
                filteredEngineers = filteredEngineers.filter(e => e.contract === contractFilter);
            }

            const totalEngineers = filteredEngineers.length;

            // Render each day
            for (let date = new Date(firstDay); date <= lastDay; date.setDate(date.getDate() + 1)) {
                const dayOfWeek = date.getDay();
                
                // Skip weekends
                if (dayOfWeek === 0 || dayOfWeek === 6) continue;

                const dateStr = date.toISOString().split('T')[0];
                
                // Count engineers on holiday (half days count as 0.5)
                const onHolidayCount = holidays.reduce((count, h) => {
                    const start = new Date(h.startDate);
                    const end = new Date(h.endDate);
                    const current = new Date(dateStr);
                    const isOnHoliday = current >= start && current <= end && 
                           filteredEngineers.some(e => e.id === h.engineerId);
                    
                    if (isOnHoliday) {
                        return count + (h.type === 'half' ? 0.5 : 1);
                    }
                    return count;
                }, 0);

                const availablePercentage = totalEngineers > 0 
                    ? Math.round(((totalEngineers - onHolidayCount) / totalEngineers) * 100)
                    : 100;

                const dayCard = document.createElement('div');
                dayCard.className = 'day-card';
                
                let capacityClass = '';
                if (availablePercentage < 70) capacityClass = 'high';
                else if (availablePercentage < 85) capacityClass = 'medium';

                dayCard.innerHTML = `
                    <div class="day-name">${date.toLocaleDateString('en-US', { weekday: 'short' })}</div>
                    <div class="day-number">${date.getDate()}</div>
                    <div class="capacity-info">
                        <div class="capacity-bar">
                            <div class="capacity-fill ${capacityClass}" style="width: ${availablePercentage}%"></div>
                        </div>
                        <div class="capacity-text">${availablePercentage}% available</div>
                    </div>
                `;

                grid.appendChild(dayCard);
            }
        }

        function updateStats() {
            const teamFilter = document.getElementById('teamFilter').value;
            const contractFilter = document.getElementById('contractFilter').value;

            let filteredEngineers = engineers;
            if (teamFilter !== 'all') {
                filteredEngineers = filteredEngineers.filter(e => e.team === teamFilter);
            }
            if (contractFilter !== 'all') {
                filteredEngineers = filteredEngineers.filter(e => e.contract === contractFilter);
            }

            document.getElementById('totalEngineers').textContent = filteredEngineers.length;

            // Count holiday today (half days count as 0.5)
            const today = new Date().toISOString().split('T')[0];
            const holidayToday = holidays.reduce((count, h) => {
                const start = new Date(h.startDate);
                const end = new Date(h.endDate);
                const current = new Date(today);
                const isOnHoliday = current >= start && current <= end && 
                       filteredEngineers.some(e => e.id === h.engineerId);
                
                if (isOnHoliday) {
                    return count + (h.type === 'half' ? 0.5 : 1);
                }
                return count;
            }, 0);

            document.getElementById('holidayToday').textContent = holidayToday;

            // Calculate average capacity for the month
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            
            let totalCapacity = 0;
            let workingDays = 0;

            for (let date = new Date(firstDay); date <= lastDay; date.setDate(date.getDate() + 1)) {
                const dayOfWeek = date.getDay();
                if (dayOfWeek === 0 || dayOfWeek === 6) continue;

                workingDays++;
                const dateStr = date.toISOString().split('T')[0];
                
                // Count engineers on holiday (half days count as 0.5)
                const onHolidayCount = holidays.reduce((count, h) => {
                    const start = new Date(h.startDate);
                    const end = new Date(h.endDate);
                    const current = new Date(dateStr);
                    const isOnHoliday = current >= start && current <= end && 
                           filteredEngineers.some(e => e.id === h.engineerId);
                    
                    if (isOnHoliday) {
                        return count + (h.type === 'half' ? 0.5 : 1);
                    }
                    return count;
                }, 0);

                const capacity = filteredEngineers.length > 0 
                    ? ((filteredEngineers.length - onHolidayCount) / filteredEngineers.length) * 100
                    : 100;
                
                totalCapacity += capacity;
            }

            const avgCapacity = workingDays > 0 ? Math.round(totalCapacity / workingDays) : 100;
            document.getElementById('avgCapacity').textContent = avgCapacity + '%';
        }

        function setupEventListeners() {
            document.getElementById('prevMonth').addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() - 1);
                renderCalendar();
                updateStats();
            });

            document.getElementById('nextMonth').addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() + 1);
                renderCalendar();
                updateStats();
            });

            document.getElementById('teamFilter').addEventListener('change', () => {
                renderCalendar();
                updateStats();
            });

            document.getElementById('contractFilter').addEventListener('change', () => {
                renderCalendar();
                updateStats();
            });

            // Establishment Report month navigation
            document.getElementById('prevReportMonth').addEventListener('click', () => {
                reportDate.setMonth(reportDate.getMonth() - 1);
                renderEstablishmentReport();
            });

            document.getElementById('nextReportMonth').addEventListener('click', () => {
                reportDate.setMonth(reportDate.getMonth() + 1);
                renderEstablishmentReport();
            });

            // Render report when modal opens
            const originalOpenModal = window.openModal;
            window.openModal = function(modalId) {
                if (modalId === 'establishmentModal') {
                    renderEstablishmentReport();
                }
                originalOpenModal(modalId);
            };

            // Holiday form
            document.getElementById('holidayForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const engineerId = document.getElementById('holidayEngineer').value;
                const startDate = document.getElementById('holidayStart').value;
                const endDate = document.getElementById('holidayEnd').value;
                const type = document.getElementById('holidayType').value;

                // Save to Firebase
                await addDoc(collection(db, 'holidays'), {
                    engineerId,
                    startDate,
                    endDate,
                    type
                });

                closeModal('holidayModal');
                document.getElementById('holidayForm').reset();
                await loadData();
                renderCalendar();
                updateStats();
            });

            // Headcount form
            document.getElementById('headcountForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const team = document.getElementById('headcountTeam').value;
                const count = parseInt(document.getElementById('headcountNumber').value);

                if (headcounts[team]) {
                    await updateDoc(doc(db, 'headcounts', headcounts[team].id), { count });
                } else {
                    await addDoc(collection(db, 'headcounts'), { team, count });
                }

                closeModal('headcountModal');
                document.getElementById('headcountForm').reset();
                await loadData();
                updateStats();
            });

            // Member form
            document.getElementById('memberForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = document.getElementById('memberName').value;
                const team = document.getElementById('memberTeam').value;
                const contract = document.getElementById('memberContract').value;

                // Save to Firebase
                await addDoc(collection(db, 'engineers'), {
                    name,
                    team,
                    contract
                });

                document.getElementById('memberForm').reset();
                await loadData();
                renderCalendar();
                updateStats();
            });
        }

        // Start the app
        init();
    </script>
</body>
</html>
